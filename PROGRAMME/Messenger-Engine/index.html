<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epochenchat & Autoren-Bibliothek – WissOS 2.0</title>
  
  <!-- Neobrutalist design system styling -->
  <style>
    :root {
      /* Theme Token Fallbacks conforming to Host theme system */
      --color-primary: #7DFFC2;
      --color-secondary: #FFE66D;
      --color-accent: #FF6B9D;
      --color-bg: #e0f2fe;
      --color-bg-darker: #bae6fd;
      --color-button-face: #fff;
      --color-text: #000;
      --color-border: #000;
      
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }

    /* Class themes matching host settings */
    .theme-retro-classic {
      --color-primary: #7DFFC2;
      --color-secondary: #FFE66D;
      --color-accent: #FF6B9D;
      --color-bg: #e0f2fe;
      --color-bg-darker: #bae6fd;
      --color-button-face: #fff;
      --color-text: #000;
    }
    .theme-vaporwave {
      --color-primary: #00f0ff;
      --color-secondary: #ff007f;
      --color-accent: #9d00ff;
      --color-bg: #120136;
      --color-bg-darker: #03001e;
      --color-button-face: #120136;
      --color-text: #fff;
      --color-border: #00f0ff;
      background-image: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px) !important;
      background-size: 20px 20px !important;
    }
    .theme-schreibstube {
      --color-primary: #C3B091;
      --color-secondary: #e2d4be;
      --color-accent: #8b5a2b;
      --color-bg: #f5f0e6;
      --color-bg-darker: #e8dfd0;
      --color-button-face: #fff;
      --color-text: #3c2f2f;
    }
    .theme-pommes {
      --color-primary: #ff4500;
      --color-secondary: #ffd700;
      --color-accent: #fff;
      --color-bg: #800000;
      --color-bg-darker: #5c0000;
      --color-button-face: #ffd700;
      --color-text: #fff;
      --color-border: #ffd700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
      overflow-x: hidden;
    }

    /* Core Neobrutalist Containers */
    header {
      background: var(--color-primary);
      color: #000;
      border: 3px solid var(--color-border);
      box-shadow: 6px 6px 0px #000;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      position: relative;
    }

    header h1 {
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.85;
    }

    /* Neobrutalist buttons */
    .os-button {
      padding: 8px 16px;
      font-family: var(--font-sans);
      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
      border: 3px solid var(--color-border);
      background: var(--color-button-face);
      color: #000;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.1s, box-shadow 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .os-button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    .os-button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    .os-button--primary {
      background: var(--color-primary);
    }

    .os-button--accent {
      background: var(--color-accent);
    }

    .os-button--back {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 10;
    }

    /* =========================================================================
       LIBRARY / BOOKSHELF MODE STYLING
       ========================================================================= */
    .library-view {
      display: flex;
      flex-direction: column;
      gap: 32px;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .shelf-container {
      background: #fff;
      border: 4px solid var(--color-border);
      box-shadow: 8px 8px 0px #000;
      padding: 32px 24px;
      position: relative;
      margin-bottom: 24px;
    }

    .shelf-board {
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      border-bottom: 12px solid #5c3a21;
      padding-bottom: 8px;
      perspective: 800px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
    }

    .book {
      width: 44px;
      height: 150px;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s;
      transform-origin: bottom center;
      display: inline-block;
      vertical-align: bottom;
    }

    .book-spine {
      width: 100%;
      height: 100%;
      border: 3px solid #000;
      box-shadow: 3px 0 0 rgba(0,0,0,0.2) inset, 2px 2px 0 rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      color: #000;
      font-weight: 900;
      position: relative;
      overflow: hidden;
    }

    .book-title {
      font-size: 11px;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 0.5px;
      margin-top: 4px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      max-height: 90px;
    }

    .book-icon {
      font-size: 16px;
    }

    .book:hover {
      transform: scale(1.08) rotate(-4deg) translateY(-8px);
      z-index: 10;
    }

    /* Bookshelf Tooltip popup */
    .book-tooltip {
      position: absolute;
      bottom: 170px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #fff;
      color: #000;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 12px;
      border-radius: 0;
      width: 220px;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
      z-index: 20;
      white-space: normal;
    }

    .book-tooltip::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: #000 transparent;
      display: block;
      width: 0;
    }

    .book-tooltip::before {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
      z-index: 1;
    }

    .book:hover .book-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .tooltip-epoch {
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 2px;
    }

    .tooltip-name {
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .tooltip-quote {
      font-size: 11px;
      font-style: italic;
      line-height: 1.3;
      border-left: 2.5px solid #000;
      padding-left: 6px;
    }

    /* Library timeline styling */
    .timeline-container {
      background: #fff;
      border: 4px solid var(--color-border);
      box-shadow: 8px 8px 0px #000;
      padding: 24px;
      position: relative;
    }

    .timeline-title {
      font-weight: 900;
      text-transform: uppercase;
      font-size: 13px;
      margin-bottom: 16px;
      border-bottom: 3px solid #000;
      padding-bottom: 6px;
      display: inline-block;
    }

    .timeline-track {
      height: 48px;
      position: relative;
      background: var(--color-bg-darker);
      border: 3px solid #000;
      margin: 20px 0;
    }

    .timeline-track-label {
      position: absolute;
      top: -16px;
      font-size: 10px;
      font-weight: 900;
    }

    .timeline-dot {
      width: 18px;
      height: 18px;
      border: 3px solid #000;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .timeline-dot:hover, .timeline-dot.active {
      transform: translate(-50%, -50%) scale(1.4);
      box-shadow: 0 0 0 2px #fff;
    }

    .timeline-label-item {
      position: absolute;
      top: 100%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 900;
      margin-top: 4px;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Bookshelf Modal */
    .library-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      padding: 16px;
    }

    .library-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .library-modal-inner {
      background: #fff;
      border: 5px solid #000;
      box-shadow: 10px 10px 0px #000;
      max-width: 500px;
      width: 100%;
      padding: 32px;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      color: #000;
    }

    .library-modal.active .library-modal-inner {
      transform: scale(1);
    }

    .modal-epoch {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 6px;
    }

    .modal-name {
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .modal-dates {
      font-size: 13px;
      font-weight: bold;
      color: #555;
      margin-bottom: 20px;
    }

    .modal-quote {
      font-size: 15px;
      font-style: italic;
      line-height: 1.5;
      background: var(--color-bg);
      border: 3px solid #000;
      padding: 16px;
      box-shadow: 4px 4px 0 #000;
      margin-bottom: 24px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .modal-close {
      cursor: pointer;
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 20px;
      font-weight: bold;
      background: none;
      border: none;
    }

    /* =========================================================================
       CHAT VIEW MODE STYLING
       ========================================================================= */
    .chat-view {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      flex: 1;
      padding-bottom: 80px;
      min-height: calc(100vh - 100px);
      position: relative;
      overflow-x: hidden;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 50px;
    }

    /* Generic Bubble Base */
    .chat-bubble {
      display: flex;
      gap: 12px;
      width: 100%;
      animation: bubbleSlideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes bubbleSlideIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrapper {
      width: 44px;
      height: 44px;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      flex-shrink: 0;
      background: var(--color-primary);
      overflow: hidden;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bubble-content {
      background: #fff;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 16px;
      max-width: 80%;
      position: relative;
      color: #000;
    }

    /* Header for bubble name */
    .bubble-sender {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 4px;
    }

    .bubble-body {
      font-size: 14px;
      line-height: 1.5;
    }

    .bubble-body p {
      margin-bottom: 8px;
    }
    .bubble-body p:last-child {
      margin-bottom: 0;
    }

    /* Learner bubble align right */
    .chat-bubble--learner {
      justify-content: flex-end;
    }

    .chat-bubble--learner .bubble-content {
      background: var(--color-secondary);
      box-shadow: -4px 4px 0 #000;
    }

    .chat-bubble--learner .bubble-sender {
      color: #000;
      text-align: right;
    }

    /* Citation badge popover */
    .chat-source-ref {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 1.5px solid #000;
      background: var(--color-accent);
      color: #000;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      border-radius: 50%;
      vertical-align: super;
      margin-left: 4px;
      transition: transform 0.2s;
    }

    .chat-source-ref:hover {
      transform: scale(1.2);
    }

    .source-popover {
      position: absolute;
      background: #fff;
      border: 2.5px solid #000;
      box-shadow: 3px 3px 0 #000;
      padding: 8px 12px;
      font-size: 11px;
      z-index: 50;
      max-width: 250px;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Typing bubble */
    .chat-bubble--typing .bubble-content {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
    }

    .dot-pulse {
      width: 8px;
      height: 8px;
      background: #000;
      border-radius: 50%;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .dot-pulse:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { transform: scale(0.6); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* Didactical framing cards */
    .chat-framing {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 6px 6px 0px #000;
      padding: 20px;
      margin-bottom: 12px;
      width: 100%;
    }

    .chat-framing__title {
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      border-bottom: 3px solid #000;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .chat-framing__body {
      font-size: 13px;
      line-height: 1.5;
    }

    /* Local timeline cards */
    .chat-timeline {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      padding: 20px;
      width: 100%;
    }

    .chat-timeline__title {
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .chat-timeline__bar {
      height: 8px;
      background: var(--color-bg-darker);
      border: 2px solid #000;
      position: relative;
      margin: 48px 24px 40px 24px;
    }

    .chat-timeline__node {
      width: 16px;
      height: 16px;
      background: var(--color-accent);
      border: 2.5px solid #000;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .chat-timeline__node:hover, .chat-timeline__node--selected {
      transform: translate(-50%, -50%) scale(1.3);
      box-shadow: 0 0 0 2px #fff;
    }

    .chat-timeline__node-label {
      position: absolute;
      top: -24px;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 900;
      white-space: nowrap;
      text-align: center;
      line-height: 1.2;
    }
    .chat-timeline__node-label--above {
      top: -38px;
    }
    .chat-timeline__node-label--below {
      top: 16px;
    }
    .chat-timeline__node-label--first {
      transform: translateX(-15%) !important;
    }
    .chat-timeline__node-label--last {
      transform: translateX(-85%) !important;
    }

    .chat-timeline__info-box {
      background: var(--color-bg);
      border: 3px solid #000;
      padding: 12px;
      font-size: 12px;
      margin-top: 16px;
      box-shadow: 3px 3px 0 #000;
      line-height: 1.4;
    }

    /* Interactive annotation word matcher game */
    .chat-annotation {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      padding: 20px;
      width: 100%;
    }

    .chat-annotation__prompt {
      font-weight: 900;
      font-size: 13px;
      background: var(--color-primary);
      border: 2.5px solid #000;
      padding: 8px 12px;
      margin-bottom: 12px;
    }

    .chat-annotation__text {
      font-size: 14px;
      line-height: 1.6;
      border: 2.5px dashed #000;
      padding: 12px;
      background: #fafaf7;
      user-select: text;
    }

    .annotation-highlight {
      background: var(--color-secondary);
      border-bottom: 2px solid #000;
      padding: 1px 4px;
      border-radius: 2px;
    }

    .annotation-highlight--target {
      background: var(--color-primary) !important;
      border-bottom: 2.5px solid #000 !important;
      font-weight: bold;
    }

    .chat-annotation__toolbar {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .chat-annotation__mark-btn {
      padding: 6px 12px;
      font-weight: 900;
      font-size: 11px;
      text-transform: uppercase;
      background: var(--color-accent);
      border: 2.5px solid #000;
      box-shadow: 2px 2px 0 #000;
      cursor: pointer;
    }

    .chat-annotation__mark-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 #000;
    }

    .chat-annotation__clear-btn {
      padding: 6px 12px;
      font-weight: bold;
      font-size: 11px;
      background: #fff;
      border: 2.5px solid #000;
      box-shadow: 2px 2px 0 #000;
      cursor: pointer;
    }

    .chat-annotation__progress {
      font-size: 11px;
      font-weight: 900;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-annotation__feedbacks {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-annotation__feedback-item {
      background: var(--color-bg);
      border: 2px solid #000;
      padding: 8px 12px;
      font-size: 12px;
      box-shadow: 2px 2px 0 #000;
    }

    /* Quiz cards styling */
    .chat-quiz {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      padding: 20px;
      width: 100%;
    }

    .chat-quiz__question {
      font-weight: 900;
      font-size: 14px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .chat-quiz__options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-quiz__option {
      background: #fff;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      padding: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      text-align: left;
    }

    .chat-quiz__option:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #000;
    }

    .chat-quiz__option--correct {
      background: #a7f3d0 !important;
      border-color: #047857 !important;
    }

    .chat-quiz__option--incorrect {
      background: #fecaca !important;
      border-color: #b91c1c !important;
    }

    .chat-quiz__option--selected-multi {
      background: var(--color-bg-darker);
    }

    .chat-quiz__feedback {
      margin-top: 16px;
      background: var(--color-bg);
      border: 3px solid #000;
      padding: 12px;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 3px 3px 0 #000;
    }

    /* Opinion Barometer scale */
    .chat-barometer {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      padding: 20px;
      width: 100%;
    }

    .chat-barometer__statement {
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .chat-barometer__scale {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 16px 0;
    }

    .chat-barometer__slider {
      width: 100%;
      height: 16px;
      -webkit-appearance: none;
      background: var(--color-bg-darker);
      border: 3px solid #000;
      outline: none;
    }

    .chat-barometer__slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--color-accent);
      border: 3px solid #000;
      cursor: pointer;
      box-shadow: 2px 2px 0 #000;
    }

    .chat-barometer__labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .chat-barometer__btn {
      align-self: flex-end;
    }

    /* Checkpoint & reflection text areas */
    .chat-checkpoint {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      padding: 20px;
      width: 100%;
    }

    .chat-checkpoint__question {
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .chat-checkpoint__textarea {
      width: 100%;
      border: 3px solid #000;
      padding: 12px;
      font-family: var(--font-sans);
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
      resize: vertical;
    }

    .chat-checkpoint__textarea:focus {
      background: var(--color-bg);
    }

    /* Finale wrap cards */
    .chat-finale {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 8px 8px 0px #000;
      padding: 28px;
      width: 100%;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .chat-finale__watermark {
      position: absolute;
      right: -24px;
      bottom: -24px;
      font-size: 180px;
      opacity: 0.05;
      pointer-events: none;
      user-select: none;
    }

    .chat-finale__seal {
      width: 60px;
      height: 60px;
      border: 3px solid #000;
      background: var(--color-accent);
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 3px 3px 0 #000;
    }

    .chat-finale__text {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
      font-weight: bold;
    }

    .chat-finale__link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 2.5px solid #000;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 900;
      text-decoration: none;
      color: #000;
      box-shadow: 2px 2px 0 #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .chat-finale__link:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #000;
    }

    /* Results trigger neobrutalist button */
    .chat-results-trigger__btn {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 3px solid #000;
      background: var(--color-primary);
      box-shadow: 4px 4px 0 #000;
      padding: 12px 24px;
      font-family: var(--font-sans);
      font-weight: 900;
      text-transform: uppercase;
      font-size: 12px;
      color: #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .chat-results-trigger__btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    /* =========================================================================
       RESULTS DASHBOARD OVERLAY STYLING
       ========================================================================= */
    .chat-results {
      width: 100%;
      margin-top: 20px;
    }

    .chat-results__card {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 8px 8px 0 #000;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .chat-results__watermark {
      position: absolute;
      right: -20px;
      bottom: -20px;
      font-size: 150px;
      opacity: 0.04;
      pointer-events: none;
    }

    .chat-results__header {
      border-bottom: 3px solid #000;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .chat-results__badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      background: var(--color-accent);
      border: 2px solid #000;
      padding: 2px 8px;
      box-shadow: 2px 2px 0 #000;
      margin-bottom: 8px;
    }

    .chat-results__title {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .chat-results__subtitle {
      font-size: 12px;
      font-weight: bold;
      color: #666;
    }

    .chat-results__stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .chat-results__stat {
      background: var(--color-bg);
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      padding: 12px;
      text-align: center;
    }

    .chat-results__stat-value {
      font-size: 24px;
      font-weight: 900;
    }

    .chat-results__stat-label {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      color: #444;
    }

    .chat-results__section {
      margin-bottom: 20px;
    }

    .chat-results__section-title {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      border-bottom: 2px dashed #000;
      padding-bottom: 4px;
      margin-bottom: 12px;
    }

    /* Circular SVG Ring & List Layout */
    .chat-results__quiz-hero {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .chat-results__ring-wrap {
      width: 120px;
      height: 120px;
      position: relative;
      flex-shrink: 0;
    }

    .chat-results__ring {
      width: 100%;
      height: 100%;
    }

    .chat-results__ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .chat-results__ring-number {
      font-size: 20px;
      font-weight: 900;
    }

    .chat-results__ring-label {
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
      color: #666;
    }

    .chat-results__quiz-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 200px;
    }

    .chat-results__quiz-row {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid #000;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .chat-results__quiz-row--correct {
      background: #a7f3d0;
    }

    .chat-results__quiz-row--incorrect {
      background: #fecaca;
    }

    .chat-results__quiz-icon {
      font-size: 14px;
      font-weight: 900;
    }

    .chat-results__quiz-text {
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      flex: 1;
    }

    /* Audio and Media didactical nodes */
    .chat-audio {
      width: 100%;
    }

    .chat-audio__card {
      background: #fff;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .chat-audio__icon {
      font-size: 28px;
    }

    .chat-audio__info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-audio__label {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--color-accent);
    }

    .chat-audio__player {
      width: 100%;
      height: 32px;
      outline: none;
    }

    .chat-image {
      width: 100%;
    }

    .chat-image__card {
      background: #fff;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      padding: 8px;
    }

    .chat-image__img {
      width: 100%;
      height: auto;
      border: 2px solid #000;
      display: block;
    }

    .chat-image__caption {
      font-size: 11px;
      font-style: italic;
      margin-top: 6px;
      text-align: center;
      font-weight: bold;
    }

    /* Empty warning */
    .empty-warning {
      border: 4px solid #000;
      background: #fff;
      color: #000;
      padding: 24px;
      text-align: center;
      box-shadow: 6px 6px 0 #000;
      max-width: 400px;
      margin: 20px auto;
      font-weight: bold;
    }
  </style>
</head>
<body class="theme-retro-classic">

  <!-- Back button to close chat or go back to library -->
  <a href="#" class="os-button os-button--back" id="btn-back" style="display: none;">◀ Zurück</a>

  <!-- =========================================================================
       1. LIBRARY MODE (BOOKSHELF & TIMELINE)
       ========================================================================= -->
  <div class="library-view" id="library-view">
    <header>
      <div>
        <h1>Bibliothek der Stimmen</h1>
        <p>Wähle einen Autor – und beginne das Gespräch</p>
      </div>
      <div>
        <span class="os-button" style="pointer-events:none; font-size:10px;" id="lib-stats">LitDM</span>
      </div>
    </header>

    <div class="shelf-container">
      <div class="shelf-board" id="shelf-board">
        <!-- Generated dynamically -->
      </div>
    </div>

    <div class="timeline-container">
      <div class="timeline-title">Literarische Epochen · 1740 – 1960</div>
      <div class="timeline-track" id="timeline-track">
        <div class="timeline-track-label" style="left: 4%;">1740</div>
        <div class="timeline-track-label" style="right: 4%;">1960</div>
        <!-- Dot coordinates generated dynamically -->
      </div>
    </div>
  </div>

  <!-- Neobrutalist Modal overlay for the selected book -->
  <div class="library-modal" id="library-modal">
    <div class="library-modal-inner">
      <button class="modal-close" id="btn-modal-close" aria-label="Schließen">×</button>
      <div class="modal-epoch" id="modal-epoch">AUFKLÄRUNG</div>
      <div class="modal-name" id="modal-name">Sophie von La Roche</div>
      <div class="modal-dates" id="modal-dates">1730 – 1807</div>
      <div class="modal-quote" id="modal-quote">»Güte ist die einzige Überlegenheit, die ich anerkenne.«</div>
      <div class="modal-footer">
        <button class="os-button" id="btn-modal-cancel">Abbrechen</button>
        <button class="os-button os-button--primary" id="btn-modal-start">Gespräch beginnen 💬</button>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       2. DIDACTIC CHAT ENGINE MODE
       ========================================================================= -->
  <div class="chat-view" id="chat-view" style="display: none;">
    <div class="chat-container" id="chat-container">
      <!-- Generated dynamically by didactical runner -->
    </div>
  </div>

  <!-- Local Offline Markdown Processing & Parent OS API Connection -->
  <script src="../../js/lib/marked.min.js"></script>
  <script src="../../sdk/wissos-sdk.js"></script>
  
  <script>
    'use strict';

    // Global variables
    let AUTHORS_CATALOG = [];
    let CURRENT_AUTHOR = null;
    let ACTIVE_FLOW = null;
    let CURRENT_MODULE_INDEX = 0;
    
    // Interactive scoring stats
    let quizResults = [];
    let barometerResults = [];
    let checkpointAnswers = [];
    let freetextResults = [];

    // Active Popovers tracker
    let activePopover = null;

    // Connect to host SDK
    WissOS.sdk.ready();

    // Volume and Audio handling
    let isMuted = false;
    WissOS.sdk.onVolumeChanged(function(muted) {
      isMuted = muted;
    });

    function playSound(type) {
      if (!isMuted) {
        WissOS.sdk.playSound(type);
      }
    }

    // Determine startup mode from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const initialMode = urlParams.get('mode') || 'library';
    const initialAuthor = urlParams.get('author');

    // Initialize application
    window.addEventListener('DOMContentLoaded', () => {
      loadCatalog();

      // Hook static event listeners
      document.getElementById('btn-modal-close').addEventListener('click', closeModal);
      document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
      document.getElementById('btn-back').addEventListener('click', handleBackButton);
      
      // Close tooltips or popovers when clicking elsewhere
      document.addEventListener('click', (e) => {
        if (activePopover && !e.target.closest('.chat-source-ref') && !e.target.closest('.source-popover')) {
          activePopover.style.display = 'none';
          activePopover = null;
        }
      });
    });

    // Helper: Number to German words
    function numberToWord(n, feminine = false) {
      const words = ["Keine", "Ein", "Zwei", "Drei", "Vier", "Fünf", "Sechs", "Sieben", "Acht", "Neun", "Zehn", "Elf", "Zwölf", "Dreizehn", "Vierzehn", "Fünfzehn", "Sechzehn", "Siebzehn", "Achtzehn", "Neunzehn", "Zwanzig"];
      if (n <= 20) {
        let word = words[n];
        if (n === 1 && feminine) return "Eine";
        return word;
      }
      return n;
    }

    // Fetch the compiled authors catalog index
    function loadCatalog() {
      // Detect file:// protocol – fetch() from iframes is blocked by modern browsers
      if (window.location.protocol === 'file:') {
        document.getElementById('shelf-board').innerHTML =
          '<div class="empty-warning" style="text-align:left;padding:20px;line-height:1.7;">' +
          '<strong style="font-size:16px;">⚠️ Server erforderlich</strong><br><br>' +
          'WissOS 2.0 kann nicht über das Dateisystem geöffnet werden,<br>' +
          'da der Browser den Dateilesezugriff aus Sicherheitsgründen blockiert.<br><br>' +
          '<strong>Lösung:</strong> Öffne das Terminal und starte den lokalen Server:<br>' +
          '<code style="background:#000;color:#7DFFC2;padding:6px 10px;display:inline-block;margin-top:8px;font-size:13px;">' +
          'powershell -File "start_server.ps1"</code><br><br>' +
          'Dann öffne <strong>http://localhost:8000</strong> im Browser.' +
          '</div>';
        return;
      }

      fetch('../../content/autoren/index.json')
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          AUTHORS_CATALOG = data;
          
          // Populate Stats badge
          const authorCount = AUTHORS_CATALOG.length;
          const epochs = new Set(AUTHORS_CATALOG.map(a => a.epochShort));
          const epochCount = epochs.size;
          
          document.getElementById('lib-stats').textContent = 
            `${numberToWord(authorCount)} ${authorCount === 1 ? 'Stimme' : 'Stimmen'} · ${numberToWord(epochCount, true)} ${epochCount === 1 ? 'Epoche' : 'Epochen'}`;
          
          renderBookshelf();
          renderTimeline();

          // If launch query requests direct Chat
          if (initialMode === 'chat' && initialAuthor) {
            launchChat(initialAuthor);
          } else {
            showLibraryView();
          }
        })
        .catch(err => {
          console.error('Failed fetching authors catalog:', err);
          document.getElementById('shelf-board').innerHTML =
            '<div class="empty-warning" style="text-align:left;padding:20px;line-height:1.7;">' +
            '<strong>⚠️ Bibliothek konnte nicht geladen werden</strong><br><br>' +
            'Fehler: <code>' + err.message + '</code><br><br>' +
            'Stelle sicher, dass der lokale Webserver läuft:<br>' +
            '<code style="background:#000;color:#7DFFC2;padding:6px 10px;display:inline-block;margin-top:8px;font-size:13px;">' +
            'powershell -File "start_server.ps1"</code><br><br>' +
            'Dann aufrufen unter: <strong>http://localhost:8000</strong>' +
            '</div>';
        });
    }

    // =========================================================================
    // RENDER: BOOKSHELF & TIMELINE
    // =========================================================================
    function renderBookshelf() {
      const shelf = document.getElementById('shelf-board');
      shelf.innerHTML = '';

      // Sort authors chronologically by timeline position
      const sorted = [...AUTHORS_CATALOG].sort((a, b) => a.timelinePos - b.timelinePos);

      sorted.forEach((author, i) => {
        const book = document.createElement('div');
        book.className = 'book';
        book.style.animationDelay = (i * 0.04) + 's';

        // Vertical book neobrutalist spine
        book.innerHTML = `
          <div class="book-spine" style="background: ${author.color};">
            <span class="book-icon">${author.icon || '✍️'}</span>
            <span class="book-title">${author.short}</span>
            <span class="book-icon">${author.icon || '✍️'}</span>
          </div>
          <div class="book-tooltip" style="border-color: ${author.highlight}">
            <div class="tooltip-epoch">${author.epochShort}</div>
            <div class="tooltip-name">${author.name}</div>
            <div class="tooltip-quote" style="border-color: ${author.highlight}">${author.quote}</div>
          </div>
        `;

        book.addEventListener('click', () => {
          playSound('click');
          openModal(author);
        });

        book.addEventListener('mouseenter', () => highlightTimelineNode(author.id, true));
        book.addEventListener('mouseleave', () => highlightTimelineNode(author.id, false));

        shelf.appendChild(book);
      });
    }

    function renderTimeline() {
      const track = document.getElementById('timeline-track');
      
      // Clean existing nodes except labels
      const labels = track.querySelectorAll('.timeline-track-label');
      track.innerHTML = '';
      labels.forEach(l => track.appendChild(l));

      AUTHORS_CATALOG.forEach((author, i) => {
        // Dot node on timeline
        const dot = document.createElement('div');
        dot.className = 'timeline-dot';
        dot.id = `dot-${author.id}`;
        dot.style.left = `${author.timelinePos}%`;
        dot.style.backgroundColor = author.highlight;

        // Tooltip coordinate label
        const lbl = document.createElement('div');
        lbl.className = 'timeline-label-item';
        lbl.id = `label-${author.id}`;
        lbl.style.left = `${author.timelinePos}%`;
        lbl.textContent = author.short;

        // Stagger labels slightly on 3 alternating levels to prevent overlapping
        const staggerHeight = (i % 3) * 12;
        lbl.style.transform = `translateX(-50%) translateY(${staggerHeight}px)`;

        dot.addEventListener('click', () => {
          playSound('click');
          openModal(author);
        });

        dot.addEventListener('mouseenter', () => highlightTimelineNode(author.id, true));
        dot.addEventListener('mouseleave', () => highlightTimelineNode(author.id, false));

        track.appendChild(dot);
        track.appendChild(lbl);
      });
    }

    function highlightTimelineNode(id, highlight) {
      const dot = document.getElementById(`dot-${id}`);
      const label = document.getElementById(`label-${id}`);
      if (dot) dot.classList.toggle('active', highlight);
      if (label) {
        label.style.color = highlight ? 'var(--color-accent)' : '';
        label.style.fontWeight = highlight ? '900' : '';
      }
    }

    // Modal Control
    function openModal(author) {
      CURRENT_AUTHOR = author;
      
      const modal = document.getElementById('library-modal');
      document.getElementById('modal-epoch').style.color = author.highlight;
      document.getElementById('modal-epoch').textContent = author.epoch.toUpperCase();
      document.getElementById('modal-name').textContent = author.name;
      document.getElementById('modal-dates').textContent = author.dates;
      document.getElementById('modal-quote').style.borderColor = author.highlight;
      document.getElementById('modal-quote').textContent = `»${author.quote}«`;
      
      modal.style.backgroundColor = `${author.color}fa`;
      modal.classList.add('active');

      // Modal start action hooks
      const startBtn = document.getElementById('btn-modal-start');
      startBtn.onclick = () => {
        closeModal();
        launchChat(author.id);
      };
    }

    function closeModal() {
      playSound('click');
      document.getElementById('library-modal').classList.remove('active');
    }

    function showLibraryView() {
      document.getElementById('chat-view').style.display = 'none';
      document.getElementById('btn-back').style.display = 'none';
      document.getElementById('library-view').style.display = 'flex';
      
      // Update browser history state offline cleanly
      window.history.replaceState({}, '', '?mode=library');
    }

    function handleBackButton() {
      playSound('click');
      if (confirm('Möchtest du das Gespräch wirklich beenden und zur Bibliothek zurückkehren?')) {
        showLibraryView();
      }
    }

    // =========================================================================
    // CHAT ENGINE RUNNER FLOW
    // =========================================================================
    function launchChat(authorId) {
      // Clear score logs
      quizResults = [];
      barometerResults = [];
      checkpointAnswers = [];
      freetextResults = [];

      document.getElementById('library-view').style.display = 'none';
      document.getElementById('chat-view').style.display = 'flex';
      document.getElementById('btn-back').style.display = 'inline-flex';
      
      const chatContainer = document.getElementById('chat-container');
      chatContainer.innerHTML = '';

      // Update URL query params offline
      window.history.replaceState({}, '', `?mode=chat&author=${authorId}`);

      // Fetch the isolated dialogue flow
      fetch(`../../content/autoren/${authorId}/index.json`)
        .then(res => res.json())
        .then(data => {
          ACTIVE_FLOW = data;
          CURRENT_MODULE_INDEX = 0;
          
          // Connect to the specific theme override if supplied
          if (ACTIVE_FLOW.theme) {
            document.body.className = `theme-${ACTIVE_FLOW.theme}`;
          } else {
            document.body.className = 'theme-retro-classic';
          }

          // Trigger didactical timeline stream runner
          showNextNode();
        })
        .catch(err => {
          console.error(`Failed loading author dialogue data for: ${authorId}`, err);
          chatContainer.innerHTML = 
            `<div class="empty-warning">⚠️ Fehler beim Laden des Epochenchats. (../../content/autoren/${authorId}/index.json fehlt oder ist beschädigt)</div>`;
        });
    }

    // Run the next queue slide in the didactical flow
    function showNextNode() {
      if (!ACTIVE_FLOW || CURRENT_MODULE_INDEX >= ACTIVE_FLOW.modules.length) return;

      const mod = ACTIVE_FLOW.modules[CURRENT_MODULE_INDEX];
      CURRENT_MODULE_INDEX++;

      // Implement simulated typing bubbles
      renderTypingIndicator(mod.type === 'learner', (typingBubble) => {
        const chatContainer = document.getElementById('chat-container');
        
        // Remove simulated bubble
        if (typingBubble) typingBubble.remove();

        // Create standard bubble wrapping
        const bubbleWrap = document.createElement('div');
        
        if (mod.type === 'learner') {
          bubbleWrap.className = 'chat-bubble chat-bubble--learner';
          bubbleWrap.innerHTML = `
            <div class="bubble-content">
              <div class="bubble-sender">Du</div>
              <div class="bubble-body">${parseMarkdownText(mod.content)}</div>
            </div>
          `;
          chatContainer.appendChild(bubbleWrap);
          playSound('click');
          
          // Advance directly after rendering learner response
          setTimeout(showNextNode, 1000);
        }
        else if (mod.type === 'persona') {
          bubbleWrap.className = 'chat-bubble';
          
          // Avatar resolving: local path or fallback
          const avatarUrl = ACTIVE_FLOW.avatar ? `../../content/autoren/${ACTIVE_FLOW.id}/${ACTIVE_FLOW.avatar}` : '';
          const avatarHtml = avatarUrl ? `<div class="avatar-wrapper"><img src="${avatarUrl}" alt="${ACTIVE_FLOW.name}"></div>` : '<div class="avatar-wrapper">✍️</div>';
          
          bubbleWrap.innerHTML = `
            ${avatarHtml}
            <div class="bubble-content">
              <div class="bubble-sender">${ACTIVE_FLOW.name}</div>
              <div class="bubble-body">${injectCitationBadges(mod.content)}</div>
            </div>
          `;
          chatContainer.appendChild(bubbleWrap);
          playSound('message');

          // Hook popovers to newly appended citation tags
          hookCitationEvents(bubbleWrap);

          // Advance directly
          setTimeout(showNextNode, 1800);
        }
        else {
          // Special interactive panels
          let elementNode = null;
          
          switch (mod.type) {
            case 'framing':
              elementNode = renderFramingNode(mod);
              break;
            case 'context':
              elementNode = renderContextNode(mod);
              break;
            case 'quote':
              elementNode = renderQuoteNode(mod);
              break;
            case 'self-assessment':
              elementNode = renderSelfAssessmentNode(mod);
              break;
            case 'timeline':

          // Equidistant representation with even spacing
          const posPercent = mod.epochs.length > 1 ? 5 + (idx / (mod.epochs.length - 1)) * 90 : 50;
          
          // Escape single and double quotes to avoid HTML rendering bugs
          const escapedName = (ep.name || '').replace(/&/g, '&amp;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
          const escapedInfo = (ep.info || '').replace(/&/g, '&amp;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
          
          let extraClass = '';
          if (idx === 0) {
            extraClass = ' chat-timeline__node-label--first';
          } else if (idx === mod.epochs.length - 1) {
            extraClass = ' chat-timeline__node-label--last';
          }
          const labelClass = (idx % 2 === 0 ? 'chat-timeline__node-label--below' : 'chat-timeline__node-label--above') + extraClass;
          const yearsStr = ep.start ? ` (${ep.start}${ep.end ? '–' + ep.end : ''})` : '';

          nodesMarkup += `

    window.markSelectedText = function(containerId, targets) {
      const sel = window.getSelection();
      if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const selectedText = range.toString().trim();
        
        if (selectedText.length > 0) {
          const container = document.getElementById(containerId);
          const feedbackContainer = container.closest('.chat-annotation').querySelector('.chat-annotation__feedbacks');
          const foundCounter = container.closest('.chat-annotation').querySelector('.found-counter');

          // Search matches in target arrays
          let matched = null;
          for (let target of targets) {
            const tw = target.word.toLowerCase();
            const st = selectedText.toLowerCase();
            if (st === tw || st.includes(tw) || tw.includes(st)) {
              matched = target;
              break;
            }
          }

          // Build highlighter wrap
          const span = document.createElement('span');
          if (matched) {
            playSound('success');
            span.className = 'annotation-highlight annotation-highlight--target';
            
            // Build visual feedback bubble
            const fb = document.createElement('div');
            fb.className = 'chat-annotation__feedback-item';
            fb.innerHTML = `<strong>»${matched.word}«</strong>: ${matched.feedback}`;
            feedbackContainer.appendChild(fb);

            // Increment counter
            if (foundCounter) {
              const current = parseInt(foundCounter.textContent) || 0;
              foundCounter.textContent = current + 1;
            }
          } else {
            playSound('click');
            span.className = 'annotation-highlight';
          }
          
          try {
            range.surroundContents(span);
          } catch(e) {
            console.warn('Selection complex wrapping failed, applying fallback border', e);
          }
          
          sel.removeAllRanges();
        }
      }
    };

      parent.querySelector('.chat-annotation__feedbacks').innerHTML = '';
      const foundCounter = parent.querySelector('.found-counter');
      if (foundCounter) foundCounter.textContent = '0';

    function renderQuizNode(mod) {
      const div = document.createElement('div');
      div.className = 'chat-quiz';
      
      const isMulti = mod.type === 'quiz-multi';
      const questionText = mod.question || 'Überprüfe dein Wissen';

      const optionsContainer = document.createElement('div');
      optionsContainer.className = 'chat-quiz__options';

      mod.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'chat-quiz__option';
        btn.textContent = opt.text;
        
        // Store correct status and feedback in dataset safely
        btn.dataset.correct = opt.correct ? 'true' : 'false';
        btn.dataset.feedback = opt.feedback || '';
        
        btn.addEventListener('click', () => {
          playSound('click');
          if (!isMulti) {
            optionsContainer.querySelectorAll('.chat-quiz__option').forEach(b => {
              b.classList.remove('chat-quiz__option--selected-multi');
            });
          }
          btn.classList.toggle('chat-quiz__option--selected-multi');
        });

        optionsContainer.appendChild(btn);
      });

      div.innerHTML = `
        <div class="chat-quiz__question">🎯 Quiz: ${questionText}</div>
      `;
      div.appendChild(optionsContainer);

      const fb = document.createElement('div');
      fb.className = 'chat-quiz__feedback';
      fb.style.display = 'none';
      div.appendChild(fb);

      const bottomBar = document.createElement('div');
      bottomBar.style.cssText = 'margin-top:16px; display:flex; justify-content:space-between; align-items:center;';
      bottomBar.innerHTML = `
        <span class="quiz-tip-label" style="font-size:10px; font-weight:bold; opacity:0.8;">Wähle die ${isMulti ? 'richtigen Antworten' : 'richtige Antwort'}!</span>
      `;

      const submitBtn = document.createElement('button');
      submitBtn.className = 'os-button os-button--primary';
      submitBtn.textContent = 'Antwort Einloggen';

      submitBtn.addEventListener('click', function() {
        const options = optionsContainer.querySelectorAll('.chat-quiz__option');
        let hasSelected = false;
        let allCorrect = true;
        let feedbacks = [];

        options.forEach(opt => {
          const isSelected = opt.classList.contains('chat-quiz__option--selected-multi');
          const isCorrect = opt.dataset.correct === 'true';
          const feedback = opt.dataset.feedback || '';

          if (isSelected) {
            hasSelected = true;
            if (isCorrect) {
              opt.className = 'chat-quiz__option chat-quiz__option--correct';
            } else {
              opt.className = 'chat-quiz__option chat-quiz__option--incorrect';
              allCorrect = false;
            }
            if (feedback) {
              feedbacks.push(`<div style="margin-top:4px; font-size:11px;"><strong>${opt.textContent.trim()}</strong>: ${feedback}</div>`);
            }
          } else {
            if (isCorrect) {
              allCorrect = false; // missed a correct one
            }
          }
        });

        if (!hasSelected) {
          alert('Bitte wähle mindestens eine Option aus!');
          return;
        }

        playSound(allCorrect ? 'success' : 'error');

        // Log quiz result
        quizResults.push({ question: questionText, correct: allCorrect });

        // Disable buttons
        options.forEach(opt => opt.disabled = true);
        submitBtn.disabled = true;

        // Render didactical feedback block
        fb.style.display = 'block';
        let headerText;
        if (allCorrect) {
          headerText = `<strong>✓ Ausgezeichnet!</strong> Deine Antwort ist absolut korrekt.`;
        } else if (feedbacks.length > 0) {
          headerText = `<strong>✗ Nicht ganz richtig.</strong> Bitte schaue dir die Erklärungen an.`;
        } else {
          headerText = `<strong>✗ Nicht ganz richtig.</strong> Versuche es noch einmal.`;
        }

        let feedbackList = feedbacks.length > 0 ? 
          `<div style="margin-top:8px; border-top:1px dashed rgba(0,0,0,0.15); padding-top:6px;">${feedbacks.join('')}</div>` : '';

        fb.innerHTML = `${headerText}${feedbackList}`;

        // Transform action button to advance
        submitBtn.textContent = 'Weiter';
        
        const newSubmitBtn = submitBtn.cloneNode(true);
        newSubmitBtn.disabled = false;
        newSubmitBtn.addEventListener('click', () => {
          advanceDidactics(newSubmitBtn);
        });
        submitBtn.parentNode.replaceChild(newSubmitBtn, submitBtn);
      });

      bottomBar.appendChild(submitBtn);
      div.appendChild(bottomBar);

      return div;
    }

      }

      playSound('success');
      freetextResults.push({ prompt: promptStr, answer: textVal });
      textarea.disabled = true;
      btn.disabled = true;
      btn.textContent = '✓ Abgegeben';

      advanceDidactics(btn);
    };

    // Finale slide
    function renderFinaleNode(mod) {
      const div = document.createElement('div');
      div.className = 'chat-finale';

      const icon = CURRENT_AUTHOR.icon || '✍️';
      
      // clickable links
      let linksHtml = '';
      if (mod.links && mod.links.length > 0) {
        linksHtml = mod.links.map(l => `
          <a class="chat-finale__link" href="${l.url}" target="_blank" rel="noopener">🌐 ${l.label}</a>
        `).join('');
      } else if (mod.url) {
        linksHtml = `<a class="chat-finale__link" href="${mod.url}" target="_blank" rel="noopener">🌐 ${mod.label || 'Mehr Informationen'}</a>`;
      }

      // literature items
      let litHtml = '';
      if (mod.literature && mod.literature.length > 0) {
        const litItems = mod.literature.map(lit => `
          <li style="margin-bottom: 6px; padding-left: 12px; position: relative;">
            <span style="position: absolute; left: 0; color: var(--color-accent);">▪</span> ${lit}
          </li>
        `).join('');

        litHtml = `
          <div style="margin-top: 24px; padding-top: 16px; border-top: 2px dashed #000; text-align: left;">
            <h4 style="font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;">Quellen & Literatur</h4>
            <ul style="list-style: none; font-size: 12px; line-height: 1.4; color: #333;">${litItems}</ul>
          </div>
        `;
      }

      div.innerHTML = `
        <div class="chat-finale__watermark">${icon}</div>
        <div class="chat-finale__seal">${icon}</div>
        <div class="chat-finale__text">${parseMarkdownText(mod.text)}</div>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;">
          ${linksHtml}
        </div>
        <div style="margin-bottom: 20px;">
          <button class="chat-results-trigger__btn" onclick="triggerResultsDashboard(this)">
            📊 Ergebnisse Anzeigen
          </button>
        </div>
        ${litHtml}
      `;
      return div;
    }

    // Results Dashboard injection
    window.triggerResultsDashboard = function(btn) {
      playSound('complete');
      const parent = btn.closest('.chat-finale');
      btn.style.display = 'none';

      const resultsDiv = document.createElement('div');
      resultsDiv.className = 'chat-results';

      // Quiz statistics ring
      const qC = quizResults.filter(q => q.correct).length;
      const qT = quizResults.length;
      const pct = qT > 0 ? Math.round((qC / qT) * 100) : 0;
      
      const circ = 2 * Math.PI * 42;
      const offset = circ - (circ * pct / 100);
      const ringColor = pct >= 70 ? '#10b981' : pct >= 40 ? 'var(--color-accent)' : '#ef4444';

      let statsMarkup = '';
      if (qT > 0) statsMarkup += `<div class="chat-results__stat"><div class="chat-results__stat-value">${pct}%</div><div class="chat-results__stat-label">Quiz</div></div>`;
      if (barometerResults.length > 0) statsMarkup += `<div class="chat-results__stat"><div class="chat-results__stat-value">${barometerResults.length}</div><div class="chat-results__stat-label">Barometer</div></div>`;
      if (checkpointAnswers.length > 0) statsMarkup += `<div class="chat-results__stat"><div class="chat-results__stat-value">${checkpointAnswers.length}</div><div class="chat-results__stat-label">Reflexionen</div></div>`;
      if (freetextResults.length > 0) statsMarkup += `<div class="chat-results__stat"><div class="chat-results__stat-value">${freetextResults.length}</div><div class="chat-results__stat-label">Freitexte</div></div>`;

      let quizSection = '';
      if (qT > 0) {
        let quizListItems = '';
        quizResults.forEach(qr => {
          quizListItems += `
            <div class="chat-results__quiz-row ${qr.correct ? 'chat-results__quiz-row--correct' : 'chat-results__quiz-row--incorrect'}">
              <span class="chat-results__quiz-icon">${qr.correct ? '✓' : '✗'}</span>
              <span class="chat-results__quiz-text">${qr.question}</span>
            </div>
          `;
        });

        quizSection = `
          <div class="chat-results__section">
            <div class="chat-results__section-title">🎯 Quiz-Auswertung</div>
            <div class="chat-results__quiz-hero">
              <div class="chat-results__ring-wrap">
                <svg class="chat-results__ring" viewBox="0 0 100 100">
                  <circle cx="50" cy="50" r="42" fill="none" stroke="var(--color-bg-darker)" stroke-width="6"/>
                  <circle cx="50" cy="50" r="42" fill="none" stroke="${ringColor}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 50 50)"/>
                </svg>
                <div class="chat-results__ring-text">
                  <div class="chat-results__ring-number">${qC}/${qT}</div>
                  <div class="chat-results__ring-label">richtig</div>
                </div>
              </div>
              <div class="chat-results__quiz-list">${quizListItems}</div>
            </div>
          </div>
        `;
      }

      resultsDiv.innerHTML = `
        <div class="chat-results__card">
          <div class="chat-results__header">
            <div class="chat-results__badge">${CURRENT_AUTHOR.short} Gespräch</div>
            <div class="chat-results__title">Deine Lernergebnisse</div>
            <div class="chat-results__subtitle">Didaktische Einheiten erfolgreich bearbeitet</div>
          </div>

          <div class="chat-results__stats-row">${statsMarkup}</div>
          
          ${quizSection}

          ${checkpointAnswers.length > 0 ? `
          <div class="chat-results__section">
            <div class="chat-results__section-title">💡 Reflexionen</div>
            ${checkpointAnswers.map(ca => `
              <div style="border:2px solid #000;padding:10px 12px;margin-bottom:8px;background:var(--color-bg);box-shadow:2px 2px 0 #000;">
                <div style="font-size:10px;font-weight:900;text-transform:uppercase;opacity:0.6;margin-bottom:4px;">${ca.question}</div>
                <div style="font-size:12px;line-height:1.5;">${ca.answer.replace(/\n/g,'<br>')}</div>
              </div>
            `).join('')}
          </div>` : ''}

          ${freetextResults.length > 0 ? `
          <div class="chat-results__section">
            <div class="chat-results__section-title">✍️ Freie Texteingaben</div>
            ${freetextResults.map(ft => `
              <div style="border:2px solid #000;padding:10px 12px;margin-bottom:8px;background:var(--color-bg);box-shadow:2px 2px 0 #000;">
                <div style="font-size:10px;font-weight:900;text-transform:uppercase;opacity:0.6;margin-bottom:4px;">${ft.prompt}</div>
                <div style="font-size:12px;line-height:1.5;">${ft.answer.replace(/\n/g,'<br>')}</div>
              </div>
            `).join('')}
          </div>` : ''}

          <div style="margin-top: 24px; text-align: center;">
            <button class="os-button os-button--accent" onclick="closeDidacticsChat()">Gespräch Beenden</button>
          </div>
        </div>
      `;

      parent.appendChild(resultsDiv);
      resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.closeDidacticsChat = function() {
      playSound('click');
      showLibraryView();
    };

    // Generic advancer
    window.advanceDidactics = function(btn) {
      playSound('click');
      // Disable action buttons inside active panel
      const container = btn.closest('.chat-framing, .chat-timeline, .chat-image, .chat-audio, .chat-annotation, .chat-barometer, .chat-checkpoint');
      if (container) {
        container.querySelectorAll('button').forEach(b => b.disabled = true);
      }
      showNextNode();
    };

    // =========================================================================
    // HIGH FIDELITY CITATION TOOLTIP LOGIC
    // =========================================================================
    function injectCitationBadges(text) {
      // Regex looking for citation brackets, e.g. [vgl. WDR Zeitzeichen] or <span class="chat-source-ref" title="...">Q</span>
      // Since MS JScript extracts these, the strings might have inline raw citation elements like:
      // <span class="chat-source-ref" title="Paul Celan, Psalm (1963)">Q</span>
      // Let's ensure these are perfectly parsed and rendered
      return parseMarkdownText(text);
    }

    function hookCitationEvents(bubbleElement) {
      const citationBadges = bubbleElement.querySelectorAll('.chat-source-ref');
      
      citationBadges.forEach(badge => {
        badge.addEventListener('click', (e) => {
          e.stopPropagation();
          playSound('click');

          // Close active popover if any
          if (activePopover) {
            activePopover.style.display = 'none';
          }

          const title = badge.getAttribute('title') || badge.getAttribute('aria-label') || 'Keine Quellenangabe';
          
          // Create or retrieve popover card
          let popover = bubbleElement.querySelector('.source-popover');
          if (!popover) {
            popover = document.createElement('div');
            popover.className = 'source-popover';
            bubbleElement.appendChild(popover);
          }

          popover.innerHTML = `<strong>📖 Quelle:</strong><br>${title.replace('Quelle:', '')}`;
          popover.style.display = 'block';

          // Position popover elegantly near the badge
          const badgeRect = badge.getBoundingClientRect();
          const bubbleRect = bubbleElement.getBoundingClientRect();
          
          popover.style.left = `${badge.offsetLeft}px`;
          popover.style.top = `${badge.offsetTop + badge.offsetHeight + 4}px`;

          activePopover = popover;
        });
      });
    }

  </script>
</body>
</html>
