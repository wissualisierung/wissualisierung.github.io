<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wortarten-Labor</title>
<style>
/* Layout: Laborbank links (Prüfband oben, Maschinen darunter, in Reichweite am Smartboard),
   Laborplan rechts (Baum oben nur zum Ansehen, Schubladen unten zum Tippen).
   Bewusst ein einziger heller Pastell-Look ohne Dunkelmodus. */
:root{
  color-scheme: light;
  --ink:#2c2a4a; --ink-soft:#625e8c;
  --ground:#e8e4f5; --grid:#ddd7ef;
  --panel:#fdfcff; --bench:#fbf0e3;
  --metal:#e3dff1; --metal-2:#cbc5e2; --metal-hover:#ece9f7;
  --belt:#9a93c4; --belt-2:#bdb7de;
  --accent:#ff8fb3; --accent-soft:#ffd6e3;
  --ja:#2fb873; --ja-soft:#d5f5e3; --nein:#f2596b; --nein-soft:#ffe1e5; --off:#d4cfe6;
  --verb:#ffe36e; --adjektiv:#a6e6a0; --nomen:#9dd4f1; --pronomen:#9eacf2; --artikel:#86d9c9; --adverb:#d6b0f0; --praeposition:#ffc08c; --konjunktion:#6ed691; --partikel:#cdd3e0; --satzaequivalent:#ff9e9e;
  /* Schriften: keine Web-Schriften aus dem Internet. "Labor Pixel" steckt als Datei-Schrift im Dokument,
     die übrigen sind Schriften des Geräts (wenn vorhanden), sonst Ersatz. */
  --f-ui:"Labor Pixel","Courier New",monospace;
  --f-term:"Courier Prime","Courier New",Courier,"Liberation Mono",monospace;
  --f-read:"Atkinson Hyperlegible",Verdana,"Segoe UI",Tahoma,Roboto,"Noto Sans","DejaVu Sans",system-ui,sans-serif;
  --b:3px; --sh:0.2667rem 0.2667rem 0 var(--ink); --sh-s:2px 2px 0 var(--ink);
}
html{font-size:16px;font-size:clamp(14px, .55vw + 8px, 20px);height:100%}
body{
  min-height:100%;color:var(--ink);font-family:var(--f-read);
  background-color:var(--ground);
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);
  background-size:2.1333rem 2.1333rem;
}
[hidden]{display:none!important}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

.app{max-width:126.6667rem;margin:0 auto;padding-inline:1.0667rem;padding-block:0.8rem 1.6rem;display:grid;gap:0.9333rem}

/* Kopfzeile */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:0.6667rem 0.9333rem;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:0.5333rem 0.8rem}
.brand{display:flex;align-items:center;gap:0.6667rem;font-family:var(--f-ui);font-weight:700;font-size:1.3rem;letter-spacing:.05em;text-transform:uppercase}
.brand canvas{width:2.5333rem;height:2.5333rem}
.roundinfo{display:flex;align-items:center;gap:0.5333rem 0.8rem;flex:1 1 20rem;min-width:0;flex-wrap:wrap;font-family:var(--f-ui)}
.floor{font-size:.78rem;font-weight:600;background:var(--metal);border:2px solid var(--ink);padding:2px 0.5333rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.maerchen-title{font-size:1.1rem;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:0.3333rem}
.pip{width:0.9333rem;height:0.9333rem;border:2px solid var(--ink);background:var(--panel)}
.pip.done{background:var(--ink)}
.pip.now{background:var(--accent)}
.tools{display:flex;gap:0.5333rem;margin-left:auto;flex-wrap:wrap}

/* Knöpfe */
.btn{font-family:var(--f-ui);font-weight:600;font-size:1rem;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh-s);padding:.4em .8em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:3.0667rem;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.btn.primary{background:var(--accent)}
.btn.big{font-size:1.25rem;padding:.5em 1.1em;box-shadow:var(--sh);min-height:3.8667rem}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn .ico{width:1.4667rem;height:1.4667rem;flex:none}
.btn .kbd{font-size:.75em;opacity:.7}
.gear{position:relative;-webkit-touch-callout:none}
.gear .hold{position:absolute;left:0;bottom:-3px;height:0.3333rem;width:0;background:var(--accent)}
.gear.holding .hold{animation:hold 2s linear forwards}
@keyframes hold{to{width:100%}}

/* Arbeitsfläche */
.labor{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:1.0667rem;align-items:start}
.bench,.plan{display:grid;gap:1.0667rem;min-width:0}
.panel{background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:0.5333rem;flex-wrap:wrap;font-family:var(--f-ui);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:.82rem;padding:0.4rem 0.8rem;border-bottom:var(--b) solid var(--ink);background:var(--metal)}
.panel-head .sub{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-soft)}
.tag{background:var(--accent-soft);border:2px solid var(--ink);padding:0 .5em;text-transform:none;letter-spacing:0}

/* Prüfband */
.station{background:var(--bench);padding:0.9333rem 1.0667rem 1.0667rem;display:grid;gap:0.8rem}
.guide{display:flex;gap:0.9333rem;align-items:flex-start}
.guide canvas{width:5.0667rem;height:5.0667rem;flex:none}
.bubble{position:relative;margin:0;flex:1;min-width:0;background:var(--panel);border:var(--b) solid var(--ink);padding:.55em .9em;font-size:1.08rem;line-height:1.42;min-height:3.3em}
.bubble::before,.bubble::after{content:"";position:absolute;background:var(--ink)}
.bubble::before{left:-11px;top:1.0667rem;width:0.5333rem;height:0.5333rem}
.bubble::after{left:-19px;top:1.7333rem;width:0.3333rem;height:0.3333rem}
.bubble .term,.term{font-family:var(--f-term);font-weight:700}
.bubble .w{font-weight:700}
.sentence{font-size:1.7rem;font-size:clamp(1.3rem, 1rem + 1.05vw, 2.15rem);line-height:1.55;text-align:center;padding:.25em .2em 0;text-wrap:balance}
.wordcard{display:inline-block;font-weight:700;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh-s);padding:0 .35em;margin:0 .08em;line-height:1.35}
.wordcard.ghost{visibility:hidden}
.wordcard.verb{background:var(--verb)}
.wordcard.adjektiv{background:var(--adjektiv)}
.wordcard.nomen{background:var(--nomen)}
.wordcard.pronomen{background:var(--pronomen)}
.wordcard.artikel{background:var(--artikel)}
.wordcard.adverb{background:var(--adverb)}
.wordcard.praeposition{background:var(--praeposition)}
.wordcard.konjunktion{background:var(--konjunktion)}
.wordcard.partikel{background:var(--partikel)}
.wordcard.satzaequivalent{background:var(--satzaequivalent)}
.flyer{position:fixed;z-index:40;pointer-events:none;margin:0;font-family:var(--f-read);box-sizing:border-box}
.belt{height:1.0667rem;border:var(--b) solid var(--ink);background:repeating-linear-gradient(90deg,var(--belt) 0 1.0667rem,var(--belt-2) 1.0667rem 2.1333rem)}
.belt.run{animation:belt .5s steps(4) infinite}
@keyframes belt{to{background-position:2.1333rem 0}}
.result{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.45em .6em;min-height:2.7em;font-size:1.15rem}
.result .mtag{font-family:var(--f-term);font-weight:700;font-size:.9rem;background:var(--metal);border:2px solid var(--ink);padding:.1em .5em}
.form{padding:.12em .5em;border:2px dashed var(--ink-soft);background:var(--panel)}
.form.base{border-style:solid;border-color:var(--ink-soft)}
.form.ok{border:2px solid var(--ja);background:var(--ja-soft)}
.form.bad{border:2px solid var(--nein);background:var(--nein-soft);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--nein)}
.sep{color:var(--ink-soft);font-family:var(--f-ui)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0.8rem;min-height:3.8667rem}
.thumb{min-width:9.5em}
.thumb.yes{background:var(--ja-soft)}
.thumb.no{background:var(--nein-soft)}
.thumb .ico{width:1.8667rem;height:1.8667rem}
.hint-line{font-family:var(--f-ui);font-size:1.05rem;color:var(--ink-soft);text-align:center}

/* Prüfmaschinen */
.machines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.9333rem;padding:0.9333rem}
.machine{position:relative;display:grid;grid-template-rows:auto 1fr;text-align:center;background:var(--metal);border:var(--b) solid var(--ink);box-shadow:var(--sh);cursor:pointer;min-height:11.2em;padding:0;overflow:hidden;touch-action:manipulation}
.machines.one{grid-template-columns:minmax(0,24em);justify-content:center}
.machines.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.machines.switched .machine{animation:appear .45s steps(5)}
@keyframes appear{from{transform:translateY(0.9333rem);opacity:.2}}
.machines.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.machines.five{grid-template-columns:repeat(6,minmax(0,1fr))}
.machines.five .machine{grid-column:span 2}
.machines.five .machine:nth-child(n+4){grid-column:span 3}
.machine:hover:not(:disabled){background:var(--metal-hover)}
.machine:active:not(:disabled){transform:translate(2px,2px);box-shadow:var(--sh-s)}
.machine:disabled{cursor:default}
.machine.waiting{opacity:.62}
.machine.active{background:var(--accent-soft);box-shadow:0.2667rem 0.2667rem 0 var(--accent)}
.mhead{display:flex;align-items:center;gap:0.5333rem;padding:0.3333rem 0.5333rem;border-bottom:var(--b) solid var(--ink);background:var(--metal-2)}
.key{font-family:var(--f-ui);font-weight:700;background:var(--ink);color:var(--panel);min-width:1.6em;padding:0 .3em;font-size:.85rem}
.dots{display:flex;gap:0.2667rem;margin-left:auto}
.dots i{width:0.5333rem;height:0.5333rem;border:2px solid var(--ink);background:var(--panel)}
.lamp{width:1.7333rem;height:1.7333rem;border:var(--b) solid var(--ink);background:var(--off);display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:.85rem;color:var(--panel)}
.lamp.ja{background:var(--ja)}
.lamp.nein{background:var(--nein)}
.lamp.partizip{background:var(--verb);color:var(--ink)}
.mbody{position:relative;display:grid;justify-items:center;align-content:center;gap:.35em;padding:0.6667rem 0.6667rem 0.9333rem}
.iconbox{position:relative;width:3.4667rem;height:3.4667rem}
.iconbox canvas{width:3.4667rem;height:3.4667rem}
.das{position:absolute;right:-16px;bottom:-4px;font-family:var(--f-read);font-weight:700;font-size:.72rem;background:var(--panel);border:2px solid var(--ink);padding:0 .3em;line-height:1.3}
.machine .term{font-size:1.25rem}
.question{font-size:.95rem;line-height:1.3;max-width:18em}
.shutter{position:absolute;top:0;right:0;bottom:0;left:0;transform-origin:top;transition:transform .5s steps(6);background:repeating-linear-gradient(0deg,var(--metal-2) 0 0.8rem,var(--ink-soft) 0.8rem 1rem)}
.machine:not(.locked) .shutter{transform:scaleY(0)}
.machine.shake,.drawer.wrong{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translate(-4px,0)}50%{transform:translate(0.2667rem,-2px)}75%{transform:translate(-3px,2px)}}

/* Laborplan */
.btn.mini{min-height:2.2667rem;padding:.15em .6em;font-size:.8rem;box-shadow:none;text-transform:none;letter-spacing:0}
.plan-full{padding:0;overflow-x:auto}
.plan-full .treesvg{min-width:720px}
.plan-note{margin:0;color:var(--ink-soft);line-height:1.4}
.head-right{display:flex;align-items:center;gap:0.6667rem;flex-wrap:wrap}
.legend{display:flex;gap:0.6667rem;text-transform:none;letter-spacing:0;font-weight:400}
.legend span{display:inline-flex;align-items:center;gap:0.2667rem}
.legend i{display:inline-block;width:0.8rem;height:0.8rem;border:2px solid var(--ink)}
.tree-wrap{padding:0.6667rem 0.8rem 0.8rem;overflow-x:auto}
.treesvg{display:block;width:100%;height:auto;min-width:300px}
.treesvg .edge{stroke:var(--ink);stroke-width:2.5;fill:none}
.treesvg .edge.ja{stroke:var(--ja);stroke-width:5}
.treesvg .edge.nein{stroke-dasharray:6 6;opacity:.45}
.treesvg .pebble{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.treesvg .node rect{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}
.treesvg .node text,.treesvg .leaf text{font-family:var(--f-term);font-weight:700;font-size:20px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.treesvg .node.root rect{fill:var(--metal)}
.treesvg .node.ja rect{fill:var(--ja-soft);stroke:var(--ja);stroke-width:3.5}
.treesvg .node.nein{opacity:.45}
.treesvg .node.nein text{text-decoration:line-through}
.treesvg .node.partizip rect{fill:#fff6c7;stroke-dasharray:7 5}
.treesvg .leaf rect{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}
.treesvg .leaf.verb rect{fill:var(--verb)}
.treesvg .leaf.adjektiv rect{fill:var(--adjektiv)}
.treesvg .leaf.nomen rect{fill:var(--nomen)}
.treesvg .leaf.pronomen rect{fill:var(--pronomen)}
.treesvg .leaf.artikel rect{fill:var(--artikel)}
.treesvg .leaf.adverb rect{fill:var(--adverb)}
.treesvg .leaf.praeposition rect{fill:var(--praeposition)}
.treesvg .leaf.konjunktion rect{fill:var(--konjunktion)}
.treesvg .leaf.partikel rect{fill:var(--partikel)}
.treesvg .leaf.satzaequivalent rect{fill:var(--satzaequivalent)}
.treesvg .leaf text.small{font-size:16px}
.treesvg .leaf .handle{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.treesvg .leaf.reached rect.box{stroke:var(--accent);stroke-width:6;animation:blink 1s steps(2) infinite}
.treesvg .future{fill:var(--off);stroke:none}
.treesvg .future-edge{stroke:var(--off);stroke-width:2.5;stroke-dasharray:3 7;fill:none}
@keyframes blink{50%{stroke:var(--ink)}}

/* Schubladen */
.cabinet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.8rem;padding:0.9333rem;background:var(--metal)}
.drawer{font-family:var(--f-ui);font-weight:700;font-size:1.25rem;border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:0.8rem 0.5333rem 0.6667rem;display:grid;justify-items:center;gap:0.4667rem;cursor:pointer;min-height:6.2em;touch-action:manipulation;transition:transform .15s steps(2)}
.drawer.verb{background:var(--verb)}
.drawer.adjektiv{background:var(--adjektiv)}
.drawer.nomen{background:var(--nomen)}
.drawer.pronomen{background:var(--pronomen)}
.drawer.artikel{background:var(--artikel)}
.drawer.adverb{background:var(--adverb)}
.drawer.praeposition{background:var(--praeposition)}
.drawer.konjunktion{background:var(--konjunktion)}
.drawer.partikel{background:var(--partikel)}
.drawer.satzaequivalent{background:var(--satzaequivalent)}
.cabinet.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:0.5333rem}
.cabinet.ten{grid-template-columns:repeat(5,minmax(0,1fr));gap:0.5333rem}
.cabinet.ten .drawer{font-size:.95rem;padding:0.5333rem 3px;min-height:4.8em}
.cab-row{grid-column:1/-1;margin:2px 0 -2px;font-family:var(--f-term);font-weight:700;font-size:.85rem;color:var(--ink-soft)}
.drawer.long{font-size:.92rem;hyphens:manual}
.machines.six .machine{min-height:9.2em}
.machines.six .iconbox,.machines.six .iconbox canvas{width:2.9333rem;height:2.9333rem}
.cabinet.ten .drawer.long{font-size:.78rem}
.cabinet.five .drawer{font-size:1.02rem;padding-inline:0.2667rem;min-height:5.6em}
.drawer .handle{width:3.0667rem;height:0.7333rem;border:var(--b) solid var(--ink);background:var(--panel)}
.drawer .count{font-size:.8rem;font-weight:600;background:var(--panel);border:2px solid var(--ink);padding:0 .5em;font-variant-numeric:tabular-nums}
.drawer:disabled{cursor:default}
.cabinet:not(.active) .drawer{box-shadow:var(--sh-s)}
.cabinet.active .drawer{transform:translateY(-4px)}
.drawer.bump{animation:bump .4s steps(4)}
@keyframes bump{40%{transform:translateY(-10px)}}

/* Dialoge */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:grid;place-items:center;padding:1.0667rem;overflow:auto;background:rgba(44,42,74,.55)}
.dialog{width:52rem;max-width:100%;box-sizing:border-box;max-height:calc(100% - 0.5333rem);overflow:hidden;display:flex;flex-direction:column;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:0.4rem 0.4rem 0 var(--ink)}
.dialog.wide{width:65.3333rem}
.dialog-head{display:flex;align-items:center;gap:0.6667rem;padding:0.5333rem 0.9333rem;border-bottom:var(--b) solid var(--ink);background:var(--metal);font-family:var(--f-ui);font-weight:700;font-size:1.1rem}
.dialog-head .dots{margin-left:auto}
.dialog-body{padding:1.0667rem;display:grid;gap:0.9333rem;flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.dialog-head{flex:none}
.dialog-body>.dialog-actions{position:-webkit-sticky;position:sticky;bottom:-16px;z-index:3;margin:0 -16px -16px;padding:0.6667rem 1.0667rem 0.9333rem;background:var(--panel);border-top:2px dashed var(--metal-2)}
.scene{display:block;width:100%;height:auto;max-width:calc(40vh * 16 / 9);margin:0 auto;aspect-ratio:16/9;border:var(--b) solid var(--ink);background:var(--metal)}
.scene.tap{cursor:pointer}
.story-text{margin:0;font-size:1.3rem;line-height:1.45;text-align:center;text-wrap:balance}
.story-text .say{display:block;font-weight:700;margin-bottom:.3em}
.dialog-actions{display:flex;justify-content:space-between;align-items:center;gap:0.6667rem;flex-wrap:wrap}
.dialog-actions .right{display:flex;gap:0.6667rem;margin-left:auto;flex-wrap:wrap}
.retell{display:grid;gap:.35em;background:var(--bench);border:var(--b) solid var(--ink);padding:0.8rem 1.0667rem}
.retell p{margin:0;font-size:1.15rem;line-height:1.55}
.retell mark{color:var(--ink);padding:0 .25em;border:2px solid var(--ink)}
.retell mark.verb{background:var(--verb)}
.retell mark.adjektiv{background:var(--adjektiv)}
.retell mark.nomen{background:var(--nomen)}
.retell mark.pronomen{background:var(--pronomen)}
.retell mark.artikel{background:var(--artikel)}
.retell mark.adverb{background:var(--adverb)}
.retell mark.praeposition{background:var(--praeposition)}
.retell mark.konjunktion{background:var(--konjunktion)}
.retell mark.partikel{background:var(--partikel)}
.retell mark.satzaequivalent{background:var(--satzaequivalent)}
.legend-box{background:var(--panel);padding:0.5333rem 1.0667rem}
.reveal{display:flex;align-items:center;gap:1.0667rem;flex-wrap:wrap}
.reveal canvas{width:7.4667rem;height:7.4667rem;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:0.4rem}
.reveal p{margin:0;font-size:1.1rem;flex:1;min-width:12em}
.big-title{font-family:var(--f-ui);font-weight:700;font-size:1.6rem;margin:0;text-wrap:balance}
.album-floor{display:grid;gap:0.6667rem}
.album-floor h3{margin:0;font-family:var(--f-ui);font-size:1.05rem;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6667rem,1fr));gap:0.8rem}
.slot{display:grid;justify-items:center;align-content:center;gap:0.4rem;border:3px dashed var(--ink-soft);padding:0.6667rem;min-height:10rem;text-align:center;font-size:.9rem}
.slot canvas{width:5.3333rem;height:5.3333rem}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--bench);box-shadow:var(--sh-s)}
.slot.new{animation:bump .5s steps(4) 2}
.slot .empty{width:5.3333rem;height:5.3333rem;display:grid;place-items:center;font-family:var(--f-ui);font-size:2rem;color:var(--ink-soft)}
.floor-locked{font-family:var(--f-ui);color:var(--ink-soft);border:2px dashed var(--ink-soft);padding:0.5333rem 0.8rem}

/* Lehrkraft-Bereich */
.tabs{display:flex;gap:0.5333rem;flex-wrap:wrap}
.tab[aria-selected="true"]{background:var(--accent)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:0.9333rem;padding:0.6667rem 0;border-bottom:2px dashed var(--metal-2)}
.setting:last-child{border-bottom:0}
.setting label,.setting .lbl{font-size:1.02rem;line-height:1.35}
.setting small{display:block;color:var(--ink-soft);font-size:.85rem}
.switch{appearance:none;-webkit-appearance:none;width:3.8667rem;height:2rem;flex:none;border:var(--b) solid var(--ink);background:var(--off);position:relative;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:1.2rem;height:1.2rem;background:var(--panel);border:2px solid var(--ink);transition:left .15s steps(3)}
.switch:checked{background:var(--ja)}
.switch:checked::after{left:1.9333rem}
.checks{display:flex;gap:0.6667rem;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--f-ui);font-weight:600;border:2px solid var(--ink);padding:0.2667rem 0.6667rem;cursor:pointer}
.check input{width:1.3333rem;height:1.3333rem;accent-color:var(--ink)}
.check.verb{background:var(--verb)}
.check.adjektiv{background:var(--adjektiv)}
.check.nomen{background:var(--nomen)}
.check.pronomen{background:var(--pronomen)}
.check.artikel{background:var(--artikel)}
.check.adverb{background:var(--adverb)}
.check.praeposition{background:var(--praeposition)}
.check.konjunktion{background:var(--konjunktion)}
.check.partikel{background:var(--partikel)}
.check.satzaequivalent{background:var(--satzaequivalent)}
select.sel{font:inherit;font-size:1rem;border:var(--b) solid var(--ink);background:var(--panel);padding:.35em .5em;min-height:3.0667rem;max-width:100%}
.preset{display:flex;gap:0.5333rem;align-items:center;flex-wrap:wrap}
.preset code{font-family:var(--f-term);font-weight:700;background:var(--bench);border:2px solid var(--ink);padding:.3em .6em;word-break:break-all}
.werkstatt{display:grid;gap:0.8rem}
.guide-text{display:grid;gap:0.4rem;line-height:1.45}
.guide-text h3{margin:0.6667rem 0 0;font-family:var(--f-ui);font-size:1.05rem}
.guide-text p,.guide-text ul,.guide-text ol{margin:0}
.guide-text ul,.guide-text ol{padding-left:1.3em}
.werkstatt textarea{width:100%;min-height:20em;resize:vertical;font-family:var(--f-term);font-size:.95rem;line-height:1.45;border:var(--b) solid var(--ink);padding:0.6667rem;background:#fffef8;color:var(--ink);box-sizing:border-box}
.werkstatt p{margin:0;line-height:1.45}
.msg{margin:0;font-weight:700}
.msg.err{color:#b3263a}
.msg.ok{color:#17794a}
.msg ul{margin:.3em 0 0;padding-left:1.2em;font-weight:400}
.toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--panel);font-family:var(--f-ui);padding:0.6667rem 1.0667rem;border:var(--b) solid var(--panel);max-width:calc(100% - 2.1333rem);text-align:center}

@media (min-width:1500px){
  html:not(.staged) .machines.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  html:not(.staged) .machines.four .term{font-size:1.1rem}
}
@media (min-width:1600px){
  html:not(.staged) .machines.five{grid-template-columns:repeat(5,minmax(0,1fr))}
  html:not(.staged) .machines.five .machine,html:not(.staged) .machines.five .machine:nth-child(n+4){grid-column:auto}
  html:not(.staged) .machines.five .term{font-size:1.1rem}
  html:not(.staged) .machines.five .question{font-size:.88rem}
}
/* Tablet hochkant und Handy */
@media (max-width:1000px){
  html:not(.staged) .labor{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  html:not(.staged) .machines,html:not(.staged) .machines.five,html:not(.staged) .machines.four,html:not(.staged) .machines.six,html:not(.staged) .machines.one{grid-template-columns:minmax(0,1fr)}
  html:not(.staged) .cabinet.ten{grid-template-columns:repeat(3,minmax(0,1fr))}
  html:not(.staged) .machines.five .machine,html:not(.staged) .machines.five .machine:nth-child(n+4){grid-column:auto}
  html:not(.staged) .cabinet.five{grid-template-columns:repeat(6,minmax(0,1fr))}
  html:not(.staged) .cabinet.five .drawer{grid-column:span 2}
  html:not(.staged) .cabinet.five .drawer:nth-child(n+4){grid-column:span 3}
  html:not(.staged) .machine{min-height:0}
  html:not(.staged) .mbody{grid-template-columns:auto minmax(0,1fr);justify-items:start;text-align:left;column-gap:0.9333rem}
  html:not(.staged) .iconbox{grid-row:span 2}
  html:not(.staged) .guide canvas{width:3.6rem;height:3.6rem}
  html:not(.staged) .drawer{font-size:1rem;min-height:5.4em}
  html:not(.staged) .brand span{font-size:1.05rem}
  html:not(.staged) .keys-hint{display:none}
  html:not(.staged) .thumb{min-width:0;flex:1}
}

/* ---------- Phasenfokus (dezent): aktiver Bereich hervorgehoben, nichts verschiebt sich ---------- */
.panel{transition:opacity .25s,filter .25s,box-shadow .25s}
.panel.focus{box-shadow:0.4rem 0.4rem 0 var(--accent)}
.panel.focus>.panel-head{background:var(--accent-soft)}
.panel.calm{opacity:.7;filter:saturate(.55)}

/* ---------- Bühne: Das ganze Labor passt immer auf einen Bildschirm (quer 1280×800, hoch 800×1140) ---------- */
/* Mitwachsendes Layout: Die Grundschrift (1rem) wird aus der Fenstergröße berechnet, alle Maße sind in rem.
   Passt es nicht ganz (sehr kleines Fenster), wird gescrollt statt abgeschnitten. */
html.staged{height:100%;overflow:auto;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.staged body{min-height:100%;margin:0}
html.staged .stage{position:relative;width:100%;min-height:100%}
html.staged .app{box-sizing:border-box;width:100%;height:100vh;height:var(--app-h,100vh);max-width:none;margin:0;padding:0.6667rem 0.9333rem 0.8rem;grid-template-rows:auto minmax(0,1fr);gap:0.6667rem}
html.staged.land .app{min-width:85.3333rem;min-height:53.3333rem}
html.staged.port .app{min-width:53.3333rem;min-height:76rem}
html.staged .topbar{padding:0.3333rem 0.6667rem;gap:0.4rem 0.8rem}
html.staged .brand{font-size:1.1rem}
html.staged .brand canvas{width:2rem;height:2rem}
html.staged .topbar .btn{min-height:2.6667rem;padding:.3em .7em}
html.staged .labor{height:100%;min-height:0;align-items:stretch;gap:0.8rem}
html.staged .bench,html.staged .plan{min-height:0;gap:0.8rem;grid-template-rows:minmax(0,1fr) auto}
html.staged .bench{grid-template-rows:minmax(0,1fr) var(--mach-h,13.3333rem)}
html.staged .bench[data-rows="2"]{--mach-h:20rem}
html.staged .panel{display:flex;flex-direction:column;min-height:0}
/* Prüfband */
html.staged .station{flex:1;min-height:0;overflow:hidden;padding:0.6667rem 0.9333rem 0.8rem;gap:0.5333rem;align-content:space-evenly}
html.staged .guide canvas{width:4.2667rem;height:4.2667rem}
html.staged .bubble{font-size:var(--fs-bub,1.08rem);min-height:0}
html.staged .sentence{font-size:var(--fs-sent,2.1rem);line-height:1.45;padding-top:.1em}
html.staged .result{font-size:var(--fs-res,1.15rem);min-height:2.4em}
html.staged .actions{min-height:3.8667rem}
/* Maschinen: flache Karten, Symbol links, Nummer oben und Ergebnislampe unten */
html.staged .machines{flex:1;min-height:0;padding:0.8rem;gap:0.8rem;grid-auto-rows:minmax(0,1fr);align-content:stretch}
html.staged .machines.four{grid-template-columns:repeat(2,minmax(0,1fr))}
html.staged .machines.one{grid-template-columns:minmax(0,24em);justify-content:center;grid-auto-rows:auto;align-content:center}
html.staged .machines .machine{min-height:0}
html.staged .machine{min-height:0;grid-template-columns:3.4667rem minmax(0,1fr);grid-template-rows:auto auto;align-content:center;align-items:center;column-gap:0.6667rem;row-gap:3px;text-align:left;padding:0.5333rem 0.8rem 0.5333rem 0.4rem}
html.staged .mhead{position:absolute;top:0.4rem;left:0.4rem;display:flex;flex-direction:row;gap:0.2667rem;align-items:center;padding:0;border:0;background:none;pointer-events:none;z-index:1}
html.staged .mhead .dots{display:none}
html.staged .lamp{width:1.4667rem;height:1.4667rem;font-size:.8rem}
html.staged .key{font-size:.78rem}
html.staged .mbody{display:contents}
html.staged .iconbox{grid-column:1;grid-row:1/span 2;justify-self:center;align-self:center;width:2.8rem;height:2.8rem;margin-top:1.4667rem}
html.staged .iconbox canvas{width:2.8rem;height:2.8rem}
html.staged .das{right:-8px;bottom:-6px;font-size:.66rem}
html.staged .machine .term{grid-column:2;grid-row:1;align-self:end;font-size:1.05rem;line-height:1.15;word-break:break-word;overflow-wrap:anywhere}
html.staged .question{grid-column:2;grid-row:2;align-self:start;font-size:.84rem;line-height:1.25;max-width:none}
html.staged .shutter{z-index:2}
html.staged #machinePanel[data-rows="1"] .iconbox,html.staged #machinePanel[data-rows="1"] .iconbox canvas{width:3.4667rem;height:3.4667rem}
html.staged #machinePanel[data-rows="1"] .machine .term{font-size:1.2rem}
html.staged #machinePanel[data-rows="1"] .question{font-size:.92rem}
/* Laborplan und Schubladen */
html.staged #planPanel{flex:1}
html.staged .tree-wrap{flex:1;min-height:0;display:flex;padding:0.5333rem 0.6667rem;overflow:hidden}
html.staged .tree-wrap .treesvg{width:100%;height:100%;min-width:0}
html.staged .cabinet{padding:0.8rem}
html.staged .drawer{min-height:5.2em;padding:0.6rem 0.4rem 0.5333rem;gap:0.4rem}
html.staged .cabinet.ten .drawer{min-height:4.3em;padding:0.4rem 3px}
html.staged .cabinet.five .drawer{min-height:5em}

/* Hochformat: Prüfband und Maschinen oben, Laborplan und Schubladen unten nebeneinander */
html.staged.port .brand span{display:none}
html.staged.port .labor{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 22.6667rem}
html.staged.port .plan{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
html.staged.port #cabinetPanel{min-height:0}
html.staged.port .cabinet{flex:1;min-height:0;grid-template-columns:minmax(0,1fr)!important;grid-auto-rows:minmax(0,1fr);align-content:stretch;gap:0.5333rem;padding:0.6667rem}
html.staged.port .cabinet.ten{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:auto repeat(5,minmax(0,1fr));grid-auto-flow:column;gap:0.4rem 0.5333rem}
html.staged.port .cab-row{grid-column:auto;margin:0}
html.staged.port .drawer{min-height:0;display:flex;align-items:center;justify-content:space-between;gap:0.5333rem;padding:0.2667rem 0.6667rem;font-size:1.05rem;text-align:left}
html.staged.port .drawer .handle{display:none}
html.staged.port .cabinet.ten .drawer{font-size:.84rem;padding:3px 0.4rem;min-height:0}
html.staged.port .cabinet.ten .drawer .count{font-size:.7rem;padding:0 .3em}
html.staged.port .drawer.long{font-size:.95rem}
html.staged.port .cabinet.ten .drawer.long{font-size:.78rem}
html.staged.port .cabinet.active .drawer{transform:translateX(-3px)}
.album-grid{display:grid;gap:0.8rem 1.2rem}
html.staged.land .album-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
html.staged .slots{grid-template-columns:repeat(auto-fill,minmax(6.6667rem,1fr));gap:0.5333rem}
html.staged .slot{min-height:7.2rem;padding:0.4rem;font-size:.8rem;gap:0.2667rem}
html.staged .slot canvas,html.staged .slot .empty{width:3.7333rem;height:3.7333rem}
html.staged .drawer .count{white-space:nowrap}
html.staged.port .cabinet .drawer,html.staged.port .cabinet.five .drawer,html.staged.port .cabinet.ten .drawer{min-height:0}

/* Ältere Browser ohne Abstände in Flex-Zeilen (Chrome < 84): Ersatz über Ränder */
html.no-flexgap .actions>*,html.no-flexgap .tools>*,html.no-flexgap .dialog-actions .right>*,html.no-flexgap .preset>*,
html.no-flexgap .checks>*,html.no-flexgap .tabs>*,html.no-flexgap .result>*,html.no-flexgap .head-right>*,html.no-flexgap .legend>*,
html.no-flexgap .roundinfo>*,html.no-flexgap .pips>*,html.no-flexgap .dots>*,html.no-flexgap .mhead>*{margin:3px}
html.no-flexgap .guide>canvas{margin-right:0.9333rem}
html.no-flexgap .brand>canvas{margin-right:0.6667rem}
html.no-flexgap .btn .ico{margin-right:.4em}
/* Technik-Check */
.tech td,.tech th{padding:0.4rem 0.5333rem;border-bottom:2px dashed var(--metal-2);text-align:left;vertical-align:top}
.tech{border-collapse:collapse;width:100%}
.tech .ok{color:#17794a;font-weight:700}
.tech .no{color:#b3263a;font-weight:700}
.tech-report{font-family:var(--f-term);font-size:.8rem;white-space:pre-wrap;background:var(--bench);border:2px solid var(--ink);padding:0.5333rem;margin:0;max-height:9em;overflow:auto}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script type="text/markdown" id="wortliste-5">
# Die Wortzwillinge der Fee

## Das
- Satz: **Das** Schloss schlief hundert Jahre.
- Wortart: Artikel
- deklinierbar: das Schloss → des Schlosses → dem Schloss
- Satzglied: Das schlief Schloss hundert Jahre.

## Das
- Satz: „**Das** ist der Wolf!“, riefen die Geißlein.
- Wortart: Pronomen
- deklinierbar: das → dessen → dem
- Satzglied: „Das ist der Wolf!“, riefen die Geißlein.
- Hinweis: Hier steht „das“ ohne Nomen. Es ist ein Pronomen (Demonstrativpronomen).

## zu
- Satz: Rotkäppchen ging **zu** seiner Großmutter.
- Wortart: Präposition
- Kasusforderung: zu wem? → zu seiner Großmutter → Dativ
- Satzglied: Zu ging Rotkäppchen seiner Großmutter.

## zu
- Satz: Der Schuh war **zu** klein.
- Wortart: Partikel
- Kasusforderung: zu wem? → zu klein
- Satzglied: Zu war der Schuh klein.
- Hinweis: Hier verstärkt „zu“ nur das Wort „klein“. Nach „zu klein“ kann man nicht „zu wem?“ fragen.

## denn
- Satz: Die Geißlein öffneten nicht, **denn** der Wolf war draußen.
- Wortart: Konjunktion
- Fügteil: Die Geißlein öffneten nicht. · Der Wolf war draußen.
- Satzglied: Denn war der Wolf draußen.

## denn
- Satz: „Wo ist **denn** das kleinste Geißlein?“, fragte die Mutter.
- Wortart: Partikel
- Satzglied: „Denn ist wo das kleinste Geißlein?“, fragte die Mutter.
- Fügteil: „Wo ist?“ · „Das kleinste Geißlein?“
- Hinweis: Diese Partikel macht die Frage freundlicher. Sie verbindet nichts.

## aber
- Satz: Die Fee war wütend, **aber** sie lachte am Ende.
- Wortart: Konjunktion
- Fügteil: Die Fee war wütend. · Sie lachte am Ende.
- Satzglied: Aber lachte sie am Ende.

## aber
- Satz: Das ist **aber** ein schönes Fest!
- Wortart: Partikel
- Satzglied: Aber ist das ein schönes Fest!
- Hinweis: Hier zeigt „aber“ nur Staunen. Es verbindet keine zwei Teile.

## ihre
- Satz: Die Goldmarie zeigte **ihre** Goldtaler.
- Wortart: Artikel
- deklinierbar: ihre Goldtaler → ihrer Goldtaler → ihren Goldtalern
- Satzglied: Ihre zeigte die Goldmarie Goldtaler.
- zusammen: Ihre Goldtaler zeigte die Goldmarie.
- Hinweis: Hier begleitet „ihre“ das Nomen „Goldtaler“ wie ein Artikel. Beide bilden eine feste Wortgruppe (Nominalphrase) und wandern nur zusammen nach vorn. Darum ist „ihre“ hier ein Possessivartikel, obwohl es wie ein Possessivpronomen aussieht.

## ihre
- Satz: „Die Goldtaler sind **ihre**, nicht deine!“, sagte die Mutter zur Pechmarie.
- Wortart: Pronomen
- deklinierbar: ihre → ihrer → ihren
- Satzglied: „Ihre sind die Goldtaler, nicht deine!“, sagte die Mutter zur Pechmarie.
- Hinweis: Hier steht „ihre“ allein, ohne Nomen. Es vertritt das Nomen: ihre = ihre Goldtaler. Darum ist es ein Possessivpronomen.

# Die Meisterprüfung

## verzauberte
- Satz: Der **verzauberte** Frosch wurde ein Prinz.
- Wortart: Verb
- Grundform: verzaubern
- konjugierbar: ich verzaubere · du verzauberst · sie verzauberte
- Partizip: verzaubert
- komparierbar: verzaubert → verzauberter → am verzaubertsten
- deklinierbar: der verzauberte → des verzauberten → dem verzauberten
- Hinweis: Das ist ein Partizip, also eine Verbform. Hier wird es attributiv gebraucht, ähnlich wie ein Adjektiv. Es bleibt aber ein Verb.

## schnell
- Satz: Der Hase lief **schnell** über das Feld.
- Wortart: Adjektiv
- komparierbar: schnell → schneller → am schnellsten
- deklinierbar: der schnelle Hase → des schnellen Hasen
- Hinweis: Viele halten „schnell“ hier für ein Adverb. Aber man kann es steigern – also ist es ein Adjektiv.

## Rotkäppchen
- Satz: **Rotkäppchen** traf den Wolf im Wald.
- Wortart: Nomen
- artikelfähig: das Rotkäppchen · ein Rotkäppchen
- deklinierbar: das Rotkäppchen → des Rotkäppchens → dem Rotkäppchen
- Hinweis: Eigenname – eine besondere Form des Nomens.

## ihre
- Satz: Die Hexe zählte **ihre** Goldstücke.
- Wortart: Artikel
- deklinierbar: ihre Goldstücke → ihrer Goldstücke → ihren Goldstücken
- Satzglied: Ihre zählte die Hexe Goldstücke.
- zusammen: Ihre Goldstücke zählte die Hexe.
- Hinweis: „ihre“ sieht aus wie ein Possessivpronomen. Hier bildet es aber mit „Goldstücke“ eine feste Wortgruppe (Nominalphrase): Beide wandern nur zusammen nach vorn. Deshalb ist „ihre“ hier ein Possessivartikel. Allein stehend wäre es ein Possessivpronomen: Die Goldstücke sind ihre.

## Der
- Satz: **Der** Prinz suchte Aschenputtel.
- Wortart: Artikel
- deklinierbar: der Prinz → des Prinzen → dem Prinzen
- Satzglied: Der suchte Prinz Aschenputtel.

## drinnen
- Satz: Die Großmutter lag **drinnen** im Bett.
- Wortart: Adverb
- Satzglied: Drinnen lag die Großmutter im Bett.

## mit
- Satz: Rotkäppchen ging **mit** dem Korb los.
- Wortart: Präposition
- Kasusforderung: mit wem oder was? → mit dem Korb → Dativ
- Satzglied: Mit ging Rotkäppchen dem Korb los.

## Wenn
- Satz: **Wenn** es dunkel wird, kommt der Wolf.
- Wortart: Konjunktion
- Fügteil: Es wird dunkel. · Der Wolf kommt.
- Satzglied: Wenn kommt der Wolf.

- Wortart: Partikel
- Satzglied: Sehr war der Wolf hungrig.

## Hurra

- Wortart: Satzäquivalent

function drawSprite(ctx, rows, x, y, s, flipY){
  for (let r = 0; r < rows.length; r++){
    const row = flipY ? rows[rows.length - 1 - r] : rows[r];
    for (let c = 0; c < row.length; c++){
      const col = PAL[row[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x + c * s, y + r * s, s, s);
    }
  }
}
function paintCanvas(cv, rows, flipY){
  if (!cv) return;
  cv.width = rows[0].length; cv.height = rows.length;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawSprite(ctx, rows, 0, 0, 1, flipY);
}
function spriteByName(name){
  if (name === 'machine') return machineSprite('normal');
  return SPR[name];
}
function paintAllIcons(root){
  (root || document).querySelectorAll('canvas[data-sprite]').forEach(cv => {
    const rows = spriteByName(cv.dataset.sprite);
    if (rows) paintCanvas(cv, rows, cv.dataset.flip === '1');
  });
}

/* ---------- Szenen für die Geschichte (128 x 72 Pixel) ---------- */
function seeded(n){ let x = n; return () => (x = (x * 9301 + 49297) % 233280) / 233280; }
function rect(ctx, c, x, y, w, h){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function card(ctx, x, y){ rect(ctx, PAL.K, x, y, 8, 6); rect(ctx, PAL.W, x + 1, y + 1, 6, 4); rect(ctx, PAL.D, x + 2, y + 2, 4, 1); }
function bricks(ctx, base, line){
  rect(ctx, base, 0, 0, 128, 72);
  ctx.fillStyle = line;
  for (let y = 4; y < 60; y += 7){
    ctx.fillRect(0, y, 128, 1);
    const off = (y / 7) % 2 ? 0 : 8;
    for (let x = off; x < 128; x += 16) ctx.fillRect(x, y - 6, 1, 6);
  }
}
function drawScene(cv, which){

    for (let i = 0; i < 16; i++){ rect(ctx, PAL.K, 48 + i, 22 - i, 1, 1); rect(ctx, PAL.K, 79 - i, 22 - i, 1, 1); }
    for (let i = 0; i < 15; i++) rect(ctx, PAL.P, 50 + i, 22 - i, 28 - 2 * i, 1);

    rect(ctx, PAL.K, 58, 30, 12, 12); rect(ctx, PAL.Y, 59, 31, 10, 10);

  } else if (which === 'fee'){
    bricks(ctx, '#e6e1f4', '#d3cbea');
    rect(ctx, '#d9b98f', 0, 60, 128, 12); rect(ctx, '#c49f74', 0, 60, 128, 1);
    for (let x = 0; x < 128; x += 12) rect(ctx, '#c49f74', x, 61, 1, 11);
    drawSprite(ctx, machineSprite('stutter'), 76, 12, 3);
    drawSprite(ctx, SPR.fairy, 6, 14, 3);
    [[60, 10], [52, 22], [64, 30], [44, 8], [58, 44], [38, 32], [70, 50], [30, 52]].forEach(([x, y]) => card(ctx, x, y));
    for (let i = 0; i < 14; i++) rect(ctx, i % 2 ? PAL.Y : PAL.W, 40 + Math.floor(rnd() * 40), 4 + Math.floor(rnd() * 50), 1, 1);
  } else if (which === 'chaos'){
    bricks(ctx, '#e6e1f4', '#d3cbea');
    rect(ctx, '#d9b98f', 0, 60, 128, 12); rect(ctx, '#c49f74', 0, 60, 128, 1);
    drawSprite(ctx, machineSprite('stutter'), 40, 0, 3);
    drawSprite(ctx, SPR.qmark, 20, 10, 2); drawSprite(ctx, SPR.qmark, 98, 6, 2); drawSprite(ctx, SPR.qmark, 104, 30, 1);
    [[10, 62], [22, 64], [36, 63], [84, 62], [98, 64], [112, 63], [60, 65]].forEach(([x, y]) => card(ctx, x, y));
  } else if (which === 'turmspitze' || which === 'fest'){
    const fest = which === 'fest';
    const sky = fest ? ['#7d73b8', '#8a80c2', '#978dcc', '#a49ad6'] : ['#5b5490', '#665fa0', '#7268ae', '#7f75bb'];

    rect(ctx, '#d9b98f', 0, 60, 128, 12); rect(ctx, '#c49f74', 0, 60, 128, 1);
    for (let i = 0; i < 64; i++){ rect(ctx, PAL.K, i, 59 - Math.floor(i / 4), 1, 1); rect(ctx, PAL.K, 127 - i, 59 - Math.floor(i / 4), 1, 1); }
    drawSprite(ctx, machineSprite(fest ? 'happy' : 'normal'), 74, 12, 3);
    drawSprite(ctx, fairySprite(fest), 10, 12, 3);
    if (fest){
      for (let x = 0; x < 128; x += 8){ rect(ctx, [PAL.Y, PAL.P, PAL.B, PAL.g][(x / 8) % 4], x + 2, 4 + ((x / 8) % 2) * 2, 4, 4); }
      for (let i = 0; i < 26; i++) rect(ctx, [PAL.Y, PAL.P, PAL.B, PAL.g, PAL.O][i % 5], Math.floor(rnd() * 128), 10 + Math.floor(rnd() * 46), 2, 2);

    });
  }
}

/* ---------- Ton (standardmäßig aus) ---------- */
let actx = null;
function tone(freq, dur, type, vol, when){
  if (!settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || .05, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);

function parseMD(text, lab){

  text.split(/\r?\n/).forEach((raw, idx) => {
    const line = raw.trim();
    if (!line) return;
    let m;
    if ((m = line.match(/^#\s+(.+)$/))){
      cur = { title: m[1].trim(), words: [] }; cur.sticker = stickerFor(cur.title);
      rounds.push(cur); entry = null; return;
    }
    if ((m = line.match(/^##\s+(.+)$/))){
      if (!cur){ cur = { title: 'Eigene Wörter', words: [], sticker: 'star' }; rounds.push(cur); }
      entry = { wort: m[1].trim(), line: idx + 1 }; cur.words.push(entry); return;
    }
    if ((m = line.match(/^[-*]\s*([^:]+):\s*(.*)$/)) && entry){
      const key = KEYMAP[normKey(m[1])];
      if (key) entry[key] = m[2].trim();
    }

  const allowed = L.wa.join(', ').replace(/, ([^,]*)$/, ' und $1');
  rounds.forEach(r => {
    r.words = r.words.filter(e => {
      const where = `Zeile ${e.line} („${e.wort}“)`;
      if (!e.satz){ errors.push(`${where}: Es fehlt „- Satz: …“.`); return false; }
      const wa = normWortart(e.wortart);
      if (!wa){ errors.push(`${where}: Wortart „${e.wortart || ''}“ kenne ich nicht. Erlaubt in Labor ${lab}: ${allowed}.`); return false; }
      if (wa[0] === '#' || !L.wa.includes(wa)){
        const home = LAB_IDS.find(n => LABS[n].wa.includes(wa));
        errors.push(`${where}: ${wa.replace('#', '')} gehört ${home ? 'in Labor ' + home : 'in ein späteres Labor'}. In Labor ${lab} gehen ${allowed}.`); return false;
      }
      if (wa === 'Verb' && !e.partizip && normKey(e.wortart).includes('partizip')) e.partizip = 'ja';
      if (wa !== 'Verb') delete e.partizip;
      e.wortart = wa;
      const mm = e.satz.match(/^(.*?)\*\*(.+?)\*\*(.*)$/);
      if (mm){ e.parts = [mm[1], mm[2], mm[3]]; e.wort = mm[2]; }
      else {
        const i = e.satz.indexOf(e.wort);
        if (i < 0){ errors.push(`${where}: Das Wort steht nicht im Satz. Markiere es so: **${e.wort}**`); return false; }
        e.parts = [e.satz.slice(0, i), e.wort, e.satz.slice(i + e.wort.length)];
      }
      const need = ((REQUIRED[lab] || {})[wa] || []).filter(f => !e[f]);
      if (need.length){ errors.push(`${where}: In Labor ${lab} braucht ${wa === 'Präposition' || wa === 'Konjunktion' ? 'eine' : 'ein'} ${wa} die Zeile ${need.map(f => FIELD_HELP[f]).join(' und ')}.`); return false; }
      if (!e.grundform){
        if (wa === 'Nomen' && e.art){ const first = splitForms(e.art)[0] || ''; e.grundform = first.replace(/^(der|die|das)\s+/i, '').trim() || e.wort; }
        else if (wa === 'Nomen' || wa === 'Verb' || wa === 'Adjektiv') e.grundform = e.wort;
        else e.grundform = e.wort.toLowerCase();
      }
      e.round = r.title;
      return true;
    });
  });
  return { rounds: rounds.filter(r => r.words.length), errors };
}

}
function stateOf(entry, t, truth){ return isPartizipCase(entry, t) ? 'partizip' : truth ? 'ja' : 'nein'; }
function probe(entry, t){
  if (isPartizipCase(entry, t)){
    const given = entry[t], p = partizipStem(entry);
    const parts = given ? splitForms(given) : [];
    if (parts.length > 1) return { truth: true, base: parts[0], items: parts.slice(1), partizip: true };
    if (t === 'komp') return { truth: true, base: p, partizip: true,
      items: [p + 'er', 'am ' + p + (/(er|el)t$|end$/.test(p) ? 'sten' : /(s|ß|sch|z|x|t|d)$/.test(p) ? 'esten' : 'sten')] };
    return { truth: true, base: entry.wort, items: [p + 'en', p + 'em'], partizip: true };
  }
  const truth = TRUTH[t](entry.wortart);
  if (t === 'isol'){
    const alone = entry.isol ? entry.isol.replace(/^\*+/, '') : cap(entry.wort.toLowerCase()) + '!';
    return { truth, base: sentenceOf(entry), items: [alone] };
  }
  if (t === 'flex' && truth && !entry.flex){
    const main = entry.konj ? 'konj' : entry.komp ? 'komp' : entry.dekl ? 'dekl' : entry.art ? 'art' : null;
    if (main){ const p = probe(entry, main); return { truth, base: p.base, items: p.items, sep: TESTS[main].sep }; }
  }
  const given = entry[t === 'sgatt' ? 'sg' : t];
  const lw = entry.wort.toLowerCase(), g = entry.grundform;
  const pa = entry.wortart === 'Pronomen' || entry.wortart === 'Artikel';
  if (t === 'kasus'){
    if (given){
      const parts = given.split(/\s*(?:→|->)\s*/).map(x => x.trim()).filter(Boolean);
      let fall = null;
      if (parts.length > 1 && /^(Nominativ|Genitiv|Dativ|Akkusativ)$/i.test(parts[parts.length - 1])) fall = cap(parts.pop().toLowerCase());
      return parts.length > 1 ? { truth, base: parts[0], items: parts.slice(1), fall } : { truth, base: null, items: parts, fall };
    }
    return { truth, base: null, items: [`${lw} wem?`] };
  }
  if (t === 'fueg'){
    if (given) return { truth, base: null, items: given.split(/\s*(?:·|\|)\s*/).map(x => x.trim()).filter(Boolean) };
    // Fehlversuch: Satz am Wort zerschneiden (ohne Anführungszeichen, ohne verwaiste Satzzeichen)
    const clean = s => tidy(s.replace(/[„“"]/g, ' ')).replace(/([!?.]),/g, '$1').replace(/^[,;:.!?\s]+/, '').replace(/[,;:\s]+$/, '');
    const a = clean(entry.parts[0]), b = clean(entry.parts[2]);
    const end = s => (/[.!?]$/.test(s) ? s : s + '.');
    return { truth, base: null, items: [a ? end(cap(a)) : '–', b ? end(cap(b)) : '–'] };
  }
  if (t === 'sg' || t === 'sgatt'){
    const items = [given ? given.replace(/^\*+/, '') : moveFront(entry)];
    if (t === 'sgatt' && settings.attribut && entry.attribut) items.push(entry.attribut);
    return { truth, base: null, items };
  }
  if (given){
    const parts = splitForms(given);
    if (TESTS[t].sep === '→' && parts.length > 1) return { truth, base: parts[0], items: parts.slice(1) };
    return { truth, base: null, items: parts };
  }
  if (truth) return { truth, base: null, items: [entry.wort] };
  if (t === 'flex') return { truth, base: null, items: flexAttempt(lw) };
  if (t === 'konj') return { truth, base: null, items: konjAttempt(pa ? lw : g) };
  if (t === 'komp') return Object.assign({ truth }, kompAttempt(pa ? lw : g, entry.wortart));
  if (t === 'dekl'){ const core = lw.replace(/e$/, ''); return { truth, base: entry.wort, items: [core + 'es', core + 'em'] }; }
  if (t === 'art') return { truth, base: null, items: pa ? [`ein ${lw}`, `der ${lw}`] : [`der ${g}`, `die ${g}`] };
  return { truth, base: null, items: [`${entry.wort} …`] };
}

  3: { wort: 'dort', parts: ['Die Geißlein wohnten ', 'dort', ' im Wald.'], wortart: 'Adverb', grundform: 'dort', round: 'Vorführung',

};
const S = {

function labTests(){ return LABS[S.lab].tests; }
function labWA(){ return LABS[S.lab].wa.filter(w => settings.enabled[w]); }
function activeWords(r){
  const round = S.rounds[r];
  return round ? round.words.filter(w => settings.enabled[w.wortart]) : [];

/* Voraussetzungen im Baum (im geführten Modus als Rolltor sichtbar) */
function unlocked(t){
  const T = S.tests, tests = labTests();
  const hasFlex = tests.includes('flex');
  if (hasFlex && LEFT_TESTS.includes(t) && T.flex !== 'ja') return false;
  if (hasFlex && RIGHT_TESTS.includes(t) && T.flex !== 'nein') return false;
  if (t === 'sg') return T.dekl === 'ja' && T.art === 'nein' && T.komp === 'nein';
  if ((t === 'sgatt' || t === 'kasus' || t === 'fueg') && tests.includes('isol')) return T.isol === 'nein';
  return true;
}
/* Im Abschlusslabor zeigt die Weiche nur die Maschinen der passenden Baumhälfte */
function visibleTests(){
  if (S.lab !== 5) return labTests();
  if (S.tests.flex === 'ja') return ['flex'].concat(LEFT_TESTS);
  if (S.tests.flex === 'nein') return ['flex'].concat(RIGHT_TESTS);
  return ['flex'];
}
function reachedWortart(){
  const T = S.tests;
  if (T.konj === 'ja') return 'Verb';
  if (T.komp === 'ja') return 'Adjektiv';
  if (T.art === 'ja') return 'Nomen';
  if (T.sg === 'ja') return 'Pronomen';
  if (T.sg === 'nein') return 'Artikel';
  if (T.sgatt === 'ja') return 'Adverb';
  if (T.kasus === 'ja') return 'Präposition';
  if (T.fueg === 'ja') return 'Konjunktion';
  if (T.isol === 'ja') return 'Satzäquivalent';
  if (T.sgatt === 'nein' && T.kasus === 'nein' && T.fueg === 'nein' && labTests().includes('isol')) return 'Partikel';
  return null;
}

/* ---------- Voreinstellungen per Link (#labor-3.experte.mit-attribut) ---------- */
function readPresets(){
  const tokens = [];
  try {
    const h = (location.hash || '').replace(/^#/, '');
    if (h) tokens.push(...h.split('.'));
    new URLSearchParams(location.search).forEach((v, k) => tokens.push(v && v !== '1' ? `${k}-${v}` : k));
  } catch (e) { /* ohne Voreinstellung weiter */ }
  tokens.forEach(raw => {
    const t = raw.toLowerCase();
    let m;
    if (t === 'experte') settings.expert = true;
    else if (t === 'ohne-urteil') settings.kidJudge = false;
    else if (t === 'ohne-vorfuehrung') settings.demo = false;
    else if (t === 'ohne-geschichte') settings.story = false;
    else if (t === 'mit-attribut') settings.attribut = true;
    else if (t === 'ton') settings.sound = true;
    else if ((m = t.match(/^labor-?(\d)$/)) && LABS[+m[1]]) settings.lab = +m[1];
    else if ((m = t.match(/^runde-?(\d+)$/))) settings.startRound = Math.max(0, +m[1] - 1);
    else if (t.startsWith('ohne-')){
      const w = WA_ALL.find(x => normKey(x) === normKey(t.slice(5)));
      if (w) settings.enabled[w] = false;
    }
  });
}
function presetString(){
  const t = [];
  if (S.lab !== 1) t.push('labor-' + S.lab);
  if (settings.expert) t.push('experte');
  if (!settings.kidJudge) t.push('ohne-urteil');
  if (settings.attribut && S.lab >= 3) t.push('mit-attribut');
  LABS[S.lab].wa.forEach(w => { if (!settings.enabled[w]) t.push('ohne-' + normKey(w)); });
  if (!settings.demo) t.push('ohne-vorfuehrung');
  if (!settings.story) t.push('ohne-geschichte');
  if (settings.sound) t.push('ton');
  if (S.r > 0) t.push('runde-' + (S.r + 1));
  return t.length ? '#' + t.join('.') : '(Standard – kein Zusatz nötig)';
}

/* Ende einer Animation; ältere Browser (Chrome < 84) kennen animation.finished nicht */
const animEnd = (a, ms) => (a && a.finished) ? a.finished : wait(ms);

/* Prüfband auf der Bühne: Passt der Inhalt nicht, wird die Schrift stufenweise kleiner (nie Scrollen). */
const staged = () => document.documentElement.classList.contains('staged');
function fitStation(){
  const st = document.querySelector('.station');
  if (!st) return;
  ['--fs-sent', '--fs-bub', '--fs-res'].forEach(v => st.style.removeProperty(v));
  if (!staged()) return;
  const over = () => st.scrollHeight > st.clientHeight + 1;
  const steps = [['--fs-sent', [1.95, 1.8, 1.65, 1.5, 1.35]], ['--fs-bub', [1, .94, .88, .82]], ['--fs-res', [1.05, .96]]];
  for (const [v, vals] of steps) for (const x of vals){ if (!over()) return; st.style.setProperty(v, x + 'rem'); }
}

/* ---------- Maschinen (je Labor einmal bauen, dann nur aktualisieren) ---------- */
let builtFor = '';
function buildMachines(force){
  const tests = visibleTests();
  const key = S.lab + ':' + tests.join(',') + ':' + settings.attribut;
  if (!force && key === builtFor) return;
  builtFor = key;
  const box = $('#machines');
  ['one', 'four', 'five', 'six'].forEach(c => box.classList.remove(c));
  const cls = { 1: 'one', 4: 'four', 5: 'five', 6: 'six' }[tests.length];
  if (cls) box.classList.add(cls);
  /* Platz für die größte Maschinenzahl des Labors reservieren, damit nach der Weiche nichts springt */
  const maxN = labTests().includes('flex') && labTests().length > 5 ? 1 + Math.max(LEFT_TESTS.length, RIGHT_TESTS.length) : labTests().length;
  const rows = maxN <= 3 ? '1' : '2';
  $('#bench').dataset.rows = rows; $('#machinePanel').dataset.rows = rows;
  box.innerHTML = tests.map((t, k) => {
    const T = TESTS[t];
    return `<button class="machine" type="button" data-test="${t}" aria-label="${T.term}: ${frageOf(t)}">
      <span class="mhead"><span class="key">${k + 1}</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="lamp" aria-hidden="true"></span></span>
      <span class="mbody">
        <span class="iconbox"><canvas class="icon" data-sprite="${T.sprite}" aria-hidden="true"></canvas>${t === 'art' ? '<span class="das" aria-hidden="true">das</span>' : ''}</span>
        <span class="term">${T.term}</span>
        <span class="question">${frageOf(t)}</span>
        <span class="shutter" aria-hidden="true"></span>
      </span>
    </button>`;
  }).join('');
  paintAllIcons(box);
}
function machineLocked(t){ return !settings.expert && !unlocked(t); }
function updateMachines(){
  buildMachines();
  visibleTests().forEach(t => {
    const el = $(`.machine[data-test="${t}"]`);
    if (!el) return;
    const st = S.tests[t];
    const locked = machineLocked(t);
    const can = S.phase === 'pick' && !S.busy && !st && !locked;
    const active = !!(S.result && S.result.t === t && !S.result.judged);
    el.disabled = !can;
    el.classList.toggle('locked', locked);
    el.classList.toggle('active', active);
    el.classList.toggle('waiting', !can && !st && !locked && !active);
    const lamp = el.querySelector('.lamp');
    lamp.className = 'lamp' + (st ? ' ' + st : '');
    lamp.textContent = st === 'ja' ? '✓' : st === 'nein' ? '✗' : st === 'partizip' ? '!' : '';
    const stText = st === 'partizip' ? 'klappt, aber das Wort ist eine Verbform (Partizip)' : st;
    el.setAttribute('aria-label', `${TESTS[t].term}: ${frageOf(t)}` + (st ? ` Ergebnis: ${stText}.` : locked ? ' Noch geschlossen.' : ''));
  });
}

/* ---------- Animationen ---------- */
/* Auf der skalierten Bühne fliegt die Wortkarte in Bühnen-Koordinaten (Bildschirmmaß geteilt durch den Maßstab). */
function stageFrame(){ return { host: document.body, x: 0, y: 0, s: 1 }; }   // kein skaliertes Bild mehr: Bildschirmkoordinaten gelten direkt
function flyer(from){
  const F = stageFrame(), r = from.getBoundingClientRect();
  const f = from.cloneNode(true);
  f.removeAttribute('id'); f.classList.add('flyer');
  Object.assign(f.style, { left: (r.left - F.x) / F.s + 'px', top: (r.top - F.y) / F.s + 'px', width: r.width / F.s + 'px', height: r.height / F.s + 'px', fontSize: getComputedStyle(from).fontSize });
  F.host.appendChild(f);
  return { f, r, s: F.s };
}
function centerDelta(r, el, s){
  const b = el.getBoundingClientRect();
  return [(b.left + b.width / 2 - (r.left + r.width / 2)) / (s || 1), (b.top + b.height / 2 - (r.top + r.height / 2)) / (s || 1)];
}
async function flyWord(t){
  const card = $('#wordcard'), m = $(`.machine[data-test="${t}"]`), icon = m && m.querySelector('.iconbox');
  const belt = $('#belt');
  sfx.machine();
  belt.classList.add('run');
  if (!card || !icon || reduceMotion()){
    if (m) m.classList.add('shake'); await wait(300); if (m) m.classList.remove('shake'); belt.classList.remove('run'); return;
  }
  const { f, r, s } = flyer(card);
  card.classList.add('ghost');
  const [dx, dy] = centerDelta(r, icon, s);
  await animEnd(f.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px,${dy}px) scale(.35)` }], { duration: 360, easing: 'steps(8, end)', fill: 'forwards' }), 360);
  m.classList.add('shake'); await wait(300); m.classList.remove('shake');
  await animEnd(f.animate([{ transform: `translate(${dx}px,${dy}px) scale(.35)` }, { transform: 'translate(0,0) scale(1)' }], { duration: 320, easing: 'steps(8, end)', fill: 'forwards' }), 320);
  f.remove(); card.classList.remove('ghost'); belt.classList.remove('run');
}
async function flyToDrawer(w){
  const card = $('#wordcard'), d = $(`.drawer[data-w="${w}"]`);
  sfx.drawer();
  if (!card || !d || reduceMotion()) return;
  const { f, r, s } = flyer(card);
  const [dx, dy] = centerDelta(r, d, s);
  await animEnd(f.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px,${dy}px) scale(.4)`, opacity: .4 }], { duration: 420, easing: 'steps(8, end)', fill: 'forwards' }), 420);
  f.remove();
}

const LEAF_Y = 460, LEAF_H = 46, LINE_H = 22;
function nodeState(id, T){
  switch (id){
    case 'dekl': return T.dekl || (T.art === 'ja' ? 'ja' : '');
    case 'nsg': return T.sg === 'nein' ? 'ja' : T.sg === 'ja' ? 'nein' : '';
    case 'root2': return T.flex === 'nein' ? 'ja' : T.flex === 'ja' ? 'nein' : '';
    case 'integ': return T.isol === 'nein' || (!T.isol && T.flex === 'nein') ? 'ja' : T.isol === 'ja' ? 'nein' : '';
    case 'nsgatt': return T.sgatt === 'nein' ? 'ja' : T.sgatt === 'ja' ? 'nein' : '';
    case 'root': return T.flex === 'ja' ? 'ja' : T.flex === 'nein' ? 'nein' : '';
    default: return T[id] || '';
  }
}
function leafEdgeState(parent, leaf, T){
  if (leaf === 'Partikel'){
    if (T.sgatt === 'nein' && T.kasus === 'nein' && T.fueg === 'nein') return 'ja';
    return T.kasus === 'ja' || T.fueg === 'ja' || T.sgatt === 'ja' ? 'nein' : '';
  }
  return nodeState(parent, T);
}
function nodeBox(n){
  const h = n.label.length * LINE_H + 16, w = Math.max(...n.label.map(l => l.length)) * 12 + 26;
  return { w, h };
}
function halfSVG(name, opts){
  const H = HALF[name], live = !!opts.live, all = !!opts.all, T = live ? S.tests : {};
  const shown = lab => all || lab <= S.lab;
  const leafOn = w => all || (H.leaves[w].lab <= S.lab && settings.enabled[w]);
  const reached = live && (S.phase === 'sort' || S.phase === 'demo') && !S.sortedAs ? reachedWortart() : null;
  const pt = id => {
    if (H.nodes[id]){ const n = H.nodes[id], b = nodeBox(n); return { x: n.x, top: n.y - b.h / 2, bottom: n.y + b.h / 2, lab: n.lab }; }
    const l = H.leaves[id]; return { x: l.x, top: LEAF_Y - LEAF_H / 2, bottom: LEAF_Y + LEAF_H / 2, lab: l.lab };
  };
  let s = '';
  H.edges.forEach(([a, b, dx = 0]) => {
    const A = pt(a), B = pt(b), isLeaf = !H.nodes[b];
    if (isLeaf && !leafOn(b) && shown(B.lab)) return;
    const x1 = A.x + dx, y1 = A.bottom, x2 = B.x, y2 = B.top;
    if (!shown(B.lab)){ s += `<line class="future-edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; return; }
    const st = isLeaf ? leafEdgeState(a, b, T) : nodeState(b, T);
    s += `<line class="edge ${st}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if (st === 'ja'){
      const n = Math.floor(Math.hypot(x2 - x1, y2 - y1) / 22);
      for (let k = 1; k < n; k++){
        const px = x1 + (x2 - x1) * k / n, py = y1 + (y2 - y1) * k / n;
        s += `<rect class="pebble" x="${(px - 3.5).toFixed(1)}" y="${(py - 3.5).toFixed(1)}" width="7" height="7"/>`;
      }
    }
  });
  Object.keys(H.nodes).forEach(id => {
    const n = H.nodes[id], b = nodeBox(n);
    if (!shown(n.lab)){ s += `<rect class="future" x="${n.x - 8}" y="${n.y - 8}" width="16" height="16"/>`; return; }
    const st = nodeState(id, T);
    const text = n.label.map((l, k) => `<text x="${n.x}" y="${(n.y + 1 + (k - (n.label.length - 1) / 2) * LINE_H).toFixed(1)}">${l}</text>`).join('');
    s += `<g class="node ${st} ${n.start ? 'root' : ''}"><rect x="${n.x - b.w / 2}" y="${n.y - b.h / 2}" width="${b.w}" height="${b.h}"/>${text}</g>`;
  });
  Object.keys(H.leaves).forEach(w => {
    const l = H.leaves[w], lw = l.w || 108;
    if (!shown(l.lab)){ s += `<rect class="future" x="${l.x - lw / 2 + 10}" y="${LEAF_Y - 20}" width="${lw - 20}" height="40"/>`; return; }
    if (!leafOn(w)) return;
    const named = S.named[w] && !settings.expert;
    s += `<g class="leaf ${named ? WA[w].cls : ''} ${reached === w ? 'reached' : ''}">
      <rect class="box" x="${l.x - lw / 2}" y="${LEAF_Y - LEAF_H / 2}" width="${lw}" height="${LEAF_H}"/>
      <rect class="handle" x="${l.x - 14}" y="${LEAF_Y + 11}" width="28" height="6"/>
      <text x="${l.x}" y="${LEAF_Y - 5}"${named && w.length > 8 ? ' class="small"' : ''}>${named ? w : '?'}</text></g>`;
  });
  return s;
}
let treeView = null, treeAnim = 0;
function setViewBox(svg, target){
  const from = treeView || target;
  treeView = target;
  cancelAnimationFrame(treeAnim);
  if (reduceMotion() || from.join() === target.join()){ svg.setAttribute('viewBox', target.join(' ')); return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 350), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    svg.setAttribute('viewBox', from.map((v, i) => (v + (target[i] - v) * e).toFixed(1)).join(' '));

}

/* ---------- Ablauf eines Wortes ---------- */
function loadWord(intro){
  const words = activeWords(S.r);

  S.gen++; clearFlights();
  S.entry = words[S.i]; S.tests = {}; S.result = null; S.sortTries = 0; S.sortedAs = null;
  S.phase = 'pick'; S.busy = false;
  render();
  const prev = S.i > 0 ? words[S.i - 1] : null;
  S.twin = prev && prev.wort.toLowerCase() === S.entry.wort.toLowerCase() ? prev : null;
  const twinNote = S.twin ? ` <b>Achtung, Zwilling!</b> ${qw(S.twin.wort)} war gerade ${WA[S.twin.wortart].ein} ${S.twin.wortart}. Prüfe genau – der Satz entscheidet.` : '';
  setBubble((intro ? intro + ' ' : '') + `Neues Wort: ${qw(S.entry.wort)}.` + (twinNote || ' Schick es in eine Maschine!'), S.twin ? 'think' : 'normal');
}
function startRound(r){
  let k = nextPlayableRound(Math.max(0, r || 0));

    S.phase = 'idle'; S.entry = null; render();
    setBubble('Für diese Einstellung gibt es keine Wörter. Schalte im Lehrkraft-Bereich eine Wortart ein.', 'think');
    return;
  }

}

  if (t === 'sg') return `Noch nicht! Erst muss klar sein: ${termOf('dekl')} ja, ${termOf('art')} nein und ${termOf('komp')} nein.`;
  if ((t === 'sgatt' || t === 'kasus' || t === 'fueg') && labTests().includes('isol')) return `Noch nicht! Erst kommt die Frage: Ist das Wort ${termOf('isol')}?`;

  if (w !== e.wortart){
    S.sortTries++;
    bump(`.drawer[data-w="${w}"]`, 'wrong'); sfx.nein();
    if (S.sortTries === 1){
      const poss = isPossessive(e) && w === 'Pronomen'
        ? ` Es sieht zwar aus wie ein Possessivpronomen. Hier ist es aber fest mit dem Nomen verbunden und wandert nur zusammen mit ihm: ein Possessivartikel.` : '';

    }
    S.busy = true; renderCabinet();
    setBubble(`Komm, ich zeig's dir: ${info.merksatz}`, 'think');
    await wait(1500);

  }
  S.busy = true; renderCabinet();

  S.sortedAs = w; S.phase = 'done'; S.busy = false;

  if (S.twin && S.twin.wortart !== w) msg += ` Gleiches Wort, andere Wortart als eben: Der Satz entscheidet!`;

const demoAlive = dg => dg === S.demoGen && S.phase === 'demo';
async function demoProbe(t){
  const dg = S.demoGen;
  S.busy = true; renderActions();
  await flyWord(t);
  if (!demoAlive(dg)) return;   // Vorführung wurde übersprungen
  const p = probe(DEMOS[S.lab], t);
  S.result = { t, truth: p.truth, base: p.base, items: p.items, fall: p.fall, sep: p.sep, judged: false };
  S.busy = false; renderResult(); updateMachines(); renderActions();
}
function demoCommit(t){
  if (S.phase !== 'demo' || !S.result) return;
  S.result.judged = true; S.tests[t] = stateOf(DEMOS[S.lab], t, S.result.truth);
  if (S.result.truth) sfx.ja(); else sfx.nein();
  render();
}
async function demoSort(w, text){
  const dg = S.demoGen;
  S.busy = true; renderActions();
  setBubble(text, 'happy');
  await wait(500); if (!demoAlive(dg)) return;
  await flyToDrawer(w); if (!demoAlive(dg)) return;
  S.counts[w]++; S.named[w] = true; S.sortedAs = w; S.busy = false;
  render(); bump(`.drawer[data-w="${w}"]`, 'bump');
}

function demoSteps(){ return DEMO_STEPS[S.lab] || []; }
let demoReturn = null, demoStartRound = 0;
function runDemo(returnTo, startRoundIdx){
  demoReturn = returnTo || null; demoStartRound = startRoundIdx || 0;
  S.demoGen++; S.gen++; clearFlights();
  S.phase = 'demo'; S.entry = DEMOS[S.lab]; S.tests = {}; S.result = null; S.sortedAs = null; S.busy = false; S.demoStep = 0;
  render(); demoSteps()[0].run();
}
async function demoAdvance(){
  if (S.phase !== 'demo' || S.busy) return;
  S.demoStep++;
  if (S.demoStep >= demoSteps().length){ endDemo(); return; }
  renderActions();
  await demoSteps()[S.demoStep].run();
  if (S.phase === 'demo') renderActions();
}
function endDemo(){
  if (S.phase !== 'demo') return;
  S.demoGen++; clearFlights();   // laufende Schritte der Vorführung verfallen
  S.demoStep = -1; S.result = null; S.tests = {}; S.sortedAs = null; S.busy = false;
  if (demoReturn){ S.r = demoReturn.r; S.i = demoReturn.i; demoReturn = null; loadWord(); }
  else startRound(demoStartRound);
}

/* ---------- Laborwechsel ---------- */
function switchLab(n, roundIdx){
  if (!LABS[n]) return;
  S.lab = n; settings.lab = n;
  S.rounds = S.labRounds[n]; S.r = 0; S.i = 0;
  S.entry = DEMOS[n]; S.tests = {}; S.result = null; S.sortedAs = null; S.phase = 'idle'; S.busy = false;
  buildMachines(); render();
  const first = !S.visited[n];
  S.visited[n] = true;
  const go = () => { if (settings.demo && first) runDemo(null, roundIdx || 0); else startRound(roundIdx || 0); };
  if (n === 5 && first && settings.story) showStory(go, FAIRY_INTRO, 'Die Turmspitze');
  else go();
}

function showAlbum(newKey, fromRound){
  const floors = LAB_IDS.map(n => {
    const slots = S.labRounds[n].map(r => {
      const key = albumKey(n, r.title), has = !!S.album[key];
      return `<div class="slot${has ? ' filled' : ''}${key === newKey ? ' new' : ''}">${has ? `<canvas data-sprite="${r.sticker}" aria-hidden="true"></canvas>` : '<span class="empty" aria-hidden="true">?</span>'}<span>${esc(r.title)}</span></div>`;
    }).join('');
    return `<div class="album-floor"><h3>${LABS[n].floor} · ${labName(n)}</h3><div class="slots">${slots}</div></div>`;
  }).join('');
  const later = LATER_FLOORS.map(([f, n]) => `<p class="floor-locked">${f} · Labor ${n} – kommt bald</p>`).join('');
  let actions = '<button class="btn big primary" type="button" data-act="close">Schließen</button>';
  if (fromRound){
    const n = nextPlayableRound(S.r + 1);
    actions = n >= 0
      ? `<button class="btn big primary" type="button" data-act="nextRound" data-r="${n}">Weiter mit: ${esc(S.rounds[n].title)} ▶</button>`
      : `<button class="btn big primary" type="button" data-act="laborDone">Weiter ▶</button>`;
  }
  openDialog('Stickeralbum', `<div class="album-grid">${floors}</div>${later ? `<div class="album-floor">${later}</div>` : ''}
    <div class="dialog-actions"><span></span><div class="right">${actions}</div></div>`, { wide: true, closable: !fromRound });
}

  const nextLab = LABS[S.lab + 1] ? S.lab + 1 : null;
  const text = {

const GUIDE_HTML = `<div class="guide-text">
  <h3>So läuft eine Probe</h3>
  <ol><li>Ein Kind schickt das markierte Wort in eine Maschine (antippen oder Taste 1–6).</li>
  <li>Die Maschine zeigt, was sie probiert hat. Die Klasse urteilt mit dem Daumen: Klappt das?</li>
  <li>Die Lampe bestätigt oder korrigiert. Der Laborplan zeigt den Weg durch den Baum.</li>
  <li>Am Blatt angekommen, tippt das Kind die passende Schublade an. Beim ersten richtigen Mal bekommt das Blatt sein Schild – wie die Lücken auf dem Arbeitsblatt.</li></ol>
  <h3>Die Etagen</h3>
  <ul><li><b>Erdgeschoss:</b> Verb, Adjektiv, Nomen</li><li><b>1. Stock:</b> dazu Pronomen und Artikel</li>
  <li><b>2. Stock:</b> Adverb, Präposition, Konjunktion</li><li><b>Dachboden:</b> Partikel und Satzäquivalent</li>
  <li><b>Turmspitze:</b> alle zehn Wortarten mit Weiche, Wortzwillingen und Meisterprüfung</li></ul>
  <h3>Hilfen</h3>
  <p>Beim ersten falschen Einsortieren gibt die Maschine einen Hinweis, beim zweiten zeigt sie den Weg. Geschlossene Maschinen (Rolltor) öffnen sich, sobald der Baum sie erlaubt.</p>
  <h3>Im Unterricht</h3>
  <p>Das Labor passt sich jedem Bildschirm an und muss nie gescrollt werden, auf dem Tablet quer und hochkant. Am Smartboard macht „Vollbild“ (oben rechts) alles größer. Der Bereich, in dem gerade etwas zu tun ist, ist rosa umrandet. Läuft das Labor auf einem Gerät nicht richtig, zeigt der Reiter „Technik-Check“, was der Browser kann; den Bericht kannst du an die Schul-IT weitergeben.</p>
  <p>Am Smartboard wird das Daumen-Urteil zur Klassenabstimmung. Für Tablets stellst du hier unter „Einstellungen“ einen Code ein und hängst ihn an den Link, z. B. #labor-3.experte. Eigene Wörter trägst du in der Werkstatt ein (gilt für die Sitzung) oder dauerhaft in der Datei.</p>
  <h3>Konventionen</h3>
  <p>Partizipien zählen als Verben, auch wenn sie attributiv gebraucht werden (ähnlich wie ein Adjektiv vor einem Nomen). Steigern und Deklinieren klappen dann zwar, die Maschine erklärt aber die Verbform und schickt zum Konjugator. In der Wortliste aktiviert das die Zeile <b>- Partizip:</b> (z. B. verzaubert). Eigennamen zählen als Nomen.</p>
  <p><b>Possessivartikel:</b> Steht ein Possessivwort vor einem Nomen (ihre Goldtaler, ihre Goldstücke), bildet es mit dem Nomen eine feste Wortgruppe (Nominalphrase): Beide wandern nur zusammen nach vorn. Deshalb zählt es im Labor als Artikel, genauer als Possessivartikel, obwohl es wie ein Possessivpronomen aussieht. Ein Possessivpronomen steht allein und vertritt das Nomen (Die Goldtaler sind ihre!). In der Schulgrammatik heißen oft beide „Possessivpronomen“; das Labor unterscheidet sie, weil die Proben es verlangen. Die Maschine „kann SG sein“ zeigt bei Artikeln zusätzlich die Probe mit der ganzen Wortgruppe. Im 1. Stock kommen nur eindeutige Fälle vor (der, ein, er, wir …). Possessivartikel und Possessivpronomen begegnen erst in der Turmspitze: als Wortzwilling „ihre“ (Goldmarie) und in der Meisterprüfung.</p>
  <h3>Datenschutz</h3>
  <p>Die Datei „Wortarten-Labor.html“ läuft vollständig auf dem Gerät. Sie lädt nichts aus dem Internet (alle Schriften, Bilder und Klänge stecken in der Datei), sendet nichts und enthält weder Statistik noch Werbung. Eine eingebaute Sperre (Content-Security-Policy) blockiert zusätzlich jede Verbindung nach außen. Der Reiter „Technik-Check“ zeigt beides an.</p>
  <p>Das Labor fragt keine Namen ab und speichert nichts: keine Cookies, kein Browser-Speicher, kein Zwischenstand. Schubladen, Album und Änderungen in der Werkstatt gelten nur, bis die Seite geschlossen oder neu geladen wird. Das Labor selbst verarbeitet damit keine personenbezogenen Daten.</p>
  <p>Für den Unterricht: Öffne die Datei direkt auf dem Gerät (Doppelklick, auch ohne Internet) oder stelle sie auf euren Schulserver bzw. eure Lernplattform; dort gelten die üblichen Regeln eurer Schule. Gib Schülerinnen und Schülern keinen Vorschau-Link eines fremden Anbieters (z. B. claude.ai). Wenn du die Datei mit eigenen Wörtern weitergibst, trage keine echten Namen von Kindern ein.</p></div>`;
/* ---------- Technik-Check: zeigt, was Browser und Bildschirm können ---------- */
function techInfo(){
  const ua = navigator.userAgent || '';
  const pick = re => { const m = ua.match(re); return m ? +m[1] : 0; };
  const edge = pick(/Edg\/(\d+)/), chrome = pick(/(?:Chrome|CriOS)\/(\d+)/), fx = pick(/(?:Firefox|FxiOS)\/(\d+)/);
  const safari = !chrome && !fx ? pick(/Version\/(\d+)[\d.]* .*Safari/) : 0;
  const browser = edge ? `Edge ${edge}` : chrome ? `Chrome ${chrome}` : fx ? `Firefox ${fx}` : safari ? `Safari ${safari}` : 'unbekannt';
  const tooOld = (chrome && chrome < 87) || (fx && fx < 66) || (safari && safari < 14.1);
  const sys = /Android/.test(ua) ? 'Android' : /iPad|iPhone/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPadOS / iOS'
    : /Windows/.test(ua) ? 'Windows' : /CrOS/.test(ua) ? 'ChromeOS' : /Mac OS/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : 'unbekannt';
  const html = document.documentElement, st = $('#stage');
  const scale = layoutScale();
  const mode = staged() ? (html.classList.contains('port') ? 'Bühne hochkant' : 'Bühne quer') : 'normale Seite mit Scrollen (Bildschirm zu klein für die Bühne)';
  const vv = window.visualViewport;
  const css = (p, v) => !!(window.CSS && CSS.supports && CSS.supports(p, v));
  let fonts = null;
  try {
    if (document.fonts && document.fonts.forEach){
      fonts = false;
      document.fonts.forEach(f => { if (String(f.family).replace(/["']/g, '') === 'Labor Pixel' && f.status === 'loaded') fonts = true; });
    }
  } catch (e) { fonts = null; }
  // Datenschutz: Hat diese Fassung etwas von einem fremden Server geladen? (Offline-Datei: nein)
  let external = null;
  try {
    if (window.performance && performance.getEntriesByType){
      const own = location.protocol === 'file:' ? null : location.origin;
      external = performance.getEntriesByType('resource').filter(r => /^https?:/i.test(r.name) && (!own || r.name.indexOf(own + '/') !== 0)).length === 0;
    }
  } catch (e) { external = null; }
  const csp = !!document.querySelector('meta[http-equiv="Content-Security-Policy"]');
  const checks = [
    ['Browser aktuell genug (Chrome ab 87, Safari ab 14.1)', !tooOld, 'Das Labor nutzt Ersatzlösungen. Ein Browser-Update wird empfohlen.'],
    ['Abstände in Flex-Zeilen', !html.classList.contains('no-flexgap'), 'Ersatz über Ränder ist aktiv.'],
    ['Animationen', !!(Element.prototype.animate), 'Die Wortkarte fliegt nicht, sonst läuft alles.'],
    ['Ton', !!(window.AudioContext || window.webkitAudioContext), 'Ohne Ton spielbar.'],
    ['Vollbild', fsAllowed(), 'Hier nicht erlaubt (z. B. in einer eingebetteten Vorschau). Die Datei direkt im Browser öffnen.'],
    ['Touch', (navigator.maxTouchPoints || 0) > 0, 'Bedienung mit Maus oder Tastatur.'],
    ['Labor-Schrift (in der Datei enthalten)', fonts, 'Der Browser zeigt eine Ersatzschrift. Das Labor funktioniert trotzdem.'],
    ['Nichts aus dem Internet geladen', external, 'Diese Fassung hat Inhalte von einem fremden Server geladen (z. B. eine Vorschau im Netz). Im Unterricht die Datei „Wortarten-Labor.html“ verwenden.'],
    ['Sperre gegen Verbindungen nach außen', csp, 'Nur in der Datei „Wortarten-Labor.html“ eingebaut, nicht in einer Vorschau im Netz.']
  ];
  const rows = [
    ['Browser', browser], ['System', sys],
    ['Fenster (CSS-Pixel)', `${window.innerWidth} × ${window.innerHeight}` + (vv ? ` · sichtbar ${Math.round(vv.width)} × ${Math.round(vv.height)}` : '')],
    ['Bildschirm', `${screen.width} × ${screen.height} · Pixelverhältnis ${(window.devicePixelRatio || 1).toFixed(2)}`],
    ['Darstellung', `${mode}${staged() ? ` · Maßstab ${Math.round(scale * 100)} %` : ''}`],
    ['Dokumentmodus', document.compatMode === 'CSS1Compat' ? 'Standard' : 'Kompatibilität (Quirks)']
  ];
  return { rows, checks, ua, tooOld };
}
function techHTML(){
  const t = techInfo();
  const mark = v => v === null ? '<span>–</span>' : v ? '<span class="ok">✓</span>' : '<span class="no">✗</span>';
  const report = t.rows.map(r => r[0] + ': ' + r[1]).concat(t.checks.map(c => (c[1] === null ? '–' : c[1] ? '✓' : '✗') + ' ' + c[0])).concat(['Kennung: ' + t.ua]).join('\n');
  return `<div class="guide-text">
    <p>${t.tooOld ? '<b>Dieser Browser ist älter.</b> Das Labor läuft mit Ersatzlösungen. Wenn etwas fehlt, hilft ein Browser-Update (bei Smartboards über die Schul-IT).' : 'Dieser Browser kann alles, was das Labor braucht.'}</p>
    <table class="tech"><tbody>${t.rows.map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>
    <table class="tech"><tbody>${t.checks.map(c => `<tr><td>${mark(c[1])}</td><td>${esc(c[0])}${c[1] === false ? `<br><small>${esc(c[2])}</small>` : ''}</td></tr>`).join('')}</tbody></table>
    <p>Bericht zum Weitergeben, zum Beispiel an die Schul-IT. Er enthält nur Geräte- und Browserangaben, keine Namen, und verlässt das Gerät nur, wenn du ihn selbst kopierst und weitergibst.</p>
    <pre class="tech-report" id="techReport">${esc(report)}</pre>
    <div class="preset"><button class="btn" type="button" data-act="copyTech">Bericht kopieren</button></div></div>`;
}

    ${S.lab >= 3 ? `<div class="setting"><label for="swAttr">Attribut mitprüfen<small>Die Maschine fragt zusätzlich: Kann das Wort ein Nomen näher beschreiben (das Haus dort)?</small></label>

  } else if (teacherTab === 'md'){
    const val = mdDraft != null ? mdDraft : S.labMD[S.lab];
    const need = S.lab === 5 ? ' Im Abschlusslabor gelten die Pflichtzeilen aus Labor 2 und 3. Zwei gleiche Wörter direkt hintereinander zeigt das Spiel als Wortzwillinge an.' : S.lab === 4 ? ' In Labor 4 genügen Satz und Wortart. Bei Satzäquivalenten kannst du mit <b>- isoliert:</b> die Kurzform angeben, z. B. Huch!' : S.lab >= 3 ? ' In Labor 3 brauchen Adverbien eine Zeile <b>- Satzglied:</b> (Wort allein vor dem Verb), Präpositionen <b>- Kasusforderung:</b> (z. B. mit wem? → mit dem Wolf → Dativ) und Konjunktionen <b>- Fügteil:</b> (die zwei getrennten Teile, verbunden mit ·).' : S.lab >= 2 ? ' In Labor 2 brauchen Nomen, Adjektive, Pronomen und Artikel eine Zeile <b>- deklinierbar:</b>, Pronomen und Artikel zusätzlich <b>- Satzglied:</b> mit der Umstellprobe. Nimm im 1. Stock nur eindeutige Fälle (der, ein, er, wir …); Possessivwörter gehören in die Turmspitze. Bei Artikeln zeigt <b>- zusammen:</b> den Satz, in dem Artikel und Nomen gemeinsam vorn stehen, z. B. „Die alte Frau Holle wohnte dort.“' : '';
    body = `<div class="werkstatt">
      <p>Hier änderst oder ergänzt du die Wörter von <b>Labor ${S.lab}</b> für diese Sitzung. Ein Märchen beginnt mit <b>#</b>, jedes Wort mit <b>##</b>. Markiere das Prüfwort im Satz mit <b>**Sternchen**</b>.${need} Nichts davon wird gespeichert. Dauerhaft änderst du eine Liste im Abschnitt „wortliste-${S.lab}“ der HTML-Datei; trage dort keine echten Namen von Kindern ein, wenn du die Datei weitergibst.</p>
      <textarea id="mdText" spellcheck="false" aria-label="Wortliste im Markdown-Format">${esc(val)}</textarea>

  openDialog('Lehrkraft-Bereich', `<div class="tabs" role="tablist">${tab('set', 'Einstellungen')}${tab('md', 'Werkstatt')}${tab('help', 'Anleitung')}${tab('tech', 'Technik-Check')}</div>
    <div>${body}</div>
