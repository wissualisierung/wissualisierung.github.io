<title>Wortarten-Labor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: Laborbank links (Prüfband oben, Maschinen darunter, in Reichweite am Smartboard),
   Laborplan rechts (Baum oben nur zum Ansehen, Schubladen unten zum Tippen).
   Bewusst ein einziger heller Pastell-Look ohne Dunkelmodus. */
:root{
  color-scheme: light;
  --ink:#2c2a4a; --ink-soft:#625e8c;
  --ground:#e8e4f5; --grid:#ddd7ef;
  --panel:#fdfcff; --bench:#fbf0e3;
  --metal:#e3dff1; --metal-2:#cbc5e2; --metal-hover:#ece9f7;
  --belt:#9a93c4; --belt-2:#bdb7de;
  --accent:#ff8fb3; --accent-soft:#ffd6e3;
  --ja:#2fb873; --ja-soft:#d5f5e3; --nein:#f2596b; --nein-soft:#ffe1e5; --off:#d4cfe6;
  --verb:#ffe36e; --adjektiv:#a6e6a0; --nomen:#9dd4f1; --pronomen:#9eacf2; --artikel:#86d9c9; --adverb:#d6b0f0; --praeposition:#ffc08c; --konjunktion:#6ed691; --partikel:#cdd3e0; --satzaequivalent:#ff9e9e;
  --f-ui:"Pixelify Sans","Courier New",monospace;
  --f-term:"Courier Prime","Courier New",Courier,monospace;
  --f-read:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --b:3px; --sh:4px 4px 0 var(--ink); --sh-s:2px 2px 0 var(--ink);
}
html{font-size:clamp(14px, .55vw + 8px, 20px);height:100%}
body{
  min-height:100%;color:var(--ink);font-family:var(--f-read);
  background-color:var(--ground);
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);
  background-size:32px 32px;
}
[hidden]{display:none!important}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

.app{max-width:1900px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:grid;gap:14px}

/* Kopfzeile */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:8px 12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-ui);font-weight:700;font-size:1.3rem;letter-spacing:.05em;text-transform:uppercase}
.brand canvas{width:38px;height:38px}
.roundinfo{display:flex;align-items:center;gap:8px 12px;flex:1 1 300px;min-width:0;flex-wrap:wrap;font-family:var(--f-ui)}
.floor{font-size:.78rem;font-weight:600;background:var(--metal);border:2px solid var(--ink);padding:2px 8px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.maerchen-title{font-size:1.1rem;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:5px}
.pip{width:14px;height:14px;border:2px solid var(--ink);background:var(--panel)}
.pip.done{background:var(--ink)}
.pip.now{background:var(--accent)}
.tools{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}

/* Knöpfe */
.btn{font-family:var(--f-ui);font-weight:600;font-size:1rem;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh-s);padding:.4em .8em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:46px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.btn.primary{background:var(--accent)}
.btn.big{font-size:1.25rem;padding:.5em 1.1em;box-shadow:var(--sh);min-height:58px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn .ico{width:22px;height:22px;flex:none}
.btn .kbd{font-size:.75em;opacity:.7}
.gear{position:relative;-webkit-touch-callout:none}
.gear .hold{position:absolute;left:0;bottom:-3px;height:5px;width:0;background:var(--accent)}
.gear.holding .hold{animation:hold 2s linear forwards}
@keyframes hold{to{width:100%}}

/* Arbeitsfläche */
.labor{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.bench,.plan{display:grid;gap:16px;min-width:0}
.panel{background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-ui);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:.82rem;padding:6px 12px;border-bottom:var(--b) solid var(--ink);background:var(--metal)}
.panel-head .sub{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-soft)}
.tag{background:var(--accent-soft);border:2px solid var(--ink);padding:0 .5em;text-transform:none;letter-spacing:0}

/* Prüfband */
.station{background:var(--bench);padding:14px 16px 16px;display:grid;gap:12px}
.guide{display:flex;gap:14px;align-items:flex-start}
.guide canvas{width:76px;height:76px;flex:none}
.bubble{position:relative;margin:0;flex:1;min-width:0;background:var(--panel);border:var(--b) solid var(--ink);padding:.55em .9em;font-size:1.08rem;line-height:1.42;min-height:3.3em}
.bubble::before,.bubble::after{content:"";position:absolute;background:var(--ink)}
.bubble::before{left:-11px;top:16px;width:8px;height:8px}
.bubble::after{left:-19px;top:26px;width:5px;height:5px}
.bubble .term,.term{font-family:var(--f-term);font-weight:700}
.bubble .w{font-weight:700}
.sentence{font-size:clamp(1.3rem, 1rem + 1.05vw, 2.15rem);line-height:1.55;text-align:center;padding:.25em .2em 0;text-wrap:balance}
.wordcard{display:inline-block;font-weight:700;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh-s);padding:0 .35em;margin:0 .08em;line-height:1.35}
.wordcard.ghost{visibility:hidden}
.wordcard.verb{background:var(--verb)}
.wordcard.adjektiv{background:var(--adjektiv)}
.wordcard.nomen{background:var(--nomen)}
.wordcard.pronomen{background:var(--pronomen)}
.wordcard.artikel{background:var(--artikel)}
.wordcard.adverb{background:var(--adverb)}
.wordcard.praeposition{background:var(--praeposition)}
.wordcard.konjunktion{background:var(--konjunktion)}
.wordcard.partikel{background:var(--partikel)}
.wordcard.satzaequivalent{background:var(--satzaequivalent)}
.flyer{position:fixed;z-index:40;pointer-events:none;margin:0;font-family:var(--f-read);box-sizing:border-box}
.belt{height:16px;border:var(--b) solid var(--ink);background:repeating-linear-gradient(90deg,var(--belt) 0 16px,var(--belt-2) 16px 32px)}
.belt.run{animation:belt .5s steps(4) infinite}
@keyframes belt{to{background-position:32px 0}}
.result{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.45em .6em;min-height:2.7em;font-size:1.15rem}
.result .mtag{font-family:var(--f-term);font-weight:700;font-size:.9rem;background:var(--metal);border:2px solid var(--ink);padding:.1em .5em}
.form{padding:.12em .5em;border:2px dashed var(--ink-soft);background:var(--panel)}
.form.base{border-style:solid;border-color:var(--ink-soft)}
.form.ok{border:2px solid var(--ja);background:var(--ja-soft)}
.form.bad{border:2px solid var(--nein);background:var(--nein-soft);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--nein)}
.sep{color:var(--ink-soft);font-family:var(--f-ui)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;min-height:58px}
.thumb{min-width:9.5em}
.thumb.yes{background:var(--ja-soft)}
.thumb.no{background:var(--nein-soft)}
.thumb .ico{width:28px;height:28px}
.hint-line{font-family:var(--f-ui);font-size:1.05rem;color:var(--ink-soft);text-align:center}

/* Prüfmaschinen */
.machines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px}
.machine{position:relative;display:grid;grid-template-rows:auto 1fr;text-align:center;background:var(--metal);border:var(--b) solid var(--ink);box-shadow:var(--sh);cursor:pointer;min-height:11.2em;padding:0;overflow:hidden;touch-action:manipulation}
.machines.one{grid-template-columns:minmax(0,24em);justify-content:center}
.machines.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.machines.switched .machine{animation:appear .45s steps(5)}
@keyframes appear{from{transform:translateY(14px);opacity:.2}}
.machines.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.machines.five{grid-template-columns:repeat(6,minmax(0,1fr))}
.machines.five .machine{grid-column:span 2}
.machines.five .machine:nth-child(n+4){grid-column:span 3}
.machine:hover:not(:disabled){background:var(--metal-hover)}
.machine:active:not(:disabled){transform:translate(2px,2px);box-shadow:var(--sh-s)}
.machine:disabled{cursor:default}
.machine.waiting{opacity:.62}
.machine.active{background:var(--accent-soft);box-shadow:4px 4px 0 var(--accent)}
.mhead{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:var(--b) solid var(--ink);background:var(--metal-2)}
.key{font-family:var(--f-ui);font-weight:700;background:var(--ink);color:var(--panel);min-width:1.6em;padding:0 .3em;font-size:.85rem}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:8px;height:8px;border:2px solid var(--ink);background:var(--panel)}
.lamp{width:26px;height:26px;border:var(--b) solid var(--ink);background:var(--off);display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:.85rem;color:var(--panel)}
.lamp.ja{background:var(--ja)}
.lamp.nein{background:var(--nein)}
.lamp.partizip{background:var(--verb);color:var(--ink)}
.mbody{position:relative;display:grid;justify-items:center;align-content:center;gap:.35em;padding:10px 10px 14px}
.iconbox{position:relative;width:52px;height:52px}
.iconbox canvas{width:52px;height:52px}
.das{position:absolute;right:-16px;bottom:-4px;font-family:var(--f-read);font-weight:700;font-size:.72rem;background:var(--panel);border:2px solid var(--ink);padding:0 .3em;line-height:1.3}
.machine .term{font-size:1.25rem}
.question{font-size:.95rem;line-height:1.3;max-width:18em}
.shutter{position:absolute;inset:0;transform-origin:top;transition:transform .5s steps(6);background:repeating-linear-gradient(0deg,var(--metal-2) 0 12px,var(--ink-soft) 12px 15px)}
.machine:not(.locked) .shutter{transform:scaleY(0)}
.machine.shake,.drawer.wrong{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translate(-4px,0)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,2px)}}

/* Laborplan */
.btn.mini{min-height:34px;padding:.15em .6em;font-size:.8rem;box-shadow:none;text-transform:none;letter-spacing:0}
.plan-full{padding:0;overflow-x:auto}
.plan-full .treesvg{min-width:720px}
.plan-note{margin:0;color:var(--ink-soft);line-height:1.4}
.head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:10px;text-transform:none;letter-spacing:0;font-weight:400}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid var(--ink)}
.tree-wrap{padding:10px 12px 12px;overflow-x:auto}
.treesvg{display:block;width:100%;height:auto;min-width:300px}
.treesvg .edge{stroke:var(--ink);stroke-width:2.5;fill:none}
.treesvg .edge.ja{stroke:var(--ja);stroke-width:5}
.treesvg .edge.nein{stroke-dasharray:6 6;opacity:.45}
.treesvg .pebble{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.treesvg .node rect{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}
.treesvg .node text,.treesvg .leaf text{font-family:var(--f-term);font-weight:700;font-size:20px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.treesvg .node.root rect{fill:var(--metal)}
.treesvg .node.ja rect{fill:var(--ja-soft);stroke:var(--ja);stroke-width:3.5}
.treesvg .node.nein{opacity:.45}
.treesvg .node.nein text{text-decoration:line-through}
.treesvg .node.partizip rect{fill:#fff6c7;stroke-dasharray:7 5}
.treesvg .leaf rect{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}
.treesvg .leaf.verb rect{fill:var(--verb)}
.treesvg .leaf.adjektiv rect{fill:var(--adjektiv)}
.treesvg .leaf.nomen rect{fill:var(--nomen)}
.treesvg .leaf.pronomen rect{fill:var(--pronomen)}
.treesvg .leaf.artikel rect{fill:var(--artikel)}
.treesvg .leaf.adverb rect{fill:var(--adverb)}
.treesvg .leaf.praeposition rect{fill:var(--praeposition)}
.treesvg .leaf.konjunktion rect{fill:var(--konjunktion)}
.treesvg .leaf.partikel rect{fill:var(--partikel)}
.treesvg .leaf.satzaequivalent rect{fill:var(--satzaequivalent)}
.treesvg .leaf text.small{font-size:16px}
.treesvg .leaf .handle{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.treesvg .leaf.reached rect.box{stroke:var(--accent);stroke-width:6;animation:blink 1s steps(2) infinite}
.treesvg .future{fill:var(--off);stroke:none}
.treesvg .future-edge{stroke:var(--off);stroke-width:2.5;stroke-dasharray:3 7;fill:none}
@keyframes blink{50%{stroke:var(--ink)}}

/* Schubladen */
.cabinet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px;background:var(--metal)}
.drawer{font-family:var(--f-ui);font-weight:700;font-size:1.25rem;border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:12px 8px 10px;display:grid;justify-items:center;gap:7px;cursor:pointer;min-height:6.2em;touch-action:manipulation;transition:transform .15s steps(2)}
.drawer.verb{background:var(--verb)}
.drawer.adjektiv{background:var(--adjektiv)}
.drawer.nomen{background:var(--nomen)}
.drawer.pronomen{background:var(--pronomen)}
.drawer.artikel{background:var(--artikel)}
.drawer.adverb{background:var(--adverb)}
.drawer.praeposition{background:var(--praeposition)}
.drawer.konjunktion{background:var(--konjunktion)}
.drawer.partikel{background:var(--partikel)}
.drawer.satzaequivalent{background:var(--satzaequivalent)}
.cabinet.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cabinet.ten{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cabinet.ten .drawer{font-size:.95rem;padding:8px 3px;min-height:4.8em}
.cab-row{grid-column:1/-1;margin:2px 0 -2px;font-family:var(--f-term);font-weight:700;font-size:.85rem;color:var(--ink-soft)}
.drawer.long{font-size:.92rem;hyphens:manual}
.machines.six .machine{min-height:9.2em}
.machines.six .iconbox,.machines.six .iconbox canvas{width:44px;height:44px}
.cabinet.ten .drawer.long{font-size:.78rem}
.cabinet.five .drawer{font-size:1.02rem;padding-inline:4px;min-height:5.6em}
.drawer .handle{width:46px;height:11px;border:var(--b) solid var(--ink);background:var(--panel)}
.drawer .count{font-size:.8rem;font-weight:600;background:var(--panel);border:2px solid var(--ink);padding:0 .5em;font-variant-numeric:tabular-nums}
.drawer:disabled{cursor:default}
.cabinet:not(.active) .drawer{box-shadow:var(--sh-s)}
.cabinet.active .drawer{transform:translateY(-4px)}
.drawer.bump{animation:bump .4s steps(4)}
@keyframes bump{40%{transform:translateY(-10px)}}

/* Dialoge */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(44,42,74,.55)}
.dialog{width:min(780px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.dialog.wide{width:min(980px,100%)}
.dialog-head{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:var(--b) solid var(--ink);background:var(--metal);font-family:var(--f-ui);font-weight:700;font-size:1.1rem}
.dialog-head .dots{margin-left:auto}
.dialog-body{padding:16px;display:grid;gap:14px}
.scene{display:block;width:100%;height:auto;aspect-ratio:16/9;border:var(--b) solid var(--ink);background:var(--metal)}
.story-text{margin:0;font-size:1.3rem;line-height:1.45;text-align:center;text-wrap:balance}
.story-text .say{display:block;font-weight:700;margin-bottom:.3em}
.dialog-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dialog-actions .right{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.retell{display:grid;gap:.35em;background:var(--bench);border:var(--b) solid var(--ink);padding:12px 16px}
.retell p{margin:0;font-size:1.15rem;line-height:1.55}
.retell mark{color:var(--ink);padding:0 .25em;border:2px solid var(--ink)}
.retell mark.verb{background:var(--verb)}
.retell mark.adjektiv{background:var(--adjektiv)}
.retell mark.nomen{background:var(--nomen)}
.retell mark.pronomen{background:var(--pronomen)}
.retell mark.artikel{background:var(--artikel)}
.retell mark.adverb{background:var(--adverb)}
.retell mark.praeposition{background:var(--praeposition)}
.retell mark.konjunktion{background:var(--konjunktion)}
.retell mark.partikel{background:var(--partikel)}
.retell mark.satzaequivalent{background:var(--satzaequivalent)}
.legend-box{background:var(--panel);padding:8px 16px}
.reveal{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.reveal canvas{width:112px;height:112px;background:var(--panel);border:var(--b) solid var(--ink);box-shadow:var(--sh);padding:6px}
.reveal p{margin:0;font-size:1.1rem;flex:1;min-width:12em}
.big-title{font-family:var(--f-ui);font-weight:700;font-size:1.6rem;margin:0;text-wrap:balance}
.album-floor{display:grid;gap:10px}
.album-floor h3{margin:0;font-family:var(--f-ui);font-size:1.05rem;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.slot{display:grid;justify-items:center;align-content:center;gap:6px;border:3px dashed var(--ink-soft);padding:10px;min-height:150px;text-align:center;font-size:.9rem}
.slot canvas{width:80px;height:80px}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--bench);box-shadow:var(--sh-s)}
.slot.new{animation:bump .5s steps(4) 2}
.slot .empty{width:80px;height:80px;display:grid;place-items:center;font-family:var(--f-ui);font-size:2rem;color:var(--ink-soft)}
.floor-locked{font-family:var(--f-ui);color:var(--ink-soft);border:2px dashed var(--ink-soft);padding:8px 12px}

/* Lehrkraft-Bereich */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab[aria-selected="true"]{background:var(--accent)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:2px dashed var(--metal-2)}
.setting:last-child{border-bottom:0}
.setting label,.setting .lbl{font-size:1.02rem;line-height:1.35}
.setting small{display:block;color:var(--ink-soft);font-size:.85rem}
.switch{appearance:none;-webkit-appearance:none;width:58px;height:30px;flex:none;border:var(--b) solid var(--ink);background:var(--off);position:relative;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--panel);border:2px solid var(--ink);transition:left .15s steps(3)}
.switch:checked{background:var(--ja)}
.switch:checked::after{left:29px}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-weight:600;border:2px solid var(--ink);padding:4px 10px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.check.verb{background:var(--verb)}
.check.adjektiv{background:var(--adjektiv)}
.check.nomen{background:var(--nomen)}
.check.pronomen{background:var(--pronomen)}
.check.artikel{background:var(--artikel)}
.check.adverb{background:var(--adverb)}
.check.praeposition{background:var(--praeposition)}
.check.konjunktion{background:var(--konjunktion)}
.check.partikel{background:var(--partikel)}
.check.satzaequivalent{background:var(--satzaequivalent)}
select.sel{font:inherit;font-size:1rem;border:var(--b) solid var(--ink);background:var(--panel);padding:.35em .5em;min-height:46px;max-width:100%}
.preset{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.preset code{font-family:var(--f-term);font-weight:700;background:var(--bench);border:2px solid var(--ink);padding:.3em .6em;word-break:break-all}
.werkstatt{display:grid;gap:12px}
.guide-text{display:grid;gap:6px;line-height:1.45}
.guide-text h3{margin:10px 0 0;font-family:var(--f-ui);font-size:1.05rem}
.guide-text p,.guide-text ul,.guide-text ol{margin:0}
.guide-text ul,.guide-text ol{padding-left:1.3em}

<!--
  WORTLISTEN (Markdown) – eine Liste je Labor: "wortliste-1" (Erdgeschoss), "wortliste-2" (1. Stock), "wortliste-3" (2. Stock),
                       "wortliste-4" (Dachboden), "wortliste-5" (Turmspitze, Abschlusslabor)
  Dauerhaft ändern: den passenden Block unten in einem Texteditor bearbeiten und speichern.
  Für eine einzelne Stunde geht es auch im Spiel: Zahnrad 2 Sekunden halten → Werkstatt.

  # Titel            → ein Märchen = eine Runde (Sätze in Erzählreihenfolge)
  ## Wort            → ein Eintrag
  - Satz:            Pflicht. Das Prüfwort mit **Sternchen** markieren.
  - Wortart:         Pflicht. Labor 1: Verb, Adjektiv, Nomen · Labor 2 zusätzlich Pronomen, Artikel
  - Grundform:       optional (z. B. weinen, tief). Daraus baut das Spiel die Fehlversuche.
  - konjugierbar:    Formen, z. B. ich weine · du weinst · sie weinte
  - komparierbar:    Formen, z. B. tief → tiefer → am tiefsten
  - deklinierbar:    Labor 2, Pflicht außer bei Verben, z. B. der Esel → des Esels → dem Esel
  - artikelfähig:    Formen, z. B. der Frosch · die Frösche
  - Satzglied:       Labor 2, Pflicht bei Pronomen und Artikel: der Satz mit dem Wort allein vor dem Verb
                     Possessivpronomen (mein, dein, ihr …) zählen als Pronomen: hier den Satz ohne Nomen angeben,
                     z. B. Ihre schüttelte das Mädchen jeden Tag.
  - Kasusforderung:  Labor 3, Pflicht bei Präpositionen, z. B. mit wem? → mit dem Wolf → Dativ
  - Fügteil:         Labor 3, Pflicht bei Konjunktionen: die zwei getrennten Teile, z. B. Satz 1 · Satz 2
  - Attribut:        Labor 3, optional bei Adverbien, z. B. das Haus dort
  In Labor 3 steht bei Adverbien unter "Satzglied:" der Satz mit dem Adverb allein vor dem Verb.
  - isoliert:        Labor 4, optional bei Satzäquivalenten: die Kurzform, z. B. Ach!
  Abschlusslabor: Zwei gleiche Wörter direkt hintereinander erscheinen als Wortzwillinge.
  - Partizip:        optional bei Verben, die als Partizip vor einem Nomen stehen: die Partizipform, z. B. verzaubert.
                     Dann zeigen Steigern und Deklinieren echte Formen ("klappt"), und die Maschine erklärt:
                     Das Wort ist eine Verbform, die attributiv (ähnlich wie ein Adjektiv) gebraucht wird.
  - Hinweis:         optional. Erscheint nach dem Einsortieren.
  Steht eine Probe bei einer Maschine, die "nein" ergibt, ersetzt sie den automatischen Fehlversuch.
-->

# Der Froschkönig

## Brunnen
- Satz: Eine Königstochter spielte am **Brunnen**.
- Wortart: Nomen
- artikelfähig: der Brunnen · die Brunnen

## tiefen
- Satz: Ihre goldene Kugel fiel in den **tiefen** Brunnen.
- Wortart: Adjektiv
- Grundform: tief
- komparierbar: tief → tiefer → am tiefsten

## weinte
- Satz: Da **weinte** die Königstochter laut.
- Wortart: Verb
- Grundform: weinen
- konjugierbar: ich weine · du weinst · sie weinte

## Frosch
- Satz: Ein **Frosch** holte die Kugel herauf.
- Wortart: Nomen
- artikelfähig: der Frosch · die Frösche

## stolz
- Satz: Doch die Königstochter war sehr **stolz**.
- Wortart: Adjektiv
- komparierbar: stolz → stolzer → am stolzesten
- artikelfähig: das stolz · die stolz

## verzauberter
- Satz: Der Frosch war ein **verzauberter** Prinz.
- Wortart: Verb
- Grundform: verzaubern
- konjugierbar: ich verzaubere · du verzauberst · sie verzauberte
- Partizip: verzaubert
- komparierbar: verzaubert → verzauberter → am verzaubertsten
- Hinweis: Das ist ein Partizip, also eine Verbform. Hier wird es attributiv gebraucht, ähnlich wie ein Adjektiv. Es bleibt aber ein Verb.

# Rotkäppchen

## brachte
- Satz: Rotkäppchen **brachte** der Großmutter Kuchen.
- Wortart: Verb
- Grundform: bringen
- konjugierbar: ich bringe · du bringst · sie brachte

## Korb
- Satz: Im **Korb** lag auch eine Flasche Wein.
- Wortart: Nomen
- artikelfähig: der Korb · die Körbe

## großen
- Satz: Der Weg führte durch den **großen** Wald.
- Wortart: Adjektiv
- Grundform: groß
- komparierbar: groß → größer → am größten

## Wolf
- Satz: Dort wartete schon der **Wolf**.
- Wortart: Nomen
- artikelfähig: der Wolf · die Wölfe

## pflückte
- Satz: Rotkäppchen **pflückte** bunte Blumen.
- Wortart: Verb
- Grundform: pflücken
- konjugierbar: ich pflücke · du pflückst · sie pflückte

## mutige
- Satz: Der **mutige** Jäger rettete alle.
- Wortart: Adjektiv
- Grundform: mutig
- komparierbar: mutig → mutiger → am mutigsten

# Hänsel und Gretel

## verirrten
- Satz: Hänsel und Gretel **verirrten** sich im Wald.
- Wortart: Verb
- Grundform: verirren
- konjugierbar: ich verirre mich · du verirrst dich · sie verirrten sich

## hungrig
- Satz: Sie waren müde und **hungrig**.
- Wortart: Adjektiv
- komparierbar: hungrig → hungriger → am hungrigsten

## Häuschen
- Satz: Im Wald stand ein **Häuschen** aus Lebkuchen.
- Wortart: Nomen
- artikelfähig: das Häuschen · die Häuschen

## knabberten
- Satz: Die Kinder **knabberten** am Dach.
- Wortart: Verb
- Grundform: knabbern
- konjugierbar: ich knabbere · du knabberst · sie knabberten

## alte
- Satz: Eine **alte** Frau öffnete die Tür.
- Wortart: Adjektiv
- Grundform: alt
- komparierbar: alt → älter → am ältesten

## Käfig
- Satz: Die Hexe sperrte Hänsel in einen **Käfig**.
- Wortart: Nomen
- artikelfähig: der Käfig · die Käfige

# Schneewittchen

## Königin
- Satz: Die **Königin** fragte ihren Zauberspiegel.
- Wortart: Nomen
- artikelfähig: die Königin · die Königinnen

## schöner
- Satz: Doch Schneewittchen war **schöner** als sie.
- Wortart: Adjektiv
- Grundform: schön
- komparierbar: schön → schöner → am schönsten

## floh
- Satz: Schneewittchen **floh** in den Wald.
- Wortart: Verb
- Grundform: fliehen
- konjugierbar: ich fliehe · du fliehst · sie floh

## wohnten
- Satz: Dort **wohnten** sieben Zwerge.
- Wortart: Verb
- Grundform: wohnen
- konjugierbar: ich wohne · du wohnst · sie wohnten

## gemütlich
- Satz: Ihr Haus war klein und **gemütlich**.
- Wortart: Adjektiv
- komparierbar: gemütlich → gemütlicher → am gemütlichsten

## Apfel
- Satz: Die Königin brachte einen giftigen **Apfel**.
- Wortart: Nomen
- artikelfähig: der Apfel · die Äpfel

<script type="text/markdown" id="wortliste-2">
# Frau Holle

## Das
- Satz: **Das** Mädchen spann am Brunnen.
- Wortart: Artikel
- deklinierbar: das Mädchen → des Mädchens → dem Mädchen
- Satzglied: Das spann Mädchen am Brunnen.

## sie
- Satz: Da sprang **sie** in den Brunnen.
- Wortart: Pronomen
- deklinierbar: sie → ihr → sie
- Satzglied: Sie sprang da in den Brunnen.

## bunte
- Satz: Unten lag eine **bunte** Wiese.
- Wortart: Adjektiv
- Grundform: bunt
- komparierbar: bunt → bunter → am buntesten
- deklinierbar: eine bunte Wiese → einer bunten Wiese

## die
- Satz: Dort wohnte **die** alte Frau Holle.
- Wortart: Artikel
- deklinierbar: die Frau → der Frau → den Frauen
- Satzglied: Die wohnte dort alte Frau Holle.

## mir
- Satz: „Du kannst **mir** helfen“, sagte Frau Holle.
- Wortart: Pronomen
- deklinierbar: ich → mir → mich
- Satzglied: „Mir kannst du helfen“, sagte Frau Holle.

## ihre
- Satz: Das Mädchen schüttelte **ihre** Betten.
- Wortart: Pronomen
- deklinierbar: ihre Betten → ihrer Betten → ihren Betten
- Satzglied: Ihre schüttelte das Mädchen jeden Tag.
- Hinweis: „ihre“ ist ein Possessivpronomen. Es kann auch ohne sein Nomen stehen.

## Kissen
- Satz: Die Federn flogen aus dem **Kissen**.
- Wortart: Nomen
- artikelfähig: das Kissen · die Kissen
- deklinierbar: das Kissen → des Kissens → dem Kissen

# Die Bremer Stadtmusikanten

## Der
- Satz: **Der** Esel wollte nach Bremen.
- Wortart: Artikel
- deklinierbar: der Esel → des Esels → dem Esel
- Satzglied: Der wollte Esel nach Bremen.

## er
- Satz: Unterwegs traf **er** einen Hund.
- Wortart: Pronomen
- konjugierbar: ich ere · du erest · sie erte
- komparierbar: er → erer → am eresten
- deklinierbar: er → ihm → ihn
- Satzglied: Er traf unterwegs einen Hund.

function drawSprite(ctx, rows, x, y, s, flipY){
  for (let r = 0; r < rows.length; r++){
    const row = flipY ? rows[rows.length - 1 - r] : rows[r];
    for (let c = 0; c < row.length; c++){
      const col = PAL[row[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x + c * s, y + r * s, s, s);
    }
  }
}
function paintCanvas(cv, rows, flipY){
  if (!cv) return;
  cv.width = rows[0].length; cv.height = rows.length;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawSprite(ctx, rows, 0, 0, 1, flipY);
}
function spriteByName(name){
  if (name === 'machine') return machineSprite('normal');
  return SPR[name];
}
function paintAllIcons(root){
  (root || document).querySelectorAll('canvas[data-sprite]').forEach(cv => {
    const rows = spriteByName(cv.dataset.sprite);
    if (rows) paintCanvas(cv, rows, cv.dataset.flip === '1');
  });
}

function seeded(n){ let x = n; return () => (x = (x * 9301 + 49297) % 233280) / 233280; }
function rect(ctx, c, x, y, w, h){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function card(ctx, x, y){ rect(ctx, PAL.K, x, y, 8, 6); rect(ctx, PAL.W, x + 1, y + 1, 6, 4); rect(ctx, PAL.D, x + 2, y + 2, 4, 1); }
function bricks(ctx, base, line){

    const off = (y / 7) % 2 ? 0 : 8;

}

/* ---------- Ton (standardmäßig aus) ---------- */
let actx = null;
function tone(freq, dur, type, vol, when){
  if (!settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || .05, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) { /* kein Ton verfügbar */ }
}

function normKey(k){
  return k.trim().toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z]/g, '');
}
function normWortart(w){
  const t = normKey(w || '');
  if (t === 'verb' || t === 'partizip' || t === 'verbpartizip') return 'Verb';
  if (t === 'adjektiv') return 'Adjektiv';
  if (t === 'nomen' || t === 'substantiv' || t === 'eigenname') return 'Nomen';
  if (t === 'pronomen' || /^(personal|possessiv|demonstrativ|reflexiv|interrogativ|relativ|indefinit)(pronomen|artikel)$/.test(t)) return 'Pronomen';
  if (t === 'artikel') return 'Artikel';
  if (t === 'adverb') return 'Adverb';
  if (t === 'praeposition') return 'Präposition';
  if (t === 'konjunktion' || t === 'subjunktion') return 'Konjunktion';
  if (t === 'partikel') return 'Partikel';
  if (t === 'satzaequivalent' || t === 'interjektion') return 'Satzäquivalent';
  const later = LATER.find(l => normKey(l) === t);
  return later ? '#' + later : null;

function stickerFor(title){
  const t = title.toLowerCase();
  const map = [['frosch', 'frog'], ['rotk', 'hood'], ['hänsel', 'house'], ['gretel', 'house'], ['schneewitt', 'apple'],
    ['holle', 'pillow'], ['bremer', 'rooster'], ['stadtmusik', 'rooster'], ['rumpel', 'gold'],

    ['dornr', 'rose'], ['aschen', 'shoe'], ['zwilling', 'twins'], ['meister', 'crown']];
  const hit = map.find(([k]) => t.includes(k));
  return hit ? hit[1] : 'star';
}

  2: { Nomen: ['dekl'], Adjektiv: ['dekl'], Pronomen: ['dekl', 'sg'], Artikel: ['dekl', 'sg'] },
  3: { Adverb: ['sg'], 'Präposition': ['kasus'], Konjunktion: ['fueg'] },
  5: { Nomen: ['dekl'], Adjektiv: ['dekl'], Pronomen: ['dekl', 'sg'], Artikel: ['dekl', 'sg'], Adverb: ['sg'], 'Präposition': ['kasus'], Konjunktion: ['fueg'] }
};
const FIELD_HELP = {
  dekl: '„- deklinierbar: der Frosch → des Frosches → dem Frosch“',
  sg: '„- Satzglied: …“ (der Satz mit dem Wort allein vor dem Verb)',
  kasus: '„- Kasusforderung: mit wem? → mit dem Wolf → Dativ“',
  fueg: '„- Fügteil: Satz 1 · Satz 2“ (die zwei getrennten Teile)'
};
function parseMD(text, lab){
  const L = LABS[lab], rounds = [], errors = [];
  let cur = null, entry = null;
  text.split(/\r?\n/).forEach((raw, idx) => {
    const line = raw.trim();
    if (!line) return;
    let m;
    if ((m = line.match(/^#\s+(.+)$/))){
      cur = { title: m[1].trim(), words: [] }; cur.sticker = stickerFor(cur.title);
      rounds.push(cur); entry = null; return;
    }
    if ((m = line.match(/^##\s+(.+)$/))){
      if (!cur){ cur = { title: 'Eigene Wörter', words: [], sticker: 'star' }; rounds.push(cur); }
      entry = { wort: m[1].trim(), line: idx + 1 }; cur.words.push(entry); return;
    }
    if ((m = line.match(/^[-*]\s*([^:]+):\s*(.*)$/)) && entry){
      const key = KEYMAP[normKey(m[1])];
      if (key) entry[key] = m[2].trim();
    }
  });
  const allowed = L.wa.join(', ').replace(/, ([^,]*)$/, ' und $1');
  rounds.forEach(r => {
    r.words = r.words.filter(e => {
      const where = `Zeile ${e.line} („${e.wort}“)`;
      if (!e.satz){ errors.push(`${where}: Es fehlt „- Satz: …“.`); return false; }
      const wa = normWortart(e.wortart);
      if (!wa){ errors.push(`${where}: Wortart „${e.wortart || ''}“ kenne ich nicht. Erlaubt in Labor ${lab}: ${allowed}.`); return false; }
      if (wa[0] === '#' || !L.wa.includes(wa)){
        const home = LAB_IDS.find(n => LABS[n].wa.includes(wa));
        errors.push(`${where}: ${wa.replace('#', '')} gehört ${home ? 'in Labor ' + home : 'in ein späteres Labor'}. In Labor ${lab} gehen ${allowed}.`); return false;
      }
      if (wa === 'Verb' && !e.partizip && normKey(e.wortart).includes('partizip')) e.partizip = 'ja';
      if (wa !== 'Verb') delete e.partizip;
      e.wortart = wa;
      const mm = e.satz.match(/^(.*?)\*\*(.+?)\*\*(.*)$/);
      if (mm){ e.parts = [mm[1], mm[2], mm[3]]; e.wort = mm[2]; }
      else {
        const i = e.satz.indexOf(e.wort);
        if (i < 0){ errors.push(`${where}: Das Wort steht nicht im Satz. Markiere es so: **${e.wort}**`); return false; }
        e.parts = [e.satz.slice(0, i), e.wort, e.satz.slice(i + e.wort.length)];
      }
      const need = ((REQUIRED[lab] || {})[wa] || []).filter(f => !e[f]);
      if (need.length){ errors.push(`${where}: In Labor ${lab} braucht ${wa === 'Präposition' || wa === 'Konjunktion' ? 'eine' : 'ein'} ${wa} die Zeile ${need.map(f => FIELD_HELP[f]).join(' und ')}.`); return false; }
      if (!e.grundform){
        if (wa === 'Nomen' && e.art){ const first = splitForms(e.art)[0] || ''; e.grundform = first.replace(/^(der|die|das)\s+/i, '').trim() || e.wort; }
        else if (wa === 'Nomen' || wa === 'Verb' || wa === 'Adjektiv') e.grundform = e.wort;
        else e.grundform = e.wort.toLowerCase();
      }
      e.round = r.title;
      return true;
    });
  });
  return { rounds: rounds.filter(r => r.words.length), errors };
}

/* ---------- Echte Formen und Fehlversuche ---------- */
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function verbStem(g){
  const b = g.toLowerCase();
  if (/(el|er)n$/.test(b)) return b.slice(0, -1);
  if (b.endsWith('en')) return b.slice(0, -2);
  if (b.endsWith('n')) return b.slice(0, -1);
  return b;
}
function konjAttempt(g){
  let b = g.toLowerCase();
  if (b.endsWith('en')) b = b.slice(0, -2); else if (b.endsWith('e')) b = b.slice(0, -1);
  const du = /[sßzx]$/.test(b) ? b + 't' : /[td]$/.test(b) ? b + 'est' : b + 'st';
  const sie = /[td]$/.test(b) ? b + 'ete' : b + 'te';
  return [`ich ${b}e`, `du ${du}`, `sie ${sie}`];
}
function kompAttempt(g, wortart){
  const b = wortart === 'Verb' ? verbStem(g) : g.toLowerCase();
  const core = b.replace(/e$/, '');
  const comp = b.endsWith('e') ? b + 'r' : b + 'er';
  const sup = 'am ' + core + (/(s|ß|sch|z|x|t|d)$/.test(core) ? 'esten' : 'sten');
  return { base: g, items: [comp, sup] };
}
function flexAttempt(lw){
  const b = lw.replace(/e$/, '');
  return [`ich ${b}e`, `${b}er`, `des ${b}es`];
}
const LOWER_START = /^(Der|Die|Das|Den|Dem|Des|Ein|Eine|Einen|Einem|Er|Sie|Es|Ich|Wir|Ihr|Ihre|Seine|Sein|Da|Dann|Dort|Im|In|Am|An)\b/;
function moveFront(e){
  let rest = (e.parts[0] + e.parts[2]).replace(/\s+/g, ' ').trim();
  rest = rest.replace(LOWER_START, m => m.toLowerCase());
  return `${cap(e.wort.toLowerCase())} ${rest}`;
}
function sentenceOf(e){ return (e.parts[0] + e.parts[1] + e.parts[2]).replace(/\s+/g, ' ').trim(); }
/* Partizip vor einem Nomen: Steigern und Deklinieren klappen, es bleibt aber eine Verbform (attributiver Gebrauch) */
function isPartizipCase(entry, t){ return !!entry.partizip && entry.wortart === 'Verb' && (t === 'komp' || t === 'dekl'); }
function partizipStem(entry){
  const p = String(entry.partizip || '').trim();
  if (p && !/^(ja|x|true|1)$/i.test(p)) return p.toLowerCase();
  return entry.wort.toLowerCase().replace(/(es|em|en|er|e)$/, '');
}
function stateOf(entry, t, truth){ return isPartizipCase(entry, t) ? 'partizip' : truth ? 'ja' : 'nein'; }
function probe(entry, t){
  if (isPartizipCase(entry, t)){
    const given = entry[t], p = partizipStem(entry);
    const parts = given ? splitForms(given) : [];
    if (parts.length > 1) return { truth: true, base: parts[0], items: parts.slice(1), partizip: true };
    if (t === 'komp') return { truth: true, base: p, partizip: true,
      items: [p + 'er', 'am ' + p + (/(er|el)t$|end$/.test(p) ? 'sten' : /(s|ß|sch|z|x|t|d)$/.test(p) ? 'esten' : 'sten')] };
    return { truth: true, base: entry.wort, items: [p + 'en', p + 'em'], partizip: true };
  }
  const truth = TRUTH[t](entry.wortart);
  if (t === 'isol'){
    const alone = entry.isol ? entry.isol.replace(/^\*+/, '') : cap(entry.wort.toLowerCase()) + '!';
    return { truth, base: sentenceOf(entry), items: [alone] };
  }
  if (t === 'flex' && truth && !entry.flex){
    const main = entry.konj ? 'konj' : entry.komp ? 'komp' : entry.dekl ? 'dekl' : entry.art ? 'art' : null;
    if (main){ const p = probe(entry, main); return { truth, base: p.base, items: p.items, sep: TESTS[main].sep }; }
  }
  const given = entry[t === 'sgatt' ? 'sg' : t];
  const lw = entry.wort.toLowerCase(), g = entry.grundform;
  const pa = entry.wortart === 'Pronomen' || entry.wortart === 'Artikel';
  if (t === 'kasus'){
    if (given){
      const parts = given.split(/\s*(?:→|->)\s*/).map(x => x.trim()).filter(Boolean);
      let fall = null;
      if (parts.length > 1 && /^(Nominativ|Genitiv|Dativ|Akkusativ)$/i.test(parts[parts.length - 1])) fall = cap(parts.pop().toLowerCase());
      return parts.length > 1 ? { truth, base: parts[0], items: parts.slice(1), fall } : { truth, base: null, items: parts, fall };
    }
    return { truth, base: null, items: [`${lw} wem?`] };
  }
  if (t === 'fueg'){
    if (given) return { truth, base: null, items: given.split(/\s*(?:·|\|)\s*/).map(x => x.trim()).filter(Boolean) };
    const a = entry.parts[0].trim().replace(/[,;:]$/, ''), b = entry.parts[2].trim();
    return { truth, base: null, items: [cap(a || '…') + (/[.!?]$/.test(a) ? '' : '.'), cap(b || '…')] };
  }
  if (t === 'sg' || t === 'sgatt'){
    const items = [given ? given.replace(/^\*+/, '') : moveFront(entry)];
    if (t === 'sgatt' && settings.attribut && entry.attribut) items.push(entry.attribut);
    return { truth, base: null, items };
  }
  if (given){
    const parts = splitForms(given);
    if (TESTS[t].sep === '→' && parts.length > 1) return { truth, base: parts[0], items: parts.slice(1) };
    return { truth, base: null, items: parts };
  }
  if (truth) return { truth, base: null, items: [entry.wort] };
  if (t === 'flex') return { truth, base: null, items: flexAttempt(lw) };
  if (t === 'konj') return { truth, base: null, items: konjAttempt(pa ? lw : g) };
  if (t === 'komp') return Object.assign({ truth }, kompAttempt(pa ? lw : g, entry.wortart));
  if (t === 'dekl'){ const core = lw.replace(/e$/, ''); return { truth, base: entry.wort, items: [core + 'es', core + 'em'] }; }
  if (t === 'art') return { truth, base: null, items: pa ? [`ein ${lw}`, `der ${lw}`] : [`der ${g}`, `die ${g}`] };
  return { truth, base: null, items: [`${entry.wort} …`] };
}

/* Voraussetzungen im Baum (im geführten Modus als Rolltor sichtbar) */
function unlocked(t){
  const T = S.tests, tests = labTests();
  const hasFlex = tests.includes('flex');
  if (hasFlex && LEFT_TESTS.includes(t) && T.flex !== 'ja') return false;
  if (hasFlex && RIGHT_TESTS.includes(t) && T.flex !== 'nein') return false;
  if (t === 'sg') return T.dekl === 'ja' && T.art === 'nein' && T.komp === 'nein';
  if ((t === 'sgatt' || t === 'kasus' || t === 'fueg') && tests.includes('isol')) return T.isol === 'nein';
  return true;
}
/* Im Abschlusslabor zeigt die Weiche nur die Maschinen der passenden Baumhälfte */
function visibleTests(){
  if (S.lab !== 5) return labTests();
  if (S.tests.flex === 'ja') return ['flex'].concat(LEFT_TESTS);
  if (S.tests.flex === 'nein') return ['flex'].concat(RIGHT_TESTS);
  return ['flex'];
}
function reachedWortart(){
  const T = S.tests;
  if (T.konj === 'ja') return 'Verb';
  if (T.komp === 'ja') return 'Adjektiv';
  if (T.art === 'ja') return 'Nomen';
  if (T.sg === 'ja') return 'Pronomen';
  if (T.sg === 'nein') return 'Artikel';
  if (T.sgatt === 'ja') return 'Adverb';
  if (T.kasus === 'ja') return 'Präposition';
  if (T.fueg === 'ja') return 'Konjunktion';
  if (T.isol === 'ja') return 'Satzäquivalent';
  if (T.sgatt === 'nein' && T.kasus === 'nein' && T.fueg === 'nein' && labTests().includes('isol')) return 'Partikel';
  return null;
}

/* ---------- Voreinstellungen per Link (#labor-3.experte.mit-attribut) ---------- */
function readPresets(){
  const tokens = [];
  try {
    const h = (location.hash || '').replace(/^#/, '');
    if (h) tokens.push(...h.split('.'));
    new URLSearchParams(location.search).forEach((v, k) => tokens.push(v && v !== '1' ? `${k}-${v}` : k));
  } catch (e) { /* ohne Voreinstellung weiter */ }
  tokens.forEach(raw => {
    const t = raw.toLowerCase();
    let m;
    if (t === 'experte') settings.expert = true;
    else if (t === 'ohne-urteil') settings.kidJudge = false;
    else if (t === 'ohne-vorfuehrung') settings.demo = false;
    else if (t === 'ohne-geschichte') settings.story = false;
    else if (t === 'mit-attribut') settings.attribut = true;
    else if (t === 'ton') settings.sound = true;
    else if ((m = t.match(/^labor-?(\d)$/)) && LABS[+m[1]]) settings.lab = +m[1];
    else if ((m = t.match(/^runde-?(\d+)$/))) settings.startRound = Math.max(0, +m[1] - 1);
    else if (t.startsWith('ohne-')){
      const w = WA_ALL.find(x => normKey(x) === normKey(t.slice(5)));
      if (w) settings.enabled[w] = false;
    }
  });
}
function presetString(){
  const t = [];
  if (S.lab !== 1) t.push('labor-' + S.lab);
  if (settings.expert) t.push('experte');
  if (!settings.kidJudge) t.push('ohne-urteil');
  if (settings.attribut && S.lab >= 3) t.push('mit-attribut');
  LABS[S.lab].wa.forEach(w => { if (!settings.enabled[w]) t.push('ohne-' + normKey(w)); });
  if (!settings.demo) t.push('ohne-vorfuehrung');
  if (!settings.story) t.push('ohne-geschichte');
  if (settings.sound) t.push('ton');
  if (S.r > 0) t.push('runde-' + (S.r + 1));
  return t.length ? '#' + t.join('.') : '(Standard – kein Zusatz nötig)';
}

function fitStation(){
  const st = document.querySelector('.station');
  if (!st) return;
  ['--fs-sent', '--fs-bub', '--fs-res'].forEach(v => st.style.removeProperty(v));
  if (!staged()) return;
  const over = () => st.scrollHeight > st.clientHeight + 1;
  const steps = [['--fs-sent', [1.95, 1.8, 1.65, 1.5, 1.35]], ['--fs-bub', [1, .94, .88]], ['--fs-res', [1.05, .96]]];
  for (const [v, vals] of steps) for (const x of vals){ if (!over()) return; st.style.setProperty(v, x + 'rem'); }
}

      </span>

  }).join('');
  paintAllIcons(box);
}
function machineLocked(t){ return !settings.expert && !unlocked(t); }
function updateMachines(){
  buildMachines();
  visibleTests().forEach(t => {
    const el = $(`.machine[data-test="${t}"]`);
    if (!el) return;
    const st = S.tests[t];
    const locked = machineLocked(t);
    const can = S.phase === 'pick' && !S.busy && !st && !locked;
    const active = !!(S.result && S.result.t === t && !S.result.judged);
    el.disabled = !can;
    el.classList.toggle('locked', locked);
    el.classList.toggle('active', active);
    el.classList.toggle('waiting', !can && !st && !locked && !active);
    const lamp = el.querySelector('.lamp');
    lamp.className = 'lamp' + (st ? ' ' + st : '');
    lamp.textContent = st === 'ja' ? '✓' : st === 'nein' ? '✗' : st === 'partizip' ? '!' : '';
    const stText = st === 'partizip' ? 'klappt, aber das Wort ist eine Verbform (Partizip)' : st;
    el.setAttribute('aria-label', `${TESTS[t].term}: ${frageOf(t)}` + (st ? ` Ergebnis: ${stText}.` : locked ? ' Noch geschlossen.' : ''));
  });
}

/* Auf der skalierten Bühne fliegt die Wortkarte in Bühnen-Koordinaten (Bildschirmmaß geteilt durch den Maßstab). */
function stageFrame(){
  const st = $('#stage');
  if (!staged() || !st) return { host: document.body, x: 0, y: 0, s: 1 };
  const r = st.getBoundingClientRect();
  return { host: st, x: r.left, y: r.top, s: r.width / st.offsetWidth || 1 };
}
function flyer(from){
  const F = stageFrame(), r = from.getBoundingClientRect();
  const f = from.cloneNode(true);
  f.removeAttribute('id'); f.classList.add('flyer');
  Object.assign(f.style, { left: (r.left - F.x) / F.s + 'px', top: (r.top - F.y) / F.s + 'px', width: r.width / F.s + 'px', height: r.height / F.s + 'px', fontSize: getComputedStyle(from).fontSize });
  F.host.appendChild(f);
  return { f, r, s: F.s };
}
function centerDelta(r, el, s){
  const b = el.getBoundingClientRect();
  return [(b.left + b.width / 2 - (r.left + r.width / 2)) / (s || 1), (b.top + b.height / 2 - (r.top + r.height / 2)) / (s || 1)];
}
async function flyWord(t){

    if (m) m.classList.add('shake'); await wait(300); if (m) m.classList.remove('shake'); belt.classList.remove('run'); return;
  }
  const { f, r, s } = flyer(card);

  const [dx, dy] = centerDelta(r, icon, s);
  await f.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px,${dy}px) scale(.35)` }], { duration: 360, easing: 'steps(8, end)', fill: 'forwards' }).finished;
  m.classList.add('shake'); await wait(300); m.classList.remove('shake');
  await f.animate([{ transform: `translate(${dx}px,${dy}px) scale(.35)` }, { transform: 'translate(0,0) scale(1)' }], { duration: 320, easing: 'steps(8, end)', fill: 'forwards' }).finished;
  f.remove(); card.classList.remove('ghost'); belt.classList.remove('run');
}
async function flyToDrawer(w){

const LEAF_Y = 460, LEAF_H = 46, LINE_H = 22;
function nodeState(id, T){
  switch (id){
    case 'dekl': return T.dekl || (T.art === 'ja' ? 'ja' : '');
    case 'nsg': return T.sg === 'nein' ? 'ja' : T.sg === 'ja' ? 'nein' : '';
    case 'root2': return T.flex === 'nein' ? 'ja' : T.flex === 'ja' ? 'nein' : '';
    case 'integ': return T.isol === 'nein' || (!T.isol && T.flex === 'nein') ? 'ja' : T.isol === 'ja' ? 'nein' : '';
    case 'nsgatt': return T.sgatt === 'nein' ? 'ja' : T.sgatt === 'ja' ? 'nein' : '';
    case 'root': return T.flex === 'ja' ? 'ja' : T.flex === 'nein' ? 'nein' : '';
    default: return T[id] || '';
  }
}
function leafEdgeState(parent, leaf, T){
  if (leaf === 'Partikel'){
    if (T.sgatt === 'nein' && T.kasus === 'nein' && T.fueg === 'nein') return 'ja';
    return T.kasus === 'ja' || T.fueg === 'ja' || T.sgatt === 'ja' ? 'nein' : '';
  }
  return nodeState(parent, T);
}
function nodeBox(n){
  const h = n.label.length * LINE_H + 16, w = Math.max(...n.label.map(l => l.length)) * 12 + 26;
  return { w, h };
}
function halfSVG(name, opts){
  const H = HALF[name], live = !!opts.live, all = !!opts.all, T = live ? S.tests : {};
  const shown = lab => all || lab <= S.lab;
  const leafOn = w => all || (H.leaves[w].lab <= S.lab && settings.enabled[w]);
  const reached = live && (S.phase === 'sort' || S.phase === 'demo') && !S.sortedAs ? reachedWortart() : null;
  const pt = id => {
    if (H.nodes[id]){ const n = H.nodes[id], b = nodeBox(n); return { x: n.x, top: n.y - b.h / 2, bottom: n.y + b.h / 2, lab: n.lab }; }
    const l = H.leaves[id]; return { x: l.x, top: LEAF_Y - LEAF_H / 2, bottom: LEAF_Y + LEAF_H / 2, lab: l.lab };
  };
  let s = '';
  H.edges.forEach(([a, b, dx = 0]) => {
    const A = pt(a), B = pt(b), isLeaf = !H.nodes[b];
    if (isLeaf && !leafOn(b) && shown(B.lab)) return;
    const x1 = A.x + dx, y1 = A.bottom, x2 = B.x, y2 = B.top;
    if (!shown(B.lab)){ s += `<line class="future-edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; return; }
    const st = isLeaf ? leafEdgeState(a, b, T) : nodeState(b, T);
    s += `<line class="edge ${st}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if (st === 'ja'){
      const n = Math.floor(Math.hypot(x2 - x1, y2 - y1) / 22);
      for (let k = 1; k < n; k++){
        const px = x1 + (x2 - x1) * k / n, py = y1 + (y2 - y1) * k / n;
        s += `<rect class="pebble" x="${(px - 3.5).toFixed(1)}" y="${(py - 3.5).toFixed(1)}" width="7" height="7"/>`;
      }
    }
  });
  Object.keys(H.nodes).forEach(id => {
    const n = H.nodes[id], b = nodeBox(n);
    if (!shown(n.lab)){ s += `<rect class="future" x="${n.x - 8}" y="${n.y - 8}" width="16" height="16"/>`; return; }
    const st = nodeState(id, T);
    const text = n.label.map((l, k) => `<text x="${n.x}" y="${(n.y + 1 + (k - (n.label.length - 1) / 2) * LINE_H).toFixed(1)}">${l}</text>`).join('');
    s += `<g class="node ${st} ${n.start ? 'root' : ''}"><rect x="${n.x - b.w / 2}" y="${n.y - b.h / 2}" width="${b.w}" height="${b.h}"/>${text}</g>`;
  });
  Object.keys(H.leaves).forEach(w => {
    const l = H.leaves[w], lw = l.w || 108;
    if (!shown(l.lab)){ s += `<rect class="future" x="${l.x - lw / 2 + 10}" y="${LEAF_Y - 20}" width="${lw - 20}" height="40"/>`; return; }
    if (!leafOn(w)) return;
    const named = S.named[w] && !settings.expert;
    s += `<g class="leaf ${named ? WA[w].cls : ''} ${reached === w ? 'reached' : ''}">
      <rect class="box" x="${l.x - lw / 2}" y="${LEAF_Y - LEAF_H / 2}" width="${lw}" height="${LEAF_H}"/>
      <rect class="handle" x="${l.x - 14}" y="${LEAF_Y + 11}" width="28" height="6"/>
      <text x="${l.x}" y="${LEAF_Y - 5}"${named && w.length > 8 ? ' class="small"' : ''}>${named ? w : '?'}</text></g>`;
  });
  return s;
}
let treeView = null, treeAnim = 0;
function setViewBox(svg, target){
  const from = treeView || target;
  treeView = target;
  cancelAnimationFrame(treeAnim);
  if (reduceMotion() || from.join() === target.join()){ svg.setAttribute('viewBox', target.join(' ')); return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 350), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    svg.setAttribute('viewBox', from.map((v, i) => (v + (target[i] - v) * e).toFixed(1)).join(' '));
    if (k < 1) treeAnim = requestAnimationFrame(step);
  };
  treeAnim = requestAnimationFrame(step);
}

/* ---------- Ablauf eines Wortes ---------- */
function loadWord(intro){
  const words = activeWords(S.r);
  if (S.i >= words.length){ roundComplete(); return; }
  S.gen++; clearFlights();
  S.entry = words[S.i]; S.tests = {}; S.result = null; S.sortTries = 0; S.sortedAs = null;
  S.phase = 'pick'; S.busy = false;
  render();
  const prev = S.i > 0 ? words[S.i - 1] : null;
  S.twin = prev && prev.wort.toLowerCase() === S.entry.wort.toLowerCase() ? prev : null;
  const twinNote = S.twin ? ` <b>Achtung, Zwilling!</b> ${qw(S.twin.wort)} war gerade ${WA[S.twin.wortart].ein} ${S.twin.wortart}. Prüfe genau – der Satz entscheidet.` : '';
  setBubble((intro ? intro + ' ' : '') + `Neues Wort: ${qw(S.entry.wort)}.` + (twinNote || ' Schick es in eine Maschine!'), S.twin ? 'think' : 'normal');
}
function startRound(r){
  let k = nextPlayableRound(Math.max(0, r || 0));
  if (k < 0) k = nextPlayableRound(0);
  if (k < 0){
    S.phase = 'idle'; S.entry = null; render();
    setBubble('Für diese Einstellung gibt es keine Wörter. Schalte im Lehrkraft-Bereich eine Wortart ein.', 'think');
    return;
  }
  S.r = k; S.i = 0;
  loadWord(`Märchen: <b>${esc(S.rounds[k].title)}</b>.`);
}
function lockMessage(t){
  const T = S.tests;
  if (labTests().includes('flex') && !T.flex && (LEFT_TESTS.includes(t) || RIGHT_TESTS.includes(t))) return `Noch nicht! Erst kommt die Formfrage: Ist das Wort ${termOf('flex')}?`;
  if (t === 'sg') return `Noch nicht! Erst muss klar sein: ${termOf('dekl')} ja, ${termOf('art')} nein und ${termOf('komp')} nein.`;
  if ((t === 'sgatt' || t === 'kasus' || t === 'fueg') && labTests().includes('isol')) return `Noch nicht! Erst kommt die Frage: Ist das Wort ${termOf('isol')}?`;
  return 'Diese Maschine ist noch nicht dran.';
}
async function runTest(t){
  if (S.phase !== 'pick' || S.busy || S.tests[t] || !visibleTests().includes(t)) return;
  if (!unlocked(t)){
    if (settings.expert){ bump(`.machine[data-test="${t}"]`, 'shake'); setBubble(lockMessage(t), 'think'); }
    return;
  }
  const gen = S.gen, entry = S.entry;
  S.busy = true; updateMachines(); renderActions();
  await flyWord(t);
  if (gen !== S.gen || entry !== S.entry || S.phase !== 'pick') return;   // inzwischen ein anderes Wort: Ergebnis verwerfen
  const p = probe(entry, t);
  S.result = { t, entry, truth: p.truth, base: p.base, items: p.items, fall: p.fall, sep: p.sep, partizip: !!p.partizip && isPartizipCase(entry, t), judged: false };
  S.busy = false;

}
function judge(yes){

  commitTest(yes === S.result.truth);
}
function commitTest(kidCorrect){
  const R = S.result;
  if (!R || R.entry !== S.entry || R.judged) return;
  const t = R.t, w = qw(S.entry.wort), first = esc(R.items[0] || '');
  const lockedBefore = labTests().filter(x => !unlocked(x));
  R.judged = true;
  S.tests[t] = stateOf(S.entry, t, R.truth);
  if (R.truth) sfx.ja(); else sfx.nein();
  if (R.partizip && isPartizipCase(S.entry, t)){
    /* Partizip vor dem Nomen: Die Form lässt sich bilden – es bleibt aber eine Verbform. */
    const g = qw(S.entry.grundform || S.entry.wort);
    let pm = kidCorrect === true ? 'Genau, das klappt! ' : kidCorrect === false ? `Doch, das klappt: „${first}“. ` : 'Das klappt! ';

      ? `Auch hier gilt: ${w} ist ein Partizip, eine Verbform. Prüfe jetzt mit der Maschine ${termOf('konj')}!`

    S.phase = 'pick';
    render(); setBubble(pm, 'think');

  let msg;
  if (kidCorrect === true) msg = (R.truth ? 'Genau, das klappt! ' : 'Genau, so geht das nicht. ') + fact;
  else if (kidCorrect === false) msg = (R.truth ? `Doch, das klappt: „${first}“. ` : `Schau genau: „${first}“ – so geht das nicht. `) + fact;
  else msg = (R.truth ? 'Das klappt! ' : 'Das klappt nicht. ') + fact;
  let mood = kidCorrect === false ? 'think' : 'happy';
  const wa = reachedWortart();
  if (!wa && S.lab === 5 && t === 'flex' && R.truth){
    S.phase = 'pick';
    msg += ' Die Weiche stellt um: Jetzt kommen die Maschinen für flektierbare Wörter.';

      msg += next.length ? ` Prüfe jetzt ${next.map(termOf).join(' und ')}.` : ' Probier eine andere Maschine.';
    } else if (t === 'dekl' && open.includes('konj')){
      msg += ` Dann probier ${termOf('konj')}.`;
    } else msg += ' Probier eine andere Maschine.';
  }
  render();
  setBubble(msg, mood);
}
async function sortInto(w, auto){
  if (S.phase !== 'sort' || (S.busy && !auto)) return;
  const e = S.entry, info = WA[e.wortart], gen = S.gen;
  if (w !== e.wortart){
    S.sortTries++;
    bump(`.drawer[data-w="${w}"]`, 'wrong'); sfx.nein();
    if (S.sortTries === 1){ setBubble(`Fast! ${qw(e.wort)} ${info.prop()}. ${info.hilfe}`, 'think'); return; }
    S.busy = true; renderCabinet();
    setBubble(`Komm, ich zeig's dir: ${info.merksatz}`, 'think');
    await wait(1500);
    if (gen !== S.gen) return;
    return sortInto(e.wortart, true);
  }
  S.busy = true; renderCabinet();
  await flyToDrawer(w);
  if (gen !== S.gen) return;
  S.counts[w]++;
  const newly = !S.named[w] && !settings.expert;
  if (newly) S.named[w] = true;
  S.sortedAs = w; S.phase = 'done'; S.busy = false;
  render(); bump(`.drawer[data-w="${w}"]`, 'bump');
  let msg = (auto ? 'So: ' : 'Richtig! ') + `${qw(e.wort)} ist ${WA[w].ein} ${w}.`;
  if (newly) msg += ` Neues Schild im Laborplan: <b>${w}</b>.`;
  if (S.twin && S.twin.wortart !== w) msg += ` Gleiches Wort, andere Wortart als eben: Der Satz entscheidet!`;
  if (e.hinweis) msg += `<br><b>Übrigens:</b> ${esc(e.hinweis)}`;
  setBubble(msg, auto ? 'normal' : 'happy');
}

  if (demoReturn){ S.r = demoReturn.r; S.i = demoReturn.i; demoReturn = null; loadWord(); }

function switchLab(n, roundIdx){
  if (!LABS[n]) return;
  S.lab = n; settings.lab = n;
  S.rounds = S.labRounds[n]; S.r = 0; S.i = 0;
  S.entry = DEMOS[n]; S.tests = {}; S.result = null; S.sortedAs = null; S.phase = 'idle'; S.busy = false;
  buildMachines(); render();
  const first = !S.visited[n];
  S.visited[n] = true;
  const go = () => { if (settings.demo && first) runDemo(null, roundIdx || 0); else startRound(roundIdx || 0); };
  if (n === 5 && first && settings.story) showStory(go, FAIRY_INTRO, 'Die Turmspitze');
  else go();
}

  <p>Am Smartboard wird das Daumen-Urteil zur Klassenabstimmung. Für Tablets stellst du hier unter „Einstellungen“ einen Code ein und hängst ihn an den Link, z. B. #labor-3.experte. Eigene Wörter trägst du in der Werkstatt ein (gilt für die Sitzung) oder dauerhaft in der Datei.</p>
  <h3>Konventionen</h3>
  <p>Partizipien zählen als Verben, auch wenn sie attributiv gebraucht werden (ähnlich wie ein Adjektiv vor einem Nomen). Steigern und Deklinieren klappen dann zwar, die Maschine erklärt aber die Verbform und schickt zum Konjugator. In der Wortliste aktiviert das die Zeile <b>- Partizip:</b> (z. B. verzaubert). Eigennamen zählen als Nomen, Possessivpronomen als Pronomen.</p>
  <h3>Datenschutz</h3>
  <p>Das Labor speichert nichts und fragt keine Namen ab. Schubladen und Album gelten nur, solange die Seite geöffnet ist.</p></div>`;
function openTeacher(){ mdDraft = null; renderTeacher(); }
function renderTeacher(){
  const tab = (id, label) => `<button class="btn tab" type="button" role="tab" aria-selected="${teacherTab === id}" data-act="tab" data-tab="${id}">${label}</button>`;
  let body;
  if (teacherTab === 'set'){
    const preset = presetString(), hasPreset = preset[0] === '#';
    const labOpts = LAB_IDS.map(n => `<option value="${n}"${n === S.lab ? ' selected' : ''}>Labor ${n} · ${LABS[n].floor}</option>`).join('')
      + LATER_FLOORS.map(([f, n]) => `<option disabled>Labor ${n} · ${f} (in Arbeit)</option>`).join('');
    body = `
    <div class="setting"><span class="lbl">Labor<small>Ein Wechsel startet das Labor von vorn.</small></span>
      <select class="sel" id="selLabor" aria-label="Labor">${labOpts}</select></div>
    <div class="setting"><span class="lbl">Märchen-Runde</span>
      <span class="preset"><select class="sel" id="selRound" aria-label="Märchen-Runde">${S.rounds.map((r, k) => `<option value="${k}"${k === S.r ? ' selected' : ''}>${esc(r.title)} (${activeWords(k).length} Wörter)</option>`).join('')}</select>
      <button class="btn" type="button" data-act="startRound">Starten</button></span></div>
    <div class="setting"><label for="swJudge">Kinder entscheiden selbst<small>Daumen hoch oder runter, danach bestätigt die Maschine.</small></label>
      <input class="switch" type="checkbox" id="swJudge" data-set="kidJudge"${settings.kidJudge ? ' checked' : ''}></div>
    <div class="setting"><label for="swExpert">Expertenmodus<small>Alle Maschinen sind sofort da, die Schilder im Laborplan bleiben leer.</small></label>
      <input class="switch" type="checkbox" id="swExpert" data-set="expert"${settings.expert ? ' checked' : ''}></div>
    ${S.lab >= 3 ? `<div class="setting"><label for="swAttr">Attribut mitprüfen<small>Die Maschine fragt zusätzlich: Kann das Wort ein Nomen näher beschreiben (das Haus dort)?</small></label>
      <input class="switch" type="checkbox" id="swAttr" data-set="attribut"${settings.attribut ? ' checked' : ''}></div>` : ''}
    <div class="setting"><label for="swSound">Ton</label>
      <input class="switch" type="checkbox" id="swSound" data-set="sound"${settings.sound ? ' checked' : ''}></div>
    <div class="setting"><span class="lbl">Geprüfte Wortarten<small>Eine Änderung startet die Runde neu.</small></span>
      <span class="checks">${LABS[S.lab].wa.map(w => `<label class="check ${WA[w].cls}"><input type="checkbox" id="chk${w}" data-wa="${w}"${settings.enabled[w] ? ' checked' : ''}>${w}</label>`).join('')}</span></div>
    <div class="setting"><span class="lbl">Noch einmal zeigen</span>
      <span class="preset"><button class="btn" type="button" data-act="showStory">Geschichte</button><button class="btn" type="button" data-act="showDemo">Vorführung</button></span></div>
    <div class="setting"><span class="lbl">Voreinstellung für Tablets<small>An den Link oder Dateinamen anhängen, dann startet das Labor mit diesen Einstellungen.</small></span>
      <span class="preset"><code id="presetCode">${esc(preset)}</code><button class="btn" type="button" data-act="copyPreset"${hasPreset ? '' : ' disabled'}>Kopieren</button></span></div>
    <div class="setting"><span class="lbl">Zurücksetzen<small>Leert Schubladen, Schilder und Album.</small></span>
      <button class="btn" type="button" data-act="resetAll">Zurücksetzen</button></div>`;
  } else if (teacherTab === 'md'){
    const val = mdDraft != null ? mdDraft : S.labMD[S.lab];
    const need = S.lab === 5 ? ' Im Abschlusslabor gelten die Pflichtzeilen aus Labor 2 und 3. Zwei gleiche Wörter direkt hintereinander zeigt das Spiel als Wortzwillinge an.' : S.lab === 4 ? ' In Labor 4 genügen Satz und Wortart. Bei Satzäquivalenten kannst du mit <b>- isoliert:</b> die Kurzform angeben, z. B. Huch!' : S.lab >= 3 ? ' In Labor 3 brauchen Adverbien eine Zeile <b>- Satzglied:</b> (Wort allein vor dem Verb), Präpositionen <b>- Kasusforderung:</b> (z. B. mit wem? → mit dem Wolf → Dativ) und Konjunktionen <b>- Fügteil:</b> (die zwei getrennten Teile, verbunden mit ·).' : S.lab >= 2 ? ' In Labor 2 brauchen Nomen, Adjektive, Pronomen und Artikel eine Zeile <b>- deklinierbar:</b>, Pronomen und Artikel zusätzlich <b>- Satzglied:</b> mit der Umstellprobe. Possessivpronomen (mein, dein, ihr …) zählen als Pronomen; gib bei ihnen den Satz ohne Nomen an, z. B. „Ihre schüttelte das Mädchen.“' : '';
    body = `<div class="werkstatt">
      <p>Hier änderst oder ergänzt du die Wörter von <b>Labor ${S.lab}</b> für diese Sitzung. Ein Märchen beginnt mit <b>#</b>, jedes Wort mit <b>##</b>. Markiere das Prüfwort im Satz mit <b>**Sternchen**</b>.${need} Dauerhaft speicherst du eine Liste im Abschnitt „wortliste-${S.lab}“ der HTML-Datei.</p>
      <textarea id="mdText" spellcheck="false" aria-label="Wortliste im Markdown-Format">${esc(val)}</textarea>
      <div class="preset"><button class="btn primary" type="button" data-act="mdApply">Liste übernehmen</button>
        <button class="btn" type="button" data-act="mdExample">Beispiel anhängen</button>
        <button class="btn" type="button" data-act="mdRestore">Originalliste</button></div>
      <div id="mdMsg" aria-live="polite"></div></div>`;
  }
  if (teacherTab === 'help') body = GUIDE_HTML;
  openDialog('Lehrkraft-Bereich', `<div class="tabs" role="tablist">${tab('set', 'Einstellungen')}${tab('md', 'Werkstatt')}${tab('help', 'Anleitung')}</div>
    <div>${body}</div>
    <div class="dialog-actions"><span></span><div class="right"><button class="btn big primary" type="button" data-act="close">Fertig</button></div></div>`, { wide: true, closable: true });
}
function refreshPreset(){
  const c = $('#presetCode'); if (!c) return;
  const p = presetString(); c.textContent = p;
  const b = $('[data-act="copyPreset"]'); if (b) b.disabled = p[0] !== '#';
}
function mdMessage(ok, text, list){
  const box = $('#mdMsg'); if (!box) return;
  box.innerHTML = `<p class="msg ${ok ? 'ok' : 'err'}">${esc(text)}${list && list.length ? '<ul>' + list.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}</p>`;
}
function applyMD(text, label){
  const { rounds, errors } = parseMD(text, S.lab);
  if (!rounds.length){ mdMessage(false, 'Ich habe keine gültigen Wörter gefunden.', errors); return; }
  S.labRounds[S.lab] = rounds; S.rounds = rounds; S.labMD[S.lab] = text; mdDraft = null;
  const n = rounds.reduce((a, r) => a + r.words.length, 0);
  mdMessage(true, `${label || 'Übernommen'}: ${rounds.length} Märchen mit ${n} Wörtern.${errors.length ? ' Diese Einträge habe ich übersprungen:' : ''}`, errors);
  if (S.phase !== 'demo') startRound(0);
}

/* ---------- Ereignisse in Dialogen ---------- */
function onDialogClick(e){
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'storyNext'){ if (storyStep >= STORY.length - 1) storyEnd(); else { storyStep++; storyRender(); } }
  else if (act === 'storySkip') storyEnd();
  else if (act === 'stick'){ const key = albumKey(S.lab, S.rounds[S.r].title); S.album[key] = true; sfx.sticker(); showAlbum(key, true); }
  else if (act === 'nextRound'){ closeDialog(); startRound(+b.dataset.r); }
  else if (act === 'laborDone') laborDone();
  else if (act === 'album') showAlbum(null, false);
  else if (act === 'again'){ closeDialog(); startRound(0); }
  else if (act === 'gotoLab'){ closeDialog(); switchLab(+b.dataset.lab, 0); }
  else if (act === 'close') closeDialog();
  else if (act === 'tab'){ if (teacherTab === 'md'){ const ta = $('#mdText'); if (ta) mdDraft = ta.value; } teacherTab = b.dataset.tab; renderTeacher(); }
  else if (act === 'startRound'){ const k = +$('#selRound').value; closeDialog(); if (S.phase === 'demo'){ S.phase = 'idle'; demoReturn = null; } startRound(k); }
  else if (act === 'showStory'){ closeDialog(); showStory(null); }
  else if (act === 'showDemo'){ closeDialog(); if (S.phase !== 'demo') runDemo({ r: S.r, i: S.i }); }
  else if (act === 'copyPreset'){
    const code = $('#presetCode'), text = code.textContent;
    try { navigator.clipboard.writeText(text).then(() => toast('Kopiert: ' + text)).catch(() => selectText(code)); }
    catch (err) { selectText(code); }
  }
  else if (act === 'resetAll'){
    if (!b.dataset.confirm){ b.dataset.confirm = '1'; b.textContent = 'Wirklich zurücksetzen?'; return; }
    WA_ALL.forEach(w => { S.counts[w] = 0; S.named[w] = false; });
    S.album = {}; closeDialog(); toast('Schubladen, Schilder und Album sind leer.');
    if (S.phase === 'demo'){ S.phase = 'idle'; demoReturn = null; }
    startRound(S.r);
  }
  else if (act === 'mdApply') applyMD($('#mdText').value);
  else if (act === 'mdExample'){ const ta = $('#mdText'); ta.value = ta.value.replace(/\s+$/, '') + MD_EXAMPLE[S.lab] + '\n'; mdDraft = ta.value; ta.focus(); ta.scrollTop = ta.scrollHeight; }
  else if (act === 'mdRestore'){ $('#mdText').value = ORIGINAL_MD[S.lab]; applyMD(ORIGINAL_MD[S.lab], 'Originalliste wiederhergestellt'); }
}
function selectText(el){
  try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Markiert – jetzt kopieren'); } catch (e) { /* nichts */ }
}
function onDialogChange(e){
  const el = e.target;
  if (el.id === 'selLabor'){ const n = +el.value; closeDialog(); if (n !== S.lab){ demoReturn = null; switchLab(n, 0); } return; }
  if (el.dataset.set){
    const key = el.dataset.set;
    settings[key] = el.checked;
    if (key === 'kidJudge' && !settings.kidJudge && S.phase === 'judge') commitTest(null);
    if (key === 'sound' && settings.sound) sfx.ja();
    if (key === 'attribut'){ buildMachines(); if (S.result && !S.result.judged && S.result.t === 'sgatt'){ const p = probe(S.entry, 'sgatt'); S.result.items = p.items; } }
    render(); refreshPreset();
  } else if (el.dataset.wa){
    settings.enabled[el.dataset.wa] = el.checked;
    if (!LABS[S.lab].wa.some(w => settings.enabled[w])){
      settings.enabled[el.dataset.wa] = true; el.checked = true;
      toast('Mindestens eine Wortart bleibt an.'); return;
    }
    refreshPreset();
    if (S.phase === 'demo') render(); else startRound(S.r);
  }
}

/* ---------- Bedienung ---------- */
function bindEvents(){
  $('#machines').addEventListener('click', e => { const m = e.target.closest('.machine'); if (m && !m.disabled) runTest(m.dataset.test); });
  $('#cabinet').addEventListener('click', e => { const d = e.target.closest('.drawer'); if (d && !d.disabled) sortInto(d.dataset.w); });
  $('#actions').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.id === 'yesBtn') judge(true);
    else if (b.id === 'noBtn') judge(false);
    else if (b.id === 'nextBtn') nextWord();
    else if (b.id === 'demoNext') demoAdvance();
    else if (b.id === 'skipBtn') endDemo();
  });
  $('#dlgBody').addEventListener('click', onDialogClick);
  $('#dlgBody').addEventListener('change', onDialogChange);
  $('#dlgBody').addEventListener('input', e => { if (e.target.id === 'mdText') mdDraft = e.target.value; });
  $('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay' && dialogClosable) closeDialog(); });
  $('#albumBtn').addEventListener('click', () => showAlbum(null, false));
  $('#planBtn').addEventListener('click', showFullPlan);
  $('#soundBtn').addEventListener('click', () => { settings.sound = !settings.sound; renderHeader(); if (settings.sound) sfx.ja(); });
  $('#fsBtn').addEventListener('click', toggleFullscreen);
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { renderFsBtn(); fitStage(); }));
  let fitTimer = null;
  const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitStage, 60); };
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', refit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);

  // Lehrkraft-Bereich: 2 Sekunden gedrückt halten
  const gear = $('#gearBtn');
  let holdTimer = null;
  const start = e => {
    if (e && e.type === 'keydown'){ if ((e.key !== 'Enter' && e.key !== ' ') || e.repeat) return; e.preventDefault(); }
    if (holdTimer) return;
    gear.classList.add('holding');
    holdTimer = setTimeout(() => { holdTimer = null; gear.classList.remove('holding'); openTeacher(); }, 2000);
  };
  const stop = () => {
    if (!holdTimer) return;
    clearTimeout(holdTimer); holdTimer = null; gear.classList.remove('holding');
    toast('Lehrkraft-Bereich: Zahnrad 2 Sekunden gedrückt halten');
  };
  gear.addEventListener('pointerdown', e => { e.preventDefault(); start(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => gear.addEventListener(ev, stop));
  gear.addEventListener('keydown', start);
  gear.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') stop(); });
  gear.addEventListener('contextmenu', e => e.preventDefault());
  gear.addEventListener('click', e => e.preventDefault());

  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const open = !$('#overlay').hidden;
    if (e.key === 'Escape' && open){
      if (storyOpen) storyEnd(); else if (dialogClosable) closeDialog();
      return;
    }
    if (open || tag === 'textarea' || tag === 'input' || tag === 'select' || e.target === gear) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (/^[1-9]$/.test(k)){ const t = visibleTests()[+k - 1]; if (t) runTest(t); }
    else if (k === 'j' || k === 'y') judge(true);
    else if (k === 'n') judge(false);
    else if (k === 'enter'){
      if (tag === 'button') return;
      if (S.phase === 'done' || S.phase === 'stuck'){ e.preventDefault(); nextWord(); }
      else if (S.phase === 'demo'){ e.preventDefault(); demoAdvance(); }
    }
  });
}

const BUILD = 8;   // Fassung des Labors; ältere Zwischenstände bringen keine alten Wortlisten mit
/* ---------- Bühne: ganzes Labor ohne Scrollen, quer oder hoch ---------- */
const STAGE = { land: [1280, 800], port: [800, 1140] };
function fitStage(){
  const html = document.documentElement, st = $('#stage');
  const vw = window.innerWidth, vh = window.innerHeight;
  const port = vw / vh < 0.9;
  const [W, H] = port ? STAGE.port : STAGE.land;
  const s = Math.min(vw / W, vh / H);
  const ok = s >= 0.6;   // sehr kleine Bildschirme (Handy): normale Seite mit Scrollen
  html.classList.toggle('staged', ok); html.classList.toggle('port', ok && port); html.classList.toggle('land', ok && !port);
  if (!ok){ st.style.transform = ''; st.style.left = ''; st.style.top = ''; fitStation(); return; }
  st.style.transform = `scale(${s.toFixed(4)})`;
  st.style.left = Math.max(0, Math.round((vw - W * s) / 2)) + 'px';
  st.style.top = Math.max(0, Math.round((vh - H * s) / 2)) + 'px';
  fitStation();
}
/* Vollbild (am Smartboard gewinnt das die Browserleiste) */
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const fsAllowed = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function renderFsBtn(){
  const b = $('#fsBtn'); if (!b) return;
  b.hidden = !fsAllowed();
  const on = !!fsElement();
  $('#fsLbl').textContent = on ? 'Vollbild aus' : 'Vollbild';
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  paintCanvas($('#fsIco'), on ? SPR.fullscreenExit : SPR.fullscreen);
}
function toggleFullscreen(){
  const d = document.documentElement;
  const fail = () => toast('Vollbild ist hier nicht möglich. Öffne die Datei direkt im Browser.');
  try {
    if (fsElement()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const req = d.requestFullscreen || d.webkitRequestFullscreen;
    if (!req) return fail();
    const p = req.call(d);
    if (p && p.catch) p.catch(fail);
  } catch (e) { fail(); }
}

/* ---------- Start ---------- */
function boot(data){
  LAB_IDS.forEach(n => {
    const src = document.getElementById(LABS[n].md);
    ORIGINAL_MD[n] = src ? src.textContent.trim() : '';
  });
  readPresets();
  const saved = data && data.state;
  if (saved && saved.settings){
    Object.assign(settings, saved.settings, { enabled: Object.assign({}, settings.enabled, saved.settings.enabled || {}) });
  }
  LAB_IDS.forEach(n => {
    // Nur selbst bearbeitete Wortlisten aus dem Zwischenstand übernehmen; sonst gilt die Liste dieser Fassung
    const own = saved && saved.v === BUILD && saved.md && saved.md[n];
    S.labMD[n] = own || ORIGINAL_MD[n];
    S.labRounds[n] = parseMD(S.labMD[n], n).rounds;
  });
  S.lab = LABS[settings.lab] ? settings.lab : 1;
  S.rounds = S.labRounds[S.lab];
  paintCanvas($('#brandIcon'), machineSprite('happy'));
  paintAllIcons(document);
  renderFsBtn();
  fitStage();
  buildMachines();
  bindEvents();
  if (saved && S.rounds.length){
    Object.assign(S.counts, saved.counts || {}); Object.assign(S.named, saved.named || {}); Object.assign(S.album, saved.album || {});
    Object.assign(S.visited, saved.visited || {});
    S.r = Math.min(saved.r || 0, S.rounds.length - 1); S.i = saved.i || 0;
    if (S.i >= activeWords(S.r).length) S.i = 0;
    loadWord();
    return;
  }
  S.entry = DEMOS[S.lab]; S.phase = 'idle'; render();
  setBubble('Hallo! Ich bin die Märchenmaschine.', 'stutter');
  const go = () => { S.visited[S.lab] = true; if (settings.demo) runDemo(null, settings.startRound); else startRound(settings.startRound); };
  if (settings.story) showStory(go); else go();
}
try {
  if (window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(() => ({ state: { v: BUILD, r: S.r, i: S.i, counts: S.counts, named: S.named, album: S.album, visited: S.visited,
      md: Object.fromEntries(LAB_IDS.filter(n => S.labMD[n] !== ORIGINAL_MD[n]).map(n => [n, S.labMD[n]])), settings: Object.assign(JSON.parse(JSON.stringify(settings)), { lab: S.lab }) } }));
  }
} catch (e) { /* ohne Zwischenstand */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
