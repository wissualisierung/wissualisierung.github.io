  const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  function renderBar() {
    bar.innerHTML = '';
    const left = [];
    if (state.screen === 'page' || state.screen === 'finish') {
      left.push(h('button.btn.px', { type: 'button', onclick: () => go('toc'), 'aria-label': 'Inhaltsverzeichnis' }, icon('book'), h('span.lbl', null, 'Inhalt')));
    } else if (state.screen === 'toc') {
      left.push(h('button.btn.px', { type: 'button', onclick: () => go('cover'), 'aria-label': 'Zum Titelbild' }, icon('star'), h('span.lbl', null, 'Titel')));
    } else if (state.screen === 'album') {
      left.push(h('button.btn.px', { type: 'button', onclick: () => go(state.prevScreen === 'album' ? 'toc' : state.prevScreen), 'aria-label': 'Zurück' }, icon('right', true), h('span.lbl', null, 'Zurück')));
    }
    let where = '';
    if (state.screen === 'page') {
      const st = story(state.sid);
      where = h('div.where', null, st.title, h('small', null, `Seite ${state.page + 1} von ${st.pages.length}`));
    } else if (state.screen === 'toc') where = h('div.where', null, 'Inhalt');
    else if (state.screen === 'album') where = h('div.where', null, 'Stickeralbum');
    else where = h('div.where', null, '');
    const right = [];
    if (state.screen !== 'album') {
      right.push(h('button.btn.px.album-btn', { type: 'button', onclick: openAlbum, 'aria-label': `Stickeralbum, ${state.stickers.size} von ${STICKERS.length} Stickern` }, icon('album'), h('span.lbl', null, 'Sticker'), h('span.num', null, String(state.stickers.size))));
    }
    if (state.screen !== 'cover') {
      right.push(h('span.btn.px.stage-chip', { title: 'Tempus-Stufe (im Lehrkraft-Menü einstellbar)' }, h('span.lbl', null, 'Stufe '), String(state.stage)));
    }
    right.push(h('button.btn.px.icon', { type: 'button', onclick: toggleSound, 'aria-label': S.on ? 'Ton ausschalten' : 'Ton einschalten', 'aria-pressed': String(S.on) }, icon(S.on ? 'soundOn' : 'soundOff')));
    right.push(h('button.btn.px.icon', { type: 'button', onclick: toggleFullscreen, 'aria-label': fsActive() ? 'Vollbild beenden' : 'Vollbild' }, icon(fsActive() ? 'compress' : 'expand'), h('span.lbl', null, fsActive() ? 'Fenster' : 'Vollbild')));
    right.push(h('button.btn.px', { type: 'button', onclick: openTeacher, 'aria-label': 'Lehrkraft-Menü' }, icon('gear'), h('span.lbl', null, 'Lehrkraft')));
    bar.append(...left, where, ...right);
  }

  function toggleSound() {
    S.on = !S.on;
    if (S.on) { S.unlock(); S.tap(); }
    renderBar();
  }

  /* ---------- Vollbild ---------- */
  let wakeLock = null;
  async function toggleFullscreen() {
    S.unlock();
    try {
      if (fsActive()) {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) await ex.call(document);
        return;
      }
      const req = fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen;
      if (!req) { toast('Dieses Gerät erlaubt im Browser kein Vollbild. Tipp: Über „Teilen → Zum Home-Bildschirm“ startet das Spiel ohne Leisten.'); return; }
      await req.call(fsTarget, { navigationUI: 'hide' });
      setTimeout(() => { if (!fsActive()) toast('Vollbild ist in dieser Ansicht gesperrt. Öffne die HTML-Datei direkt im Browser, dann klappt es.'); }, 600);
    } catch (e) {
      toast('Vollbild ist in dieser Ansicht gesperrt. Öffne die HTML-Datei direkt im Browser, dann klappt es.');
    }
  }
  async function onFsChange() {
    renderBar();
    requestAnimationFrame(fitPic);
    try {
      if (fsActive() && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  /* ---------- Hinweis ---------- */
  let toastTimer = null;
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = h('div.toast.px', { role: 'status' }); document.body.append(t); }
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 4200);
  }

  /* ---------- Navigation ---------- */
  function go(where, sid, page) {
    hideTip();
    state.screen = where;
    if (sid !== undefined) state.sid = sid;
    if (page !== undefined) state.page = page;
    state.sel = null;
    state.tray = { mode: 'idle' };
    render();
  }
  function render() {
    renderBar();
    screen.innerHTML = '';
    if (state.screen === 'cover') renderCover();
    else if (state.screen === 'toc') renderToc();
    else if (state.screen === 'page') renderPage();
    else if (state.screen === 'finish') renderFinish();
    else if (state.screen === 'album') renderAlbum();
  }

  function renderAlbum() {
    const stt = stickerStats();
    const wrap = h('section.album');
    wrap.append(h('div.toc-head', null,
      h('h1.sr', null, 'Stickeralbum'),
      pixelTitle('Stickeralbum', { fill: '#4a3290', shadow: '#fdfaff' }),
      h('p', null, `${state.stickers.size} von ${STICKERS.length} Stickern gesammelt`)));
    ALBUM.forEach(pgDef => {
      const list = STICKERS.filter(x => x.page === pgDef.id);
      const have = list.filter(x => state.stickers.has(x.id)).length;
      const grid = h('div.sticker-grid');
      list.forEach(x => {
        const owned = state.stickers.has(x.id);
        let progress = '';
        if (!owned && x.page === 'zauber') { const need = +x.id.slice(1); progress = ` (${Math.min(stt.solved, need)}/${need})`; }
        if (!owned && x.page === 'fehlerfrei') { const need = +x.id.slice(1); progress = ` (${Math.min(stt.perfect, need)}/${need})`; }
        grid.append(h(`figure.slot${owned ? '.owned' : ''}`, null,
          stickerCanvas(x, owned),
          h('figcaption', null, h('b', null, owned ? x.name : '???'), h('span', null, owned ? x.how.replace(/\.$/, '') + ' – geschafft!' : x.how + progress))));
      });
      wrap.append(h('section.album-page.px', null,
        h('div.album-head', null, h('h2', null, pgDef.title), h('span.count', null, `${have}/${list.length}`)),
        h('p.small', null, pgDef.note), grid));
    });
    // Code zum Mitnehmen
    const msg = h('p.small', { 'aria-live': 'polite' });
    const inp = h('input', { id: 'code-in', type: 'text', inputmode: 'text', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', maxlength: '9', placeholder: 'z. B. ABC-DEF', 'aria-label': 'Sticker-Code eingeben' });
    const redeem = () => {
      const ids = readStickerCode(inp.value);
      if (!ids) { msg.textContent = 'Dieser Code stimmt nicht. Prüfe die sechs Zeichen.'; return; }
      const before = state.stickers.size;
      ids.forEach(id => state.stickers.add(id));
      const added = state.stickers.size - before;
      render();
      toast(added ? `${added} ${added === 1 ? 'Sticker ist' : 'Sticker sind'} wieder im Album.` : 'Diese Sticker hast du schon alle.');
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') redeem(); });
    wrap.append(h('section.album-page.px.code-box', null,
      h('div.album-head', null, h('h2', null, 'Sticker mitnehmen')),
      h('p', null, 'Das Spiel speichert nichts. Schreib dir diesen Code auf, dann bekommst du deine Sticker beim nächsten Mal zurück. Er verrät nur, welche Sticker du hast.'),
      h('p.code', { 'aria-label': 'Dein Sticker-Code' }, state.stickers.size ? stickerCode() : '—'),
      h('div.row-btns', null, inp, h('button.btn.px.fairy', { type: 'button', onclick: redeem }, 'Code einlösen')),
      msg));
    screen.append(wrap);
  }

  function openStory(sid) {
    const st = story(sid);
    let p = st.pages.findIndex(pg => !pageStat(pg).complete);
    if (p < 0) p = 0;
    S.page();
    go('page', sid, p);
  }

  /* ---------- Titelbild ---------- */
  function renderCover() {
    const art = document.createElement('canvas');
    A.drawScene(art, 'cover', ['fee13']);
    art.className = 'cover-art';
    art.setAttribute('aria-hidden', 'true');
    const intro = allStories().find(s => s.role === 'einleitung');
    const start = () => {
      S.unlock(); S.page();
      if (!state.introDone && intro && !storyStat(intro).complete) go('page', intro.id, 0);
      else go('toc');
    };
    screen.append(h('section.cover', null, art,
      h('div.cover-inner', null,
        h('h1.sr', null, 'Der Zeitfaden'),
        pixelTitle('Der Zeitfaden', { fill: '#f8d35a', shadow: '#3b3355', outline: '#4a3290' }),
        h('p', null, 'Ein verfluchtes Märchenbuch. Tippe die grauen Verben an und gib ihnen ihre Zeit zurück.'),
        h('button.btn.px.primary', { type: 'button', onclick: start }, 'Buch öffnen', icon('right'))
      )));
  }

  /* ---------- Inhaltsverzeichnis ---------- */
  function renderToc() {
    const stages = { 1: 'Präsens und Präteritum', 2: 'dazu Perfekt und Plusquamperfekt', 3: 'alle sechs Tempora' };
    const grid = h('div.toc-grid');
    allStories().forEach(st => {
      const s = storyStat(st);
      const c = document.createElement('canvas');
      A.drawScene(c, st.pages[0].bild, st.pages[0].figuren);
      const g = s.n ? 1 - s.d / s.n : 0;
      c.style.filter = `grayscale(${g.toFixed(2)})`;
      c.setAttribute('aria-hidden', 'true');
      const frame = !!st.role;
      const badge = s.complete && s.n ? h('span.badge', null, 'entflucht') : frame ? h('span.badge', null, st.role === 'einleitung' ? 'Vorwort' : 'Schluss') : st.custom ? h('span.badge', null, 'eigenes Material') : null;
      grid.append(h(`button.story.px${s.complete && s.n ? '.done' : ''}${frame ? '.frame' : ''}`, { type: 'button', onclick: () => openStory(st.id) },
        c,
        h('div.info', null,
          h('h3', null, st.title),
          h('div.meta', null, s.n ? `${s.d} von ${s.n} Verben repariert · ${st.pages.length} ${st.pages.length === 1 ? 'Seite' : 'Seiten'}` : 'Auf dieser Stufe nichts verflucht'),
          h('div.meter', { 'aria-hidden': 'true' }, h('i', { style: `width:${s.n ? Math.round(s.d / s.n * 100) : 100}%` })),
          badge)));
    });
    screen.append(h('section.toc', null,
      h('div.toc-head', null,
        h('h1.sr', null, 'Inhalt'),
        pixelTitle('Inhalt', { fill: '#4a3290', shadow: '#fdfaff' }),
        h('p', null, `Stufe ${state.stage}: ${stages[state.stage]}`)),
      grid));
  }

  /* ---------- Buchseite ---------- */
  let picCanvas = null, picFig = null;
  const MQ_STACK = window.matchMedia('(max-aspect-ratio: 5/4), (max-width: 720px)');

  function renderPage() {
    const st = story(state.sid);
    if (!st) return go('toc');
    const pg = st.pages[state.page];
    picCanvas = document.createElement('canvas');
    A.drawScene(picCanvas, pg.bild, pg.figuren);
    picCanvas.className = 'px';
    picCanvas.setAttribute('role', 'img');
    picCanvas.setAttribute('aria-label', 'Bild zur Seite');
    picFig = h('figure.pic', null, picCanvas, h('div.sparkles'));

    const text = h('div.text.px', { lang: 'de' });
    if (state.page === 0) text.append(h('span.heading', null, h('span.sr', null, st.title), (() => { const c = pixelTitle(st.title, { fill: '#7a5cd6', shadow: '#d2bff5' }); c.setAttribute('aria-hidden', 'true'); return c; })()));
    pg.paras.forEach(tokens => {
      const p = h('p');
      tokens.forEach(tk => {
        if (tk.type === 'text') p.append(tk.text);
        else if (tk.type === 'slot') p.append(verbButton(tk));
      });
      text.append(p);
    });
    const tray = h('div.tray.px', { id: 'tray', 'aria-live': 'polite' });
    const last = state.page === st.pages.length - 1;
    const ps = pageStat(pg);
    const pager = h('nav.pager', { 'aria-label': 'Seiten' },
      h('button.btn.px', { type: 'button', onclick: prevPage, disabled: state.page === 0 ? true : null, 'aria-label': 'Vorige Seite' }, icon('right', true), h('span.lbl', null, 'Zurück')),
      h('span.count', null, `${state.page + 1} / ${st.pages.length}`),
      h(`button.btn.px${ps.complete ? '.glow' : ''}`, { type: 'button', id: 'nextBtn', onclick: nextPage, 'aria-label': last ? lastLabel(st) : 'Nächste Seite' }, h('span.lbl', null, last ? 'Fertig' : 'Weiter'), icon('right')));
    screen.append(h('section.page', null, picFig, h('div.textcol', null, h('div.stack', null, text, tray), pager)));
    updatePic(false);
    renderTray();
    fitPic();
  }

  function lastLabel(st) { return st.role === 'einleitung' ? 'Los geht es' : st.role === 'schluss' ? 'Zum Ende' : 'Märchen beenden'; }

  function fitPic() {
    if (!picCanvas || !picFig || !picFig.isConnected) return;
    const stacked = MQ_STACK.matches;
    const b = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--b')) || 3;
    let w = picFig.clientWidth - 6 * b;
    let hgt = stacked ? Math.max(120, window.innerHeight * 0.38) : picFig.clientHeight - 8 * b;
    if (w <= 0 || hgt <= 0) return;
    let cw = w, ch = w * 9 / 16;
    if (ch > hgt) { ch = hgt; cw = ch * 16 / 9; }
    picCanvas.style.width = Math.floor(cw) + 'px';
    picCanvas.style.height = Math.floor(ch) + 'px';
    picFig.style.height = stacked ? Math.floor(ch + 5 * b) + 'px' : '';
  }
  if (window.ResizeObserver) new ResizeObserver(() => fitPic()).observe(screen);
  window.addEventListener('resize', fitPic);

  function verbButton(tk) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.key = tk.item;
    b.dataset.slot = tk.slot;
    updateVerb(b);
    return b;
  }
  function updateVerb(b, pop) {
    const it = items.get(b.dataset.key), i = +b.dataset.slot;
    const done = isDone(it);
    b.className = 'verb';
    if (done) {
      b.classList.add('done', 't-' + (it.tense || 'none'));
      if (pop) b.classList.add('pop');
      b.textContent = it.slots[i];
      b.setAttribute('aria-label', `${it.correct}, ${it.tense ? E.TNAME[it.tense] : 'Verb'}`);
    } else {
      b.classList.add('cursed');
      const lastSlot = i === it.slots.length - 1;
      if (lastSlot) b.textContent = capLike(it.display, it.slots.length === 1 ? it.slots[0] : '');
      else { b.textContent = '···'; b.classList.add('gap'); }
      if (state.sel === it.key) b.classList.add('sel');
      b.setAttribute('aria-label', `verflucht: ${it.display}. Antippen und Form wählen.`);
    }
  }
  function updateItem(key, pop) { screen.querySelectorAll(`.verb[data-key="${CSS.escape(key)}"]`).forEach(b => updateVerb(b, pop)); }
  function updateAllVerbs() { screen.querySelectorAll('.verb').forEach(b => updateVerb(b)); }

  function updatePic(animate) {
    const st = story(state.sid); if (!st || !picCanvas) return;
    const s = pageStat(st.pages[state.page]);
    const g = s.n ? 1 - s.d / s.n : 0;
    picCanvas.style.filter = g > 0.001 ? `grayscale(${g.toFixed(3)}) brightness(${(1 + g * 0.05).toFixed(3)})` : 'none';
    const nb = document.getElementById('nextBtn');
    if (nb) nb.classList.toggle('glow', s.complete);
    if (animate && s.complete) sparkle();
  }
  function sparkle() {
    if (!picFig || !picCanvas) return;
    const box = picFig.querySelector('.sparkles');
    box.style.inset = 'auto';
    box.style.left = picCanvas.offsetLeft + 'px';
    box.style.top = picCanvas.offsetTop + 'px';
    box.style.width = picCanvas.offsetWidth + 'px';
    box.style.height = picCanvas.offsetHeight + 'px';
    for (let i = 0; i < 16; i++) {
      const sp = h('i.spark');
      sp.style.left = (8 + Math.random() * 84) + '%';
      sp.style.top = (30 + Math.random() * 60) + '%';
      sp.style.animationDelay = (Math.random() * 0.5) + 's';
      sp.style.background = ['#f8d35a', '#f8b9cb', '#a8e8cf', '#d2bff5', '#acd8f6'][i % 5];
      box.append(sp);
      setTimeout(() => sp.remove(), 2200);
    }
  }

  /* Kartenablage */
  function legendFor(pg) {
    const ts = [];
    pg.items.forEach(it => { if (it.tense && isDone(it) && !ts.includes(it.tense)) ts.push(it.tense); });
    ts.sort((a, b) => E.TENSES.indexOf(a) - E.TENSES.indexOf(b));
    if (!ts.length) return null;
    return h('div.legend', { 'aria-label': 'Farben der Tempora' }, ts.map(t => h(`span.t-${t}`, null, E.TNAME[t])));
  }

  /* Lernhinweise */
  const KIND_TITLE = { strong: 'Starkes Verb', weak: 'Schwaches Verb', mixed: 'Gemischtes Verb', irreg: 'Unregelmäßiges Verb', modal: 'Modalverb' };
  function verbTip(it) {
    const I = it.info;
    if (!I) return null;
    const praet = I.particle ? `${I.praet} ${I.particle}` : I.praet;
    const forms = `${I.inf} – ${praet} – ${I.aux === 's' ? 'ist' : 'hat'} ${I.p2}`;
    let title = KIND_TITLE[I.kind] || 'Verb', text = '';
    if (I.base === 'backen') {
      title = 'Sonderfall';
      text = 'Backen hat heute ein schwaches Präteritum mit -te (früher: buk), aber ein starkes Partizip II.';
    } else if (I.kind === 'strong') {
      text = 'Starke Verben sind unregelmäßig: Der Stammvokal wechselt, und das Präteritum hat kein -te.';
    } else if (I.kind === 'mixed') {
      text = 'Gemischte Verben ändern den Stamm wie starke Verben und bekommen trotzdem -te wie schwache.';
    } else if (I.kind === 'weak') {
      text = 'Schwache Verben sind regelmäßig: Der Stamm bleibt gleich, das Präteritum bekommt -te.';
      if (I.eIns) text += ` Nach -d, -t oder -m/-n mit Mitlaut davor kommt ein -e- dazu: ${I.praet}.`;
    } else if (I.kind === 'modal') {
      text = `Bei Modalverben haben ich und er/sie/es im Präsens dieselbe Form ohne Endung: ich ${I.ich}, er ${I.er}.`;
    } else {
      text = `${q(I.base)} ist ganz unregelmäßig. Seine Formen lernt man am besten auswendig.`;
    }
    let extra = '';
    const t = it.tense;
    if ((t === 'perf' || t === 'plusq' || t === 'fut2') && I.aux === 's') {
      extra = ['sein', 'werden', 'bleiben'].includes(I.base)
        ? '„sein“, „werden“ und „bleiben“ bilden das Perfekt mit „sein“.'
        : 'Bei Bewegung oder Veränderung steht „sein“, nicht „haben“.';
    } else if (t === 'perf') extra = 'Perfekt = „haben“ oder „sein“ + Partizip II.';
    else if (t === 'plusq') extra = 'Plusquamperfekt = „hatte“ oder „war“ + Partizip II: Es geschah noch früher.';
    else if (t === 'fut1') extra = 'Futur I = „werden“ + Infinitiv.';
    else if (t === 'fut2') extra = 'Futur II = „werden“ + Partizip II + „haben“ oder „sein“.';
    else if (I.particle) extra = `${q(I.particle)} ist trennbar: Im Satz steht es am Ende, im Partizip II steht ge- in der Mitte.`;
    else if (I.ieren) extra = 'Verben auf -ieren bekommen im Partizip II kein ge-.';
    else if (I.prefix) extra = `Die Vorsilbe ${I.prefix}- bleibt am Verb, darum bekommt das Partizip II kein ge-.`;
    else if (I.vowelChange && t === 'praes') extra = `Auch im Präsens wechselt der Vokal: du ${I.du}, er ${I.er}.`;
    return { title, forms, text: extra ? text + ' ' + extra : text };
  }

  const GENERAL_TIPS = [
    [1, 'Erzähltempus', 'Märchen erzählen meist im Präteritum: „Ein Kaiser regierte ein großes Land.“ In der wörtlichen Rede sprechen die Figuren oft im Präsens.'],
    [1, 'Schwache Verben', 'Regelmäßige Verben heißen schwach. Ihr Präteritum bekommt -te: lachen – lachte – hat gelacht.'],
    [1, 'Starke Verben', 'Unregelmäßige Verben heißen stark. Im Präteritum wechselt der Stammvokal: binden – band – hat gebunden.'],
    [1, 'Gemischte Verben', 'Kennen, nennen, rennen, brennen, denken und bringen mischen beides: neuer Stamm und -te. kennen – kannte – hat gekannt.'],
    [1, 'Personalendungen', 'Die Endung verrät die Person: ich lern-e, du lern-st, er lern-t, wir lern-en, ihr lern-t, sie lern-en.'],
    [1, 'Trennbare Verben', 'Bei Verben wie einkaufen wandert die Vorsilbe im Satz ans Ende: Er kauft ein. Er kaufte ein.'],
    [1, 'Vokalwechsel', 'Viele starke Verben wechseln schon im Präsens den Vokal, aber nur bei du und er/sie/es: ich fahre, du fährst, er fährt.'],
    [1, 'Stammformen', 'Mit drei Formen kennst du ein Verb ganz: Infinitiv, Präteritum und Partizip II: binden – band – gebunden.'],
    [2, 'Perfekt', 'Perfekt = „haben“ oder „sein“ im Präsens + Partizip II: Sie hat gelacht. Er ist gerannt.'],
    [2, 'haben oder sein?', 'Verben der Bewegung oder Veränderung bilden das Perfekt mit „sein“: Er ist gestolpert. Sie ist gewachsen.'],
    [2, 'Plusquamperfekt', 'Was noch früher geschah, steht im Plusquamperfekt: Nachdem es geregnet hatte, schien die Sonne.'],
    [2, 'Satzklammer', 'Bei zusammengesetzten Formen umschließen die zwei Verbteile den Satz wie eine Klammer: Ich habe den Kuchen gebacken.'],
    [3, 'Futur I', 'Futur I = „werden“ + Infinitiv: Morgen wird es schneien.'],
    [3, 'Futur II', 'Futur II = „werden“ + Partizip II + „haben“ oder „sein“: Bis morgen wird er das Buch gelesen haben.'],
    [3, 'Tempus ist nicht Zeit', 'Auch das Präsens kann von der Zukunft erzählen: Morgen fahre ich los. Bestimme deshalb immer die Form.']
  ];
  function generalTip(st, page) {
    if (st.role === 'einleitung' && !st.pages[page].items.some(it => state.repaired.has(it.key))) {
      return { title: 'So geht es', text: 'Tippe auf ein graues Verb und wähle unten die Form, die in den Satz passt.' };
    }
    const list = GENERAL_TIPS.filter(t => t[0] <= state.stage);
    let hsh = 0; for (const ch of st.id) hsh = (hsh * 31 + ch.charCodeAt(0)) >>> 0;
    const t = list[(hsh + page * 3) % list.length];
    return { title: 'Tipp · ' + t[1], text: t[2] };
  }
  function infoBox(tip) {
    return h('div.info', null,
      h('span.kicker', null, tip.title),
      tip.forms ? h('span.forms', null, tip.forms) : null,
      h('p', null, tip.text));
  }
  function countChip(ps) {
    return h('span.count', { 'aria-label': `${ps.d} von ${ps.n} Verben auf dieser Seite repariert` }, `${ps.d}/${ps.n}`);
  }

  function renderTray() {
    const tray = document.getElementById('tray');
    if (!tray) return;
    const st = story(state.sid), pg = st.pages[state.page];
    const ps = pageStat(pg);
    const T = state.tray;
    tray.innerHTML = '';

    if (T.mode === 'choose' && state.sel) {
      const it = items.get(state.sel);
      tray.append(h('div.tray-head', null,
        h('p.prompt', null, icon('star'), h('span', null, 'Welche Form passt für ', h('b', null, q(it.display)), '?')),
        countChip(ps)));
      const cards = h('div.cards', { role: 'group', 'aria-label': 'Kärtchen' });
      T.options.forEach((o, idx) => {
        cards.append(h(`button.card.px${T.shake === idx ? '.shake' : ''}`, { type: 'button', onclick: () => choose(idx), disabled: o.disabled ? true : null, 'aria-label': `${idx + 1}: ${o.label}` }, o.label));
      });
      tray.append(cards);
      if (T.note) tray.append(h('p.note', null, T.note));
      T.shake = null;
      return;
    }

    // Ergebniszeile nach einer Antwort
    const last = T.last ? items.get(T.last) : null;
    if (last) {
      const tname = last.tense ? E.TNAME[last.tense] : '';
      tray.append(h('div.tray-head', null,
        h(`p.result${T.revealed ? '.reveal' : ''}`, null, icon('star'),
          h('span', null, T.revealed ? 'Richtig ist ' : 'Richtig: ', h('b', null, q(last.correct))),
          tname ? h(`span.tchip.t-${last.tense}`, null, tname) : null),
        countChip(ps)));
      const tip = verbTip(last);
      if (tip) tray.append(infoBox(tip));
    } else if (!ps.complete) {
      const tip = generalTip(st, state.page);
      tray.append(h('div.tray-head', null, h('span.kicker', null, tip.title), countChip(ps)));
      tray.append(h('div.info', null, h('p', null, tip.text)));
    }

    if (ps.complete) {
      const isLast = state.page === st.pages.length - 1;
      if (!last && ps.n === 0) tray.append(h('p.prompt', null, 'Auf dieser Stufe ist hier nichts verflucht.'));
      tray.append(h('div.done-row', null,
        h('p', null, ps.n ? 'Seite repariert!' : ''),
        h('button.btn.px.primary', { type: 'button', onclick: nextPage }, isLast ? lastLabel(st) : 'Umblättern', icon('right'))));
      if (!last) { const lg = legendFor(pg); if (lg) tray.append(lg); }
    }
  }

  function selectItem(it) {
    state.sel = it.key;
    const opts = [{ label: it.correct, right: true }].concat(it.cards.map(c => ({ label: c.label, right: false, fb: c.feedback, type: c.type })));
    state.tray = { mode: 'choose', options: shuffle(opts), note: null };
    updateAllVerbs();
    renderTray();
  }

  function choose(idx) {
    const T = state.tray;
    if (T.mode !== 'choose' || !state.sel) return;
    const o = T.options[idx];
    if (!o || o.disabled) return;
    const it = items.get(state.sel);
    if (o.right) {
      state.repaired.add(it.key);
      state.sel = null;
      S.right();
      updateItem(it.key, true);
      updateAllVerbs();
      state.tray = { mode: 'idle', last: it.key };
      afterRepair();
      return;
    }
    o.disabled = true;
    const n = (state.wrong.get(it.key) || 0) + 1;
    state.wrong.set(it.key, n);
    S.wrong();
    if (n >= 2) {
      state.repaired.add(it.key);
      state.revealed.add(it.key);
      state.sel = null;
      setTimeout(() => S.reveal(), 350);
      updateItem(it.key, true);
      updateAllVerbs();
      state.tray = { mode: 'idle', last: it.key, revealed: true };
      afterRepair();
      return;
    }
    T.note = o.fb || 'Schau noch einmal genau hin.';
    T.shake = idx;
    renderTray();
    const cards = document.querySelectorAll('.tray .card:not(:disabled)');
    if (cards[0] && document.activeElement && document.activeElement.classList.contains('card')) cards[0].focus();
  }

  function afterRepair() {
    const st = story(state.sid);
    const ps = pageStat(st.pages[state.page]);
    updatePic(true);
    renderTray();
    if (ps.complete) setTimeout(() => S.done(), 380);
    checkStickers();
    if (stickerQueue.length) { clearTimeout(stickerTimer); stickerTimer = setTimeout(showStickerPop, 1100); }
  }

  function prevPage() {
    if (state.page > 0) { S.page(); go('page', state.sid, state.page - 1); }
  }
  function nextPage() {
    const st = story(state.sid);
    if (state.page < st.pages.length - 1) { S.page(); go('page', state.sid, state.page + 1); }
    else go('finish');
  }

  /* Tooltip für reparierte Verben */
  let tipEl = null, tipTimer = null;
  function showTip(btn, text) {
    hideTip();
    const r = btn.getBoundingClientRect();
    tipEl = h('div.tip.px', { role: 'status' }, text);
    tipEl.style.left = (r.left + r.width / 2) + 'px';
    tipEl.style.top = r.top + 'px';
    document.body.append(tipEl);
    const tr = tipEl.getBoundingClientRect();
    if (tr.left < 8) tipEl.style.left = (r.left + r.width / 2 + (8 - tr.left)) + 'px';
    if (tr.right > window.innerWidth - 8) tipEl.style.left = (r.left + r.width / 2 - (tr.right - window.innerWidth + 8)) + 'px';
    tipTimer = setTimeout(hideTip, 1800);
  }
  function hideTip() { if (tipEl) { tipEl.remove(); tipEl = null; } clearTimeout(tipTimer); }

  screen.addEventListener('click', e => {
    const b = e.target.closest('.verb');
    if (!b) return;
    S.unlock();
    const it = items.get(b.dataset.key);
    if (isDone(it)) { showTip(b, it.tense ? E.TNAME[it.tense] : 'Verb'); return; }
    if (state.sel === it.key) return;
    S.tap();
    selectItem(it);
  });

  /* ---------- Abschluss ---------- */
  function renderFinish() {
    if (stickerQueue.length) setTimeout(showStickerPop, 900);
    const st = story(state.sid);
    const s = storyStat(st);
    const all = allStories();
    const tales = all.filter(x => !x.role);
    const idx = all.indexOf(st);
    const next = all.slice(idx + 1).find(x => !storyStat(x).complete || x.role === 'schluss') || null;
    const thumb = document.createElement('canvas');
    const lastPg = st.pages[st.pages.length - 1];
    A.drawScene(thumb, lastPg.bild, lastPg.figuren);
    thumb.className = 'thumb px';
    thumb.setAttribute('aria-hidden', 'true');
    let title, text, buttons = [];
    if (!s.complete) {
      thumb.style.filter = `grayscale(${(1 - s.d / Math.max(1, s.n)).toFixed(2)})`;
      title = pixelTitle('Fast geschafft', { fill: '#fdfaff', shadow: '#3b3355', outline: '#7a5cd6' });
      text = `In ${q(st.title)} ${s.n - s.d === 1 ? 'ist noch 1 Verb' : 'sind noch ' + (s.n - s.d) + ' Verben'} grau.`;
      buttons.push(h('button.btn.px.primary', { type: 'button', onclick: () => openStory(st.id) }, 'Zurück ins Märchen'));
      buttons.push(h('button.btn.px', { type: 'button', onclick: () => go('toc') }, icon('book'), 'Zum Inhalt'));
    } else if (st.role === 'einleitung') {
      state.introDone = true;
      title = pixelTitle('Los geht es!', { fill: '#f8d35a', shadow: '#3b3355', outline: '#4a3290' });
      text = `Du weißt jetzt, wie es geht. ${tales.length} Märchen warten im Inhaltsverzeichnis auf dich.`;
      buttons.push(h('button.btn.px.primary', { type: 'button', onclick: () => go('toc') }, icon('book'), 'Zum Inhalt'));
      setTimeout(() => S.done(), 120);
    } else if (st.role === 'schluss') {
      title = pixelTitle('Ende', { fill: '#f8d35a', shadow: '#3b3355', outline: '#4a3290' });
      text = 'Der Fluch ist gebrochen. Das Märchenbuch ist wieder heil, und die dreizehnte Fee sitzt mit am Tisch.';
      buttons.push(h('button.btn.px.primary', { type: 'button', onclick: () => go('cover') }, icon('star'), 'Zum Titelbild'));
      buttons.push(h('button.btn.px', { type: 'button', onclick: () => go('toc') }, icon('book'), 'Zum Inhalt'));
      setTimeout(() => S.fanfare(), 120);
    } else {
      title = pixelTitle('Entflucht!', { fill: '#f8d35a', shadow: '#3b3355', outline: '#4a3290' });
      text = `${st.title} ist wieder heil. ${s.n} ${s.n === 1 ? 'Verb hat' : 'Verben haben'} ihre Zeit zurück.`;
      if (next) buttons.push(h('button.btn.px.primary', { type: 'button', onclick: () => openStory(next.id) }, next.role === 'schluss' ? 'Zum Schluss' : 'Weiter: ' + next.title, icon('right')));
      buttons.push(h('button.btn.px', { type: 'button', onclick: () => go('toc') }, icon('book'), 'Zum Inhalt'));
      setTimeout(() => S.fanfare(), 120);
    }
    screen.append(h('section.finish', null, h('div.box.px', null, h('h1.sr', null, title.getAttribute('aria-label')), title, thumb, h('p', null, text), h('div.row', null, buttons))));
    const first = screen.querySelector('.finish .btn'); if (first) first.focus({ preventScroll: true });
  }

  /* ---------- Lehrkraft-Menü ---------- */
  let overlay = null, lastFocus = null;
  function openTeacher() {
    S.unlock();
    hideTip();
    lastFocus = document.activeElement;
    overlay = h('div.overlay', { onclick: e => { if (e.target === overlay) closeTeacher(); } });
    const panel = h('div.panel.px', { role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'tm-title' });

    // Stufe
    const stageInfo = [
      [1, 'Stufe 1', 'Erzählen und Sprechen', ['praes', 'praet']],
      [2, 'Stufe 2', 'Dazu Vergangenes in Rede und nachdem-Sätzen', ['praes', 'praet', 'perf', 'plusq']],
      [3, 'Stufe 3', 'Dazu Wünsche, Flüche und Versprechen', ['praes', 'praet', 'perf', 'plusq', 'fut1', 'fut2']]
    ];
    const stages = h('div.stages', { role: 'radiogroup', 'aria-label': 'Tempus-Stufe' });
    stageInfo.forEach(([n, name, desc, ts]) => {
      const inp = h('input', { type: 'radio', name: 'stage', id: 'stage-' + n, value: String(n), checked: state.stage === n ? true : null,
        onchange: () => { state.stage = n; state.sel = null; state.tray = { mode: 'idle' }; renderBar(); toast(`${name}: ${ts.map(t => E.TNAME[t]).join(', ')} sind verflucht.`); } });
      stages.append(h('label.stage-opt', { for: 'stage-' + n }, inp, h('b', null, name + ' · ', h('span', null, desc)), h('div.chips', null, ts.map(t => h(`i.t-${t}`, null, E.TNAME[t])))));
    });

    // Ton
    const sound = h('label.switch', { for: 'tm-sound' }, h('input', { type: 'checkbox', id: 'tm-sound', checked: S.on ? true : null, onchange: e => { S.on = e.target.checked; renderBar(); } }), 'Klänge abspielen');

    // Eigenes Material
    const ta = h('textarea', { id: 'tm-md', spellcheck: 'false', 'aria-label': 'Eigenes Märchen im Markdown-Format', placeholder: '# Titel\n\n## Seite 1\nbild: wald\nfiguren: rotkaeppchen, wolf\nEs {war|sein} einmal …' });
    const file = h('input', { type: 'file', id: 'tm-file', accept: '.md,.txt,text/markdown,text/plain', class: 'sr' });
    const report = h('div', { id: 'tm-report', 'aria-live': 'polite' });
    const list = h('ul.custom-list');
    const renderCustomList = () => {
      list.innerHTML = '';
      custom.forEach(st => list.append(h('li', null, h('span', null, `${st.title} · ${st.pages.length} ${st.pages.length === 1 ? 'Seite' : 'Seiten'}`),
        h('button.btn.px.quiet', { type: 'button', onclick: () => { removeCustom(st.id); renderCustomList(); fillCheckSelect(); } }, 'Entfernen'))));
    };
    file.addEventListener('change', () => {
      const f = file.files && file.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { ta.value = String(rd.result || ''); loadCustom(ta.value, report); renderCustomList(); fillCheckSelect(); };
      rd.readAsText(f, 'utf-8');
    });
    const example = `# Die Bremer Stadtmusikanten

## Seite 1
bild: wald
figuren: wolf
Ein alter Esel {lief|fortlaufen} von zu Hause {fort}.
Er {wollte|wollen} in Bremen Musik machen.

## Seite 2
bild: nacht
„Wir {werden|singen} zusammen {singen}!“, {rief|rufen} der Hahn.`;

    // Prüfliste
    const sel = h('select', { id: 'tm-check', 'aria-label': 'Märchen für die Prüfliste' });
    const checkOut = h('div.check-wrap');
    const fillCheckSelect = () => {
      const cur = sel.value;
      sel.innerHTML = '';
      allStories().forEach(st => sel.append(h('option', { value: st.id }, st.title)));
      if (cur && story(cur)) sel.value = cur; else if (state.sid && story(state.sid)) sel.value = state.sid;
      renderCheck();
    };
    const renderCheck = () => {
      const st = story(sel.value); checkOut.innerHTML = '';
      if (!st) return;
      const tb = h('tbody');
      st.pages.forEach((pg, pi) => pg.items.forEach(it => {
        tb.append(h('tr', null,
          h('td', null, String(pi + 1)),
          h('td', null, h('b', null, it.correct), h('br'), h('span.small', null, it.inf)),
          h('td.t', null, it.tense ? h(`span.t-${it.tense}`, null, E.TNAME[it.tense]) : 'unbekannt'),
          h('td', null, it.cards.map(c => c.label).join(' · '))));
      }));
      checkOut.append(h('table.check', null, h('thead', null, h('tr', null, h('th', null, 'S.'), h('th', null, 'Richtige Form'), h('th', null, 'Tempus'), h('th', null, 'Falsche Kärtchen'))), tb));
    };
    sel.addEventListener('change', renderCheck);

    // Zurücksetzen
    let armed = false, armTimer = null;
    const reset = h('button.btn.px.quiet', { type: 'button' }, 'Fortschritt zurücksetzen');
    reset.addEventListener('click', () => {
      if (!armed) { armed = true; reset.textContent = 'Wirklich alles zurücksetzen?'; reset.classList.add('primary'); armTimer = setTimeout(() => { armed = false; reset.textContent = 'Fortschritt zurücksetzen'; reset.classList.remove('primary'); }, 3500); return; }
      clearTimeout(armTimer);
      state.repaired.clear(); state.revealed.clear(); state.wrong.clear(); state.introDone = false; state.stickers.clear();
      reset.textContent = 'Zurückgesetzt'; reset.classList.remove('primary'); armed = false;
      toast('Alle Verben sind wieder verflucht, das Stickeralbum ist leer.');
    });

    panel.append(
      h('header', null, h('h2#tm-title', null, 'Lehrkraft-Menü'), h('button.btn.px.icon', { type: 'button', onclick: closeTeacher, 'aria-label': 'Menü schließen' }, icon('close'))),
      h('p', null, 'Hier stellst du ein, welche Tempora verflucht sind, lädst eigene Märchen und prüfst alle Formen. Es wird nichts gespeichert und nichts übertragen.'),
      h('h3', null, 'Tempus-Stufe'), stages,
      h('p.small', null, 'Verben in anderen Tempora stehen schon repariert im Text. So passt dasselbe Märchen zu jeder Stufe.'),
      h('h3', null, 'Ton'), sound,
      h('h3', null, 'Eigenes Märchen laden'),
      h('p', null, 'Schreibe ein Märchen im Markdown-Format oder wähle eine Datei. ', h('code', null, '{richtige Form|Infinitiv}'), ' markiert ein verfluchtes Verb, ', h('code', null, '{Teil}'), ' ohne Infinitiv den abgetrennten Teil im selben Satz. Eigene falsche Kärtchen hängst du an: ', h('code', null, '{ging|gehen|gehte|geht}'), '.'),
      ta,
      h('div.row-btns', null,
        h('button.btn.px.fairy', { type: 'button', onclick: () => { loadCustom(ta.value, report); renderCustomList(); fillCheckSelect(); } }, 'Märchen laden'),
        h('label.btn.px.quiet', { for: 'tm-file' }, 'Datei wählen …'), file,
        h('button.btn.px.quiet', { type: 'button', onclick: () => { ta.value = example; ta.focus(); } }, 'Beispiel einfügen')),
      report, list,
      h('details', null, h('summary', null, 'Bilder und Figuren'),
        h('p.small', null, 'bild: ', A.SCENES.filter(s => s !== 'cover').join(', ')),
        h('p.small', null, 'figuren: ', A.FIGURES.join(', '))),
      h('h3', null, 'Formen prüfen'),
      h('p', null, 'Alle verfluchten Verben eines Märchens mit Tempus und den falschen Kärtchen.'), sel, checkOut,
      h('h3', null, 'Fortschritt'), reset,
      h('h3', null, 'Datenschutz'),
      h('ul.privacy', null,
        h('li', null, 'Das Spiel lädt nichts aus dem Internet: keine Schriften, Bilder, Skripte oder Statistikdienste. Die Offline-Datei sperrt Verbindungen zusätzlich per Sicherheitsregel.'),
        h('li', null, 'Es fragt keine Namen, Konten oder Klassen ab und erhebt keine Daten über die Kinder.'),
        h('li', null, 'Es speichert nichts auf dem Gerät, auch keine Cookies. Fortschritt und Sticker gelten nur, bis das Fenster geschlossen wird.'),
        h('li', null, 'Der Sticker-Code besteht aus sechs Zeichen und verrät nur, welche Sticker gesammelt sind.'),
        h('li', null, 'Eigene Märchen werden nur im Browser gelesen und nicht übertragen.'),
        h('li', null, 'Für den Unterricht die HTML-Datei lokal oder vom USB-Stick öffnen. Dann läuft das Spiel ohne Internet.')),
      h('h3', null, 'Über das Spiel'),
      h('p.small', null, 'Texte: eigene Nacherzählungen nach den Kinder- und Hausmärchen der Brüder Grimm. Grafik, Pixelschrift, Klänge und Programm: eigens für dieses Spiel erstellt und in die Datei eingebettet. Lesetext in der Systemschrift des Geräts. Tastatur: 1, 2, 3 wählen ein Kärtchen, Pfeiltasten blättern, F schaltet Vollbild.'));
    renderCustomList();
    fillCheckSelect();
    overlay.append(panel);
    document.body.append(overlay);
    panel.querySelector('button, input').focus({ preventScroll: true });
  }
  function closeTeacher() {
    if (!overlay) return;
    overlay.remove(); overlay = null;
    render();
    if (lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });
  }

  function loadCustom(md, report) {
    report.innerHTML = '';
    if (!md.trim()) { report.append(h('div.report.err', null, 'Das Feld ist leer. Füge ein Märchen ein oder wähle eine Datei.')); return; }
    const res = E.parseBook(md, { prefix: 'eigen' + (customSources.length + 1) + '-', custom: true });
    const sts = res.stories.filter(s => s.pages.length);
    if (!sts.length) { report.append(h('div.report.err', null, 'Kein Märchen gefunden. Beginne mit einer Zeile wie „# Titel“ und schreibe darunter den Text.')); return; }
    customSources.push(md);
    sts.forEach(s => { s.role = ''; custom.push(s); });
    rebuildIndex();
    const nItems = sts.reduce((a, s) => a + s.pages.reduce((b, p) => b + p.items.length, 0), 0);
    report.append(h(`div.report${res.warnings.length ? '.err' : ''}`, null,
      h('b', null, `Geladen: ${sts.map(s => q(s.title)).join(', ')} mit ${nItems} verfluchten Verben.`), ' Das Märchen steht jetzt im Inhaltsverzeichnis.',
      res.warnings.length ? h('div', null, 'Diese Formen kennt das Spiel nicht. Sie funktionieren trotzdem, bekommen aber einfache falsche Kärtchen und keine Tempusfarbe:', h('ul', null, res.warnings.map(w => h('li', null, w.replace('Unbekannte Form: ', ''))))) : null));
  }
  function removeCustom(id) {
    const i = custom.findIndex(s => s.id === id);
    if (i >= 0) { custom.splice(i, 1); customSources.splice(i, 1); }
    rebuildIndex();
    if (state.sid === id) { state.screen = 'toc'; state.sid = null; }
  }

  /* ---------- Tastatur ---------- */
  document.addEventListener('keydown', e => {
    if (overlay) { if (e.key === 'Escape') closeTeacher(); return; }
    const pop = document.querySelector('.sticker-pop');
    if (pop) { if (e.key === 'Escape') pop.remove(); return; }
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); return; }
    if (state.screen !== 'page') return;
    if (e.key === 'ArrowRight') nextPage();
    else if (e.key === 'ArrowLeft') prevPage();
    else if (e.key === 'Escape' && state.sel) { state.sel = null; state.tray = { mode: 'idle' }; updateAllVerbs(); renderTray(); }
    else if (/^[1-3]$/.test(e.key) && state.tray.mode === 'choose') choose(+e.key - 1);
  });

  /* ---------- Start ---------- */
  function snapshot() {
    return {
      screen: state.screen, sid: state.sid, page: state.page, stage: state.stage, sound: S.on, introDone: state.introDone,
      repaired: [...state.repaired], revealed: [...state.revealed], wrong: [...state.wrong], customSources: customSources.slice(),
      stickers: [...state.stickers], prevScreen: state.prevScreen
    };
  }
  function start(data) {
    data = data || {};
    try {
      (data.customSources || []).forEach(md => {
        const res = E.parseBook(md, { prefix: 'eigen' + (customSources.length + 1) + '-', custom: true });
        customSources.push(md);
        res.stories.forEach(s => { s.role = ''; custom.push(s); });
      });
    } catch (e) { /* eigenes Material ließ sich nicht wiederherstellen */ }
    rebuildIndex();
    if (data.stage) state.stage = data.stage;
    if (typeof data.sound === 'boolean') S.on = data.sound;
    (data.repaired || []).forEach(k => items.has(k) && state.repaired.add(k));
    (data.revealed || []).forEach(k => items.has(k) && state.revealed.add(k));
    (data.wrong || []).forEach(([k, v]) => items.has(k) && state.wrong.set(k, v));
    state.introDone = !!data.introDone;
    (data.stickers || []).forEach(id => STICKERS.some(x => x.id === id) && state.stickers.add(id));
    if (data.prevScreen) state.prevScreen = data.prevScreen;
    if (data.screen && (data.screen === 'cover' || data.screen === 'toc' || data.screen === 'album' || (data.sid && story(data.sid)))) {
      state.screen = data.screen; state.sid = data.sid || null; state.page = data.page || 0;
      if (state.sid) { const st = story(state.sid); if (!st || state.page >= st.pages.length) { state.screen = 'toc'; state.page = 0; } }
    }
    render();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(snapshot); } catch (e) { /* ohne Vorschau-Update */ } }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

  window.ZeitApp = { state, items, allStories, choose, go, openStory, openAlbum, stickerCode, readStickerCode, STICKERS };
})();

</script>

</body>
</html>
