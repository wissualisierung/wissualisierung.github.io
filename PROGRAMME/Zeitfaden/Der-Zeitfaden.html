<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Der Zeitfaden</title>
<style>
/* Layout: ein aufgeschlagenes Pixel-Märchenbuch auf einem Dämmerungs-Schreibtisch.
   Breit: Bildseite links, Textseite rechts. Hoch: Bild oben, Text darunter. Die Kartenablage liegt unten wie ein Lesebändchen. */
:root {
  --desk: #c9c3f0;
  --desk-deep: #a69fe0;
  --star: rgba(255, 255, 255, 0.55);
  --paper: #fdfaff;
  --paper-2: #f2ecfb;
  --ink: #3b3355;
  --ink-soft: #6b6287;
  --curse: #dedae8;
  --curse-ink: #675f80;
  --fairy: #7a5cd6;
  --fairy-tint: #ebe4ff;
  --gold: #f8d35a;
  --ok: #3f9a7d;
  --warn-tint: #fff1e6;
  --shadow: rgba(59, 51, 85, 0.28);

  --t-praes: #a8e8cf;
  --t-praet: #f8b9cb;
  --t-perf: #d2bff5;
  --t-plusq: #ffcda9;
  --t-fut1: #fce792;
  --t-fut2: #acd8f6;
  --t-none: #e8e3f2;

  /* Nur Systemschriften: nichts wird aus dem Internet geladen. Die Pixelschrift ist selbst gezeichnet und eingebettet. */
  --font-text: Verdana, "Segoe UI", Tahoma, "Trebuchet MS", system-ui, -apple-system, Roboto, "Noto Sans", "DejaVu Sans", sans-serif;
  --font-ui: Verdana, "Segoe UI", Tahoma, "Trebuchet MS", system-ui, -apple-system, Roboto, "Noto Sans", "DejaVu Sans", sans-serif;

  --fs: clamp(17px, max(1.1vw + 1.05vh, 2.3vh), 40px);
  --b: clamp(2px, 0.28vmin, 4px);
  --gap: clamp(10px, 1.6vmin, 24px);
  color-scheme: light;
}

html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--desk);
  background-image:
    radial-gradient(var(--star) 1px, transparent 1.6px),
    radial-gradient(var(--star) 1px, transparent 1.6px);
  background-size: 46px 46px, 71px 71px;
  background-position: 0 0, 23px 31px;
  color: var(--ink);
  font-family: var(--font-text);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
:fullscreen body, body:fullscreen { background-color: var(--desk); }

button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px dashed var(--fairy); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Pixelrahmen: vier Schatten ohne Ecken ergeben die gestuften Ecken */
.px {
  background: var(--paper);
  box-shadow:
    0 calc(-1 * var(--b)) 0 0 var(--ink),
    0 var(--b) 0 0 var(--ink),
    calc(-1 * var(--b)) 0 0 0 var(--ink),
    var(--b) 0 0 0 var(--ink),
    calc(2 * var(--b)) calc(3 * var(--b)) 0 0 var(--shadow),
    calc(3 * var(--b)) calc(2 * var(--b)) 0 0 var(--shadow);
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-inline: max(var(--gap), env(safe-area-inset-left, 0px)) max(var(--gap), env(safe-area-inset-right, 0px));
  padding-block: 0 max(var(--gap), env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
}

/* ---------- Kopfleiste ---------- */
.bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: calc(var(--gap) * 0.6);
  padding-block: max(calc(var(--gap) * 0.7), env(safe-area-inset-top, 0px)) calc(var(--gap) * 0.7);
  min-height: 44px;
  font-family: var(--font-ui);
}
.bar .where {
  flex: 1;
  min-width: 0;
  text-align: center;
  font-weight: 700;
  font-size: clamp(14px, 0.7vw + 0.7vh, 22px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar .where small { font-weight: 400; color: var(--ink-soft); margin-left: 0.5em; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45em;
  min-height: 44px;
  min-width: 44px;
  padding: 0.35em 0.8em;
  border: 0;
  font-weight: 700;
  font-size: clamp(14px, 0.6vw + 0.7vh, 20px);
  background: var(--paper);
  transition: transform 0.08s ease;
}
.btn.px:active { transform: translate(var(--b), var(--b)); }
.btn svg { width: 1.25em; height: 1.25em; flex: none; shape-rendering: crispEdges; }
.btn.icon { padding-inline: 0.55em; }
.btn .lbl { white-space: nowrap; }
.btn.primary { background: var(--gold); }
.btn.fairy { background: var(--fairy); color: #fff; }
.btn.quiet { background: var(--paper-2); }
.stage-chip { background: var(--fairy-tint); }
@media (max-width: 760px) {
  .bar .lbl { display: none; }
  .bar .stage-chip { display: none; }
  .bar .where small { display: none; }
}

main#screen { flex: 1; min-height: 0; position: relative; }

/* ---------- Titelbild ---------- */
.cover {
  height: 100%;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
}
.cover .cover-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  image-rendering: pixelated;
}
.cover .cover-inner {
  position: relative;
  display: grid;
  justify-items: center;
  gap: calc(var(--gap) * 1.2);
  padding: var(--gap);
  text-align: center;
  margin-top: -14vh;
}
.pixeltitle { image-rendering: pixelated; display: block; height: auto; }
.cover .pixeltitle { width: min(88vw, 900px); }
.cover p {
  margin: 0;
  color: #fff;
  font-size: clamp(16px, 1vw + 1.1vh, 30px);
  max-width: 30ch;
  text-shadow: 2px 2px 0 var(--ink);
  text-wrap: balance;
}
.cover .btn { font-size: clamp(18px, 1vw + 1.3vh, 34px); padding: 0.5em 1.4em; }

/* ---------- Inhaltsverzeichnis ---------- */
.toc { height: 100%; overflow: auto; padding: var(--b) calc(var(--b) * 3) calc(var(--gap) * 2); box-sizing: border-box; }
.toc-head { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); flex-wrap: wrap; margin-bottom: var(--gap); }
.toc-head .pixeltitle { height: clamp(28px, 6vmin, 64px); width: auto; }
.toc-head p { margin: 0; color: var(--ink-soft); font-size: clamp(14px, 0.6vw + 0.8vh, 20px); }
.toc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, clamp(220px, 22vw, 340px)), 1fr));
  gap: calc(var(--gap) * 1.4);
  padding: var(--b);
}
.story {
  display: grid;
  grid-template-rows: auto auto;
  text-align: left;
  border: 0;
  padding: 0;
  overflow: visible;
}
.story canvas { width: 100%; aspect-ratio: 16 / 9; display: block; image-rendering: pixelated; transition: filter 0.6s ease; }
.story .info { padding: 0.7em 0.9em 0.9em; display: grid; gap: 0.45em; }
.story h3 { margin: 0; font-size: clamp(16px, 0.7vw + 0.9vh, 24px); text-wrap: balance; }
.story .meta { font-size: clamp(13px, 0.5vw + 0.6vh, 17px); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.meter { height: 10px; background: var(--curse); display: flex; }
.meter i { display: block; height: 100%; background: var(--fairy); }
.story.done .meter i { background: var(--ok); }
.badge { justify-self: start; font-size: 0.8em; font-weight: 700; padding: 0.15em 0.5em; background: var(--t-praes); }
.story.frame .badge { background: var(--fairy-tint); }

/* ---------- Buchseite ---------- */
.page {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  gap: calc(var(--gap) * 1.4);
  padding: var(--b) calc(var(--b) * 3) calc(var(--b) * 3);
  box-sizing: border-box;
}
.pic {
  margin: 0;
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  min-height: 0;
}
.pic canvas {
  display: block;
  width: 100%;
  max-width: 100%;
  image-rendering: pixelated;
  transition: filter 0.9s ease;
}
.pic .sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.spark {
  position: absolute;
  width: 1.2%;
  aspect-ratio: 1;
  background: var(--gold);
  box-shadow: 0 0 0 2px #fff;
  animation: spark 1.4s steps(6) forwards;
}
@keyframes spark {
  0% { transform: translateY(0) scale(0.2); opacity: 0; }
  20% { opacity: 1; transform: translateY(-20%) scale(1); }
  100% { transform: translateY(-260%) scale(0.4); opacity: 0; }
}

.textcol {
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: calc(var(--gap) * 1.1);
}
.stack {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(var(--gap) * 1.1);
}
.text {
  flex: 0 1 auto;
  min-height: 0;
  overflow: auto;
  padding: calc(var(--fs) * 0.9) calc(var(--fs) * 1.05);
  font-size: var(--fs);
  line-height: 1.85;
  hyphens: manual;
}
.text p { margin: 0 0 0.6em; max-width: 34em; }
.text p:last-child { margin-bottom: 0; }
.text .heading { display: block; margin-bottom: 0.4em; }
.text .heading canvas { height: calc(var(--fs) * 1.25); width: auto; image-rendering: pixelated; }

.verb {
  display: inline;
  border: 0;
  margin: 0 0.04em;
  padding: 0.1em 0.32em;
  font: inherit;
  line-height: 1.2;
  border-radius: 0;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
  vertical-align: baseline;
}
.verb.cursed {
  background: var(--curse);
  color: var(--curse-ink);
  box-shadow: inset 0 calc(-0.12em) 0 #c9c3d8;
  animation: cursed 3.2s ease-in-out infinite;
}
.verb.cursed.gap { letter-spacing: 0.08em; }
.verb.cursed:hover { background: #d3cde3; }
.verb.sel {
  background: var(--fairy-tint);
  color: var(--ink);
  box-shadow: inset 0 0 0 0.12em var(--fairy);
  animation: none;
}
.verb.done {
  color: var(--ink);
  font-weight: 700;
  background: var(--tc, var(--t-none));
  box-shadow: inset 0 calc(-0.12em) 0 rgba(59, 51, 85, 0.22);
}
.verb.pop { animation: pop 0.45s steps(4); }
@keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes cursed { 0%, 100% { background-color: var(--curse); } 50% { background-color: #e9e6f0; } }
.t-praes { --tc: var(--t-praes); } .t-praet { --tc: var(--t-praet); } .t-perf { --tc: var(--t-perf); }
.t-plusq { --tc: var(--t-plusq); } .t-fut1 { --tc: var(--t-fut1); } .t-fut2 { --tc: var(--t-fut2); }

.tip {
  position: fixed;
  z-index: 40;
  padding: 0.25em 0.6em;
  font-weight: 700;
  font-size: clamp(14px, 0.5vw + 0.9vh, 22px);
  background: var(--ink);
  color: #fff;
  pointer-events: none;
  transform: translate(-50%, calc(-100% - 8px));
  white-space: nowrap;
}

/* Kartenablage */
.tray {
  flex: none;
  padding: calc(var(--fs) * 0.7) calc(var(--fs) * 0.8);
  display: grid;
  gap: calc(var(--fs) * 0.55);
  background: var(--paper-2);
  font-size: var(--fs);
}
.tray .prompt { margin: 0; font-size: 0.82em; color: var(--ink-soft); display: flex; align-items: center; gap: 0.5em; min-height: 1.6em; }
.tray .prompt b { color: var(--ink); }
.tray .prompt svg { width: 1.3em; height: 1.3em; flex: none; shape-rendering: crispEdges; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--fs) * 0.6); }
.card {
  border: 0;
  min-height: max(56px, 2.4em);
  padding: 0.3em 0.4em;
  font-weight: 700;
  font-size: 1em;
  line-height: 1.15;
  background: var(--paper);
  overflow-wrap: anywhere;
  transition: transform 0.08s ease;
}
.card:hover:not(:disabled) { background: var(--fairy-tint); }
.card:active:not(:disabled) { transform: translate(var(--b), var(--b)); }
.card:disabled { opacity: 0.45; background: var(--curse); }
.card.right { background: var(--t-praes); opacity: 1; }
.card.shake { animation: shake 0.4s steps(6); }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8%); } 40% { transform: translateX(7%); } 60% { transform: translateX(-5%); } 80% { transform: translateX(3%); } }
.note {
  margin: 0;
  font-size: 0.78em;
  line-height: 1.4;
  padding: 0.5em 0.7em;
  background: var(--warn-tint);
  box-shadow: inset calc(var(--b) * 1.5) 0 0 #f2a477;
}
.note.good { background: #e3f7ee; box-shadow: inset calc(var(--b) * 1.5) 0 0 var(--ok); }
.note.reveal { background: var(--fairy-tint); box-shadow: inset calc(var(--b) * 1.5) 0 0 var(--fairy); }
.tray-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6em; min-width: 0; }
.tray-head .prompt, .tray-head .result { flex: 1 1 auto; min-width: 0; }
.count {
  flex: none;
  font-size: 0.6em;
  font-weight: 700;
  color: var(--ink-soft);
  padding: 0.15em 0.55em;
  background: var(--paper);
  box-shadow: inset 0 0 0 2px var(--curse);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.result { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 0.25em 0.5em; font-size: 0.82em; color: var(--ok); }
.result.reveal { color: var(--fairy); }
.result b { color: var(--ink); }
.result svg { width: 1.2em; height: 1.2em; flex: none; shape-rendering: crispEdges; }
.tchip { font-size: 0.85em; font-weight: 700; color: var(--ink); padding: 0.05em 0.45em; background: var(--tc); }
.kicker { font-size: 0.62em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fairy); }
.info {
  display: grid;
  gap: 0.2em;
  font-size: 0.74em;
  line-height: 1.42;
  padding: 0.5em 0.75em;
  background: var(--paper);
  box-shadow: inset calc(var(--b) * 1.5) 0 0 var(--t-perf);
}
.info .kicker { font-size: 0.82em; }
.info .forms { font-weight: 700; }
.info p { margin: 0; max-width: 60ch; }
.legend { display: flex; flex-wrap: wrap; gap: 0.35em 0.5em; font-size: 0.62em; color: var(--ink-soft); }
.legend span { padding: 0.1em 0.45em; background: var(--tc); color: var(--ink); font-weight: 700; }
.done-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6em; flex-wrap: wrap; }
.done-row p { margin: 0; font-weight: 700; }
.done-row .btn { font-size: 0.9em; }

.pager { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }
.pager .count { font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: clamp(14px, 0.6vw + 0.7vh, 20px); }
.btn.glow { background: var(--gold); animation: glow 1.2s steps(2) infinite; }
@keyframes glow { 50% { background: #fff3b8; } }

/* Hochformat und schmale Fenster: Bild oben */
@media (max-aspect-ratio: 5/4), (max-width: 720px) {
  .page { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: var(--gap); }
  .pic { height: auto; }
  .stack { justify-content: flex-start; }
  .text { padding: 0.7em 0.85em; }
}
@media (max-width: 480px) {
  .info { font-size: 0.7em; padding: 0.4em 0.6em; }
  .cards { gap: 0.4em; }
  .card { font-size: 0.92em; }
}

/* ---------- Abschlussseite ---------- */
.finish { height: 100%; display: grid; place-items: center; overflow: auto; }
.finish .box { padding: calc(var(--gap) * 1.6); display: grid; gap: var(--gap); justify-items: center; text-align: center; max-width: min(92vw, 780px); }
.finish canvas.thumb { width: min(80vw, 560px); aspect-ratio: 16 / 9; image-rendering: pixelated; }
.finish .pixeltitle { height: clamp(30px, 7vmin, 64px); width: auto; max-width: 100%; }
.finish p { margin: 0; font-size: clamp(16px, 0.8vw + 1vh, 26px); text-wrap: balance; }
.finish .row { display: flex; gap: var(--gap); flex-wrap: wrap; justify-content: center; }

/* ---------- Lehrkraft-Menü ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(44, 38, 72, 0.55);
  display: grid;
  place-items: center;
  padding: var(--gap);
}
.panel {
  width: min(100%, 760px);
  max-height: calc(100% - 2 * var(--gap));
  overflow: auto;
  padding: calc(var(--gap) * 1.2) calc(var(--gap) * 1.4);
  box-sizing: border-box;
  font-size: clamp(15px, 0.4vw + 0.8vh, 19px);
  line-height: 1.5;
}
.panel header { display: flex; align-items: center; justify-content: space-between; gap: 1em; margin-bottom: 0.4em; }
.panel h2 { margin: 0; font-size: 1.4em; }
.panel h3 { margin: 1.4em 0 0.5em; font-size: 1.05em; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.panel p { margin: 0.3em 0 0.6em; max-width: 62ch; }
.stages { display: grid; gap: 0.6em; }
.stage-opt { display: grid; grid-template-columns: auto 1fr; gap: 0.2em 0.8em; align-items: center; padding: 0.6em 0.8em; background: var(--paper-2); cursor: pointer; }
.stage-opt input { width: 1.3em; height: 1.3em; accent-color: var(--fairy); grid-row: span 2; }
.stage-opt b { font-size: 1.05em; }
.stage-opt span { color: var(--ink-soft); }
.stage-opt .chips { display: flex; flex-wrap: wrap; gap: 0.3em; grid-column: 2; }
.stage-opt .chips i { font-style: normal; font-size: 0.85em; font-weight: 700; padding: 0.05em 0.45em; background: var(--tc); }
.switch { display: flex; align-items: center; gap: 0.7em; cursor: pointer; }
.switch input { width: 1.3em; height: 1.3em; accent-color: var(--fairy); }
.panel textarea {
  width: 100%;
  min-height: 9em;
  box-sizing: border-box;
  font: 0.9em/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
  padding: 0.6em;
  border: var(--b) solid var(--ink);
  background: #fff;
  color: var(--ink);
  resize: vertical;
}
.row-btns { display: flex; gap: 0.7em; flex-wrap: wrap; margin-top: 0.6em; align-items: center; }
.panel pre { background: var(--paper-2); padding: 0.7em 0.8em; overflow-x: auto; font-size: 0.85em; line-height: 1.45; margin: 0.4em 0; white-space: pre-wrap; }
.report { padding: 0.6em 0.8em; background: var(--paper-2); margin-top: 0.6em; }
.report.err { background: var(--warn-tint); }
.report ul { margin: 0.3em 0 0; padding-left: 1.2em; }
.custom-list { list-style: none; padding: 0; margin: 0.6em 0 0; display: grid; gap: 0.4em; }
.custom-list li { display: flex; justify-content: space-between; align-items: center; gap: 0.6em; padding: 0.3em 0.6em; background: var(--paper-2); }
.check-wrap { overflow-x: auto; margin-top: 0.6em; }
.check { border-collapse: collapse; width: 100%; font-size: 0.88em; }
.check th, .check td { text-align: left; padding: 0.3em 0.5em; border-bottom: 1px solid var(--curse); vertical-align: top; }
.check th { background: var(--paper-2); }
.check td.t span { display: inline-block; padding: 0 0.35em; background: var(--tc); font-weight: 700; }
.panel select { font: inherit; padding: 0.35em 0.5em; border: var(--b) solid var(--ink); background: #fff; color: var(--ink); max-width: 100%; }
.panel .small { font-size: 0.88em; color: var(--ink-soft); }

/* ---------- Stickeralbum ---------- */
.album-btn .num {
  font-size: 0.78em;
  min-width: 1.4em;
  padding: 0 0.3em;
  background: var(--gold);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.album { height: 100%; overflow: auto; padding: var(--b) calc(var(--b) * 3) calc(var(--gap) * 2); box-sizing: border-box; display: grid; gap: calc(var(--gap) * 1.6); align-content: start; }
.album .toc-head { margin-bottom: 0; }
.album-page { padding: calc(var(--gap) * 1) calc(var(--gap) * 1.2) calc(var(--gap) * 1.2); background: var(--paper); }
.album-head { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
.album-head h2 { margin: 0; font-size: clamp(17px, 0.6vw + 1vh, 26px); }
.album-head .count { font-size: clamp(13px, 0.4vw + 0.7vh, 17px); }
.album-page > .small { margin: 0.3em 0 0.9em; color: var(--ink-soft); font-size: clamp(13px, 0.4vw + 0.7vh, 17px); }

    const te = (!isElEr(inf) && needsE(stem)) ? 'ete' : 'te';
    const b = stem + te;
    return [b, b + 'st', b, b + 'n', b + 't', b + 'n'];
  }
  function weakP2(inf, stem, noGe) {
    const t = (!isElEr(inf) && needsE(stem)) ? 'et' : 't';
    return (noGe ? '' : 'ge') + stem + t;
  }

  function untrennbarPrefix(inf) {
    if (NOT_PREFIXED.has(inf)) return '';
    for (const p of UNTRENNBAR) {
      if (inf.startsWith(p) && inf.length - p.length >= 4) {
        const rest = inf.slice(p.length);
        if (!isVowel(rest[0]) || p === 'miss' || p === 'ent' || p === 'emp') return p;
        if (p === 'ver' || p === 'zer' || p === 'er' || p === 'be') return p; // verabreden, erarbeiten, beobachten
      }
    }
    return '';
  }

  /* ---------- Lesarten ---------- */
  function auxSetOf(code) { return code === 'hs' ? ['h', 's'] : code === 'sh' ? ['s', 'h'] : [code]; }

  function buildDirect(inf) {
    if (IRREG[inf]) {
      const d = IRREG[inf];
      return {
        inf, base: inf, particle: '', prefix: '', kind: d.kind, stem: stemOf(inf),
        pres: d.pres.slice(), praetForms: praetStrong(d.praet), praet1: d.praet, p2: d.p2,
        auxSet: auxSetOf(d.aux), auxKnown: true, vowelChange: false, untrennbar: false, ieren: false
      };
    }
    if (STRONG[inf]) {
      const d = STRONG[inf];
      const stem = stemOf(inf);
      const pres = presRegular(inf, stem);
      let vowelChange = false;
      if (d.p3) { pres[2] = d.p3; pres[1] = du2From3(d.p3, stem); vowelChange = true; }
      const kind = /te$/.test(d.praet) ? 'mixed' : 'strong';
      const r = {
        inf, base: inf, particle: '', prefix: '', kind, stem, pres, praetForms: praetStrong(d.praet), praet1: d.praet,
        p2: d.p2, auxSet: auxSetOf(d.aux), auxKnown: true, vowelChange, untrennbar: !!untrennbarPrefix(inf) && !/^ge/.test(d.p2),
        ieren: false, alt: ALT[inf] || null
      };
      return r;
    }
    return null;
  }

  function buildUntrennbarStrong(inf) {
    const pre = untrennbarPrefix(inf);
    if (!pre) return null;
    const baseInf = inf.slice(pre.length);
    const b = buildDirect(baseInf);
    if (!b || b.kind === 'modal') return null;
    const r = Object.assign({}, b);
    r.inf = inf; r.base = baseInf; r.prefix = pre; r.untrennbar = true;
    r.stem = pre + b.stem;
    r.pres = b.pres.map(f => pre + f);
    r.praetForms = b.praetForms.map(f => pre + f);
    r.praet1 = pre + b.praet1;
    r.p2 = pre + b.p2.replace(/^ge/, '');
    const ex = DERIVED_AUX[inf];
    r.auxSet = ex ? auxSetOf(ex) : ['h', 's'];
    r.auxKnown = !!ex;
    r.alt = null;
    return r;
  }

  function buildWeak(inf) {
    const stem = stemOf(inf);
    const ieren = /ieren$/.test(inf);
    // Als Ganzes gelesene Verben mit um-, über-, unter-, durch-, wider- sind untrennbar: umarmt, übersetzt
    const amb = ['wider', 'durch', 'unter', 'über', 'um'].find(p => inf.startsWith(p) && inf.length - p.length >= 4);
    const pre = untrennbarPrefix(inf) || amb || '';
    const auxCode = WEAK_AUX[inf] || DERIVED_AUX[inf];
    return {
      inf, base: inf, particle: '', prefix: pre, kind: 'weak', stem,
      pres: presRegular(inf, stem), praetForms: praetWeak(inf, stem), praet1: praetWeak(inf, stem)[0],
      p2: weakP2(inf, stem, !!pre || ieren),
      auxSet: auxCode ? auxSetOf(auxCode) : ['h', 's'], auxKnown: !!auxCode, auxDefault: auxCode ? null : 'h',
      vowelChange: false, untrennbar: !!pre, ieren
    };
  }

  function withParticle(b, pt, inf) {
    const r = Object.assign({}, b);
    r.inf = inf; r.particle = pt; r.base = b.inf;
    r.p2 = pt + b.p2;
    const ex = DERIVED_AUX[inf];
    if (ex) { r.auxSet = auxSetOf(ex); r.auxKnown = true; }
    else { r.auxSet = ['h', 's']; r.auxKnown = false; }
    r.alt = b.alt;
    return r;
  }

  function baseReading(base) {
    return buildDirect(base) || buildUntrennbarStrong(base) || (KNOWN_WEAK.has(base) ? buildWeak(base) : null);
  }

  const readingCache = new Map();
  function readings(infRaw) {
    const key = infRaw;
    if (readingCache.has(key)) return readingCache.get(key);
    let inf = infRaw.trim().toLowerCase();
    const out = [];
    if (inf.includes('+')) {
      const [pt, base] = inf.split('+');
      inf = pt + base;
      const b = buildDirect(base) || buildUntrennbarStrong(base) || buildWeak(base);
      out.push(withParticle(b, pt, inf));
    } else {
      const direct = buildDirect(inf);
      if (direct) out.push(direct);
      else {
        const clear = [], ambig = [];
        for (const pt of PARTICLES_CLEAR) {
          if (inf.startsWith(pt) && inf.length - pt.length >= 3) {
            const b = baseReading(inf.slice(pt.length));
            if (b) clear.push(withParticle(b, pt, inf));
          }
        }
        for (const pt of PARTICLES_AMBIG) {
          if (inf.startsWith(pt) && inf.length - pt.length >= 3) {
            const b = baseReading(inf.slice(pt.length));
            if (b) ambig.push(withParticle(b, pt, inf));
          }
        }
        out.push(...clear);
        const u = buildUntrennbarStrong(inf);
        if (u) out.push(u);
        out.push(buildWeak(inf));
        out.push(...ambig);
        // Zuletzt: trennbare Lesart mit unbekanntem schwachem Grundverb (z. B. herausstrecken)
        for (const pt of PARTICLES_CLEAR) {
          const base = inf.slice(pt.length);
          if (inf.startsWith(pt) && base.length >= 4 && /(en|ern|eln)$/.test(base) && !clear.some(r => r.particle === pt)) {
            out.push(withParticle(buildWeak(base), pt, inf));
          }
        }
      }
    }
    out.forEach(r => { r.cells = paradigm(r); });
    readingCache.set(key, out);
    return out;
  }

  /* ---------- Paradigma ---------- */
  const AUX = {
    h: { pres: IRREG.haben.pres, praet: praetStrong('hatte'), inf: 'haben' },
    s: { pres: IRREG.sein.pres, praet: praetStrong('war'), inf: 'sein' }
  };
  const WERDEN = IRREG.werden.pres;

  function simpleVariants(r, form, alt) {
    if (r.particle) {
      return [{ vals: [form, r.particle], split: true, alt }, { vals: [r.particle + form], joined: true, alt }];
    }
    return [{ vals: [form], alt }];
  }

  function paradigm(r) {
    const cells = {};
    TENSES.forEach(t => { cells[t] = [[], [], [], [], [], []]; });
    for (let p = 0; p < 6; p++) {
      cells.praes[p].push(...simpleVariants(r, r.pres[p], false));
      cells.praet[p].push(...simpleVariants(r, r.praetForms[p], false));
      if (r.alt && r.alt.p3 && (p === 2)) cells.praes[p].push(...simpleVariants(r, r.alt.p3, true));
      if (r.alt && r.alt.p3 && (p === 1)) cells.praes[p].push(...simpleVariants(r, du2From3(r.alt.p3, r.stem), true));
      if (r.alt && r.alt.praet) cells.praet[p].push(...simpleVariants(r, praetStrong(r.alt.praet)[p], true));
      // Präteritum 2. Person: „du last“ neben „du lasest“
      if (p === 1 && r.kind === 'strong' && sibilant(r.praet1)) cells.praet[p].push(...simpleVariants(r, r.praet1 + 't', true));
      r.auxSet.forEach((a, i) => {
        const alt = i > 0;
        cells.perf[p].push({ vals: [AUX[a].pres[p], r.p2], aux: a, alt });
        cells.plusq[p].push({ vals: [AUX[a].praet[p], r.p2], aux: a, alt });
        cells.fut2[p].push({ vals: [WERDEN[p], r.p2, AUX[a].inf], aux: a, alt });
      });
      cells.fut1[p].push({ vals: [WERDEN[p], r.inf] });
    }
    return cells;
  }

  /* ---------- Erkennen ---------- */
  const lc = s => s.toLowerCase();
  const sig = arr => arr.map(lc).slice().sort().join('|');

  function isSubMultiset(small, big) {
    const pool = big.map(lc);
    for (const s of small.map(lc)) {
      const i = pool.indexOf(s);
      if (i < 0) return false;
      pool.splice(i, 1);
    }
    return true;
  }

  // Passen diese Teile zu irgendeiner Form des Verbs? (für die Zuordnung abgetrennter Teile)
  function partialFits(inf, parts) {
    for (const r of readings(inf)) {
      for (const t of TENSES) for (let p = 0; p < 6; p++) {
        for (const v of r.cells[t][p]) if (v.vals.length >= parts.length && isSubMultiset(parts, v.vals)) return true;
      }
    }
    return false;
  }

  function identify(inf, slotsText) {
    const s = sig(slotsText);
    for (const r of readings(inf)) {
      let found = null;
      for (const t of TENSES) {
        const persons = [];
        let variant = null;
        for (let p = 0; p < 6; p++) {
          for (const v of r.cells[t][p]) {
            if (v.vals.length === slotsText.length && sig(v.vals) === s) {
              persons.push(p);
              if (!variant || (variant.alt && !v.alt)) variant = v;
              break;
            }
          }
        }
        if (persons.length) { found = { reading: r, tense: t, persons, variant }; break; }
      }
      if (found) return found;
    }
    return null;
  }

  /* ---------- Ablenker ---------- */
  const PARTNER = { praes: 'praet', praet: 'praes', perf: 'plusq', plusq: 'perf', fut1: 'perf', fut2: null };
  const PERSON_PREF = [[2, 1, 3], [2, 0, 4], [1, 5, 0], [2, 4, 1], [1, 3, 2], [2, 4, 1]];

  function sameShape(a, b) { return a.vals.length === b.vals.length && !!a.joined === !!b.joined && !!a.split === !!b.split; }

  function personsOf(r, t, vals) {
    const s = sig(vals), out = [];
    for (let p = 0; p < 6; p++) if (r.cells[t][p].some(v => sig(v.vals) === s)) out.push(p);
    return out;
  }
  function personLabel(ps) {
    const names = ps.map(p => PERSONS[p] === 'sie' ? 'sie (Plural)' : PERSONS[p]);
    if (names.length <= 1) return names[0] || '';
    return names.slice(0, -1).join(', ') + ' oder ' + names[names.length - 1];
  }
  const q = s => '„' + s + '“';
  const EXAMPLE_E = inf => (inf === 'reden' ? 'du arbeitest' : 'du redest');

  function errorCandidates(r, t, p, V) {
    const out = [];
    const shapeFin = f => {
      if (V.joined) return [r.particle + f];
      if (V.split) return [f, r.particle];
      return [f];
    };
    const inf = r.inf;
    if (t === 'praes') {
      if (r.vowelChange && (p === 1 || p === 2)) {
        const f = presRegular(r.particle ? r.base : r.inf, r.stem)[p];
        out.push({ vals: shapeFin(f), type: 'vokal', fb: `Bei ${q(inf)} ändert sich in der du- und er/sie/es-Form der Stammvokal.` });
      }
      if (p === 1 && !r.vowelChange && (r.kind === 'weak' || r.kind === 'strong' || r.kind === 'mixed') && needsE(r.stem) && !isElEr(r.base)) {
        out.push({ vals: shapeFin(r.stem + 'st'), type: 'eEinschub', fb: `Endet der Stamm auf -d, -t oder auf -m/-n nach einem Mitlaut, kommt ein -e- dazu: ${EXAMPLE_E(inf)}.` });
      }
    }
    if (t === 'praet') {
      if (r.kind === 'strong') {
        out.push({ vals: shapeFin(praetWeak(r.base, r.stem)[p]), type: 'stark', fb: `${q(inf)} ist ein starkes Verb: Im Präteritum ändert sich der Stammvokal, und es gibt kein -te.` });
      } else if (r.kind === 'mixed') {
        out.push({ vals: shapeFin(praetWeak(r.base, r.stem)[p]), type: 'gemischt', fb: `${q(inf)} ist ein gemischtes Verb: Der Stamm ändert sich, und trotzdem kommt -te dazu.` });
      } else if (r.base === 'haben') {
        out.push({ vals: shapeFin(praetWeak('haben', 'hab')[p]), type: 'unregel', fb: `${q('haben')} ist unregelmäßig: Im Präteritum heißt der Stamm hatt-.` });
      }
    }
    const p2Errors = () => {
      const res = [];
      if (r.kind === 'strong' || r.kind === 'mixed') {
        let wp;
        if (r.particle) wp = r.particle + 'ge' + stemOf(r.base) + (needsE(stemOf(r.base)) ? 'et' : 't');
        else wp = (r.untrennbar ? '' : 'ge') + r.stem + (needsE(r.stem) ? 'et' : 't');
        if (r.base !== 'sein' && r.base !== 'werden') {
          res.push({ p2: wp, type: r.kind === 'strong' ? 'partizipStark' : 'partizipGemischt',
            fb: r.kind === 'strong'
              ? `${q(inf)} ist ein starkes Verb: Das Partizip II endet auf -en, oft mit anderem Stammvokal.`
              : `${q(inf)} ist ein gemischtes Verb: Das Partizip II hat einen neuen Stamm und endet auf -t.` });
        }
      }
      if (r.particle) {
        const rest = r.p2.slice(r.particle.length).replace(/^ge/, '');
        res.push({ p2: 'ge' + r.particle + rest, type: 'geTrennbar', fb: 'Bei trennbaren Verben steht ge- zwischen Vorsilbe und Stamm.' });
      } else if (r.ieren) {
        res.push({ p2: 'ge' + r.p2, type: 'ieren', fb: 'Verben auf -ieren bekommen im Partizip II kein ge-.' });
      } else if (r.untrennbar) {
        res.push({ p2: 'ge' + r.p2, type: 'geVorsilbe', fb: 'Verben mit be-, ge-, er-, ver-, zer-, ent-, emp- oder miss- bekommen im Partizip II kein ge-.' });
      }
      return res;
    };
    const auxIsS = r.auxKnown && r.auxSet.length === 1 && r.auxSet[0] === 's';
    const auxFb = ['sein', 'werden', 'bleiben'].includes(r.base)
      ? `${q('sein')}, ${q('werden')} und ${q('bleiben')} bilden Perfekt und Plusquamperfekt mit ${q('sein')}.`
      : `${q(inf)} beschreibt eine Bewegung oder Veränderung. Dann steht ${q('sein')}.`;
    if (t === 'perf' || t === 'plusq') {
      if (auxIsS) {
        const f = t === 'perf' ? AUX.h.pres[p] : AUX.h.praet[p];
        out.push({ vals: [f, V.vals[1]], type: 'hilfsverb', fb: auxFb });
      }
      p2Errors().forEach(e => out.push({ vals: [V.vals[0], e.p2], type: e.type, fb: e.fb }));
    }
    if (t === 'fut1') {
      out.push({ vals: [V.vals[0], r.p2], type: 'futurInf', fb: `Das Futur I bildest du mit ${q('werden')} und dem Infinitiv.` });
    }
    if (t === 'fut2') {
      if (auxIsS) out.push({ vals: [V.vals[0], V.vals[1], 'haben'], type: 'hilfsverb', fb: auxFb });
      p2Errors().forEach(e => out.push({ vals: [V.vals[0], e.p2, V.vals[2]], type: e.type, fb: e.fb }));
      out.push({ vals: [V.vals[0], r.inf, V.vals[2]], type: 'futur2', fb: `Das Futur II bildest du mit ${q('werden')}, dem Partizip II und ${q('haben')} oder ${q('sein')}.` });
    }
    return out;
  }

  /* Baut aus einer Erkennung Kärtchen.
     slots: Texte der Teile in Textreihenfolge; adj: true, wenn Teil i und i+1 direkt nebeneinanderstehen. */
  function pickPerson(persons, sentenceWords, headNeighbours) {
    if (persons.length === 1) return persons[0];
    const pron = { 0: 'ich', 1: 'du', 3: 'wir' };
    for (const p of persons) if (pron[p] && sentenceWords.includes(pron[p])) return p;
    if (persons.includes(4) && headNeighbours.includes('ihr')) return 4;
    if (persons.includes(2)) return 2;
    if (persons.includes(5)) return 5;
    return persons[0];
  }

  function buildCards(found, slots, adj, p0) {
    const { reading: r, tense: t, persons, variant: V } = found;
    if (p0 === undefined || !persons.includes(p0)) p0 = persons[0];
    // Zuordnung Teil -> Position in V.vals
    const used = new Set();
    const slotRole = slots.map(s => {
      for (let j = 0; j < V.vals.length; j++) if (!used.has(j) && lc(V.vals[j]) === lc(s)) { used.add(j); return j; }
      return -1;
    });
    const toSlots = vals => slots.map((s, i) => {
      let v = vals[slotRole[i]];
      if (v && /^[A-ZÄÖÜ]/.test(s)) v = v[0].toUpperCase() + v.slice(1);
      return v;
    });
    const correctSig = sig(slots);
    const forbidden = new Set();
    persons.forEach(p => r.cells[t][p].forEach(v => forbidden.add(sig(v.vals))));
    forbidden.add(correctSig);
    const chosen = [];
    const ok = vals => {
      if (!vals || vals.some(v => !v)) return false;
      const sg = sig(vals);
      if (forbidden.has(sg)) return false;
      if (chosen.some(c => sig(c.vals) === sg)) return false;
      return true;
    };

    const errs = errorCandidates(r, t, p0, V);
    const otherPersonCands = () => {
      const pref = PERSON_PREF[p0].concat([0, 1, 2, 3, 4, 5]);
      const res = [];
      for (const p of pref) {
        if (persons.includes(p)) continue;
        const v = r.cells[t][p].find(w => sameShape(w, V) && !w.alt && (!V.aux || w.aux === V.aux));
        if (v && !res.some(x => sig(x.vals) === sig(v.vals))) {
          const ps = personsOf(r, t, v.vals);
          res.push({ vals: v.vals, type: 'person', fb: `${q(joinLabel(toSlots(v.vals), adj))} passt zu ${personLabel(ps)}. Schau, wer hier handelt.` });
        }
      }
      return res;
    };
    const otherTense = () => {
      const t2 = PARTNER[t];
      if (!t2) return null;
      const v = (V.aux && r.cells[t2][p0].find(w => sameShape(w, V) && w.aux === V.aux)) ||
        r.cells[t2][p0].find(w => sameShape(w, V) && !w.alt);
      if (!v) return null;
      return { vals: v.vals, type: 'tempus', fb: `${q(joinLabel(toSlots(v.vals), adj))} steht im ${TNAME[t2]}. Hier ist das ${TNAME[t]} gesucht.` };
    };

    const first = errs.find(e => ok(e.vals));
    if (first) chosen.push(first);
    const ot = otherTense();
    if (ot && ok(ot.vals)) chosen.push(ot);
    for (const c of otherPersonCands()) { if (chosen.length >= 2) break; if (ok(c.vals)) chosen.push(c); }
    for (const e of errs) { if (chosen.length >= 2) break; if (ok(e.vals)) chosen.push(e); }

    return chosen.slice(0, 2).map(c => ({ label: joinLabel(toSlots(c.vals), adj), type: c.type, feedback: c.fb }));
  }

  function joinLabel(parts, adj) {
    let s = parts[0] || '';
    for (let i = 1; i < parts.length; i++) s += (adj && adj[i - 1] ? ' ' : ' … ') + parts[i];
    return s;
  }

  /* ---------- Markdown ---------- */
  const SENT_END = /[.!?]/;
  const CLOSERS = '“”"»«‘’\')';

  function parseInline(text, ctx) {
    // Zerlegt einen Absatz in Text- und Klammerteile und merkt sich die Satznummer.
    const tokens = [];
    let sentence = 0, i = 0, buf = '';
    const flush = () => { if (buf) { tokens.push({ type: 'text', text: buf, sentence }); buf = ''; } };
    while (i < text.length) {
      const ch = text[i];
      if (ch === '{') {
        const j = text.indexOf('}', i);
        if (j < 0) { buf += ch; i++; continue; }
        flush();
        const inner = text.slice(i + 1, j);
        const parts = inner.split('|').map(s => s.trim());
        tokens.push({ type: 'brace', form: parts[0], inf: parts[1] || '', extra: parts.slice(2).filter(Boolean), sentence });
        i = j + 1;
        continue;
      }
      buf += ch;
      if (SENT_END.test(ch)) {
        const nx = text[i + 1];
        if (nx === undefined || /\s/.test(nx) || CLOSERS.includes(nx)) {
          // Schließende Anführungszeichen gehören noch zum Satz
          let k = i + 1;
          while (k < text.length && CLOSERS.includes(text[k])) { buf += text[k]; k++; }
          i = k;
          flush();
          sentence++;
          continue;
        }
      }
      i++;
    }
    flush();
    return tokens;
  }

  function groupItems(tokens) {
    const heads = [], bares = [];
    tokens.forEach((tk, idx) => {
      if (tk.type !== 'brace') return;
      if (tk.inf) heads.push({ idx, tk, parts: [idx] });
      else bares.push({ idx, tk });
    });
    for (const b of bares) {
      const same = heads.filter(h => h.tk.sentence === b.tk.sentence);
      const before = same.filter(h => h.idx < b.idx).sort((x, y) => y.idx - x.idx);
      const after = same.filter(h => h.idx > b.idx).sort((x, y) => x.idx - y.idx);
      const cands = before.concat(after);
      let target = null;
      for (const h of cands) {
        const parts = h.parts.map(k => tokens[k].form).concat([b.tk.form]);
        if (partialFits(h.tk.inf, parts)) { target = h; break; }
      }
      if (!target) target = cands[0] || null;
      if (target) { target.parts.push(b.idx); target.parts.sort((x, y) => x - y); }
      else { tokens[b.idx] = { type: 'text', text: b.tk.form, sentence: b.tk.sentence }; }
    }
    return heads;
  }

  function makeItem(heads, tokens, key, warnings) {
    const items = [];
    const sentWords = {};
    tokens.forEach(t => {
      const w = (t.type === 'text' ? t.text : t.form || '').toLowerCase().split(/[^a-zäöüß]+/).filter(Boolean);
      (sentWords[t.sentence] = sentWords[t.sentence] || []).push(...w);
    });
    heads.forEach((h, n) => {
      const order = h.parts;
      const slots = order.map(k => tokens[k].form);
      const adj = [];
      for (let i = 0; i + 1 < order.length; i++) {
        const between = tokens.slice(order[i] + 1, order[i + 1]);
        adj.push(between.every(t => t.type === 'text' && /^\s*$/.test(t.text)));
      }
      const inf = h.tk.inf;
      const item = { key: key + '.' + n, inf: inf.replace('+', ''), slots, adj, headPos: order.indexOf(h.idx) };
      let found = identify(inf, slots);
      if (!found && !inf.includes('+')) {
        // Abgetrennte Vorsilbe im Text, aber Infinitiv ohne sie angegeben: „{lief|laufen} … {fort}“
