:root{
  --paper:#F4EFFD;--ink:#2D2545;--ink-2:#5E5480;--shadow:#CDBDF0;
  --mint:#A6E3C8;--peach:#FFCBA9;--rose:#F6AECB;--sky:#AED6F3;--butter:#FFE99A;--lilac:#CDB9F4;
  --focus-bg:#FFFBEA;--desk:#E4F0FB;--desk-line:#D3E5F6;
  --px:3px;
  --pixel-border:0 calc(-1 * var(--px)) 0 0 var(--ink),0 var(--px) 0 0 var(--ink),calc(-1 * var(--px)) 0 0 0 var(--ink),var(--px) 0 0 0 var(--ink);
  --pixel-shadow:3px 9px 0 0 var(--shadow),9px 3px 0 0 var(--shadow),6px 6px 0 0 var(--shadow);
  --font-pixel:"Kachel",ui-monospace,monospace;
  --font-text:"Puzzle Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--ink);font:16px/1.4 var(--font-text)}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
svg{display:block;flex:none}

.bar{flex:none;display:flex;align-items:center;gap:10px 14px;padding:8px 14px;background:#fff;border-bottom:3px solid var(--ink);min-height:62px}
.bar .qtitle{font:400 20px/1.2 var(--font-pixel);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.grow{flex:1 1 0}
.chip{font:400 20px/1 var(--font-pixel);padding:8px 10px 7px;margin:var(--px);box-shadow:var(--pixel-border);white-space:nowrap}
.chip.progress{background:var(--lilac)}
.chip.points{background:var(--butter)}
.icon-btn{display:grid;place-items:center;width:46px;height:46px;margin:var(--px);border:0;padding:0;background:#fff;cursor:pointer;box-shadow:var(--pixel-border)}
.icon-btn:focus-visible,.btn:focus-visible,.ans:focus-visible,.tbtn:focus-visible{outline:3px dashed var(--ink);outline-offset:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;margin:var(--px);padding:14px 22px 13px;border:0;border-radius:0;background:var(--mint);font:400 24px/1 var(--font-pixel);cursor:pointer;white-space:nowrap;
  box-shadow:var(--pixel-border),inset -3px -4px 0 0 rgba(45,37,69,.14),inset 3px 3px 0 0 rgba(255,255,255,.6)}
.btn:active{transform:translateY(2px);box-shadow:var(--pixel-border),inset 3px 4px 0 0 rgba(45,37,69,.14)}
.btn.alt{background:var(--peach)}
.btn.quiet{background:#fff;font:700 16px/1 var(--font-text);padding:12px 14px}

main{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow:hidden}

/* Start */
.start{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.cover{max-width:min(520px,80vw);max-height:34vh;width:auto;height:auto;margin:var(--px);box-shadow:var(--pixel-border),var(--pixel-shadow);background:#fff}
.cover.pixel{image-rendering:pixelated;width:min(400px,72vw,calc(34vh * 1.6));height:auto}
.start h1{margin:10px 0 0;font:400 clamp(30px,5vw,56px)/1.1 var(--font-pixel);text-shadow:4px 4px 0 var(--rose)}
.start .intro{margin:0;max-width:56ch;font-size:clamp(16px,1.6vw,21px);color:var(--ink-2)}
.start .count{margin:0;font-weight:700}
.modes{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:10px}
.mode{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:230px;padding:18px 20px 16px;border:0;background:#fff;cursor:pointer;margin:var(--px);box-shadow:var(--pixel-border),var(--pixel-shadow)}
.mode:hover{background:var(--focus-bg)}
.mode:focus-visible{outline:3px dashed var(--ink);outline-offset:8px}
.mode strong{font:400 24px/1.2 var(--font-pixel)}
.mode span{font-size:15px;color:var(--ink-2)}
.team-pick{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.team-pick button{display:flex;align-items:center;gap:6px;padding:10px 14px;border:0;background:#fff;cursor:pointer;margin:var(--px);box-shadow:var(--pixel-border);font:400 24px/1 var(--font-pixel)}
.team-pick button[aria-pressed=true]{background:var(--butter)}
.team-preview{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;margin:10px 0}
.team-preview div{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}

/* Frage */
.q{display:grid;grid-template-rows:auto 16px minmax(0,1fr) auto auto;gap:12px;padding:12px 16px 14px}
.qbox{display:grid;place-items:center;min-height:clamp(64px,13vh,150px);max-height:22vh;padding:10px 20px;margin:var(--px);background:#fff;box-shadow:var(--pixel-border);text-align:center;overflow:hidden}
.qtext{font:700 34px/1.22 var(--font-text);max-width:60ch;overflow-wrap:break-word}
.timebar{margin:0 var(--px);background:#fff;box-shadow:var(--pixel-border)}
.timebar i{display:block;height:100%;background:var(--butter);transform-origin:left center}
.timebar.hurry i{background:var(--rose)}
.mid{display:grid;grid-template-columns:auto minmax(0,1fr) clamp(150px,19vw,280px);gap:16px;min-height:0;position:relative;align-items:center}
.timer{--ts:clamp(64px,min(11vw,15vh),160px);display:grid;place-items:center;width:var(--ts);height:var(--ts);background:var(--butter);margin:var(--px);box-shadow:var(--pixel-border),var(--pixel-shadow);font:400 calc(var(--ts) * .46)/1 var(--font-pixel)}
.timer.hurry{background:var(--rose)}
.timer.done{background:#fff}
.media{min-height:0;display:flex;align-items:center;justify-content:center}
.media img{max-width:100%;max-height:100%;object-fit:contain;margin:var(--px);box-shadow:var(--pixel-border);background:#fff}
.side{display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:12px;min-height:0}
.side .stat{padding:clamp(6px,1.2vh,12px);background:#fff;margin:var(--px);box-shadow:var(--pixel-border);text-align:center}
.side .stat b{display:block;font:400 clamp(20px,min(3vw,4.5vh),40px)/1.1 var(--font-pixel)}
.side .stat span{font-size:clamp(12px,1.6vh,14px);color:var(--ink-2)}
.side .btn{font-size:clamp(18px,min(2vw,3.2vh),24px);padding:clamp(8px,1.4vh,14px) 14px}
.side .btn{width:calc(100% - 6px)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.ans{position:relative;display:flex;align-items:center;gap:14px;min-height:clamp(50px,11vh,140px);min-width:0;margin:var(--px);padding:10px 16px;border:0;background:var(--c);text-align:left;cursor:pointer;
  box-shadow:var(--pixel-border),inset -4px -5px 0 0 rgba(45,37,69,.12);font:700 30px/1.2 var(--font-text);transition:opacity .2s steps(2),transform .12s steps(2)}
button.ans:not(:disabled):hover{transform:translateY(-2px)}
button.ans:not(:disabled):active{transform:translateY(2px)}
.ans .shape svg{width:clamp(26px,min(3.4vw,6vh),56px);height:auto}
.ans:disabled{cursor:default}
.ans .atext{min-width:0;overflow-wrap:normal;hyphens:manual}
.ans .atext.squeeze{overflow-wrap:anywhere}
.ans.dim{opacity:.33}
.ans.chosen{outline:5px dashed var(--ink);outline-offset:4px}
.ans .mark{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center}
.ans .ok{display:grid;place-items:center;width:38px;height:38px;background:#fff;box-shadow:0 0 0 3px var(--ink)}
.q.noimg{grid-template-rows:auto 16px auto minmax(0,1fr) auto}
.q.noimg .answers{grid-auto-rows:minmax(0,1fr)}
.q.noimg .ans{min-height:0}
.q.noimg .media{min-height:0;height:0}
.read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;background:var(--paper);z-index:5;text-align:center}
.read .rtext{font:700 48px/1.25 var(--font-text);max-width:30ch}
.read .rbar{width:min(520px,70vw);height:16px;background:#fff;box-shadow:var(--pixel-border)}
.read .rbar i{display:block;height:100%;background:var(--lilac);transform-origin:left center}
.read .rlabel{font:400 20px/1 var(--font-pixel);color:var(--ink-2)}
.mid>.timer{grid-column:1;grid-row:1}.mid>.media{grid-column:2;grid-row:1;align-self:stretch}.mid>.side{grid-column:3;grid-row:1;align-self:stretch}
.banner{grid-column:2;grid-row:1;justify-self:center;align-self:center;z-index:4;min-width:min(420px,100%);max-width:100%;pointer-events:none;padding:clamp(8px,1.6vh,16px) clamp(12px,2vw,24px);text-align:center;background:#fff;margin:var(--px);box-shadow:var(--pixel-border),var(--pixel-shadow)}
.banner.good{background:var(--mint)}
.banner.bad{background:var(--rose)}
.banner.late{background:var(--butter)}
.banner h2{margin:0;font:400 clamp(22px,min(4.5vw,6vh),56px)/1.1 var(--font-pixel)}
.banner p{margin:6px 0 0;font-size:clamp(14px,min(1.7vw,2.6vh),22px);font-weight:700}
.banner.pop{animation:pop .35s steps(4)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.teams-row{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:12px}
.team{display:flex;flex-direction:column;gap:clamp(4px,.8vh,8px);padding:clamp(4px,.8vh,8px) 10px clamp(6px,1vh,10px);margin:var(--px);background:#fff;box-shadow:var(--pixel-border)}
.team .thead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;min-height:28px}
.team .tstate{margin-left:auto;font:400 16px/1 var(--font-pixel)}
.team .tbtns{display:grid;grid-template-columns:repeat(var(--k,4),1fr);gap:8px}
.tbtn svg{width:clamp(22px,min(2.6vw,4.5vh),40px);height:auto}
.tbtn{display:grid;place-items:center;height:clamp(36px,6.5vh,72px);margin:var(--px);border:0;padding:0;background:var(--c);cursor:pointer;box-shadow:var(--pixel-border);touch-action:manipulation}
.tbtn:active{transform:translateY(2px)}
.team.locked .tbtns{opacity:.35}
.team.locked{background:var(--focus-bg)}
.team.won{background:var(--mint)}
.team.lost{background:#FBE4EE}
.gain{font:400 18px/1 var(--font-pixel)}

/* Rangliste */
.board{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.board h2{margin:0;font:400 clamp(30px,4.5vw,52px)/1.1 var(--font-pixel)}
.rows{width:min(900px,92vw);display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:56px 50px 160px minmax(0,1fr) 120px;align-items:center;gap:12px;padding:10px 14px;background:#fff;margin:var(--px);box-shadow:var(--pixel-border)}
.row .rank{font:400 30px/1 var(--font-pixel)}
.row .name{font-weight:700;font-size:19px}
.row .track{height:26px;background:var(--focus-bg);box-shadow:0 0 0 2px var(--ink)}
.row .fill{height:100%;background:var(--butter);width:0;transition:width .7s steps(10)}
.row .pts{font:400 24px/1 var(--font-pixel);text-align:right}
.row .plus{display:block;font:400 15px/1 var(--font-pixel);color:var(--ink-2);margin-top:4px}

/* Ende */
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
.end h2{margin:0;font:400 clamp(30px,5vw,58px)/1.1 var(--font-pixel);text-shadow:4px 4px 0 var(--rose)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:min(46vh,380px)}
.place{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;width:clamp(110px,16vw,190px);height:100%}
.place .who{font-weight:700;font-size:18px}
.place .pts{font:400 20px/1 var(--font-pixel)}
.block{width:100%;display:grid;place-items:start center;padding-top:10px;margin:var(--px);box-shadow:var(--pixel-border),var(--pixel-shadow);font:400 46px/1 var(--font-pixel)}
.p1 .block{height:56%;background:var(--butter)}
.p2 .block{height:40%;background:#E6E1F1}
.p3 .block{height:28%;background:var(--peach)}
.place.rise{animation:rise .6s steps(6) both}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.p2.rise{animation-delay:.5s}.p1.rise{animation-delay:1s}
.also{margin:0;color:var(--ink-2)}
.solo-res{display:flex;flex-direction:column;align-items:center;gap:10px}
.solo-res .big{font:400 clamp(40px,7vw,80px)/1 var(--font-pixel)}
.solo-res .sub{font-size:20px;font-weight:700}
.end-actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.review{position:absolute;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column}
.review-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--ink);background:#fff}
.review-head h2{margin:0;font:400 24px/1 var(--font-pixel);flex:1}
.review-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
.ritem{padding:12px 16px;background:#fff;margin:var(--px);box-shadow:var(--pixel-border)}
.ritem h3{margin:0 0 6px;font-size:18px}
.ritem p{margin:2px 0;font-size:16px}
.ritem .ok{color:#2E7D5B;font-weight:700}
.ritem .no{color:#B0306A;font-weight:700}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:12px;height:12px;animation:fall var(--dur) steps(14) var(--delay) forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--fy)) rotate(var(--rot))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:820px){
  .mid{grid-template-columns:clamp(70px,16vw,110px) minmax(0,1fr) clamp(120px,30vw,180px);gap:10px}
  .ans{font-size:20px;gap:10px;padding:8px 10px}
  .bar .qtitle{display:none}
  .row{grid-template-columns:40px 40px minmax(0,1fr) 90px}.row .track{display:none}
}
@media (max-width:600px){
  .mid{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:8px}
  .mid>.timer{grid-column:1;grid-row:1}.mid>.side{grid-column:2;grid-row:1}
  .mid>.media{grid-column:1/-1;grid-row:2}.mid>.banner{grid-column:1/-1;grid-row:2}
  .side{flex-direction:row;align-items:center}.side .stat,.side .btn{flex:1}
}
@media (max-height:620px){
  .q{gap:8px;padding:8px 12px}
  .ans{min-height:52px}
  .q.noimg .ans{min-height:60px}
}
@media (prefers-reduced-motion:reduce){
  .ans,.row .fill,.place.rise,.banner.pop{transition:none;animation:none}
}
</style>
</head>
<body>
<header class="bar">
  <span class="qtitle" id="barTitle"></span>
  <span class="chip progress" id="progress" hidden></span>
  <span class="grow"></span>
  <span class="chip points" id="points" hidden></span>
  <button type="button" class="icon-btn" id="btnSound"></button>
  <button type="button" class="icon-btn" id="btnFull" hidden></button>
</header>
<main>
  <section class="screen start" id="scrStart">
    <img class="cover" id="cover" alt="" hidden>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
    <p class="count" id="count"></p>
    <div class="modes" id="modes"></div>
  </section>

  <section class="screen start" id="scrTeams" hidden aria-labelledby="teamsTitle">
    <h1 id="teamsTitle">Klassen-Duell</h1>
    <p class="intro">Jedes Team tippt seine Antwort auf der eigenen Leiste an. Schnelle richtige Antworten bringen mehr Punkte.</p>
    <div class="team-pick" id="teamPick" role="group" aria-label="Anzahl der Teams"></div>
    <div class="team-preview" id="teamPreview"></div>
    <div class="end-actions">
      <button type="button" class="btn quiet" id="teamsBack">Zurück</button>
      <button type="button" class="btn" id="teamsGo">Los geht's</button>
    </div>
  </section>

  <section class="screen q" id="scrQ" hidden>
    <div class="qbox"><div class="qtext" id="qtext"></div></div>
    <div class="timebar" id="timebar"><i id="timefill"></i></div>
    <div class="mid">
      <div class="timer" id="timer" aria-hidden="true"></div>
      <div class="media" id="media"></div>
      <div class="side" id="side"></div>
      <div class="banner" id="banner" hidden role="status"></div>
    </div>
    <div class="answers" id="answers"></div>
    <div class="teams-row" id="teamsRow" hidden></div>
    <div class="read" id="read" hidden>
      <div class="rtext" id="rtext"></div>
      <div class="rbar"><i id="rfill"></i></div>
      <span class="rlabel">Gleich geht's los …</span>
    </div>
  </section>

  <section class="screen board" id="scrBoard" hidden>
    <h2>Zwischenstand</h2>
    <div class="rows" id="rows"></div>
    <button type="button" class="btn" id="boardNext"></button>
  </section>

  <section class="screen end" id="scrEnd" hidden></section>
</main>
<p class="sr" id="live" aria-live="polite"></p>

  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const freq = n => 440 * Math.pow(2, (n - 69) / 12);

    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(comp);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const pulse = duty => { const n = 48, re = new Float32Array(n), im = new Float32Array(n); for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(Math.PI * k * duty); return ctx.createPeriodicWave(re, im); };
    pulse25 = pulse(0.25); pulse12 = pulse(0.125);

    o.frequency.setValueAtTime(freq(n), t);

    const a = 0.005, end = t + Math.max(0.03, d);

  function noteNum(tok) {

}

/* ---------- Frage ---------- */
const slotsFor = q => q.type === 'tf' ? TF_SLOTS : q.answers.map((_, i) => i);
function showQuestion(i) {
  clearTimers();
  G.qi = i; G.phase = 'read';
  const q = QS[i];
  show('scrQ');
  $('#progress').hidden = false; $('#progress').textContent = `${i + 1} / ${QS.length}`;
  const scr = $('#scrQ');
  scr.classList.toggle('noimg', !q.image);
  $('#qtext').textContent = q.text;
  $('#media').innerHTML = '';
  if (q.image) { const im = new Image(); im.src = q.image; im.alt = ''; $('#media').append(im); }
  $('#banner').hidden = true;
  const timer = $('#timer'); timer.textContent = q.time; timer.className = 'timer';
  $('#timebar').classList.remove('hurry'); $('#timefill').style.transform = 'scaleX(1)';
  renderAnswers(q, true);
  renderSide();
  if (G.mode === 'team') { G.teams.forEach(t => { t.choice = null; t.time = 0; t.gained = 0; }); renderTeams(q); }
  $('#teamsRow').hidden = G.mode !== 'team';
  // Lesephase
  const readMs = Math.round(Math.min(6, Math.max(3, 2 + q.text.length / 30)) * 1000);
  const read = $('#read'); read.hidden = false;
  $('#rtext').textContent = q.text;
  requestAnimationFrame(() => fit($('#rtext'), Math.min(56, window.innerHeight / 9), 20));
  const rf = $('#rfill'); const r0 = performance.now();
  const step = now => { if (G.phase !== 'read') return; const u = Math.min(1, (now - r0) / readMs); rf.style.transform = `scaleX(${Math.ceil((1 - u) * 24) / 24})`; if (u < 1) G.raf = requestAnimationFrame(step); else startAnswering(); };
  G.raf = requestAnimationFrame(step);
  read.onclick = () => { if (G.phase === 'read') { cancelAnimationFrame(G.raf); startAnswering(); } };
  say(`Frage ${i + 1} von ${QS.length}: ${q.text}`);
}
function renderAnswers(q, disabled) {
  const box = $('#answers'); box.innerHTML = '';
  const slots = slotsFor(q);
  q.answers.forEach((a, i) => {
    const s = SLOTS[slots[i]];
    const el = document.createElement(G.mode === 'solo' ? 'button' : 'div');
    if (G.mode === 'solo') { el.type = 'button'; el.disabled = disabled; el.addEventListener('click', () => soloChoose(i)); el.setAttribute('aria-label', `${s.name}: ${a.t}`); }
    el.className = 'ans'; el.dataset.i = i; el.style.setProperty('--c', s.c);
    el.innerHTML = `<span class="shape">${shapeSvg(s.shape, 4)}</span><span class="atext"></span><span class="mark"></span>`;
    el.querySelector('.atext').textContent = a.t;
    box.append(el);
  });
  box.style.gridTemplateColumns = q.answers.length === 2 ? '1fr 1fr' : '1fr 1fr';
  requestAnimationFrame(() => {
    fit($('#qtext'), Math.min(44, window.innerHeight / 16, window.innerWidth / 16), 16);
    const maxA = Math.min(q.image ? 32 : 46, window.innerHeight / (q.image ? 26 : 20), window.innerWidth / 22);
    box.querySelectorAll('.atext').forEach(t => {
      t.classList.remove('squeeze');
      let px = maxA; t.style.fontSize = px + 'px'; const b = t.parentElement;
      const over = () => b.scrollHeight > b.clientHeight + 1 || t.scrollWidth > t.clientWidth + 1;
      while (px > 13 && over()) { px--; t.style.fontSize = px + 'px'; }
      if (over()) t.classList.add('squeeze');
    });
  });
}
function renderSide(extra) {
  const side = $('#side'); side.innerHTML = '';
  if (G.mode === 'solo') {
    const st = document.createElement('div'); st.className = 'stat';
    st.innerHTML = `<b>${G.score}</b><span>Punkte</span>`;
    side.append(st);
    if (G.streak >= 2) { const s2 = document.createElement('div'); s2.className = 'stat'; s2.innerHTML = `<b>${G.streak}</b><span>richtig in Folge</span>`; side.append(s2); }
  } else {
    const done = G.teams.filter(t => t.choice !== null).length;
    const st = document.createElement('div'); st.className = 'stat';
    st.innerHTML = `<b>${done} / ${G.teams.length}</b><span>Teams haben geantwortet</span>`;
    side.append(st);
  }
  if (extra) side.append(extra);
}
function renderTeams(q) {
  const row = $('#teamsRow'); row.innerHTML = ''; row.style.setProperty('--n', G.teams.length);
  const slots = slotsFor(q);
  G.teams.forEach((t, ti) => {
    const box = document.createElement('div'); box.className = 'team'; box.dataset.t = ti;
    box.innerHTML = `<div class="thead">${animal(t.key, 2)}<span></span><span class="tstate"></span></div><div class="tbtns" style="--k:${q.answers.length}"></div>`;
    box.querySelector('.thead span').textContent = t.name;
    const btns = box.querySelector('.tbtns');
    q.answers.forEach((a, i) => {
      const s = SLOTS[slots[i]], b = document.createElement('button');
      b.type = 'button'; b.className = 'tbtn'; b.style.setProperty('--c', s.c); b.innerHTML = shapeSvg(s.shape, 3);
      b.setAttribute('aria-label', `${t.name}: ${s.name}, ${a.t}`); b.disabled = true;
      const pick = e => { e.preventDefault(); teamChoose(ti, i); };
      b.addEventListener('pointerdown', pick);
      b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') pick(e); });
      btns.append(b);
    });
    row.append(box);
  });
}
function startAnswering() {
  const q = QS[G.qi];
  G.phase = 'answer';
  $('#read').hidden = true;
  if (G.mode === 'solo') $$('#answers .ans').forEach(b => { b.disabled = false; });
  else $$('#teamsRow .tbtn').forEach(b => { b.disabled = false; });
  if (G.mode === 'team') { const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'btn alt'; rb.textContent = 'Auflösen'; rb.addEventListener('click', reveal); renderSide(rb); }
  music(true);
  G.t0 = performance.now(); G.T = q.time * 1000; G.lastTick = null;
  const timer = $('#timer'), fill = $('#timefill');
  const loop = now => {
    if (G.phase !== 'answer') return;
    const left = Math.max(0, G.T - (now - G.t0)), sec = Math.ceil(left / 1000);
    timer.textContent = sec;
    fill.style.transform = `scaleX(${Math.ceil(left / G.T * 40) / 40})`;
    if (sec <= 5 && sec > 0 && sec !== G.lastTick) { G.lastTick = sec; fx('tick'); timer.classList.add('hurry'); $('#timebar').classList.add('hurry'); }
    if (left <= 0) { fx('timeup'); reveal(); return; }
    G.raf = requestAnimationFrame(loop);
  };
  G.raf = requestAnimationFrame(loop);
}
const $$ = s => [...document.querySelectorAll(s)];
function scoreFor(q, correct, ms, streak) {
  if (!correct || !q.points) return { base: 0, bonus: 0 };
  const base = Math.round(1000 * q.points * (1 - Math.min(1, ms / (q.time * 1000)) / 2));
  const bonus = streak >= 2 ? Math.min(100 * (streak - 1), 500) : 0;
  return { base, bonus };
}
function soloChoose(i) {
  if (G.phase !== 'answer' || G.mode !== 'solo') return;
  fx('tap');
  G.choice = i; G.choiceMs = performance.now() - G.t0;
  reveal();
}
function teamChoose(ti, i) {
  if (G.phase !== 'answer') return;
  const t = G.teams[ti]; if (t.choice !== null) return;
  t.choice = i; t.time = performance.now() - G.t0;
  fx('tap');
  const box = $(`#teamsRow .team[data-t="${ti}"]`); box.classList.add('locked');
  box.querySelector('.tstate').innerHTML = icon('check', 2);
  box.querySelectorAll('.tbtn').forEach(b => { b.disabled = true; });
  const rb = $('#side .btn'); renderSide(rb);
  say(`${t.name} haben geantwortet.`);
  if (G.teams.every(x => x.choice !== null)) later(reveal, 500);
}
function reveal() {
  if (G.phase !== 'answer') return;
  G.phase = 'reveal'; cancelAnimationFrame(G.raf);
  const q = QS[G.qi], timer = $('#timer');
  timer.classList.add('done');
  $$('#answers .ans').forEach(el => {
    const i = Number(el.dataset.i), right = !!q.answers[i].c;
    if (el.tagName === 'BUTTON') el.disabled = true;
    el.classList.toggle('dim', !right);
    if (right) el.querySelector('.mark').insertAdjacentHTML('beforeend', `<span class="ok">${icon('check', 3)}</span>`);
  });
  const rightText = q.answers.filter(a => a.c).map(a => a.t).join(' / ');
  const banner = $('#banner'); banner.className = 'banner'; banner.hidden = false;
  Sound.duck(true);
  const next = document.createElement('button'); next.type = 'button'; next.className = 'btn';
  if (G.mode === 'solo') {
    const chosen = G.choice !== undefined && G.choice !== null ? G.choice : null;
    const correct = chosen !== null && !!q.answers[chosen].c;
    if (chosen !== null) $(`#answers .ans[data-i="${chosen}"]`).classList.add('chosen');
    if (q.points) G.streak = correct ? G.streak + 1 : 0;
    const sc = scoreFor(q, correct, G.choiceMs || 0, G.streak);
    G.score += sc.base + sc.bonus;
    G.history.push({ q, chosen, correct, pts: sc.base + sc.bonus });
    $('#points').textContent = G.score;
    if (correct) {
      banner.classList.add('good');
      banner.innerHTML = '<h2>Richtig!</h2><p></p>';
      banner.querySelector('p').textContent = q.points ? `+${sc.base} Punkte` + (sc.bonus ? `  +${sc.bonus} Serien-Bonus` : '') : 'Diese Frage zählt ohne Punkte.';
      fx('correct');
    } else {
      banner.classList.add(chosen === null ? 'late' : 'bad');
      banner.innerHTML = `<h2>${chosen === null ? 'Zeit ist um!' : 'Leider falsch'}</h2><p></p>`;
      banner.querySelector('p').textContent = 'Richtig: ' + rightText;
      if (chosen !== null) fx('wrong');
    }
    G.choice = null; G.choiceMs = 0;
    next.textContent = G.qi + 1 < QS.length ? 'Weiter' : 'Ergebnis';
    next.addEventListener('click', () => { if (G.qi + 1 < QS.length) showQuestion(G.qi + 1); else showEnd(); });
  } else {
    let anyRight = false;
    G.teams.forEach((t, ti) => {
      const correct = t.choice !== null && !!q.answers[t.choice].c;
      if (q.points) t.streak = correct ? t.streak + 1 : 0;
      const sc = scoreFor(q, correct, t.time, t.streak);
      t.gained = sc.base + sc.bonus; t.score += t.gained; anyRight = anyRight || correct;
      const box = $(`#teamsRow .team[data-t="${ti}"]`);
      box.classList.remove('locked'); box.classList.add(correct ? 'won' : 'lost');
      box.querySelector('.tstate').innerHTML = `<span class="gain">${correct ? '+' + t.gained : (t.choice === null ? '–' : '0')}</span>`;
      if (t.choice !== null) $(`#answers .ans[data-i="${t.choice}"] .mark`).insertAdjacentHTML('afterbegin', animal(t.key, 2));
    });
    banner.classList.add('good');
    banner.innerHTML = '<h2>Auflösung</h2><p></p>';
    banner.querySelector('p').textContent = 'Richtig: ' + rightText;
    fx(anyRight ? 'correct' : 'wrong');
    next.textContent = 'Zwischenstand';
    next.addEventListener('click', showBoard);
  }
  banner.classList.add('pop');
  renderSide(next);
  next.focus({ preventScroll: true });
  say(banner.textContent);
}

/* ---------- Zwischenstand ---------- */
function showBoard() {
  clearTimers(); G.phase = 'board';
  show('scrBoard'); fx('board');
  const rows = $('#rows'); rows.innerHTML = '';
  const sorted = [...G.teams].sort((a, b) => b.score - a.score);
  const max = Math.max(1, ...sorted.map(t => t.score));
  sorted.forEach((t, i) => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<span class="rank">${i + 1}.</span>${animal(t.key, 3)}<span class="name"></span><span class="track"><span class="fill" style="display:block"></span></span><span class="pts">${t.score}<span class="plus">${t.gained ? '+' + t.gained : ''}</span></span>`;
    r.querySelector('.name').textContent = t.name;
    rows.append(r);
    requestAnimationFrame(() => requestAnimationFrame(() => { r.querySelector('.fill').style.width = (t.score / max * 100) + '%'; }));
  });
  const last = G.qi + 1 >= QS.length;
  const b = $('#boardNext'); b.textContent = last ? 'Zum Siegertreppchen' : 'Nächste Frage';
  b.onclick = () => last ? showEnd() : showQuestion(G.qi + 1);
  b.focus({ preventScroll: true });
  say('Zwischenstand: ' + sorted.map((t, i) => `${i + 1}. ${t.name} ${t.score} Punkte`).join(', '));
}

/* ---------- Ende ---------- */
function showEnd() {
  clearTimers(); G.phase = 'end';
  Sound.stopSong(0.4);
  later(() => fx('fanfare'), 200);
  const end = $('#scrEnd'); end.innerHTML = ''; show('scrEnd');
  if (G.mode === 'team') {
    const sorted = [...G.teams].sort((a, b) => b.score - a.score);
    end.innerHTML = '<h2>Siegertreppchen</h2><div class="podium"></div><p class="also"></p><div class="end-actions"></div>';
    const pod = end.querySelector('.podium');
    [[1, 'p2'], [0, 'p1'], [2, 'p3']].forEach(([idx, cls]) => {
      const t = sorted[idx]; if (!t) return;
      const d = document.createElement('div'); d.className = `place ${cls} rise`;
      d.innerHTML = `${animal(t.key, idx === 0 ? 7 : 5)}<span class="who"></span><span class="pts">${t.score}</span><div class="block">${idx + 1}</div>`;
      d.querySelector('.who').textContent = t.name;
      pod.append(d);
    });
    if (sorted[3]) end.querySelector('.also').textContent = `4. Platz: ${sorted[3].name} mit ${sorted[3].score} Punkten`;
    say(`${sorted[0].name} gewinnen mit ${sorted[0].score} Punkten.`);
  } else {
    const right = G.history.filter(h => h.correct).length, ratio = QS.length ? right / QS.length : 0;
    const medal = ratio >= 0.8 ? ['#FFD86B', 'Gold'] : ratio >= 0.5 ? ['#DCD3EC', 'Silber'] : ['#F7A97B', 'Bronze'];
    end.innerHTML = `<h2>Geschafft!</h2><div class="solo-res">${svg(STAR, { X: INK, Y: medal[0], W: '#FFFFFF' }, 9)}<span class="big">${G.score}</span><span class="sub">Punkte – ${right} von ${QS.length} richtig</span></div><div class="end-actions"></div>`;
    say(`Geschafft! ${G.score} Punkte, ${right} von ${QS.length} richtig.`);
  }
  const acts = end.querySelector('.end-actions');
  if (G.mode === 'solo') {
    const rv = document.createElement('button'); rv.type = 'button'; rv.className = 'btn quiet'; rv.textContent = 'Antworten ansehen';
    rv.addEventListener('click', showReview); acts.append(rv);
  }
  const again = document.createElement('button'); again.type = 'button'; again.className = 'btn'; again.textContent = 'Nochmal spielen';
  again.addEventListener('click', () => { Sound.stopSong(0.1); renderStart(); });
  acts.append(again);
  again.focus({ preventScroll: true });
  if (!reduceMotion()) later(confetti, 900);
}
function showReview() {
  const box = document.createElement('div'); box.className = 'review';
  box.innerHTML = '<div class="review-head"><h2>Deine Antworten</h2><button type="button" class="btn quiet">Schließen</button></div><div class="review-list"></div>';
  const list = box.querySelector('.review-list');
  G.history.forEach((h, i) => {
    const it = document.createElement('div'); it.className = 'ritem';
    const right = h.q.answers.filter(a => a.c).map(a => a.t).join(' / ');
    it.innerHTML = '<h3></h3><p></p><p></p>';
    it.children[0].textContent = `${i + 1}. ${h.q.text}`;
    const p1 = it.children[1], p2 = it.children[2];
    p1.innerHTML = `<span class="${h.correct ? 'ok' : 'no'}">${h.correct ? 'Richtig' : (h.chosen === null ? 'Keine Antwort' : 'Falsch')}</span>`;
    if (h.chosen !== null) p1.append(document.createTextNode(` – deine Antwort: ${h.q.answers[h.chosen].t}`));
    p2.textContent = 'Richtige Antwort: ' + right;
    list.append(it);
  });
  box.querySelector('button').addEventListener('click', () => box.remove());
  $('#scrEnd').append(box);
  box.querySelector('button').focus();
}
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#F6AECB', '#A6E3C8', '#AED6F3', '#FFE99A', '#CDB9F4', '#FFCBA9'];
  const H = window.innerHeight;
  for (let i = 0; i < 64; i++) {
    const c = document.createElement('i');
    c.style.left = (Math.random() * 100) + '%'; c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', ((Math.random() - 0.5) * 180) + 'px'); c.style.setProperty('--fy', (H + 40) + 'px');
    c.style.setProperty('--rot', (Math.round(Math.random() * 4) * 90) + 'deg');
    c.style.setProperty('--dur', (1.6 + Math.random() * 1.3) + 's'); c.style.setProperty('--delay', (Math.random() * 0.6) + 's');
    box.append(c);
  }
  document.body.append(box); setTimeout(() => box.remove(), 3800);
}

/* ---------- Tastatur ---------- */
document.addEventListener('keydown', e => {
  if (G.phase === 'answer' && G.mode === 'solo') {
    const k = { 1: 0, 2: 1, 3: 2, 4: 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()];
    if (k !== undefined && k < QS[G.qi].answers.length) { e.preventDefault(); soloChoose(k); }
  }
});
window.addEventListener('resize', () => {
  if (G.phase === 'answer' || G.phase === 'reveal' || G.phase === 'read') {
    fit($('#qtext'), Math.min(44, window.innerHeight / 16), 16);
    if (G.phase === 'read') fit($('#rtext'), Math.min(56, window.innerHeight / 9), 20);
  }
});

paintSound();
renderStart();
})();
</script>
</body>
