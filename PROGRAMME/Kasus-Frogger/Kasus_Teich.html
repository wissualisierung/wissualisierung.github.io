<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Der Kasus-Teich</title>
<style>
:root{--p:3px;--q:2px;--ink:#3A3350;--soft:#6E6688;--paper:#FFF7EA;--card:#FFFDF8;--line:#E7DCF2;--frame:#5E4BA8;--frame2:#B9A6E0;--btn:#8C7BD1;--btn-hi:#B4A8E8;--btn-sh:#6A59B2;--btn-bd:#3F3470;--mark:#D9CEF6;--mark-d:#7058C8;--font:Verdana,Tahoma,"Segoe UI","Trebuchet MS",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
canvas.px,.px canvas,#stage canvas{image-rendering:pixelated;image-rendering:crisp-edges}
:fullscreen{background:var(--paper)}

/* ---------- Pixel-Bausteine ---------- */
/* Rahmen mit abgeschrägten Pixelecken, innen hell/dunkel abgesetzt */
.pf{--bd:var(--frame);--bg:var(--card);--hi:#FFFFFF;--sh:var(--line);background:var(--bg);border-radius:0;
  box-shadow:inset var(--p) var(--p) 0 0 var(--hi),inset calc(-1*var(--p)) calc(-1*var(--p)) 0 0 var(--sh),
  0 calc(-1*var(--p)) 0 0 var(--bd),0 var(--p) 0 0 var(--bd),calc(-1*var(--p)) 0 0 0 var(--bd),var(--p) 0 0 0 var(--bd),
  0 calc(3*var(--p)) 0 calc(-1*var(--p)) rgba(58,51,80,.22)}
.pf.soft{--bd:var(--frame2);--sh:#F1EAFA}
.pf.flat{box-shadow:inset var(--p) var(--p) 0 0 var(--hi),inset calc(-1*var(--p)) calc(-1*var(--p)) 0 0 var(--sh),0 calc(-1*var(--p)) 0 0 var(--bd),0 var(--p) 0 0 var(--bd),calc(-1*var(--p)) 0 0 0 var(--bd),var(--p) 0 0 0 var(--bd)}
/* Knöpfe */
.pb{--bd:var(--btn-bd);--bg:var(--btn);--hi:var(--btn-hi);--sh:var(--btn-sh);position:relative;font-family:inherit;font-weight:bold;color:#fff;border:0;border-radius:0;background:var(--bg);cursor:pointer;
  margin:calc(2*var(--p)) calc(2*var(--p)) calc(3*var(--p));padding:calc(3*var(--p)) calc(6*var(--p));min-height:54px;font-size:clamp(17px,2.3vw,22px);line-height:1.2;
  box-shadow:inset var(--p) var(--p) 0 0 var(--hi),inset calc(-1*var(--p)) calc(-1*var(--p)) 0 0 var(--sh),
  0 calc(-1*var(--p)) 0 0 var(--bd),0 var(--p) 0 0 var(--bd),calc(-1*var(--p)) 0 0 0 var(--bd),var(--p) 0 0 0 var(--bd),
  0 calc(2*var(--p)) 0 calc(-1*var(--p)) var(--bd)}
.pb:active,.pb.down{transform:translateY(var(--p));box-shadow:inset var(--p) var(--p) 0 0 var(--sh),0 calc(-1*var(--p)) 0 0 var(--bd),0 var(--p) 0 0 var(--bd),calc(-1*var(--p)) 0 0 0 var(--bd),var(--p) 0 0 0 var(--bd)}
.pb.alt{--bg:#EFE8FA;--hi:#FFFFFF;--sh:#D6C9EE;--bd:var(--frame);color:var(--ink)}
.pb.teal{--bg:#7FC8DB;--hi:#BFE6F0;--sh:#55A7BD;--bd:#2F6F86}
.pb.gold{--bg:#F5CF52;--hi:#FFF0B0;--sh:#D9A42C;--bd:#8E6D0C;color:#4A3A08}
.pb.sm{min-height:46px;font-size:16px;padding:calc(2*var(--p)) calc(4*var(--p))}
.pb:focus-visible,.seg button:focus-visible{outline:var(--p) dashed var(--frame);outline-offset:calc(3*var(--p))}
.pb .ic{width:calc(8*var(--p));height:calc(8*var(--p));vertical-align:-0.35em;margin-right:calc(2*var(--p))}
/* Symbolknöpfe in der Kopfzeile */
.ib{--bg:#FFFFFF;--hi:#FFFFFF;--sh:#E3DAF3;--bd:var(--frame);color:var(--ink);width:max(44px,calc(15*var(--p)));height:max(44px,calc(15*var(--p)));min-height:0;padding:0;margin:var(--p) calc(1.5*var(--p)) calc(3*var(--p));display:grid;place-items:center;flex:0 0 auto;font-size:0}
.ib canvas{width:calc(12*var(--p));height:calc(12*var(--p))}
.ib.hold::after{content:"";position:absolute;left:0;bottom:0;width:100%;background:rgba(140,123,209,.5);animation:fillup 1.6s steps(8) forwards}
@keyframes fillup{from{height:0}to{height:100%}}
/* Umschalter */
.seg{display:inline-flex;flex-wrap:wrap;gap:calc(2*var(--p));padding:calc(1.5*var(--p));margin:calc(2*var(--p));--bg:#EFE8FA;--sh:#E3DAF3;justify-content:center}
.seg button{border:0;border-radius:0;background:transparent;color:var(--soft);font-weight:bold;font-size:16px;min-height:46px;padding:calc(2*var(--p)) calc(4*var(--p));cursor:pointer}
.seg button.on{background:#FFFFFF;color:var(--ink);box-shadow:0 calc(-1*var(--p)) 0 0 var(--frame),0 var(--p) 0 0 var(--frame),calc(-1*var(--p)) 0 0 0 var(--frame),var(--p) 0 0 0 var(--frame),inset 0 calc(-1*var(--p)) 0 0 #E3DAF3}
/* Kasus-Etiketten */
.k,.chip{display:inline-block;background:var(--c);color:var(--ink);font-weight:bold;padding:0 .35em;margin:var(--q) calc(2*var(--q));line-height:1.45;
  box-shadow:0 calc(-1*var(--q)) 0 0 var(--cd),0 var(--q) 0 0 var(--cd),calc(-1*var(--q)) 0 0 0 var(--cd),var(--q) 0 0 0 var(--cd),inset 0 calc(-1*var(--q)) 0 0 var(--cd)}
.chip{font-size:max(13px,calc(4.6*var(--p)));padding:calc(.5*var(--p)) calc(2*var(--p));white-space:nowrap}
.chip.off{opacity:.28;filter:grayscale(.8)}
.chip .ab{display:none}
.ptitle{display:block;margin:calc(2*var(--p)) auto calc(3*var(--p));line-height:0}
.ptitle canvas{display:inline-block;max-width:100%;height:auto}

/* ---------- Kopfzeile, Satzkarte ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:calc(1.5*var(--p));padding:var(--p) calc(3*var(--p));background:#F4EDFB;border-bottom:var(--p) solid var(--frame2);min-height:60px}
#lvl{line-height:0;flex:0 0 auto}
.chips{display:flex;gap:var(--p);flex-wrap:nowrap}
#pips{display:flex;gap:var(--p);align-items:center;margin-left:var(--p)}
#pips canvas{width:calc(7*var(--p));height:calc(7*var(--p))}
.sp{flex:1}
#scores{display:flex;gap:calc(3*var(--p));align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-right:var(--p)}
.score{display:inline-flex;align-items:center;gap:calc(2*var(--p));padding:var(--p) calc(3*var(--p));font-weight:bold;font-size:max(16px,calc(6*var(--p)));white-space:nowrap;margin:var(--p)}
.score canvas{width:calc(6*var(--p));height:calc(6*var(--p))}
.score.act{--bg:#FFF4C8;--sh:#F5E3A0}
#card{flex:0 0 auto;background:var(--card);border-bottom:var(--p) solid var(--frame2);box-shadow:0 var(--p) 0 0 #EFE8FA;padding:calc(2*var(--p)) calc(5*var(--p)) calc(1.5*var(--p));text-align:center;position:relative;z-index:2}
#sent{height:var(--sentH,90px);display:flex;align-items:center;justify-content:center;line-height:1.55;font-weight:bold;overflow:hidden;letter-spacing:.02em}
#sent>div{max-width:100%}
#taskline{display:flex;align-items:center;justify-content:center;gap:calc(3*var(--p));font-size:clamp(15px,2.1vw,21px);color:var(--soft);min-height:32px;flex-wrap:wrap;padding-bottom:var(--p)}
#gprog{font-size:.8em;padding:0 calc(3*var(--p));margin:var(--p) calc(2*var(--p));--bg:#F1EAFA;--bd:var(--frame2);--sh:#E3DAF3}
.np{padding:0 .12em;white-space:nowrap}
.np.cur{background:var(--mark);box-shadow:inset 0 calc(-1*max(3px,var(--p))) 0 0 var(--mark-d);animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{background:#EAE3FC}}
.np.done{background:var(--c);box-shadow:inset 0 calc(-1*max(3px,var(--p))) 0 0 var(--cd)}
.np sup{font-size:.46em;color:var(--ct);margin-left:.14em;font-weight:bold}

/* ---------- Spielfläche ---------- */
#stage{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;cursor:pointer}
#pix,#txt{position:absolute;left:0;top:0}
#txt{image-rendering:auto}
#floats{position:absolute;inset:0;pointer-events:none;z-index:3}
#banner{position:absolute;left:50%;top:calc(4*var(--p));transform:translate(-50%,-12px);opacity:0;background:var(--card);padding:calc(3*var(--p)) calc(6*var(--p));font-size:clamp(15px,2vw,20px);line-height:1.5;max-width:calc(100% - 32px);text-align:center;pointer-events:none;z-index:4;transition:opacity .2s ease-out,transform .2s ease-out}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner.low{top:auto;bottom:calc(6*var(--p))}
.fl{position:absolute;animation:fl 1.3s ease-out forwards;line-height:0;will-change:transform,opacity}
.fl canvas{display:block}
@keyframes fl{0%{transform:translate(-50%,0);opacity:1}65%{opacity:1}100%{transform:translate(-50%,-60px);opacity:0}}
#carpBtn{position:absolute;left:calc(4*var(--p));bottom:calc(5*var(--p));width:max(84px,calc(28*var(--p)));height:max(84px,calc(28*var(--p)));padding:0;margin:0;--bg:#BFE6F0;--hi:#DFF4F9;--sh:#9FD3E3;--bd:#2F6F86;z-index:3}
#carpCv{display:block;width:100%;height:100%}
#carpBtn .q{position:absolute;right:calc(-4*var(--p));top:calc(-4*var(--p));width:calc(12*var(--p));height:calc(12*var(--p));min-width:30px;min-height:30px;display:grid;place-items:center;--bg:#FFFFFF;--bd:var(--frame);line-height:0}
#carpBtn .q canvas{width:calc(5*var(--p));height:calc(7*var(--p));min-width:10px;min-height:14px}
#carpBtn.call .q{animation:bob 1s steps(2) infinite;--bg:#FFF3C4}
@keyframes bob{50%{transform:translateY(calc(-2*var(--p)))}}
#bubble{position:absolute;left:50%;top:calc(4*var(--p));transform:translateX(-50%);width:max-content;max-width:min(680px,calc(100% - 32px));max-height:calc(100% - 140px);overflow:auto;
  --bg:#FFFFFF;--bd:#2F6F86;--sh:#DFF0F5;padding:calc(4*var(--p)) calc(5*var(--p));font-size:clamp(16px,2.1vw,21px);line-height:1.55;display:none;cursor:default;z-index:5}
#bubble.show{display:block}
#bubble .who{display:flex;align-items:center;gap:calc(2*var(--p));font-size:.72em;color:#2F6F86;font-weight:bold;margin-bottom:var(--p)}
#bubble .who canvas{width:calc(19*var(--q));height:calc(10*var(--q))}
#bubble .row{display:flex;gap:calc(2*var(--p));margin-top:calc(2*var(--p));justify-content:flex-end;flex-wrap:wrap}
.hl{background:var(--mark);padding:0 4px;font-weight:bold;box-shadow:inset 0 calc(-1*var(--q)) 0 0 var(--mark-d)}

/* ---------- Überlagerungen ---------- */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;padding:calc(6*var(--p));
  background:repeating-conic-gradient(rgba(58,51,80,.46) 0 25%,rgba(58,51,80,.30) 0 50%) 0 0/calc(2*var(--p)) calc(2*var(--p))}
.ov.show{display:flex}
.panel{width:100%;max-width:800px;max-height:calc(100% - 4*var(--p));overflow:auto;padding:calc(5*var(--p)) calc(7*var(--p));text-align:center}
.panel.wide{max-width:980px;text-align:left}
.lead{font-size:clamp(17px,2.4vw,22px);font-weight:bold;color:var(--frame);margin:0 0 calc(3*var(--p))}
h3{margin:calc(5*var(--p)) 0 calc(2*var(--p));color:var(--frame);font-size:18px}
p{line-height:1.55;margin:8px 0}
.lbl{font-size:15px;color:var(--soft);margin-top:calc(4*var(--p));font-weight:bold}
.small{font-size:14px;color:var(--soft)}
.steps{display:grid;gap:calc(5*var(--p));text-align:left;margin:calc(4*var(--p)) var(--p)}
.step{display:flex;gap:calc(4*var(--p));align-items:center;padding:calc(3*var(--p)) calc(4*var(--p));font-size:clamp(16px,2.2vw,20px);line-height:1.45}
.step canvas{width:64px;height:64px;flex:0 0 64px}
.ex{padding:calc(3*var(--p)) calc(4*var(--p));margin:calc(4*var(--p)) var(--p);font-size:clamp(17px,2.4vw,23px);line-height:1.75}
.ex .q{font-size:.86em;font-weight:normal}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:calc(5*var(--p));margin:calc(4*var(--p)) var(--p)}
.st{padding:calc(2*var(--p)) calc(2*var(--p)) calc(3*var(--p));font-size:13px;line-height:1.35}
.st canvas{width:84px;height:84px;display:block;margin:0 auto 4px}
.st b{display:block;font-size:14px}
.st.lock{--bg:#F6F2FB;color:#9A93B0}
.st .pr{font-size:12px;color:#8A82A3;margin-top:2px}
.bigst{width:192px;height:192px}
.tabs{display:flex;gap:0;flex-wrap:wrap;margin:calc(2*var(--p)) 0 calc(3*var(--p))}
.tabs .pb{margin:calc(2*var(--p)) calc(2*var(--p)) calc(3*var(--p)) var(--p)}
.set{display:grid;grid-template-columns:minmax(170px,1fr) 2.4fr;gap:calc(1.5*var(--p)) calc(4*var(--p));align-items:center}
.set>div:nth-child(odd){font-weight:bold;font-size:15px}
.set .seg{margin:calc(1.5*var(--p)) var(--p);justify-content:flex-start;justify-self:start}
#ed{display:block;width:calc(100% - 2*var(--p));margin:var(--p);min-height:260px;font:15px/1.55 ui-monospace,Menlo,Consolas,monospace;border:0;padding:calc(3*var(--p));-webkit-user-select:text;user-select:text;color:var(--ink);resize:vertical;outline:none}
.btnrow{display:flex;flex-wrap:wrap;align-items:center;margin:calc(2*var(--p)) 0}
.check{font-size:14px;line-height:1.5;padding-left:22px;max-height:260px;overflow:auto}
.check li.err{color:#B4486A}.check li.warn{color:#8A6D0E}
.sum{padding:calc(2*var(--p)) calc(4*var(--p));font-size:15px;margin:calc(3*var(--p)) var(--p);--bg:#F4EFFC}
table.stat{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
table.stat td,table.stat th{border:var(--q) solid var(--frame2);padding:6px 10px;text-align:left}
table.stat th{background:#F4EFFC}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;-webkit-user-select:text;user-select:text}
pre{padding:calc(2*var(--p)) calc(3*var(--p));margin:calc(3*var(--p)) var(--p);white-space:pre-wrap;word-break:break-word;--bg:#FFFFFF}
#toast{position:fixed;left:50%;bottom:calc(6*var(--p));transform:translateX(-50%);--bg:#3A3350;--bd:#1F1A2E;--hi:#544A78;--sh:#2A2440;color:#fff;padding:calc(3*var(--p)) calc(5*var(--p));font-size:16px;z-index:80;opacity:0;pointer-events:none;max-width:90%;text-align:center;transition:opacity .25s ease-out}
#toast.show{opacity:1}
.fadein #pix,.fadein #txt{animation:fi .4s ease-out}@keyframes fi{from{opacity:0}}
#titleCv{width:100%;max-width:460px;display:block;margin:var(--p) auto calc(2*var(--p))}
@media (max-width:1100px){.chip .full{display:none}.chip .ab{display:inline}}
@media (max-width:700px){#hud{flex-wrap:wrap;row-gap:0}#pips{order:1}.score{font-size:15px}.set{grid-template-columns:1fr}.panel{padding:calc(4*var(--p)) calc(4*var(--p))}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <span id="lvl"></span>
    <span class="chips" id="chips"></span>
    <span id="pips" title="Goldene Kugel"></span>
    <span class="sp"></span>
    <span id="scores"></span>
    <button class="pb ib" id="bAlbum" aria-label="Stickeralbum" title="Stickeralbum"></button>
    <button class="pb ib" id="bMusic" aria-label="Musik an oder aus" title="Musik"></button>
    <button class="pb ib" id="bFull" aria-label="Vollbild" title="Vollbild (F)"></button>
    <button class="pb ib" id="bMenu" aria-label="Menü" title="Menü"></button>
    <button class="pb ib" id="bGear" aria-label="Lehrkraft-Bereich (2 Sekunden gedrückt halten)" title="Lehrkraft-Bereich: 2 Sekunden gedrückt halten"></button>
  </header>
  <section id="card" aria-live="polite">
    <div id="sent"><div></div></div>
    <div id="taskline"><span id="task"></span><span id="gprog" class="pf flat"></span></div>
  </section>
  <div id="stage">
    <canvas id="pix"></canvas>
    <canvas id="txt"></canvas>
    <div id="floats"></div>
    <div id="banner" class="pf"></div>
    <div id="bubble" class="pf" role="dialog" aria-live="polite"><div class="who"><canvas id="bubCarp" width="19" height="10" class="px"></canvas>Karpfen, der Teichwächter</div><div id="bubText"></div><div class="row"><button class="pb alt sm" id="bubMore">Noch ein Tipp</button><button class="pb teal sm" id="bubOk">Danke!</button></div></div>
    <button id="carpBtn" class="pb" aria-label="Den Karpfen um einen Tipp bitten"><canvas id="carpCv" width="28" height="28" class="px"></canvas><span class="q pf flat"></span></button>
  </div>
</div>

<div class="ov" id="ovStart"><div class="panel pf" id="startBody"></div></div>
<div class="ov" id="ovHow"><div class="panel pf" id="howBody"></div></div>
<div class="ov" id="ovLevel"><div class="panel pf" id="levelBody"></div></div>
<div class="ov" id="ovGold"><div class="panel pf" id="goldBody"></div></div>
<div class="ov" id="ovSticker"><div class="panel pf" id="stickerBody" style="max-width:440px"></div></div>
<div class="ov" id="ovAlbum"><div class="panel pf" id="albumBody"></div></div>
<div class="ov" id="ovTeacher"><div class="panel pf wide" id="teacherBody"></div></div>
<input type="file" id="edFile" accept=".md,.txt,text/markdown,text/plain" hidden>
<div id="toast" class="pf flat"></div>
<script>
'use strict';
/* =========================================================
   Der Kasus-Teich – ein Froschkönig-Spiel zu den vier Fällen
   Eine Datei, offline lauffähig. Alle Grafiken und Töne
   werden im Code erzeugt. Es werden keine Namen gespeichert.
   ========================================================= */

// ---------- Hilfsfunktionen ----------
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const FONT = 'Verdana, Tahoma, "Segoe UI", Arial, sans-serif';

// ---------- Kasus ----------
const CI = {
  Nom: { name: 'Nominativ', ab: 'Nom', short: 'Wer oder was?', qw: 'Wer oder was', col: '#FBE38E', rim: '#E2C25A', dark: '#8E6D0C', hi: '#FFF4C8' },
  Gen: { name: 'Genitiv', ab: 'Gen', short: 'Wessen?', qw: 'Wessen', col: '#9FE0B8', rim: '#62C08B', dark: '#25784A', hi: '#D6F6E3' },
  Dat: { name: 'Dativ', ab: 'Dat', short: 'Wem?', qw: 'Wem', col: '#A9CFF5', rim: '#73A9E0', dark: '#2B629E', hi: '#DDECFC' },
  Akk: { name: 'Akkusativ', ab: 'Akk', short: 'Wen oder was?', qw: 'Wen oder was', col: '#F8B7D0', rim: '#E487AD', dark: '#A23A6C', hi: '#FDE1EC' }
};
const ORDER = ['Nom', 'Gen', 'Dat', 'Akk'];
const LEVEL_CASES = { 1: ['Nom', 'Akk'], 2: ['Nom', 'Dat', 'Akk'], 3: ['Nom', 'Gen', 'Dat', 'Akk'], 4: ['Nom', 'Gen', 'Dat', 'Akk'] };
const NEW_CASE = { 2: 'Dat', 3: 'Gen' };
const chip = c => `<span class="k" style="--c:${CI[c].col};--cd:${CI[c].rim}">${CI[c].name}</span>`;

// ---------- Eingebauter Satzvorrat ----------
// Format: [Nominalgruppe]{Kasus: vollständige Frage}
// Bei Präpositionen steht die Präposition in der Frage: Worauf …? / Auf wen …? / Weswegen …? / Trotz wessen …?
const CORPUS = `# Der Froschkönig
[Der König]{Nom: Wer oder was ruft den Frosch?} ruft [den Frosch]{Akk: Wen oder was ruft der König?}.
[Der Frosch]{Nom: Wer oder was sieht den tiefen Brunnen?} sieht [den tiefen Brunnen]{Akk: Wen oder was sieht der Frosch?}.

// ---------- Parser ----------
const TAG = { nom: 'Nom', nominativ: 'Nom', n: 'Nom', '1': 'Nom', gen: 'Gen', genitiv: 'Gen', g: 'Gen', '2': 'Gen', dat: 'Dat', dativ: 'Dat', d: 'Dat', '3': 'Dat', akk: 'Akk', akkusativ: 'Akk', acc: 'Akk', a: 'Akk', '4': 'Akk' };
const PREP = {};
'an auf hinter in neben über unter vor zwischen'.split(' ').forEach(p => PREP[p] = 'wechsel');
'aus bei mit nach seit von zu gegenüber außer'.split(' ').forEach(p => PREP[p] = 'dat');
'durch für gegen ohne um bis'.split(' ').forEach(p => PREP[p] = 'akk');
'wegen trotz während statt anstatt innerhalb außerhalb'.split(' ').forEach(p => PREP[p] = 'gen');
const CONTR = { im: 'in', ins: 'in', am: 'an', ans: 'an', aufs: 'auf', zum: 'zu', zur: 'zu', vom: 'von', beim: 'bei', 'übers': 'über', unters: 'unter', vors: 'vor', hinters: 'hinter', ums: 'um', durchs: 'durch', 'fürs': 'für' };
const prepOf = w => { const lw = String(w).toLowerCase(); const b = CONTR[lw] || lw; return PREP[b] ? { base: b, kind: PREP[b] } : null; };

function topLevelPipe(line) {
  let d = 0;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '[' || c === '{') d++;
    else if (c === ']' || c === '}') d = Math.max(0, d - 1);
    else if (c === '|' && d === 0) return i;
  }
  return -1;
}

function parseLine(raw, no) {
  let line = String(raw).replace(/\r/g, '').replace(/\s+/g, ' ').trim();
  if (!line || /^(#|<!--|>|-{3,}$|={3,}$|\*{3,}$)/.test(line)) return null;
  line = line.replace(/^([-*+]|\d+[.)])\s+/, '').trim();
  if (!line) return null;
  const out = { raw: line, no, plain: '', groups: [], errors: [], warnings: [], notes: [] };
  let gq = null;
  const pi = topLevelPipe(line);
  if (pi >= 0) { gq = line.slice(pi + 1).trim() || null; line = line.slice(0, pi).trim(); }
  const re = /\[([^\[\]{}]+)\]\s*\{([^{}]*)\}/g;
  let m, pos = 0, plain = '';
  while ((m = re.exec(line))) {
    plain += line.slice(pos, m.index);
    const text = m[1].trim();
    const inner = m[2].trim();
    let tagRaw = inner, q = null;
    const ci = inner.indexOf(':');
    if (ci >= 0) { tagRaw = inner.slice(0, ci).trim(); q = inner.slice(ci + 1).trim() || null; }
    const cs = TAG[tagRaw.toLowerCase()];
    if (!cs) out.errors.push(`„{${tagRaw}}“ kenne ich nicht. Erlaubt sind Nom, Gen, Dat, Akk.`);
    const start = plain.length;
    plain += text;
    out.groups.push({ text, case: cs || null, q, start, end: plain.length, prep: null });
    pos = m.index + m[0].length;
  }
  plain += line.slice(pos);
  out.plain = plain;
  if (/[\[\]{}]/.test(plain)) out.errors.push('Eine Klammer passt nicht. So geht es: [dem Frosch]{Dat}');
  if (!out.groups.length && !out.errors.length) out.errors.push('Keine markierte Gruppe gefunden. So geht es: [dem Frosch]{Dat}');
  out.groups.forEach(g => {
    const mm = plain.slice(0, g.start).match(/([A-Za-zÄÖÜäöüß]+)\s+$/);
    if (mm) { const p = prepOf(mm[1]); if (p) g.prep = { word: mm[1], base: p.base, kind: p.kind }; }
  });
  if (gq) {
    if (out.groups.length === 1 && !out.groups[0].q) out.groups[0].q = gq;
    else if (out.groups.length > 1) out.warnings.push('Bei mehreren Gruppen gehört die Frage in die Klammer: [dem Frosch]{Dat: Wem …?}');
  }
  out.groups.forEach(g => {
    if (!g.case) return;
    if (!g.q) out.warnings.push(`„${g.text}“ hat keine Frage. Der Karpfen gibt dann allgemeine Tipps, die Fragen-Reihe entfällt.`);
    else if (!probeOpts(g, ORDER)) out.notes.push(`Zu „${g.text}“ gibt es keine Fragen-Reihe (Frage beginnt nicht mit einem Fragewort wie Wer, Wen, Wem, Wessen, Worauf …). Die Kasus-Reihe funktioniert.`);
    if (g.prep && g.prep.kind === 'gen' && g.case !== 'Gen') out.warnings.push(`„${g.prep.word} ${g.text}“: Nach „${g.prep.word}“ steht in der Schriftsprache der Genitiv. Bitte prüfen.`);
    const ql = g.q ? g.q.trim().toLowerCase() : '';
    const b = g.prep ? g.prep.base : '';
    if (g.prep && g.q && !(ql.startsWith('wo' + b) || ql.startsWith('wor' + b) || ql.startsWith(b + ' ') || /^(wohin|wo)\s/.test(ql) || (b === 'wegen' && /^wes(wegen|halb)\s/.test(ql))))
      out.notes.push(`„${g.prep.word} ${g.text}“: Tipp – die Frage sollte die Präposition enthalten, z. B. ${g.prep.kind === 'gen' ? `„${cap(g.prep.base)} wessen …?“` : `„Wo${/^[aeiouäöü]/i.test(g.prep.base) ? 'r' : ''}${g.prep.base} …?“ oder „${cap(g.prep.base)} wem …?“`}`);
  });
  return out;
}

function parseAll(text, src) {
  const res = [];
  String(text || '').split('\n').forEach((ln, i) => {
    const p = parseLine(ln, i + 1);
    if (p && !p.errors.length) { p.id = src + ':' + i; p.src = src; res.push(p); }
  });
  return res;
}

// Antwort für die Frageprobe, z. B. „Dem Frosch.“ oder „Auf dem Tisch.“
const answerOf = g => cap((g.prep ? g.prep.word + ' ' : '') + g.text) + '.';

// ---------- Vollständige Fragen für die Fragen-Reihe ----------
// Fragewort am Anfang abtrennen, Rest der Frage behalten.
const LEAD_RE = /^(Weswegen|Weshalb|Wo(?:r)?(?:auf|an|in|über|unter|vor|hinter|neben|zwischen|aus|bei|mit|nach|von|zu|durch|für|gegen|um)|Wohin|Woher|Wo|Wer oder was|Wen oder was|Wem oder was|Wessen|Wem|Wen|Wer|Was|[A-Za-zÄÖÜäöüß]+\s+(?:wem oder was|wen oder was|wem|wen|wessen))(?=[\s?]|$)\s*(.*)$/i;
function splitQ(q) { const m = String(q || '').trim().match(LEAD_RE); return m ? { lead: m[1], rest: m[2] } : null; }
function dropNoun(rest) {
  const t = rest.split(' ');
  const i = t.findIndex(w => /^[A-ZÄÖÜ]/.test(w));
  return i >= 0 ? t.slice(i + 1).join(' ') : rest;
}
const joinQ = (lead, rest) => !rest ? lead + '?' : (/^[?!.,]/.test(rest) ? lead + rest : lead + ' ' + rest);

// Liefert die Antwortmöglichkeiten der Fragen-Reihe (eine pro Kasus) oder null.
function probeOpts(g, avail) {
  if (!g.q || !g.case) return null;
  const sp = splitQ(g.q);
  if (!sp) return null;
  const lead = sp.lead, rest = sp.rest;
  // 1) Präpositionalgruppe: Präposition gehört in die Frage
  if (g.prep) {
    if (g.case === 'Nom') return null;
    const P = cap(g.prep.base);
    if (g.prep.kind === 'gen' || g.case === 'Gen') {
      if (g.case !== 'Gen') return null;
      const opts = [{ case: 'Gen', lead: P + ' wessen', rest }];
      if (avail.includes('Dat')) opts.push({ case: 'Dat', lead: P + ' wem oder was', rest });
      if (avail.includes('Akk')) opts.push({ case: 'Akk', lead: P + ' wen oder was', rest });
      return opts.length >= 2 ? { kind: 'genprep', opts } : null;
    }
    const opts = [];
    if (avail.includes('Dat')) opts.push({ case: 'Dat', lead: P + ' wem oder was', rest });
    if (avail.includes('Akk')) opts.push({ case: 'Akk', lead: P + ' wen oder was', rest });
    return opts.length >= 2 ? { kind: 'prep', opts } : null;
  }
  // 2) Genitivattribut: „Wessen Tochter …?“ oder „Auf wessen Rand …?“
  if (g.case === 'Gen') {
    const pm = lead.match(/^([A-Za-zÄÖÜäöüß]+)\s+wessen$/i);
    if (pm && prepOf(pm[1])) {
      const P = cap(pm[1].toLowerCase()), other = dropNoun(rest);
      const opts = [{ case: 'Gen', lead: P + ' wessen', rest }];
      if (avail.includes('Dat')) opts.push({ case: 'Dat', lead: P + ' wem oder was', rest: other });
      if (avail.includes('Akk')) opts.push({ case: 'Akk', lead: P + ' wen oder was', rest: other });
      return opts.length >= 2 ? { kind: 'gen', opts } : null;
    }
    if (!/^wessen$/i.test(lead)) return null;
    const other = dropNoun(rest);
    const opts = avail.map(c => ({ case: c, lead: CI[c].qw, rest: c === 'Gen' ? rest : other }));
    return opts.length >= 2 ? { kind: 'gen', opts } : null;
  }
  // 3) Nominativ, Dativ, Akkusativ ohne Präposition
  if (!/^(wer oder was|wen oder was|wem oder was|wem|wen|wer|was)$/i.test(lead)) return null;
  const opts = avail.filter(c => c !== 'Gen').map(c => ({ case: c, lead: CI[c].qw, rest }));
  return opts.length >= 2 ? { kind: 'plain', opts } : null;
}
const optText = o => joinQ(o.lead, o.rest);

// Die passende Probe-Frage (für den Karpfen-Tipp)
function probeQuestion(g) {
  const p = probeOpts(g, ORDER);
  if (!p) return null;
  const o = p.opts.find(o => o.case === g.case);
  return o ? optText(o) : null;
}

// Reihen für eine Überquerung bauen: erst die Frage, dann der Kasus
function buildRows(sent, level, ext) {
  const av = LEVEL_CASES[level], out = [];
  const asked = sent.groups.map((g, gi) => ({ g, gi })).filter(o => o.g.case && av.includes(o.g.case));
  // Fragen-Reihen für höchstens zwei Gruppen, Nominativ zuletzt
  let qSet = new Set();
  if (ext && level >= 2) {
    const cand = asked.filter(o => probeOpts(o.g, av)).sort((a, b) => (a.g.case === 'Nom') - (b.g.case === 'Nom'));
    cand.slice(0, 2).forEach(o => qSet.add(o.gi));
  }
  asked.forEach(({ g, gi }) => {
    if (qSet.has(gi)) {
      const pv = probeOpts(g, av);
      out.push({ type: 'q', gi, opts: shuffle(pv.opts.map(o => ({ case: o.case, lead: o.lead, rest: o.rest, correct: o.case === g.case }))) });
    }
    out.push({ type: 'k', gi, opts: shuffle(av.map(c => ({ case: c, correct: c === g.case }))) });
  });
  return out;
}

// Wie gut hilft der Artikel? (für den Einstieg in Level 1)
function easyScore(s, av) {
  const asked = s.groups.filter(g => av.includes(g.case));
  if (!asked.length) return 0;
  let n = 0;
  asked.forEach(g => {
    if (g.case === 'Nom' && /^der\s/i.test(g.text)) n++;
    if (g.case === 'Akk' && !g.prep && /^(den|einen)\s/i.test(g.text)) n++;
  });
  return n / asked.length;
}

// Frage mit hervorgehobenem Fragewort
function fmtQ(q) {
  const sp = splitQ(q);
  return sp ? `<b>${esc(sp.lead)}</b>${sp.rest ? (/^[?!.,]/.test(sp.rest) ? '' : ' ') + esc(sp.rest) : '?'}` : esc(q);
}

saved.stickers = saved.stickers || {};
saved.count = Object.assign({ Nom: 0, Gen: 0, Dat: 0, Akk: 0, frage: 0, hilfe: 0, balls: 0, mut: 0 }, saved.count || {});

// =========================================================
const SND = {
  ctx: null, master: null, music: null, sfx: null, echo: null, on: false, timer: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = 0.7; this.master.connect(c.destination);

const MUSIC = {
  bpm: 76, beat: 60 / 76, nextBar: 0, bar: 0, phraseIdx: 0, timer: null, phrases: {}, lastNote: 77,
  CH: { F: { bass: 41, arp: [57, 60, 65], tones: [65, 69, 72, 77, 81, 84] }, Dm: { bass: 38, arp: [57, 62, 65], tones: [62, 65, 69, 74, 77, 81] }, Bb: { bass: 46, arp: [58, 62, 65], tones: [65, 70, 74, 77, 82] }, C: { bass: 48, arp: [55, 60, 64], tones: [67, 72, 76, 79, 84] }, Am: { bass: 45, arp: [57, 60, 64], tones: [69, 72, 76, 81, 84] } },
  PROG: { A: ['F', 'Dm', 'Bb', 'C', 'F', 'Am', 'Bb', 'C'], B: ['Bb', 'C', 'Am', 'Dm', 'Bb', 'C', 'F', 'F'] },
  PENTA: [65, 67, 69, 72, 74, 77, 79, 81, 84],
  RHY: [[1, 1, 1], [2, 1], [1, 2], [1, 0.5, 0.5, 1], [1.5, 0.5, 1], [3]],
  makePhrase(key) {
    const prog = this.PROG[key], bars = [];
    let last = this.lastNote;
    prog.forEach((ch, bi) => {
      const end = bi === 3 || bi === 7;
      const rhy = end ? [3] : pick(this.RHY.slice(0, 5));
      const notes = []; let t = 0;
      rhy.forEach((d, k) => {
        let m;
        if (k === 0 || end) {
          const tones = this.CH[ch].tones.filter(x => x >= 65 && x <= 84);
          m = tones.reduce((a, b) => Math.abs(b - last) < Math.abs(a - last) ? b : a);
          if (end && key === 'B' && bi === 7) m = 77;
        } else {
          let i = this.PENTA.indexOf(last); if (i < 0) i = 4;
          i = clamp(i + pick([-2, -1, -1, 1, 1, 2]), 1, this.PENTA.length - 1);
          m = this.PENTA[i];

        notes.push({ t, m, d }); last = m; t += d;
      });
      bars.push({ ch, notes });
    });
    this.lastNote = last;
    return bars;
  },
  start() {
    if (this.timer) return;
    this.phrases = { A: this.makePhrase('A'), B: this.makePhrase('B') };
    this.nextBar = SND.ctx.currentTime + 0.2; this.bar = 0; this.phraseIdx = 0;
    this.timer = setInterval(() => this.tick(), 90);
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  tick() {
    const c = SND.ctx; if (!c) return;
    const barDur = this.beat * 3;
    while (this.nextBar < c.currentTime + 0.4) {
      const form = ['A', 'A', 'B', 'A'];
      const key = form[this.phraseIdx % 4];
      const ph = this.phrases[key];
      const b = ph[this.bar], ch = this.CH[b.ch], t0 = this.nextBar;
      SND.pad(ch.bass, t0, barDur * 1.1, 0.9);
      SND.box(ch.arp[0], t0 + this.beat, 0.28); SND.box(ch.arp[1], t0 + this.beat * 2, 0.24);
      if (this.bar % 2 === 1) SND.box(ch.arp[2], t0 + this.beat * 2.5, 0.18);
      const rest = (this.phraseIdx % 8 === 7) && this.bar >= 4; // gelegentlich atmen
      if (!rest) b.notes.forEach(n => SND.box(n.m, t0 + n.t * this.beat, 0.62));
      this.nextBar += barDur;
      this.bar++;
      if (this.bar >= ph.length) {
        this.bar = 0; this.phraseIdx++;
        if (this.phraseIdx % 4 === 0) this.phrases.B = this.makePhrase('B');
        if (this.phraseIdx % 8 === 0) this.phrases.A = this.makePhrase('A');
      }
    }
  }
};

// Pixel-Ellipse auf beliebigem Kontext (ganzzahlige Zeilen)
function pEllipse(ctx, cx, cy, rx, ry, col) {
  if (rx <= 0 || ry <= 0) return;
  ctx.fillStyle = col;
  const r0 = Math.ceil(ry);
  for (let yy = -r0; yy <= r0; yy++) {
    const t = (yy + 0.5 * Math.sign(-yy)) / ry;
    if (Math.abs(t) > 1) continue;
    const hw = Math.round(rx * Math.sqrt(1 - t * t));
    if (hw <= 0) continue;
    ctx.fillRect(Math.round(cx) - hw, Math.round(cy) + yy, hw * 2, 1);
  }
}
function pRing(ctx, cx, cy, rx, ry, col, dotted) {
  ctx.fillStyle = col;
  const n = Math.max(12, Math.ceil((rx + ry) * 3.2));
  for (let i = 0; i < n; i++) {
    if (dotted && (i % 6) > 2) continue;
    const a = i / n * Math.PI * 2;
    ctx.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1);
  }
}
// Seerosenblatt
const WATER = '#A9DDEA';
function pPad(ctx, cx, cy, rx, ry, pal, notch, waterCol) {
  pEllipse(ctx, cx, cy + 1.5, rx, ry, 'rgba(70,120,150,0.20)');
  pEllipse(ctx, cx, cy, rx, ry, pal.rim);
  pEllipse(ctx, cx, cy - 0.5, rx - 1, ry - 1, pal.fill);
  pEllipse(ctx, cx - rx * 0.32, cy - ry * 0.42, rx * 0.34, Math.max(1, ry * 0.16), pal.hi);
  if (notch) {
    const th = 0.62, N = 10;
    ctx.fillStyle = waterCol || WATER;
    for (let k = 0; k <= N; k++) {
      const f = 0.55 + 0.47 * (k / N);
      const x = cx + Math.cos(th) * rx * f, y = cy + Math.sin(th) * ry * f;
      const w = Math.max(1, Math.round((k / N) * rx * 0.16));
      ctx.fillRect(Math.round(x - w / 2), Math.round(y - w / 2), w, w);
    }
  }
}

  if (SET.source === 'custom' && POOL_CUSTOM.length) return POOL_CUSTOM;
  if (SET.source === 'both') return POOL_BUILTIN.concat(POOL_CUSTOM);
  return POOL_BUILTIN;
}

function newStats() {
  const k = {}; ORDER.forEach(c => k[c] = { asked: 0, first: 0, wrong: 0, conf: {} });
  return { k, q: { asked: 0, first: 0, wrong: 0 }, sents: {}, hints: 0, crossings: 0, flawless: 0 };
}

const G = {
  running: false, paused: true, level: 1, solved: 0, turn: 0, score: [0, 0], best: 0,
  streak: 0, used: {}, sent: null, rows: [], ri: -1, phase: 'idle', safe: { r: -1 },
  rowErr: 0, rowSplash: false, crossErr: 0, hint: 0, rowTime: 0, done: {}, qDone: {},
  sel: -1, selVis: false, cam: 0, t: 0, timers: [], fx: [], waves: [], deco: [],
  carp: null, ballFly: null, joy: 0, frogS: 2,
  frogs: [{ team: 0, at: { r: -1 }, x: 0, y: 0, anim: null, hidden: false }, { team: 1, at: { r: -1 }, x: 0, y: 0, anim: null, hidden: false }],
  stats: newStats(), pending: [], teams: 1
};
const activeFrog = () => G.frogs[G.teams === 2 ? G.turn : 0];
const mult = () => LEVEL_CASES[G.level].length;
function later(sec, fn) { G.timers.push({ t: sec, fn }); }

// ---------- Satzwahl ----------
function chooseSentence() {
  const av = LEVEL_CASES[G.level];
  const cand = pool().filter(s => s.groups.some(g => g.case && av.includes(g.case)));
  if (!cand.length) return null;
  const key = 'L' + G.level;
  G.used[key] = G.used[key] || new Set();
  const lastId = G.sent && G.sent.id;
  let fresh = cand.filter(s => !G.used[key].has(s.id) && s.id !== lastId);
  if (!fresh.length) { G.used[key].clear(); fresh = cand.filter(s => s.id !== lastId); if (!fresh.length) fresh = cand; }
  const nAsked = s => s.groups.filter(g => av.includes(g.case)).length;
  let sub = fresh;
  const nc = NEW_CASE[G.level];
  if (G.level === 1 && G.solved < 2) {
    const e = fresh.filter(s => easyScore(s, av) === 1 && nAsked(s) >= 2);
    if (e.length) sub = e;
  } else if (nc && Math.random() < 0.65 && fresh.some(s => s.groups.some(g => g.case === nc))) {
    sub = fresh.filter(s => s.groups.some(g => g.case === nc));
  } else {
    const multi = fresh.filter(s => nAsked(s) >= 2);
    if (multi.length && Math.random() < 0.75) sub = multi;
  }
  const s = pick(sub);
  G.used[key].add(s.id);
  return s;
}

// ---------- Layout ----------
function fonts() {
  const m = Math.min(W, H * 1.6);
  return { big: clamp(m * 0.03, 18, 40), small: clamp(m * 0.021, 14, 27), q: clamp(m * 0.022, 15, 28) };
}
function fontStr(b, s) { return `${b ? 'bold ' : ''}${Math.round(s)}px ${FONT}`; }
function wrapWords(words, s, maxW) {
  const lines = []; let cur = null;
  words.forEach(wd => {
    tx.font = fontStr(wd.b, s);
    const w = tx.measureText(wd.t).width, sp = tx.measureText(' ').width;
    const it = { t: wd.t, font: fontStr(wd.b, s), w, sp };
    if (!cur || (cur.w + sp + w > maxW && cur.items.length)) { cur = { items: [it], w, lh: s * 1.28 }; lines.push(cur); }
    else { cur.items[cur.items.length - 1].spAfter = true; cur.w += sp + w; cur.items.push(it); }
  });
  return lines;
}
function buildLeaf(row, o, g, F, n) {
  const Lf = o.leaf;
  let lines = [];
  const gap = clamp(W * 0.025, 10, 34);
  if (row.demo) { Lf.lines = []; Lf.w = F.big * 5.2; Lf.h = F.big * 2.6; return; }
  if (row.type === 'k') {
    lines = wrapWords([{ t: CI[o.case].name, b: true }], F.big, 9999);
    if (SET.mode === 'easy') {
      let h = CI[o.case].short;
      if (g.prep) h = o.case === 'Dat' ? cap(g.prep.base) + ' wem oder was?' : o.case === 'Akk' ? cap(g.prep.base) + ' wen oder was?' : o.case === 'Gen' ? cap(g.prep.base) + ' wessen?' : 'Wer oder was?';
      lines = lines.concat(wrapWords(h.split(' ').map(t => ({ t, b: false })), F.small, F.big * 7));
    }
  } else {
    const leadW = o.lead.split(' ').map(t => ({ t, b: true }));
    const restW = (o.rest || '?').split(' ').filter(Boolean).map(t => ({ t, b: false }));
    if (!o.rest) leadW[leadW.length - 1].t += '?';
    const words = o.rest && /^[?!.,]/.test(o.rest) ? (leadW[leadW.length - 1].t += o.rest, leadW) : leadW.concat(restW);
    let s = F.q, maxW = clamp((W - (n + 1) * gap) / n / 1.25 - 16, 110, 420);
    for (let k = 0; k < 6; k++) { lines = wrapWords(words, s, maxW); if (lines.length <= 3 || s <= 14) break; s -= 1; }
  }
  const tw = Math.max(...lines.map(l => l.w)), th = lines.reduce((a, l) => a + l.lh, 0);
  Lf.lines = lines;
  Lf.w = Math.max(tw * 1.24 + F.small * 1.6, F.big * 5.4);
  Lf.h = Math.max(th * 1.32 + F.small * 1.1, F.big * 2.5);
}
function arrange(row) {
  const live = row.opts.filter(o => o.leaf.state !== 'sink' && o.leaf.state !== 'gone');
  if (!live.length) return;
  const gap = clamp(W * 0.025, 10, 34);
  const sumW = live.reduce((a, o) => a + o.leaf.w, 0);
  let lines = [live];
  if (sumW + gap * (live.length + 1) > W && live.length > 1) { const k = Math.ceil(live.length / 2); lines = [live.slice(0, k), live.slice(k)]; }
  let minSlack = 1e9;
  lines.forEach((ln, li) => {
    const sum = ln.reduce((a, o) => a + o.leaf.w, 0);
    const g = Math.max(4, (W - sum) / (ln.length + 1));
    minSlack = Math.min(minSlack, g);
    let x = g;
    ln.forEach(o => { o.leaf.tx = x + o.leaf.w / 2; x += o.leaf.w + g; o.leaf.line = li; });
  });
  const mh = Math.max(...live.map(o => o.leaf.h));
  live.forEach(o => { o.leaf.tdy = lines.length === 1 ? 0 : (o.leaf.line === 0 ? -1 : 1) * (mh / 2 + 6); });
  row.nLines = Math.max(row.nLines || 1, lines.length);
  row.swayA = clamp((minSlack - gap * 0.6) * 0.45, 0, 28);
}
function layoutCrossing() {
  const F = fonts();
  G.rows.forEach((row, ri) => {
    const g = G.sent ? G.sent.groups[row.gi] : null;
    row.nLines = 1;
    row.opts.forEach(o => {
      o.leaf = o.leaf || { state: 'neutral', colorT: 0, sinkT: 0, labelA: 0, x: null, dy: 0, flower: Math.random() < 0.3 };
      buildLeaf(row, o, g, F, row.opts.length);
    });
    arrange(row);
    const mh = Math.max(...row.opts.map(o => o.leaf.h));
    row.h = row.nLines * (mh + 14) + clamp(H * 0.045, 16, 36);
    const gap = clamp(W * 0.06, 30, 80);
    let bx = 0; row.opts.forEach(o => { o.leaf.bx = bx + o.leaf.w / 2; bx += o.leaf.w + gap; });
    const maxW = Math.max(...row.opts.map(o => o.leaf.w));
    row.beltL = Math.max(W + maxW + gap, bx);
    row.speed = clamp(W * 0.016, 12, 26);
  });
  let bankTop = clamp(H * 0.26, 120, 210), bankBot = clamp(H * 0.2, 100, 150);
  const rowsH = G.rows.reduce((a, r) => a + r.h, 0);
  let worldH = bankTop + rowsH + bankBot;
  if (worldH < H) {
    const extra = H - worldH, add = Math.min(extra * 0.6, G.rows.length * 70);
    G.rows.forEach(r => r.h += add / Math.max(1, G.rows.length));
    bankTop += extra - add; worldH = H;
  }
  let y = worldH - bankBot;
  G.rows.forEach(r => { r.y = y - r.h / 2; y -= r.h; });
  LAY.bankTop = bankTop; LAY.bankBot = bankBot; LAY.worldH = worldH;
  const minRow = G.rows.length ? Math.min(...G.rows.map(r => r.h)) : 120;
  G.frogS = Math.max(1, Math.round(Math.min(clamp(minRow * 0.72, 50, 112), W * 0.16) / (13 * P)));
  makeWaves();
}
function makeWaves() {
  G.waves = [];
  const n = Math.round(W * LAY.worldH / 7000);
  for (let i = 0; i < n; i++) G.waves.push({ x: rnd(0, W), y: rnd(LAY.bankTop + 10, LAY.worldH - LAY.bankBot - 8), len: Math.round(rnd(2, 7)), sp: rnd(5, 14) * (Math.random() < 0.5 ? -1 : 1), ph: rnd(0, 6) });
  G.deco = [];
  for (let i = 0; i < Math.round(W / 70); i++) {
    let x = rnd(10, W - 10);
    if (Math.abs(x - W / 2) < 70) x += 140 * Math.sign(x - W / 2 || 1);
    G.deco.push({ x, f: rnd(0.4, 0.92), k: Math.random() < 0.6 ? 'flower' : 'tuft' });
  }
}

function demoRows() {
  G.sent = null;
  G.rows = [0, 1, 2].map(i => ({ demo: true, type: 'k', gi: 0, state: 'future', dir: i % 2 ? -1 : 1, beltOff: rnd(0, 400), phase: rnd(0, 6), opts: [0, 1, 2].map(() => ({ case: null })) }));
  G.ri = -1;
  layoutCrossing();
  G.cam = Math.max(0, LAY.worldH - H);
}

// ---------- Positionen ----------
function leafPos(o) { return { x: o.leaf.x, y: o.leaf.ly + o.leaf.h * 0.2 + (o.leaf.state === 'sink' ? o.leaf.sinkT * 14 : 0) }; }
function princessPos() { return { x: W * 0.36, y: LAY.bankTop * 0.9 }; }
function goalPos() { return { x: W * 0.36 + 15 * G.frogS * P, y: LAY.bankTop * 0.92 }; }
function bankPos(team) { const act = (G.teams === 2 ? G.turn : 0) === team; return { x: act ? W / 2 : W * 0.84, y: LAY.worldH - LAY.bankBot * 0.4 }; }
function restPos(f, at) {
  at = at || f.at;
  if (at.r === -1) return bankPos(f.team);
  if (at.r === 'goal') return goalPos();
  if (at.r === 'water') return { x: at.x, y: at.y };
  const row = G.rows[at.r], o = row && row.opts[at.j];
  return o ? leafPos(o) : bankPos(f.team);
}

// ---------- Ablauf ----------
function newGame() {
  G.teams = SET.teams === 2 ? 2 : 1;
  G.level = clamp(+SET.startLevel || 1, 1, 4); G.solved = 0; G.score = [0, 0]; G.turn = 0; G.streak = 0; G.used = {};
  G.running = true; G.timers = []; G.fx = [];
  G.frogs.forEach(f => { f.at = { r: -1 }; f.anim = null; f.hidden = false; });
  updateHUD();
  if (G.level >= 4) checkStickers();
  showLevelIntro(G.level, () => nextSentence(false));
}

function nextSentence(switchTeam) {
  if (switchTeam && G.teams === 2) G.turn = 1 - G.turn;
  const s = chooseSentence();
  if (!s) { toast('Für dieses Level gibt es keine passenden Sätze. Bitte im Lehrkraft-Bereich Sätze ergänzen oder die Satzquelle ändern.'); demoRows(); return; }
  G.sent = s; G.done = {}; G.qDone = {}; G.crossErr = 0; G.ri = -1;
  G.rows = buildRows(s, G.level, SET.ext).map((r, i) => Object.assign(r, { state: 'future', dir: i % 2 ? -1 : 1, beltOff: rnd(0, 600), phase: rnd(0, 6) }));
  G.frogs.forEach(f => { f.at = { r: -1 }; f.anim = null; f.hidden = false; });
  G.safe = { r: -1 }; G.carp = null; G.fx = [];
  layoutCrossing();
  G.cam = Math.max(0, LAY.worldH - H);
  stage.classList.remove('fadein'); void stage.offsetWidth; stage.classList.add('fadein');
  G.phase = 'intro';
  renderSentence(); renderTask(); updateHUD();
  if (G.teams === 2) banner(`<b style="color:${TEAM[G.turn].dot === '#8FD48A' ? '#4C9A4A' : '#3E78B0'}">${TEAM[G.turn].name}</b> ist dran!`);
  later(0.6, () => activateRow(0));
}

function activateRow(i) {
  G.ri = i; const row = G.rows[i];
  row.state = 'active';
  arrange(row);
  G.rowErr = 0; G.rowSplash = false; G.hint = 0; G.rowTime = 0;
  const f = activeFrog();
  const live = row.opts.map((o, j) => j).filter(j => row.opts[j].leaf.state === 'neutral');
  G.sel = live.reduce((a, j) => Math.abs(row.opts[j].leaf.tx - f.x) < Math.abs(row.opts[a].leaf.tx - f.x) ? j : a, live[0]);
  const g = G.sent.groups[row.gi];
  if (row.type === 'k') G.stats.k[g.case].asked++; else G.stats.q.asked++;
  $('#carpBtn').classList.remove('call');
  renderSentence(); renderTask();
  G.phase = 'ready';
}

function jumpFrog(f, target, dur, arc, done) {
  f.anim = { type: 'jump', t: 0, dur, fx: f.x, fy: f.y, target, arc, done };
  SND.play('jump');
}

function jumpTo(j) {
  if (G.phase !== 'ready' || G.paused) return;
  const row = G.rows[G.ri], o = row && row.opts[j];
  if (!o || o.leaf.state !== 'neutral') return;
  closeBubble();
  G.phase = 'jump';
  const f = activeFrog();
  jumpFrog(f, () => leafPos(o), 0.55, 55 + row.h * 0.3, () => (o.correct ? onCorrect : onWrong)(row, o));
}

const GOOD_MSG = ['Richtig!', 'Super!', 'Klasse!', 'Genau!', 'Prima!', 'Toll!'];
const WRONG_MSG = ['Platsch! Dieses Blatt trägt dich nicht.', 'Platsch! Nasse Füße – probier ein anderes Blatt.', 'Huch! Das Blatt ist untergetaucht.'];
const ARRIVE_MSG = ['Geschafft! Die Prinzessin freut sich.', 'Wunderbar! Du bist am Schloss.', 'Hurra, angekommen!'];

function onCorrect(row, o) {
  const f = activeFrog(), j = row.opts.indexOf(o), g = G.sent.groups[row.gi];
  o.leaf.state = 'good';
  f.at = { r: G.ri, j }; G.safe = { r: G.ri, j };
  row.state = 'done';
  const first = G.rowErr === 0;
  const m = mult();
  let pts = 10 * m;
  const p = leafPos(o);
  addPoints(pts, '', p.x, p.y - G.cam - 60);
  if (SET.tempo && first && G.rowTime < 8) later(0.35, () => addPoints(5 * m, 'Tempo', p.x, p.y - G.cam - 60));
  saved.count.jumps = (saved.count.jumps || 0) + 1;
  if (G.rowSplash) saved.count.mut++;
  if (row.type === 'k') {
    G.done[row.gi] = o.case;
    if (first) { saved.count[o.case]++; G.stats.k[o.case].first++; }
    SND.play('good');
    sparkFx(p.x, p.y - 10, CI[o.case].rim);
    floatText(CI[o.case].name + '!', p.x, p.y - G.cam - 100, o.case);
    showProbeLine(g);
  } else {
    G.qDone[row.gi] = optText(o);
    if (first) { saved.count.frage++; G.stats.q.first++; }
    SND.play('qgood');
    sparkFx(p.x, p.y - 10, '#B4A3E6');
    $('#task').innerHTML = `<span style="color:#5E4BA8">✓</span> ${fmtQ(optText(o))} – <b>${esc(answerOf(g))}</b>`;
    $('#gprog').textContent = '';
  }
  persist();
  checkStickers();
  renderSentence();
  G.hint = 0; $('#carpBtn').classList.remove('call');
  G.phase = 'land';
  later(row.type === 'k' ? 1.5 : 1.1, () => { if (G.ri + 1 < G.rows.length) activateRow(G.ri + 1); else finishCrossing(); });
}

function onWrong(row, o) {
  const f = activeFrog(), j = row.opts.indexOf(o), g = G.sent.groups[row.gi];
  o.leaf.state = 'sink'; o.leaf.sinkT = 0;
  f.at = { r: G.ri, j };
  G.crossErr++; G.rowErr++; G.rowSplash = true;
  if (row.type === 'k') { const st = G.stats.k[g.case]; st.wrong++; st.conf[o.case] = (st.conf[o.case] || 0) + 1; }
  else G.stats.q.wrong++;
  const sid = G.sent.id; G.stats.sents[sid] = G.stats.sents[sid] || { plain: G.sent.plain, wrong: 0 }; G.stats.sents[sid].wrong++;
  arrange(row);
  G.phase = 'fall';
  later(0.5, () => {
    const p = { x: f.x, y: f.y };
    f.hidden = true; f.at = { r: 'water', x: p.x, y: p.y };
    SND.play('plop'); splashFx(p.x, p.y);
    banner(pick(WRONG_MSG));
    later(0.6, () => {
      G.carp = { x: p.x, y: p.y + 6, t: 0, leave: false };
      SND.play('blub');
      later(0.5, () => {
        f.hidden = false; f.x = p.x; f.y = p.y;
        jumpFrog(f, () => restPos(f, G.safe), 0.75, 80, () => {
          f.at = Object.assign({}, G.safe);
          if (G.carp) G.carp.leave = true;
          G.phase = 'ready';
          if (G.rowErr >= 2) { $('#carpBtn').classList.add('call'); later(0.3, () => openHint(true)); }
          else banner('Der Karpfen hat dich zurückgebracht. Probier ein anderes Blatt.', 2.4);
        });
      });
    });
  });
}

function finishCrossing() {
  G.phase = 'finish'; G.ri = G.rows.length;
  renderTask(); renderSentence();
  const f = activeFrog();
  jumpFrog(f, () => goalPos(), 0.85, 120, () => {
    f.at = { r: 'goal' };
    G.phase = 'arrive'; G.joy = 2.2;
    SND.play('arrive');
    const pp = princessPos();
    heartsFx(pp.x, pp.y - 60, 7);
    G.solved++; G.stats.crossings++;
    if (G.crossErr === 0) {
      G.streak++; G.stats.flawless++;
      const bonus = 20 * Math.min(G.streak, 5);
      later(0.5, () => addPoints(bonus, 'Serie', W / 2, LAY.bankTop * 0.5 - G.cam));
      banner(G.streak > 1 ? `Ohne Platsch! Serie ${G.streak}: Bonus +${bonus}` : `Ohne Platsch! Serien-Bonus +${bonus}`, 2.6, true);
      G.flagFlawless = true;
    } else { G.streak = 0; banner(pick(ARRIVE_MSG), 2.4, true); }
    if (G.teams === 2) G.flagTeam = true;
    checkStickers();
    updateHUD();
    later(2.4, afterCrossing);
  });
}

function afterCrossing() {
  if (G.solved >= SET.perBall) goldBall();
  else showPending(() => nextSentence(true));
}

function goldBall() {
  G.phase = 'gold';
  const pp = princessPos(), f = activeFrog();
  G.ballFly = { t: 0, dur: 1.1, fx: pp.x + 5 * G.frogS * P, fy: pp.y - 10 * G.frogS * P, tx: f.x, ty: f.y - 14 * G.frogS * P };
  SND.play('gold');
  later(1.4, () => {
    G.ballFly = null;
    saved.count.balls++; persist();
    const old = G.level;
    if (G.level < 4) G.level++;
    checkStickers();
    showGold(old, () => {
      G.solved = 0; updateHUD();
      showPending(() => { if (G.level !== old) showLevelIntro(G.level, () => nextSentence(true)); else nextSentence(true); });
    });
  });
}

function addPoints(n, label, sx, sy) {
  G.score[G.teams === 2 ? G.turn : 0] += n;
  G.best = Math.max(G.best, G.score[0], G.score[1]);
  floatText(`+${n}${label ? ' ' + label : ''}`, sx, sy);
  updateHUD();
}

// ---------- Karpfen-Tipps (gestuft) ----------
function hintHTML(lv) {
  const row = G.rows[G.ri], g = G.sent.groups[row.gi];
  const av = LEVEL_CASES[G.level], ans = answerOf(g);
  const mk = `<span class="hl">${esc(g.text)}</span>`;
  const P0 = g.prep ? cap(g.prep.base) : '';
  if (row.type === 'q') {
    const cor = row.opts.find(o => o.correct);
    if (lv === 1) return `Welche Frage hat als Antwort genau ${mk}?<br>Lies jede Frage leise und antworte: <b>„${esc(ans)}“</b>`;
    if (lv === 2) {
      if (g.prep && g.prep.kind === 'gen') return `Vor der Gruppe steht <b>„${esc(g.prep.word)}“</b>. Darum beginnt die Frage mit „${esc(P0)}“.<br>Nach <b>wegen, trotz, während, statt</b> fragt man mit <b>wessen</b>.`;
      if (g.prep) return `Vor der Gruppe steht <b>„${esc(g.prep.word)}“</b>. Darum beginnt die Frage mit „${esc(P0)}“.<br>Hör genau hin: <b>${esc(P0)} wem</b> oder <b>${esc(P0)} wen</b>?`;
      if (g.case === 'Gen') return `Die markierte Gruppe gehört zu dem Nomen davor.<br>Frag, <b>wem etwas gehört</b>: „Wessen …?“`;
      return `Achte auf das Fragewort: <b>Wer</b>, <b>Wen</b> oder <b>Wem</b>?<br>Antworte jedes Mal mit <b>„${esc(ans)}“</b>. Wo passt es?`;
    }
    return `Diese Frage passt:<br>${fmtQ(optText(cor))} – <b>${esc(ans)}</b>`;
  }
  if (lv === 1) {
    if (G.qDone[row.gi]) return `Du hast schon die passende Frage gefunden:<br>${fmtQ(G.qDone[row.gi])}<br>Welcher Kasus gehört zu diesem Fragewort?`;
    if (g.prep) return `Vor der Gruppe steht <b>„${esc(g.prep.word)}“</b>. Nimm dieses Wort mit in die Frage.<br>Die Antwort ist: <b>„${esc(ans)}“</b>`;
    return `Stell eine Frage mit dem Verb.<br>Die Antwort soll ${mk} sein.`;
  }
  if (lv === 2) {
    let rows;
    if (g.prep && (g.prep.kind === 'gen' || g.case === 'Gen')) {
      rows = [`<b>${esc(P0)} wessen?</b> → ${chip('Gen')}`, `<b>${esc(P0)} wem oder was?</b> → ${chip('Dat')}`, `<b>${esc(P0)} wen oder was?</b> → ${chip('Akk')}`,
        `<span class="small">Merksatz: Nach <b>wegen, trotz, während, statt, innerhalb, außerhalb</b> steht der Genitiv. Im Alltag hört man oft „wegen dem …“. Richtig ist „wegen des …“.</span>`];
    } else if (g.prep) {

// ---------- Update ----------
function update(dt) {
  G.t += dt;
  G.rows.forEach((row, ri) => {
    row.beltOff += row.dir * row.speed * dt;
    const sway = Math.sin(G.t * 0.55 + row.phase) * (row.swayA || 0) * (row.state === 'done' ? 0.6 : 1);
    row.opts.forEach(o => {
      const L = o.leaf; if (!L) return;

        let x = (L.bx + row.beltOff) % row.beltL; if (x < 0) x += row.beltL;
        L.x = x - (row.beltL - W) / 2; L.dy = 0;
        L.labelA = Math.max(0, L.labelA - dt * 3);
      } else {
        const tgt = (L.tx || 0) + sway;
        if (L.x == null) L.x = tgt;
        L.x += (tgt - L.x) * Math.min(1, dt * (row.state === 'active' ? 4 : 2));
        L.dy += ((L.tdy || 0) - L.dy) * Math.min(1, dt * 3);
        const frogHere = G.frogs.some(f => f.at.r === ri && row.opts[f.at.j] === o && !f.hidden);
        const near = Math.abs(L.x - tgt) < 40;
        const want = row.state === 'active' && L.state === 'neutral' ? (near ? 1 : 0) : (row.type === 'k' && L.state === 'good' && !frogHere ? 0.85 : 0);
        L.labelA += (want - L.labelA) * Math.min(1, dt * 4);
      }
      L.ly = row.y + L.dy;
      if (L.state === 'good') L.colorT = Math.min(1, L.colorT + dt * 1.8);
      if (L.state === 'sink') { L.sinkT += dt / 1.1; if (L.sinkT >= 1) { L.sinkT = 1; L.state = 'gone'; } }
    });
  });
  if (!G.paused) {
    if (G.phase === 'ready') G.rowTime += dt;
    const due = []; G.timers.forEach(tm => { tm.t -= dt; if (tm.t <= 0) due.push(tm); });
    G.timers = G.timers.filter(tm => tm.t > 0); due.forEach(tm => tm.fn());
    G.frogs.forEach(f => {
      const a = f.anim; if (!a) return;
      a.t += dt; const k = clamp(a.t / a.dur, 0, 1), p = a.target();
      f.x = lerp(a.fx, p.x, ease(k)); f.y = lerp(a.fy, p.y, ease(k)) - a.arc * 4 * k * (1 - k);
      a.sx = lerp(a.fx, p.x, ease(k)); a.sy = lerp(a.fy, p.y, ease(k));
      if (k >= 1) { f.anim = null; a.done && a.done(); }
    });

    if (G.joy > 0) G.joy -= dt;
  }
  G.frogs.forEach(f => { if (!f.anim) { const p = restPos(f); f.x = p.x; f.y = p.y; } });
  G.fx.forEach(e => { e.t += dt; if (e.t < 0) return; if (e.k === 'drop') { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += (e.g || 420) * dt; } if (e.k === 'heart') e.y += e.vy * dt; });
  G.fx = G.fx.filter(e => e.t < e.dur);
  if (G.carp) { G.carp.t += dt; if (G.carp.leave) { G.carp.out = (G.carp.out || 0) + dt; if (G.carp.out > 0.8) G.carp = null; } }
  // Kamera
  const f = activeFrog();
  let target;
  if (['finish', 'arrive', 'gold'].includes(G.phase) || f.at.r === 'goal') target = 0;
  else if (G.ri >= 0 && G.rows[G.ri] && G.bubble) target = G.rows[G.ri].y - H * 0.7;
  else if (G.ri >= 0 && G.rows[G.ri]) { target = G.rows[G.ri].y - H * 0.42; target = Math.max(target, f.y - H + 50); }

}

let ptr = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#carpBtn, #bubble')) return;
  const r = stage.getBoundingClientRect();
  ptr = { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now(), id: e.pointerId };
});
stage.addEventListener('pointerup', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const r = stage.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top, dx = x - ptr.x, dy = y - ptr.y;
  const dist = Math.hypot(dx, dy), dt = performance.now() - ptr.t;
  ptr = null;
  SND.init(); SND.resume();
  if (dist < 16 && dt < 900) onTap(ptr0x(x), y);
  else if (dist >= 40) {
    if (Math.abs(dx) > Math.abs(dy)) moveSel(dx > 0 ? 1 : -1);
    else if (dy < 0) { if (!G.selVis) selNearest(); jumpTo(G.sel); }
  }
});
stage.addEventListener('pointercancel', () => { ptr = null; });
function ptr0x(x) { return x; }
function liveSorted() {
  const row = G.rows[G.ri]; if (!row) return [];
  return row.opts.map((o, j) => j).filter(j => row.opts[j].leaf.state === 'neutral').sort((a, b) => row.opts[a].leaf.tx - row.opts[b].leaf.tx || row.opts[a].leaf.line - row.opts[b].leaf.line);
}
function selNearest() {
  const row = G.rows[G.ri]; if (!row) return;
  const f = activeFrog(), l = liveSorted();
  if (l.length) G.sel = l.reduce((a, j) => Math.abs(row.opts[j].leaf.x - f.x) < Math.abs(row.opts[a].leaf.x - f.x) ? j : a, l[0]);
}
function moveSel(d) {
  if (G.phase !== 'ready') return;
  const l = liveSorted(); if (!l.length) return;
  if (!G.selVis) { G.selVis = true; if (!l.includes(G.sel)) selNearest(); SND.play('tap'); return; }
  let i = l.indexOf(G.sel); if (i < 0) i = 0;
  G.sel = l[clamp(i + d, 0, l.length - 1)]; SND.play('tap');
}
function onTap(x, y) {
  if (G.phase === 'ready' && G.rows[G.ri]) {
    const row = G.rows[G.ri], wy = y + G.cam;
    let hit = -1, best = 1e9;
    row.opts.forEach((o, j) => {
      const L = o.leaf; if (L.state !== 'neutral') return;
      const nx = (x - L.x) / (L.w / 2 + 14), ny = (wy - L.ly) / (L.h / 2 + 14), d = nx * nx + ny * ny;
      if (d <= 1 && d < best) { best = d; hit = j; }
    });
    if (hit >= 0) { G.sel = hit; jumpTo(hit); return; }
  }
  const f = activeFrog();
  if (Math.abs(x - f.x) < 50 && Math.abs(y + G.cam - (f.y - 30)) < 50) { SND.play('croak'); return; }
  const pp = princessPos();
  if (Math.abs(x - pp.x) < 50 && Math.abs(y + G.cam - (pp.y - 50)) < 70) { SND.play('heart'); heartsFx(pp.x, pp.y - 70, 3); }
}
document.addEventListener('keydown', e => {
  if (document.querySelector('.ov.show')) return;
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
  SND.init(); SND.resume();
  if (e.key === 'ArrowLeft') { moveSel(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { moveSel(1); e.preventDefault(); }
  else if (e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ') { if (G.phase === 'ready') { if (!G.selVis) { G.selVis = true; selNearest(); if (e.key !== 'ArrowUp') { e.preventDefault(); return; } } jumpTo(G.sel); } e.preventDefault(); }
  else if (/^[1-4]$/.test(e.key)) { const l = liveSorted(); const j = l[+e.key - 1]; if (j != null) jumpTo(j); }

});

const _measure = document.createElement('canvas').getContext('2d');
function pixText(text, o) {
  o = o || {};
  const size = o.size || 12, fill = o.fill || '#5E4BA8', line = o.outline || null, shadow = o.shadow || null, maxW = o.maxW || 9999;
  const font = `bold ${size}px ${FONT}`;
  _measure.font = font;
  const words = String(text).split(' '), lines = [];
  let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (cur && _measure.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  const lh = Math.ceil(size * 1.3), pad = 2;
  const w = Math.ceil(Math.max(...lines.map(l => _measure.measureText(l).width))) + pad * 2 + 2, h = lh * lines.length + pad * 2 + 1;
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.className = 'px';
  const x = c.getContext('2d', { willReadFrequently: true });
  x.font = font; x.textBaseline = 'top'; x.fillStyle = '#000';
  lines.forEach((l, i) => x.fillText(l, Math.round((w - _measure.measureText(l).width) / 2), pad + i * lh + 1));
  const d = x.getImageData(0, 0, w, h).data, on = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) on[i] = d[i * 4 + 3] > 110 ? 1 : 0;
  const out = x.createImageData(w, h), od = out.data;
  const put = (i, col) => { const [r, g, b] = hex2rgb(col); od[i * 4] = r; od[i * 4 + 1] = g; od[i * 4 + 2] = b; od[i * 4 + 3] = 255; };
  if (shadow) for (let y = 0; y < h - 1; y++) for (let xx = 0; xx < w - 1; xx++) if (on[y * w + xx]) put((y + 1) * w + xx + 1, shadow);
  if (line) for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
    const i = y * w + xx; if (on[i]) continue;
    if ((xx > 0 && on[i - 1]) || (xx < w - 1 && on[i + 1]) || (y > 0 && on[i - w]) || (y < h - 1 && on[i + w])) put(i, line);
  }
  for (let i = 0; i < w * h; i++) if (on[i]) put(i, fill);

}

function checkEditor(text) {

    const p = parseLine(ln, i + 1); if (!p) return;
    if (p.errors.length) { bad++; p.errors.forEach(m => items.push(`<li class="err">Zeile ${i + 1}: ${esc(m)} – wird übersprungen.</li>`)); return; }
    ok++; p.groups.forEach(g => g.case && cnt[g.case]++);
    p.warnings.forEach(m => items.push(`<li class="warn">Zeile ${i + 1}: ${esc(m)}</li>`));
    p.notes.forEach(m => items.push(`<li>Zeile ${i + 1}: ${esc(m)}</li>`));
  });
  $('#edSum').innerHTML = ok || bad ? `<b>${ok}</b> Sätze erkannt · ${ORDER.map(c => `${CI[c].ab} ${cnt[c]}`).join(' · ')}${bad ? ` · <span style="color:#B4486A">${bad} Zeile(n) mit Fehlern</span>` : ''}${!cnt.Gen && ok ? ' · <span class="small">Ohne Genitiv-Sätze nutzt Level 3 die übrigen Fälle.</span>' : ''}` : 'Noch keine eigenen Sätze.';
  $('#edCheck').innerHTML = items.join('') || (ok ? '<li>Alles in Ordnung.</li>' : '');
}
function statHTML() {
  const S = G.stats;
  const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '–';
  const rows = ORDER.map(c => {
    const s = S.k[c];
    const conf = Object.entries(s.conf).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${CI[k].name} (${n}×)`).join(', ') || '–';
    return `<tr><td>${chip(c)}</td><td>${s.asked}</td><td>${s.first} (${pct(s.first, s.asked)})</td><td>${s.wrong}</td><td>${conf}</td></tr>`;
  }).join('');
  const top = Object.values(S.sents).sort((a, b) => b.wrong - a.wrong).slice(0, 6);
  return `<p class="small">Diese Auswertung gilt nur für die laufende Sitzung auf diesem Gerät. Es werden keine Namen erfasst.</p>
    <h3>Kasus-Reihen</h3>
    <div style="overflow:auto"><table class="stat"><tr><th>Kasus</th><th>Gefragt</th><th>Beim 1. Versuch richtig</th><th>Platsch</th><th>Gehalten für …</th></tr>${rows}</table></div>
    <h3>Fragen-Reihen</h3>
    <table class="stat"><tr><th>Gefragt</th><th>Beim 1. Versuch richtig</th><th>Platsch</th></tr><tr><td>${S.q.asked}</td><td>${S.q.first} (${pct(S.q.first, S.q.asked)})</td><td>${S.q.wrong}</td></tr></table>
    <h3>Überblick</h3><p>Überquerungen: ${S.crossings} · davon ohne Platsch: ${S.flawless} · Karpfen-Tipps: ${S.hints}</p>
    <h3>Sätze mit den meisten Platschern</h3>${top.length ? '<ol>' + top.map(t => `<li>${esc(t.plain)} <span class="small">(${t.wrong}×)</span></li>`).join('') + '</ol>' : '<p class="small">Noch keine.</p>'}
    <div class="btnrow"><button class="pb alt sm" id="statReset">Auswertung zurücksetzen</button></div>`;
}

// =========================================================
// Knöpfe und Start
// =========================================================
function updateMusicBtn() {
  const b = $('#bMusic'); b.innerHTML = ''; b.appendChild(iconCv(SET.music ? 'music' : 'musicOff'));
  b.setAttribute('aria-pressed', SET.music ? 'true' : 'false');
}
function setupButtons() {
  $('#bAlbum').appendChild(iconCv('album'));
  $('#bMenu').appendChild(iconCv('home'));
  $('#bGear').appendChild(iconCv('gear'));
  updateMusicBtn(); updateFsBtn();
  if (!FS.can()) $('#bFull').style.display = 'none';
  $('#carpBtn .q').appendChild(spriteCv(SPR.letter['?']));
  $('#bubCarp').getContext('2d').drawImage(SPR.carp, 0, 0);
}
$('#bMusic').onclick = () => { SND.init(); SND.resume(); SET.music = !SET.music; persist(); SND.setMusic(SET.music); updateMusicBtn(); toast(SET.music ? 'Musik an' : 'Musik aus', 1.4); };
$('#bFull').onclick = () => FS.toggle();
$('#bAlbum').onclick = () => showAlbum();
$('#bMenu').onclick = () => { closeBubble(); showStart(); };
$('#carpBtn').onclick = e => { e.stopPropagation(); openHint(false); };
$('#bubMore').onclick = e => { e.stopPropagation(); openHint(false); };
$('#bubOk').onclick = e => { e.stopPropagation(); closeBubble(); };
(function gearHold() {
  const b = $('#bGear'); let tm = null;
  const cancel = (ev) => { if (tm) { clearTimeout(tm); tm = null; b.classList.remove('hold'); if (ev.type === 'pointerup') toast('Lehrkraft-Bereich: Zahnrad 2 Sekunden gedrückt halten.'); } };
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.remove('hold'); void b.offsetWidth; b.classList.add('hold'); tm = setTimeout(() => { tm = null; b.classList.remove('hold'); closeBubble(); showTeacher('set'); }, 1600); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, cancel));
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('keydown', e => { if (e.key === 'Enter' && e.shiftKey) showTeacher('set'); });
})();
function drawCarpButton() {
  const c = $('#carpCv').getContext('2d'); c.imageSmoothingEnabled = false; c.clearRect(0, 0, 28, 28);
  c.fillStyle = '#BFE6F0'; c.fillRect(0, 0, 28, 28);
  c.fillStyle = '#A9DDEA'; c.fillRect(0, 15, 28, 13);
  c.fillStyle = '#CFEFF6'; c.fillRect(2, 23, 5, 1); c.fillRect(17, 25, 6, 1); c.fillRect(21, 19, 4, 1);
  c.drawImage(SPR.carp, 4, 9);
  c.fillStyle = '#FFFFFF'; c.fillRect(22, 3, 2, 2); c.fillRect(19, 1, 1, 1); c.fillRect(25, 7, 1, 1);
}
document.addEventListener('visibilitychange', () => { if (!SND.ctx) return; if (document.hidden) SND.ctx.suspend(); else SND.ctx.resume(); });

function boot() {
  buildSprites();
  drawCarpButton();
  setupButtons();
  G.teams = SET.teams === 2 ? 2 : 1;
  resize();
  demoRows();
  renderSentence(); renderTask(); updateHUD();
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(stage);
  window.addEventListener('resize', () => { resize(); _lvlShown = ''; updateHUD(); });
  showStart();
  requestAnimationFrame(frame);
}
boot();
</script>
